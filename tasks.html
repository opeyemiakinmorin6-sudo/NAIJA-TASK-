<!DOCTYPE html>  <html lang="en">    <head>    
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Tasks — NAIJA TASK</title>  <style>    
* {    
  box-sizing: border-box;    
}    body {
margin: 0;
font-family: Arial, sans-serif;
background: #f5fff7;
color: #111;
}

header {
background: #0b8f3c;
color: white;
padding: 20px;
text-align: center;
}

header h1 {
margin: 0 0 6px;
}

header p {
margin: 0;
}

.container {
max-width: 600px;
margin: auto;
padding: 20px;
}

.nav {
display: grid;
gap: 10px;
margin-bottom: 16px;
}

.nav a {
display: block;
background: white;

}

}

</style>  </head>  <body>  <header>

  <h1>NAIJA TASK</h1>    
  <p>Available Tasks</p>    
</header>  <div class="container">    <div class="nav">    
    <a href="dashboard.html">🏠 Dashboard</a>    
    <a href="wallet.html">💰 Wallet</a>

  </div>    <div class="card">    
    <h3>Available Tasks</h3>  <div id="tasks">    
  <p class="message">Loading tasks...</p>    
</div>    </div>  </div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>    const SUPABASE_URL =
"https://jwakveeiynpakunwjzkj.supabase.co";

/*
Put your current Supabase publishable key here.
Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY = "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadTasks() {

const tasksBox =
document.getElementById("tasks");

const {
data: { user },
error: userError
} = await supabaseClient.auth.getUser();

if (userError || !user) {
window.location.href = "index.html";
return;
}

const {
data,
error
} = await supabaseClient
.from("tasks")
.select(
"id, title, description, reward, slots, expiry_date, requirements, proof_type, proof_required, max_completions"
)
.eq("active", true)
.order("created_at", {
ascending: false
});

if (error) {

console.error(error);    

tasksBox.innerHTML =    
  '<p class="message">Unable to load tasks.</p>';    

return;

}

if (!data || data.length === 0) {

tasksBox.innerHTML =    
  '<p class="message">No tasks available right now.</p>';    

return;

}

tasksBox.innerHTML = "";

data.forEach(task => {

const div =    
  document.createElement("div");    

div.className = "task";    


const title =    
  document.createElement("h4");    

title.textContent =    
  task.title || "Task";    


const description =    
  document.createElement("p");    

description.textContent =    
  task.description || "";    


const reward =    
  document.createElement("p");    

reward.className = "reward";    

reward.textContent =    
  "Reward: ₦" +    
  Number(task.reward || 0).toFixed(2);    


const proof =    
  document.createElement("p");    

proof.innerHTML =    
  "<strong>Proof:</strong> " +    
  (    
    task.proof_required    
      ? (task.proof_type || "Text")    
      : "No proof required"    
  );    


const button =    
  document.createElement("button");    

button.textContent =    
  "Complete Task";    

button.onclick = function() {    
  startTask(task.id);    
};    


div.appendChild(title);    
div.appendChild(description);    
div.appendChild(reward);    
div.appendChild(proof);    
div.appendChild(button);    

tasksBox.appendChild(div);

});
}

async function startTask(taskId) {

const {
data: task,
error
} = await supabaseClient
.from("tasks")
.select(
"id, title, description, reward, proof_type, proof_required"
)
.eq("id", taskId)
.single();

if (error || !task) {

alert(    
  "Unable to load this task."    
);    

return;

}

let proof = "";

if (task.proof_required) {

proof = prompt(    
  "Complete the task first, then enter your proof." +    
  "\n\nProof type: " +    
  (task.proof_type || "text")    
);    


if (proof === null) {    
  return;    
}    


proof = proof.trim();    


if (!proof) {    

  alert(    
    "Proof is required."    
  );    

  return;    
}

} else {

proof = prompt(    
  "Complete the task first. Add any proof or note if required:"    
);    


if (proof === null) {    
  return;    
}    

proof = proof.trim();

}

const {
data: { user },
error: userError
} = await supabaseClient.auth.getUser();

if (userError || !user) {

alert(    
  "Please log in again."    
);    

window.location.href =    
  "index.html";    

return;

}

const {
error: submissionError
} = await supabaseClient
.from("task_submissions")
.insert({
user_id: user.id,
task_id: task.id,
proof: proof,
status: "PENDING"
});

if (submissionError) {

console.error(submissionError);    

alert(    
  "Submission failed: " +    
  submissionError.message    
);    

return;

}

alert(
"Task submitted successfully. Your proof is pending review."
);
}

loadTasks();

</script>  </body>
