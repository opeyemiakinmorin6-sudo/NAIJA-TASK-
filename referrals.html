<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Referrals — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 6px;
}

header p {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.nav {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.nav a {
  display: block;
  background: white;
  color: #0b8f3c;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin: 8px 0 10px;
  font-size: 14px;
}

button {
  width: 100%;
  background: #0b8f3c;
  color: white;
  border: none;
  padding: 13px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
}

.referral {
  border-top: 1px solid #eee;
  padding: 14px 0;
}

.referral:first-child {
  border-top: none;
}

.referral p {
  margin: 7px 0;
}

.status {
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>NAIJA TASK</h1>
  <p>Referrals</p>
</header>

<div class="container">

  <div class="nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="task.html">📋 Tasks</a>
    <a href="wallet.html">💰 Wallet</a>
    <a href="withdrawal.html">💸 Withdraw</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="card">
    <h3>Your Referral Link</h3>

    <input
      id="referralLink"
      type="text"
      readonly
    >

    <button onclick="copyReferralLink()">
      Copy Referral Link
    </button>
  </div>

  <div class="card">
    <h3>Your Referrals</h3>

    <div id="referralList">
      Loading referrals...
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Put your current publishable key here.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadReferrals() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    window.location.href = "index.html";
    return;
  }

  const referralLink =
    window.location.origin +
    window.location.pathname.replace(
      "referrals.html",
      ""
    ) +
    "?ref=" +
    user.id;

  document.getElementById(
    "referralLink"
  ).value = referralLink;


  const {
    data,
    error
  } = await supabaseClient
    .from("referrals")
    .select(
      "referred_user_id, reward, status"
    )
    .eq(
      "referrer_user_id",
      user.id
    )
    .order("id", {
      ascending: false
    });


  const referralList =
    document.getElementById(
      "referralList"
    );


  if (error) {
    console.error(error);

    referralList.textContent =
      "Unable to load referrals.";

    return;
  }


  if (!data || data.length === 0) {

    referralList.textContent =
      "No referrals yet.";

    return;
  }


  referralList.innerHTML = "";


  for (const referral of data) {

    const item =
      document.createElement("div");

    item.className = "referral";


    const {
      data: profile
    } = await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq(
        "id",
        referral.referred_user_id
      )
      .single();


    const name =
      profile?.full_name ||
      "New user";


    item.innerHTML =
      "<strong>" +
      name +
      "</strong>" +

      "<p>Reward: ₦" +
      Number(
        referral.reward || 0
      ).toFixed(2) +
      "</p>" +

      "<p class='status'>Status: " +
      (
        referral.status ||
        "PENDING"
      ) +
      "</p>";


    referralList.appendChild(item);
  }
}


async function copyReferralLink() {

  const input =
    document.getElementById(
      "referralLink"
    );

  try {

    await navigator.clipboard.writeText(
      input.value
    );

    alert(
      "Referral link copied!"
    );

  } catch (error) {

    input.select();

    document.execCommand("copy");

    alert(
      "Referral link copied!"
    );
  }
}


loadReferrals();

</script>

</body>
</html>
