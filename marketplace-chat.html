<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f36"><title>Marketplace Messages | NAIJA TASK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#087f36;--d:#064d25;--bg:#f3f8f5;--line:#dfe9e1;--muted:#68796e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17251c}header{background:var(--g);color:#fff;padding:15px}header>div,main{max-width:1000px;margin:auto}header>div{display:flex;align-items:center;justify-content:space-between;gap:12px}main{padding:18px 12px 40px}.layout{display:grid;grid-template-columns:310px 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}button,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.green{background:var(--g);color:#fff}.light{background:#e9f5ec;color:var(--d)}textarea{width:100%;border:1px solid #d4e1d7;border-radius:10px;padding:11px;background:#fff;min-height:48px;max-height:110px;resize:vertical}.muted{font-size:12px;color:var(--muted);line-height:1.5}.status{padding:10px;border-radius:9px;background:#eaf5ec;margin:10px 0;display:none}.thread{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.thread.active{background:#eaf5ec;border-radius:10px}.thread strong{display:block;font-size:14px}.thread small{color:var(--muted)}.chat-head{padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.messages{height:430px;overflow:auto;padding:14px 2px;display:flex;flex-direction:column;gap:9px}.message{max-width:82%;padding:10px 12px;border-radius:13px;background:#eef3ef;overflow-wrap:anywhere;font-size:14px;line-height:1.45}.message.mine{align-self:flex-end;background:#dff3e4}.message time{display:block;font-size:10px;color:var(--muted);margin-top:5px}.composer{display:flex;gap:8px;align-items:flex-end}.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:13px}@media(max-width:700px){.layout{grid-template-columns:1fr}.messages{height:48vh;min-height:280px}.thread-list{max-height:220px;overflow:auto}}
</style></head><body>
<header><div><div><strong>NAIJA TASK</strong><div style="font-size:11px;margin-top:3px">Marketplace Messages</div></div><button class="light" onclick="location.href='marketplace.html'">Back to Marketplace</button></div></header>
<main><div id="status" class="status" role="status"></div><div class="layout">
<section class="panel"><h3 style="margin:0 0 8px">Your conversations</h3><p class="muted">Chat with buyers and sellers about products.</p><div id="threads" class="thread-list"><div class="empty">Loading conversations…</div></div></section>
<section class="panel"><div id="chatHead" class="chat-head"><div><strong>Choose a conversation</strong><div class="muted">Messages stay between the buyer and seller.</div></div></div><div id="messages" class="messages"><div class="empty">Select a conversation to view messages.</div></div><form id="composer" class="composer"><textarea id="messageInput" maxlength="2000" placeholder="Write a message…" required></textarea><button class="green" id="sendBtn" type="submit">Send</button></form><p class="muted" style="margin:10px 0 0">Do not pay outside NAIJA TASK. Never share your password, PIN or OTP.</p></section>
</div></main>
<script>
'use strict';
const db=window.supabase.createClient('https://jwakveeiynpakunwjzkj.supabase.co','sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D');
let user=null,activeConversation=null,inbox=[],refreshHandle=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notice(msg){$('status').textContent=msg;$('status').style.display='block';}
function time(v){try{return new Date(v).toLocaleString('en-NG',{dateStyle:'short',timeStyle:'short'});}catch(_){return '';}}
async function loadInbox(){const {data,error}=await db.rpc('marketplace_chat_inbox');if(error)throw error;inbox=data||[];$('threads').innerHTML=inbox.length?inbox.map(c=>'<div class="thread '+(c.conversation_id===activeConversation?'active':'')+'" onclick="selectConversation(\''+esc(c.conversation_id)+'\')"><strong>'+esc(c.other_user_name)+'</strong><small>'+esc(c.product_title||'Marketplace chat')+'</small><div class="muted">'+esc(c.last_message||'Start the conversation')+'</div></div>').join(''):'<div class="empty">No messages yet. Open a product and tap Chat seller to start.</div>';}
async function loadMessages(){if(!activeConversation)return;const {data,error}=await db.from('chat_messages').select('id,sender_id,message,created_at').eq('conversation_id',activeConversation).is('deleted_at',null).order('created_at',{ascending:true}).limit(200);if(error)throw error;const box=$('messages'),nearBottom=box.scrollHeight-box.clientHeight-box.scrollTop<90;box.innerHTML=(data||[]).length?data.map(m=>'<div class="message '+(m.sender_id===user.id?'mine':'')+'">'+esc(m.message)+'<time>'+time(m.created_at)+'</time></div>').join(''):'<div class="empty">No messages yet. Say hello.</div>';if(nearBottom)box.scrollTop=box.scrollHeight;await db.from('chat_participants').update({last_read_at:new Date().toISOString()}).eq('conversation_id',activeConversation).eq('user_id',user.id);}
async function selectConversation(id){activeConversation=id;const c=inbox.find(x=>x.conversation_id===id);$('chatHead').innerHTML='<div><strong>'+esc(c?.other_user_name||'Marketplace member')+'</strong><div class="muted">'+esc(c?.product_title||'Marketplace chat')+'</div></div><button class="light" type="button" onclick="blockUser()">Block</button>';await loadInbox();await loadMessages();}
async function blockUser(){const c=inbox.find(x=>x.conversation_id===activeConversation);if(!c)return;if(!confirm('Block this member? You will not be able to message each other.'))return;const {error}=await db.from('chat_blocks').insert({blocker_id:user.id,blocked_id:c.other_user_id});if(error){notice(error.message);return;}notice('Member blocked.');activeConversation=null;$('messages').innerHTML='<div class="empty">This conversation is blocked.</div>';await loadInbox();}
$('composer').addEventListener('submit',async e=>{e.preventDefault();const message=$('messageInput').value.trim();if(!message||!activeConversation)return;$('sendBtn').disabled=true;try{const {error}=await db.from('chat_messages').insert({conversation_id:activeConversation,sender_id:user.id,message});if(error)throw error;$('messageInput').value='';await loadMessages();await loadInbox();}catch(error){notice('Message not sent: '+error.message);}finally{$('sendBtn').disabled=false;}});
(async function init(){try{const {data,error}=await db.auth.getUser();if(error)throw error;user=data.user;if(!user){location.href='index.html#account-types';return;}const product=new URLSearchParams(location.search).get('product');if(product){const {data:conversation,error:rpcError}=await db.rpc('create_marketplace_chat',{p_product_id:product});if(rpcError)throw rpcError;activeConversation=conversation;}await loadInbox();if(activeConversation)await selectConversation(activeConversation);else if(inbox.length)await selectConversation(inbox[0].conversation_id);refreshHandle=setInterval(async()=>{try{await loadInbox();await loadMessages();}catch(error){console.warn(error.message);}},15000);}catch(error){notice('Marketplace chat could not load: '+error.message);}})();
window.addEventListener('beforeunload',()=>{if(refreshHandle)clearInterval(refreshHandle);});
</script></body></html>
