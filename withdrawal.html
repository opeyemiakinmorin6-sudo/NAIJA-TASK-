<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 6px;
}

header p {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.nav {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.nav a {
  display: block;
  background: white;
  color: #0b8f3c;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.info {
  background: #f5fff7;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 15px;
}

button {
  width: 100%;
  background: #0b8f3c;
  color: white;
  border: none;
  padding: 13px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
}

.status {
  margin-top: 14px;
  color: #555;
  text-align: center;
}

.withdrawal {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.withdrawal:first-child {
  border-top: none;
  padding-top: 5px;
}

.withdrawal p {
  margin: 7px 0;
}

.withdrawal small {
  color: #777;
}

.message {
  text-align: center;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>NAIJA TASK</h1>
  <p>Withdraw</p>
</header>

<div class="container">

  <div class="nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="task.html">📋 Tasks</a>
    <a href="wallet.html">💰 Wallet</a>
    <a href="referrals.html">👥 Referrals</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="card">

    <h3>Request Withdrawal</h3>

    <div class="info">
      <p>Minimum withdrawal: <strong>₦1,500</strong></p>
      <p>Withdrawal fee: <strong>₦100</strong></p>
    </div>

    <input
      id="amount"
      type="number"
      min="1500"
      inputmode="numeric"
      placeholder="Withdrawal amount"
    >

    <input
      id="bankName"
      type="text"
      placeholder="Bank name"
    >

    <input
      id="accountNumber"
      type="text"
      inputmode="numeric"
      maxlength="10"
      placeholder="10-digit account number"
    >

    <button onclick="requestWithdrawal()">
      Request Withdrawal
    </button>

    <p id="withdrawStatus" class="status"></p>

  </div>

  <div class="card">

    <h3>Withdrawal History</h3>

    <div id="withdrawals">
      <p class="message">
        Loading withdrawals...
      </p>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Put your current Supabase publishable key here.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function requestWithdrawal() {

  const status =
    document.getElementById(
      "withdrawStatus"
    );

  status.textContent =
    "Checking wallet...";


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "index.html";

    return;
  }


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const bankName =
    document.getElementById(
      "bankName"
    ).value.trim();


  const accountNumber =
    document.getElementById(
      "accountNumber"
    ).value.trim();


  if (!amount || amount < 1500) {

    status.textContent =
      "Minimum withdrawal is ₦1,500.";

    return;
  }


  if (!bankName) {

    status.textContent =
      "Enter your bank name.";

    return;
  }


  if (!/^\d{10}$/.test(accountNumber)) {

    status.textContent =
      "Enter a valid 10-digit account number.";

    return;
  }


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("balance")
    .eq("id", user.id)
    .single();


  if (profileError) {

    console.error(profileError);

    status.textContent =
      "Unable to check wallet balance.";

    return;
  }


  const balance =
    Number(
      profile?.balance || 0
    );


  if (balance < amount) {

    status.textContent =
      "Insufficient wallet balance.";

    return;
  }


  status.textContent =
    "Submitting withdrawal...";


  const {
    error
  } = await supabaseClient
    .from("withdrawals")
    .insert({
      user_id: user.id,
      amount: amount,
      bank_name: bankName,
      account_number: accountNumber,
      status: "PENDING"
    });


  if (error) {

    console.error(error);

    status.textContent =
      "Withdrawal request failed.";

    return;
  }


  status.textContent =
    "Withdrawal request submitted successfully.";


  document.getElementById(
    "amount"
  ).value = "";

  document.getElementById(
    "bankName"
  ).value = "";

  document.getElementById(
    "accountNumber"
  ).value = "";


  loadWithdrawals();
}


async function loadWithdrawals() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "index.html";

    return;
  }


  const {
    data,
    error
  } = await supabaseClient
    .from("withdrawals")
    .select(
      "id, amount, bank_name, account_number, status, created_at"
    )
    .eq(
      "user_id",
      user.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  const box =
    document.getElementById(
      "withdrawals"
    );


  if (error) {

    console.error(error);

    box.innerHTML =
      '<p class="message">Unable to load withdrawal history.</p>';

    return;
  }


  if (!data || data.length === 0) {

    box.innerHTML =
      '<p class="message">No withdrawal requests yet.</p>';

    return;
  }


  box.innerHTML = "";


  data.forEach(withdrawal => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "withdrawal";


    const amount =
      document.createElement(
        "strong"
      );

    amount.textContent =
      "₦" +
      Number(
        withdrawal.amount || 0
      ).toFixed(2);


    const bank =
      document.createElement("p");

    bank.textContent =
      withdrawal.bank_name || "";


    const account =
      document.createElement("p");

    account.textContent =
      "Account: " +
      (
        withdrawal.account_number ||
        ""
      );


    const status =
      document.createElement("small");

    status.textContent =
      "Status: " +
      (
        withdrawal.status ||
        "N/A"
      );


    div.appendChild(amount);
    div.appendChild(bank);
    div.appendChild(account);
    div.appendChild(status);

    box.appendChild(div);
  });
}


loadWithdrawals();

</script>

</body>
      </html>
