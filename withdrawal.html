<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Withdraw — NAIJA TASK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5fff7;
      color: #111;
      padding-bottom: 30px;
    }

    header {
      background: #0b8f3c;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 7px 0 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .card h2 {
      margin-top: 0;
      color: #0b8f3c;
    }

    .info {
      background: #f5fff7;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #0b8f3c;
    }

    button {
      width: 100%;
      background: #0b8f3c;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7e5da;
      border-radius: 10px;
      margin-bottom: 13px;
      background: #fff;
      color: #17251b;
      font-size: 15px;
    }
    .field-label{display:block;margin:8px 0 7px;color:#34483a;font-size:12px;font-weight:800}
    .verify-button{margin:0 0 12px;background:#e8f5eb;color:#075b2b;border:1px solid #cce6d2}
    .account-verification{display:flex;align-items:center;gap:11px;padding:13px;margin:0 0 14px;border:1px solid #dcebe0;border-radius:12px;background:#f7fbf8}
    .account-verification.verified{border-color:#a9d8b5;background:#effaf1}
    .account-verification.invalid{border-color:#f0c4c0;background:#fff7f6}
    .verification-icon{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:#e4f1e7}
    .account-verification strong,.account-verification small{display:block;overflow-wrap:anywhere}
    .account-verification strong{font-size:13px;color:#153b22}
    .account-verification small{margin-top:4px;color:#66756a;font-size:11px;line-height:1.4}
    .verify-button:disabled{opacity:.55}
    .status {
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
    }

    .withdrawal {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .withdrawal:first-child {
      border-top: none;
    }

    .withdrawal p {
      margin: 7px 0;
    }

    .withdrawal small {
      color: #666;
    }

    .message {
      text-align: center;
      color: #777;
      line-height: 1.6;
    }

    .nav {
      display: grid;
      gap: 10px;
    }

    .nav a {
      display: block;
      background: white;
      color: #0b8f3c;
      text-decoration: none;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

  <header>
    <h1>NAIJA TASK</h1>
    <p>Withdraw Earnings</p>
  </header>

  <div class="container">

    <div class="card">

      <h2>Request Withdrawal</h2>

      <div class="info" id="withdrawalInfo">
        <div>Minimum withdrawal: <strong>₦500</strong></div>
        <div>Withdrawal fee: <strong>₦100</strong></div>
      </div>

      <input
        id="amount"
        type="number"
        min="500"
        inputmode="numeric"
        placeholder="Enter withdrawal amount"
      >

      <label class="field-label" for="bankSearch">Search Nigerian banks</label>
      <input
        id="bankSearch"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="Type bank name e.g. Access, GTBank, UBA…"
        aria-label="Search Nigerian banks"
      >
      <label class="field-label" for="bankName">Select your bank</label>
      <select id="bankName" autocomplete="off">
        <option value="">Loading Nigerian banks…</option>
      </select>

      <label class="field-label" for="accountNumber">Account number</label>
      <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="10"
        pattern="[0-9]{10}"
        placeholder="Enter your 10-digit account number"
      >

      <button type="button" id="verifyBankButton" class="verify-button" onclick="verifyBankAccount()" disabled>
        Verify Bank Account
      </button>

      <div id="accountVerification" class="account-verification" aria-live="polite">
        <span class="verification-icon">🔒</span>
        <div><strong id="accountName">Account name will appear here</strong><small id="verificationMessage">Choose a bank and enter your account number.</small></div>
      </div>

      <button
        id="withdrawButton"
        onclick="requestWithdrawal()"
      >
        Request Withdrawal
      </button>

      <p id="withdrawStatus" class="status"></p>

    </div>


    <div class="card">

      <h2>Withdrawal History</h2>

      <div id="withdrawals">
        <p class="message">
          Loading withdrawals...
        </p>
      </div>

    </div>


    <div class="card">

      <h2>Navigation</h2>

      <div class="nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="task.html">📋 Tasks</a>
        <a href="wallet.html">💰 Wallet</a>
        <a href="referrals.html">👥 Referrals</a>
        <a href="profile.html">👤 Profile</a>
      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jwakveeiynpakunwjzkj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const platformSettings = {};

    function formatMoney(value) {
      const number = Number(value || 0);
      return "₦" + number.toLocaleString("en-NG", {
        maximumFractionDigits: 0
      });
    }

    async function loadPlatformSettings() {
      try {
        const { data, error } = await supabaseClient
          .from("platform_settings")
          .select("*")
          .limit(1)
          .maybeSingle();

        if (error) {
          console.warn("Platform settings unavailable:", error.message);
          return;
        }

        if (data) {
          Object.assign(platformSettings, data);
          applyWithdrawalSettings();
        }
      } catch (error) {
        console.warn("Platform settings read failed:", error);
      }
    }

    function applyWithdrawalSettings() {
      const minimumWithdrawal = Number(platformSettings.minimum_withdrawal ?? 500);
      const withdrawalFee = Number(platformSettings.free_withdrawal_fee || 100);

      const info = document.getElementById("withdrawalInfo");
      if (info) {
        info.innerHTML = `
          <div>Minimum withdrawal: <strong>${formatMoney(minimumWithdrawal)}</strong></div>
          <div>Withdrawal fee: <strong>${formatMoney(withdrawalFee)}</strong></div>
        `;
      }

      const amountInput = document.getElementById("amount");
      if (amountInput) {
        amountInput.min = String(minimumWithdrawal);
      }
    }

    let verifiedBankAccount = null;
    let availableBanks = [];

    function setVerificationState(state, title, message) {
      const box = document.getElementById("accountVerification");
      const name = document.getElementById("accountName");
      const note = document.getElementById("verificationMessage");
      const icon = box.querySelector(".verification-icon");
      box.classList.remove("verified", "invalid");
      if (state === "verified") box.classList.add("verified");
      if (state === "invalid") box.classList.add("invalid");
      icon.textContent = state === "verified" ? "✓" : state === "invalid" ? "!" : "🔒";
      name.textContent = title;
      note.textContent = message;
    }

    function invalidateAccountVerification() {
      verifiedBankAccount = null;
      setVerificationState("idle", "Account name will appear here", "Choose a bank and enter your account number.");
      const verifyButton = document.getElementById("verifyBankButton");
      verifyButton.disabled = !document.getElementById("bankName").value ||
        !/^\d{10}$/.test(document.getElementById("accountNumber").value.trim());
    }

    function renderBankOptions(searchTerm = "") {
      const select = document.getElementById("bankName");
      const query = String(searchTerm || "").trim().toLowerCase();
      const currentValue = select.value;
      const filteredBanks = availableBanks.filter(bank =>
        String(bank.name || "").toLowerCase().includes(query) ||
        String(bank.code || "").toLowerCase().includes(query)
      );

      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = filteredBanks.length
        ? (query ? "Choose a matching bank" : "Choose your bank")
        : "No matching bank found";
      select.appendChild(placeholder);

      filteredBanks.forEach(bank => {
        const option = document.createElement("option");
        option.value = String(bank.code || "");
        option.textContent = String(bank.name || "Bank");
        select.appendChild(option);
      });

      if (currentValue && filteredBanks.some(bank => String(bank.code) === currentValue)) {
        select.value = currentValue;
      } else if (currentValue) {
        select.value = "";
        invalidateAccountVerification();
      }
    }

    async function loadBanks() {
      const select = document.getElementById("bankName");
      select.innerHTML = '<option value="">Loading Nigerian banks…</option>';
      try {
        const { data, error } = await supabaseClient.functions.invoke("flutterwave-payments", {
          body: { action: "banks" }
        });
        if (error) throw error;
        if (!data?.success || !Array.isArray(data.banks) || !data.banks.length) {
          throw new Error(data?.error || "The bank list is unavailable.");
        }
        availableBanks = data.banks;
        select.innerHTML = '<option value="">Choose your bank</option>' +
          availableBanks.map(bank => '<option value="' +
            String(bank.code).replace(/[&<>"']/g, "") + '">' +
            String(bank.name).replace(/[&<>"']/g, "&amp;") + '</option>').join("");
      } catch (error) {
        console.error("Bank list error:", error);
        select.innerHTML = '<option value="">Unable to load banks — tap to retry</option>';
        select.addEventListener("focus", loadBanks, { once: true });
        setVerificationState("invalid", "Bank list unavailable", "Please check your connection and try again.");
      }
    }

    async function verifyBankAccount() {
      const bankSelect = document.getElementById("bankName");
      const accountInput = document.getElementById("accountNumber");
      const button = document.getElementById("verifyBankButton");
      const bankCode = bankSelect.value;
      const accountNumber = accountInput.value.trim();
      const selectedBank = availableBanks.find(bank => bank.code === bankCode);
      if (!selectedBank) {
        setVerificationState("invalid", "Select a bank", "Choose a supported Nigerian bank from the list.");
        return;
      }
      if (!/^\d{10}$/.test(accountNumber)) {
        setVerificationState("invalid", "Invalid account number", "Enter exactly 10 digits.");
        return;
      }
      button.disabled = true;
      button.textContent = "Verifying account…";
      setVerificationState("idle", "Verifying account…", "Securely checking the details with Flutterwave.");
      verifiedBankAccount = null;
      try {
        const { data, error } = await supabaseClient.functions.invoke("flutterwave-payments", {
          body: { action: "resolve_account", bank_code: bankCode, account_number: accountNumber }
        });
        if (error) throw error;
        if (!data?.success || !data.account_name || data.account_number !== accountNumber) {
          throw new Error(data?.error || "We could not verify this account.");
        }
        verifiedBankAccount = {
          bank_code: bankCode,
          bank_name: selectedBank.name,
          account_number: accountNumber,
          account_name: data.account_name
        };
        setVerificationState("verified", data.account_name, "Verified account · " + selectedBank.name + " · " + accountNumber);
      } catch (error) {
        console.error("Account verification error:", error);
        setVerificationState("invalid", "Account not verified", error?.message || "Check the bank and account number.");
      } finally {
        button.textContent = "Verify Bank Account";
        button.disabled = false;
      }
    }

    document.getElementById("bankSearch").addEventListener("input", event => {
      renderBankOptions(event.target.value);
    });
    document.getElementById("bankName").addEventListener("change", invalidateAccountVerification);
    document.getElementById("accountNumber").addEventListener("input", invalidateAccountVerification);
    document.getElementById("accountNumber").addEventListener("blur", () => {
      const button = document.getElementById("verifyBankButton");
      if (document.getElementById("bankName").value &&
          /^\d{10}$/.test(document.getElementById("accountNumber").value.trim()) &&
          !verifiedBankAccount) {
        verifyBankAccount();
      }
    });

    async function requestWithdrawal() {
      const status = document.getElementById("withdrawStatus");
      const button = document.getElementById("withdrawButton");
      await loadPlatformSettings();
      applyWithdrawalSettings();
      const amount = Number(document.getElementById("amount").value);
      const minimumWithdrawal = Number(platformSettings.minimum_withdrawal ?? 500);
      if (!amount || amount < minimumWithdrawal) {
        status.textContent = "Minimum withdrawal is " + formatMoney(minimumWithdrawal) + ".";
        status.style.color = "#b42318";
        return;
      }
      const bankCode = document.getElementById("bankName").value;
      const accountNumber = document.getElementById("accountNumber").value.trim();
      if (!verifiedBankAccount ||
          verifiedBankAccount.bank_code !== bankCode ||
          verifiedBankAccount.account_number !== accountNumber) {
        status.textContent = "Verify your bank account before requesting a withdrawal.";
        status.style.color = "#b42318";
        return;
      }
      status.textContent = "Submitting verified withdrawal request…";
      status.style.color = "#111";
      button.disabled = true;
      try {
        const { data, error } = await supabaseClient.functions.invoke("flutterwave-payments", {
          body: {
            action: "request_withdrawal",
            amount,
            bank_code: verifiedBankAccount.bank_code,
            account_number: verifiedBankAccount.account_number,
            account_name: verifiedBankAccount.account_name
          }
        });
        if (error) throw error;
        if (!data?.success) throw new Error(data?.error || "Withdrawal request failed.");
        status.textContent = "Withdrawal request submitted. Account name verified: " + data.account_name + ".";
        status.style.color = "#087f36";
        document.getElementById("amount").value = "";
        document.getElementById("bankName").value = "";
        document.getElementById("accountNumber").value = "";
        invalidateAccountVerification();
        await loadWithdrawals();
      } catch (error) {
        console.error("Withdrawal request error:", error);
        status.textContent = error?.message || "Withdrawal request failed. Please try again.";
        status.style.color = "#b42318";
      } finally {
        button.disabled = false;
      }
    }

    async function loadWithdrawals() {
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.replace("login.html");
        return;
      }

      const {
        data,
        error
      } = await supabaseClient
        .from("withdrawals")
        .select(
          "id, amount, bank_name, account_name, account_number, status, created_at"
        )
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      const box = document.getElementById("withdrawals");

      if (error) {
        console.error(error);
        box.innerHTML = '<p class="message">Unable to load withdrawal history.</p>';
        return;
      }

      if (!data || data.length === 0) {
        box.innerHTML = '<p class="message">No withdrawal requests yet.</p>';
        return;
      }

      box.innerHTML = "";

      data.forEach(withdrawal => {
        const div = document.createElement("div");
        div.className = "withdrawal";

        const amount = document.createElement("strong");
        amount.textContent = "₦" + Number(withdrawal.amount || 0).toLocaleString("en-NG");

        const bank = document.createElement("p");
        bank.textContent = withdrawal.bank_name || "";

        const account = document.createElement("p");
        const rawAccount = String(withdrawal.account_number || "");
        account.textContent = (withdrawal.account_name ? withdrawal.account_name + " · " : "") +
          "Account ending " + (rawAccount.length >= 4 ? rawAccount.slice(-4) : "****");

        const status = document.createElement("small");
        status.textContent = "Status: " + (withdrawal.status || "PENDING");

        div.appendChild(amount);
        div.appendChild(bank);
        div.appendChild(account);
        div.appendChild(status);

        box.appendChild(div);
      });
    }

    loadPlatformSettings();
    applyWithdrawalSettings();
    loadBanks();
    loadWithdrawals();

  </script>

</body>
</html>
