  currentUser = data.user;

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeUrl(url){
  if(!url) return "";

  let value = String(url).trim();

  if(!value) return "";

  if(!/^https?:\/\//i.test(value)){
    value = "https://" + value;
  }

  return value;
}

function isTaskExpired(task){
  if(!task.expiry_date) return false;

  return new Date(task.expiry_date).getTime() <= Date.now();
}

function formatExpiry(date){
  if(!date) return "No expiry";

  const d = new Date(date);

  if(Number.isNaN(d.getTime())){
    return "No expiry";
  }

  return d.toLocaleString();
}

function getPlatformHTML(type){
  const name = type || "Task";
  const icon = platformIcons[name];

  if(icon){
    return `
      <img
        class="platform-icon"
        src="${icon}"
        alt="${escapeHTML(name)}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      >
      <div class="platform-fallback" style="display:none;">
        NT
      </div>
    `;
  }

  return `
    <div class="platform-fallback">
      NT
    </div>
  `;
}

  if(!link){
    return `
      <div class="link-box">
        <div style="font-size:13px;color:#68756c;">
          No task link was provided.
        </div>
      </div>
    `;

  return `
    <div class="link-box">

      <a
        class="task-link"
        href="${escapeHTML(link)}"
        target="_blank"
        rel="noopener noreferrer"

        </button>

      </div>

  `;
}

let loadedTasks = [];

async function loadTasks(){

  tasksArea.className = "loading";
  tasksArea.innerHTML = "Loading tasks...";

  /*
    Only LIVE tasks are shown to Taskers.
  */
  const {data,error} = await db
    .from("tasks")
    .select(`
      id,
      title,
      description,
      reward,
      slots,
      expiry_date,
      requirements,
      proof_type,
      active,
      status,
      task_type,
      task_link,
      uploader_username,
      copy_text,
      post_link,
      upload_required,
      created_at
    `)
    .eq("active",true)
    .eq("status","LIVE")
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    tasksArea.className = "error";

    tasksArea.innerHTML = `
      <strong>Unable to load tasks.</strong>
      <br><br>
      Please refresh the page and try again.
    `;

    return;
  }

  loadedTasks = (data || []).filter(task => !isTaskExpired(task));

  if(!loadedTasks.length){

    tasksArea.className = "empty";

    tasksArea.innerHTML = `
      <strong>No live tasks available right now.</strong>
      <br><br>
      Check again later for new tasks.
    `;

    return;
  }

  tasksArea.className = "";

  tasksArea.innerHTML = loadedTasks
    .map((task,index) => taskCard(task,index))
    .join("");
}

function showProofForm(index){

  const box = document.getElementById(`proof-${index}`);

  if(!box) return;

  box.style.display = "block";

  box.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

  trackTaskStart(loadedTasks[index]);
}

async function trackTaskStart(task){

  if(!currentUser || !task) return;

  try{

    await db
      .from("task_activity")
      .insert({
        task_id:task.id,
        user_id:currentUser.id,
        activity_type:"STARTED"
      });

  }catch(error){

    console.log("Activity tracking skipped:",error);

  }
}

function handlePhotoSelect(event,index){

  const file = event.target.files?.[0];

  const uploadBox =
    document.getElementById(`photoUpload-${index}`);

  const preview =
    document.getElementById(`preview-${index}`);

  if(!file) return;

  if(!file.type.startsWith("image/")){

    event.target.value = "";

    alert("Please choose an image file.");

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    event.target.value = "";

    alert("Photo must be 5MB or smaller.");

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    preview.src = e.target.result;

    preview.style.display = "block";

    uploadBox.classList.add("photo-selected");

  };

  reader.readAsDataURL(file);
}

async function openTaskLink(index){

  const task = loadedTasks[index];

  if(!task) return;

  const raw =
    task.task_link ||
    task.post_link ||
    "";

  const url = normalizeUrl(raw);

  if(!url){

    alert("This task does not have a link.");

    return;
  }

  /*
    Open the actual task separately.
    NAIJA TASK stays open.
  */
  const newWindow = window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

  /*
    Some Android browsers block window.open.
    In that case, use a real anchor as fallback.
  */
  if(!newWindow){

    const a = document.createElement("a");

    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    document.body.appendChild(a);

    a.click();

    a.remove();
  }
}

async function copyTextReliable(text){

  if(!text) return false;

  try{

    if(navigator.clipboard &&
       window.isSecureContext){

      await navigator.clipboard.writeText(text);

      return true;
    }

  }catch(error){

    console.log("Clipboard API failed:",error);

  }

  try{

    const textarea = document.createElement("textarea");

    textarea.value = text;

    textarea.setAttribute("readonly","");

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.top = "0";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0,text.length);

    const copied =
      document.execCommand("copy");

    textarea.remove();

    return copied;

  }catch(error){

    console.error("Copy failed:",error);

    return false;
  }
}

async function copyTaskLink(index){

  const task = loadedTasks[index];

  if(!task) return;

  const link =
    normalizeUrl(
      task.task_link ||
      task.post_link ||
      ""
    );

  if(!link){

    alert("There is no task link to copy.");

    return;
  }

  const button =
    document.getElementById(`copyLinkBtn-${index}`);

  const success =
    await copyTextReliable(link);

  if(success){

    const oldText = button.innerText;

    button.innerText = "Copied ✓";
    button.classList.add("copied");

    setTimeout(() => {

      button.innerText = oldText;
      button.classList.remove("copied");

    },1800);

  }else{

    alert(
      "Copy was blocked by your browser. Long-press the link and choose Copy."
    );

  }
}

async function copyTaskText(index){

  const task = loadedTasks[index];

  if(!task || !task.copy_text) return;

  const button =
    document.getElementById(`copyTextBtn-${index}`);

  const success =
    await copyTextReliable(task.copy_text);

  if(success){

    const oldText = button.innerText;

    button.innerText = "Copied ✓";
    button.classList.add("copied");

    setTimeout(() => {

      button.innerText = oldText;
      button.classList.remove("copied");

    },1800);

  }else{

    alert(
      "Copy was blocked by your browser. Select the text and copy it manually."
    );

  }
}

function showMessage(index,type,text){

  const box =
    document.getElementById(`message-${index}`);

  if(!box) return;

  box.className = `message ${type}`;

  box.textContent = text;
}

async function submitProof(event,index){

  event.preventDefault();

  const task = loadedTasks[index];

  if(!task){

    alert("Task not found.");

    return;
  }

  if(!currentUser){

    alert("Please log in again.");

    window.location.href = "index.html";

    return;
  }

  if(isTaskExpired(task)){

    showMessage(
      index,
      "error",
      "This task has expired."
    );

    return;
  }

  const username =
    document
      .getElementById(`username-${index}`)
      .value
      .trim();

  const comment =
    document
      .getElementById(`comment-${index}`)
      .value
      .trim();

  const proofLink =
    document
      .getElementById(`proofLink-${index}`)
      .value
      .trim();

  const fileInput =
    document.getElementById(`photo-${index}`);

  const file =
    fileInput.files?.[0];

  if(!username){

    showMessage(
      index,
      "error",
      "Enter the username or account you used."
    );

    return;
  }

  if(!comment){

    showMessage(
      index,
      "error",
      "Please enter your comment or report."
    );

    return;
  }

  if(!file){

    showMessage(
      index,
      "error",
      "Photo proof is required. Tap the large upload box and choose a photo."
    );

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    showMessage(
      index,
      "error",
      "Photo must be 5MB or smaller."
    );

    return;
  }

  const submitButton =
    document.getElementById(`submit-${index}`);

  submitButton.disabled = true;
  submitButton.innerText = "Uploading proof...";

  showMessage(
    index,
    "success",
    "Uploading your photo proof..."
  );

  let uploadedPath = null;

  try{

    /*
      Check for an existing active submission.
      Rejected submissions can be submitted again.
    */
    const {data:existing,error:existingError} =
      await db
        .from("task_submissions")
        .select("id,status")
        .eq("task_id",task.id)
        .eq("user_id",currentUser.id)
        .in("status",["PENDING","APPROVED"])
        .limit(1);

    if(existingError){
      throw existingError;
    }

    if(existing && existing.length){

      throw new Error(
        "You have already submitted this task."
      );
    }

    const extension =
      file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "jpg";

    uploadedPath =
      `${currentUser.id}/${task.id}/${Date.now()}.${extension}`;

    const {error:uploadError} =
      await db
        .storage
        .from("task proof")
        .upload(
          uploadedPath,
          file,
          {
            contentType:file.type,
            upsert:false
          }
        );

    if(uploadError){
      throw uploadError;
    }

    const proof = {

      photo:{
        bucket:"task proof",
        path:uploadedPath,
        name:file.name,
        type:file.type,
        size:file.size
      },

      worker_username:username,

      worker_comment:comment,

      worker_link:proofLink,

      task_owner:
        task.uploader_username || null,

      submitted_at:
        new Date().toISOString()
    };

    submitButton.innerText =
      "Saving submission...";

    const {error:insertError} =
      await db
        .from("task_submissions")
        .insert({

          user_id:currentUser.id,

          task_id:task.id,

          proof:proof,

          status:"PENDING"

        });

    if(insertError){
      throw insertError;
    }

    showMessage(
      index,
      "success",
      "Proof submitted successfully. Your photo will be reviewed by the task poster."
    );

    submitButton.innerText =
      "Proof Submitted ✓";

    /*
      Disable the form after successful submission.
    */
    const form =
      event.target;

    form.querySelectorAll("input,textarea,button")
      .forEach(element => {

        if(element !== submitButton){
          element.disabled = true;
        }

      });

  }catch(error){

    console.error(error);

    /*
      If the database insert failed after photo upload,
      remove the orphaned photo.
    */
    if(uploadedPath){

      try{

        await db
          .storage
          .from("task proof")
          .remove([uploadedPath]);

      }catch(removeError){

        console.log(
          "Could not remove uploaded proof:",
          removeError
        );

      }

    }

    submitButton.disabled = false;
    submitButton.innerText =
      "Submit Proof";

    showMessage(
      index,
      "error",
      error?.message ||
      "Something went wrong while submitting your proof."
    );
  }
}

async function startPage(){

  const user =
    await getCurrentUser();

  if(!user) return;

  await loadTasks();
}

startPage();
</script>
