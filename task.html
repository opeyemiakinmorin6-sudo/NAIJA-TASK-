<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  background: white;
  color: #0b8f3c;
  border: none;
  border-radius: 8px;
  padding: 9px 12px;
  font-weight: bold;
  cursor: pointer;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.intro {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.intro h2 {
  margin: 0 0 6px;
  color: #0b8f3c;
}

.intro p {
  margin: 0;
  color: #555;
  font-size: 14px;
}

.task-count {
  font-size: 14px;
  font-weight: bold;
  margin: 15px 0 10px;
}

.task-card {
  background: white;
  border-radius: 16px;
  margin-bottom: 16px;
  padding: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  border: 1px solid #e3f2e7;
}

.task-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.task-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: #e9f9ee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

.task-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 5px;
}

.task-reward {
  color: #0b8f3c;
  font-weight: bold;
  font-size: 16px;
}

.task-description {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  color: #444;
}

.section {
  margin-top: 15px;
  padding-top: 13px;
  border-top: 1px solid #eee;
}

.section-title {
  font-size: 13px;
  font-weight: bold;
  color: #0b8f3c;
  margin-bottom: 7px;
}

.info-box {
  background: #f7faf8;
  border-radius: 9px;
  padding: 10px;
  font-size: 13px;
  word-break: break-word;
}

.action-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

button {
  font-family: inherit;
}

.primary-btn {
  width: 100%;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.secondary-btn {
  border: none;
  background: #e9f9ee;
  color: #08752f;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.open-btn {
  background: #0b8f3c;
  color: white;
}

.cancel-btn {
  background: #eee;
  color: #333;
}

.submit-btn {
  margin-top: 10px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d7e4da;
  border-radius: 9px;
  font-size: 14px;
  outline: none;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #0b8f3c;
}

.file-input {
  padding: 9px;
}

.preview {
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 10px;
  background: #f4f4f4;
  display: none;
}

.empty,
.loading,
.error {
  background: white;
  border-radius: 14px;
  padding: 25px 15px;
  text-align: center;
  color: #666;
}

.error {
  color: #b00020;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 10px;
  font-size: 13px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}

.status.success {
  display: block;
  background: #e9f9ee;
  color: #08752f;
}

.status.error {
  display: block;
  background: #fff0f0;
  color: #b00020;
}

.deadline {
  color: #777;
  font-size: 12px;
}

.requirement-list {
  margin: 0;
  padding-left: 20px;
  font-size: 13px;
  line-height: 1.6;
}

.upload-note {
  font-size: 12px;
  color: #777;
  margin-top: 6px;
}

.success-box {
  background: #e9f9ee;
  color: #08752f;
  padding: 12px;
  border-radius: 9px;
  margin-top: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="header-title">NAIJA TASK</div>
  </div>
</header>

<div class="container">

  <div class="intro">
    <h2>Available Tasks</h2>
    <p>Complete tasks correctly and earn Naira.</p>
  </div>

  <div id="taskCount" class="task-count"></div>

  <div id="loading" class="loading">
    Loading tasks...
  </div>

  <div id="errorBox" class="error hidden"></div>

  <div id="emptyBox" class="empty hidden">
    No tasks are available right now.
  </div>

  <div id="tasksContainer"></div>

</div>

<script>
const SUPABASE_URL = "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Replace this with your existing Supabase PUBLISHABLE key.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY = 
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentTasks = [];

function goBack() {
  window.location.href = "dashboard.html";
}

async function checkUser() {
  const {
    data: { user },
    error
  } = await db.auth.getUser();

  if (error || !user) {
    window.location.href = "index.html";
    return null;
  }

  currentUser = user;
  return user;
}

function escapeHTML(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(date) {
  if (!date) return "No deadline";

  const d = new Date(date);

  if (isNaN(d.getTime())) {
    return "No deadline";
  }

  return d.toLocaleString();
}

function getTaskIcon(task) {
  const type = String(
    task.task_type || task.title || ""
  ).toLowerCase();

  if (type.includes("tiktok")) {
    return "🎵";
  }

  if (type.includes("youtube")) {
    return "▶️";
  }

  if (type.includes("instagram")) {
    return "📸";
  }

  if (type.includes("facebook")) {
    return "📘";
  }

  if (
    type.includes("app") ||
    type.includes("download")
  ) {
    return "📱";
  }

  if (
    type.includes("website") ||
    type.includes("web")
  ) {
    return "🌐";
  }

  if (
    type.includes("telegram")
  ) {
    return "✈️";
  }

  if (
    type.includes("whatsapp")
  ) {
    return "💬";
  }

  return "💼";
}

function getProofType(task) {
  if (task.proof_type) {
    return String(task.proof_type).toLowerCase();
  }

  if (task.proof_required) {
    return "text";
  }

  return "text";
}

function shouldShowImageUpload(task) {
  const type = getProofType(task);

  return Boolean(
    task.upload_required ||
    type.includes("image") ||
    type.includes("photo") ||
    type.includes("screenshot")
  );
}

function buildRequirements(task) {
  if (!task.requirements) {
    return "<div class='info-box'>Follow the task instructions carefully.</div>";
  }

  const requirements = String(task.requirements)
    .split(/\n/)
    .map(item => item.trim())
    .filter(Boolean);

  if (!requirements.length) {
    return "<div class='info-box'>Follow the task instructions carefully.</div>";
  }

  return `
    <ul class="requirement-list">
      ${requirements.map(item => `
        <li>${escapeHTML(item)}</li>
      `).join("")}
    </ul>
  `;
}

function buildLinkSection(title, link, buttonText, idPrefix) {
  if (!link) return "";

  return `
    <div class="section">
      <div class="section-title">${title}</div>

      <div class="info-box">
        ${escapeHTML(link)}
      </div>

      <div class="action-row">
        <button
          class="secondary-btn open-btn"
          onclick="openLink('${encodeURIComponent(link)}')"
        >
          ${buttonText}
        </button>

        <button
          class="secondary-btn"
          onclick="copyText('${encodeURIComponent(link)}')"
        >
          Copy Link
        </button>
      </div>
    </div>
  `;
}

function buildTaskCard(task, index) {
  const icon = getTaskIcon(task);

  const reward = Number(task.reward || 0);

  const uploader = task.uploader_username
    ? escapeHTML(task.uploader_username)
    : "Not provided";

  const copyTextValue = task.copy_text
    ? escapeHTML(task.copy_text)
    : "";

  const deadline = task.expiry_date
    ? formatDate(task.expiry_date)
    : "No deadline";

  return `
    <div class="task-card">

      <div class="task-top">

        <div class="task-icon">
          ${icon}
        </div>

        <div>
          <div class="task-title">
            ${escapeHTML(task.title || "Untitled Task")}
          </div>

          <div class="task-reward">
            ₦${reward.toLocaleString()}
          </div>
        </div>

      </div>

      <div class="task-description">
        ${escapeHTML(
          task.description ||
          "Complete this task according to the instructions."
        )}
      </div>

      <div class="section">

        <div class="section-title">
          Task Requirements
        </div>

        ${buildRequirements(task)}

      </div>

      <div class="section">

        <div class="section-title">
          Task Owner / Username
        </div>

        <div class="info-box">
          ${uploader}
        </div>

        ${
          task.uploader_username
          ? `
            <div class="action-row">
              <button
                class="secondary-btn"
                onclick="copyText('${encodeURIComponent(
                  task.uploader_username
                )}')"
              >
                Copy Username
              </button>
            </div>
          `
          : ""
        }

      </div>

      ${
        copyTextValue
        ? `
          <div class="section">

            <div class="section-title">
              Text To Copy
            </div>

            <div class="info-box">
              ${copyTextValue}
            </div>

            <div class="action-row">
              <button
                class="secondary-btn"
                onclick="copyText('${encodeURIComponent(
                  task.copy_text
                )}')"
              >
                Copy Text
              </button>
            </div>

          </div>
        `
        : ""
      }

      ${buildLinkSection(
        "Task Link",
        task.task_link,
        "Open Task",
        "task"
      )}

      ${buildLinkSection(
        "Post Link",
        task.post_link,
        "Open Post",
        "post"
      )}

      <div class="section">

        <div class="section-title">
          Deadline
        </div>

        <div class="deadline">
          ${escapeHTML(deadline)}
        </div>

      </div>

      <div class="section">

        <div class="section-title">
          Submit Proof
        </div>

        <div class="info-box">
          Proof type:
          <strong>
            ${escapeHTML(
              task.proof_type || "Text"
            )}
          </strong>
        </div>

        ${
          shouldShowImageUpload(task)
          ? `
            <div style="margin-top:12px;">

              <label>
                Upload Picture / Screenshot
              </label>

              <input
                id="image-${task.id}"
                class="file-input"
                type="file"
                accept="image/*"
                onchange="previewImage(this, 'preview-${task.id}')"
              >

              <div class="upload-note">
                Maximum image size: 5MB.
              </div>

              <img
                id="preview-${task.id}"
                class="preview"
                alt="Proof preview"
              >

            </div>
          `
          : ""
        }

        <div style="margin-top:12px;">

          <label>
            Username
          </label>

          <input
            id="username-${task.id}"
            type="text"
            placeholder="Enter the username used"
          >

        </div>

        <div style="margin-top:12px;">

          <label>
            Proof URL
          </label>

          <input
            id="url-${task.id}"
            type="url"
            placeholder="Paste proof link if required"
          >

        </div>

        <div style="margin-top:12px;">

          <label>
            Reference ID
          </label>

          <input
            id="reference-${task.id}"
            type="text"
            placeholder="Enter reference if required"
          >

        </div>

        <div style="margin-top:12px;">

          <label>
            Proof Description
          </label>

          <textarea
            id="proof-${task.id}"
            placeholder="Describe what you completed..."
          ></textarea>

        </div>

        <button
          id="submit-${task.id}"
          class="primary-btn submit-btn"
          onclick="submitProof('${task.id}')"
        >
          Upload Proof
        </button>

        <div
          id="status-${task.id}"
          class="status"
        ></div>

      </div>

    </div>
  `;
}

async function loadTasks() {

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("errorBox");
  const emptyBox = document.getElementById("emptyBox");
  const container = document.getElementById("tasksContainer");
  const count = document.getElementById("taskCount");

  loading.classList.remove("hidden");
  errorBox.classList.add("hidden");
  emptyBox.classList.add("hidden");
  container.innerHTML = "";
  count.textContent = "";

  const user = await checkUser();

  if (!user) {
    return;
  }

  const {
    data,
    error
  } = await db
    .from("tasks")
    .select(
      "id, title, description, reward, slots, expiry_date, requirements, proof_type, proof_required, max_completions, active, task_type, task_link, uploader_username, copy_text, post_link, upload_required"
    )
    .eq("active", true)
    .order("created_at", {
      ascending: false
    });

  loading.classList.add("hidden");

  if (error) {

    console.error(error);

    errorBox.textContent =
      "Unable to load tasks. " +
      (error.message || "Please try again.");

    errorBox.classList.remove("hidden");

    return;
  }

  currentTasks = data || [];

  if (!currentTasks.length) {

    emptyBox.classList.remove("hidden");

    count.textContent =
      "0 tasks available";

    return;
  }

  count.textContent =
    `${currentTasks.length} task${
      currentTasks.length === 1 ? "" : "s"
    } available`;

  container.innerHTML =
    currentTasks
      .map(buildTaskCard)
      .join("");
}

function openLink(encodedLink) {

  try {

    const link = decodeURIComponent(encodedLink);

    if (!link) return;

    window.open(
      link,
      "_blank",
      "noopener,noreferrer"
    );

  } catch (error) {

    console.error(error);

  }
}

async function copyText(encodedText) {

  try {

    const value =
      decodeURIComponent(encodedText);

    await navigator.clipboard.writeText(value);

    alert("Copied successfully.");

  } catch (error) {

    console.error(error);

    alert("Could not copy. Please copy it manually.");

  }
}

function previewImage(input, previewId) {

  const preview =
    document.getElementById(previewId);

  if (!input.files || !input.files[0]) {

    preview.style.display = "none";
    preview.src = "";

    return;
  }

  const file = input.files[0];

  if (!file.type.startsWith("image/")) {

    alert("Please select an image.");

    input.value = "";

    preview.style.display = "none";

    return;
  }

  if (file.size > 5 * 1024 * 1024) {

    alert("Image is too large. Maximum size is 5MB.");

    input.value = "";

    preview.style.display = "none";

    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    preview.src = event.target.result;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);
}

function showStatus(taskId, message, type) {

  const box =
    document.getElementById(
      `status-${taskId}`
    );

  if (!box) return;

  box.textContent = message;

  box.className =
    `status ${type}`;

}

function resetSubmitButton(taskId) {

  const button =
    document.getElementById(
      `submit-${taskId}`
    );

  if (!button) return;

  button.disabled = false;
  button.textContent = "Upload Proof";
}

async function submitProof(taskId) {

  if (!currentUser) {

    alert("Please log in again.");

    return;
  }

  const button =
    document.getElementById(
      `submit-${taskId}`
    );

  const task =
    currentTasks.find(
      item => String(item.id) === String(taskId)
    );

  if (!task) {

    alert("Task not found.");

    return;
  }

  button.disabled = true;
  button.textContent = "Submitting...";

  showStatus(
    taskId,
    "Preparing your proof...",
    "success"
  );

  try {

    const username =
      document.getElementById(
        `username-${taskId}`
      )?.value.trim() || "";

    const proofUrl =
      document.getElementById(
        `url-${taskId}`
      )?.value.trim() || "";

    const reference =
      document.getElementById(
        `reference-${taskId}`
      )?.value.trim() || "";

    const description =
      document.getElementById(
        `proof-${taskId}`
      )?.value.trim() || "";

    const imageInput =
      document.getElementById(
        `image-${taskId}`
      );

    let imageUrl = "";

    /*
      Upload proof image to Supabase Storage.

      IMPORTANT:
      The existing Supabase bucket is named:
      task proof

      Therefore this MUST be:
      .from("task proof")
    */

    if (
      shouldShowImageUpload(task) &&
      imageInput &&
      imageInput.files &&
      imageInput.files.length > 0
    ) {

      const file =
        imageInput.files[0];

      if (file.size > 5 * 1024 * 1024) {

        throw new Error(
          "Image is too large. Maximum size is 5MB."
        );
      }

      const extension =
        file.name.includes(".")
          ? file.name
              .split(".")
              .pop()
              .toLowerCase()
          : "jpg";

      const filePath =
        `${currentUser.id}/${task.id}/${Date.now()}.${extension}`;

      showStatus(
        taskId,
        "Uploading proof image...",
        "success"
      );

      const {
        error: uploadError
      } =
        await db.storage
          .from("task proof")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false
            }
          );

      if (uploadError) {

        console.error(uploadError);

        throw new Error(
          uploadError.message ||
          "Image upload failed."
        );
      }

      const {
        data: publicData
      } =
        db.storage
          .from("task proof")
          .getPublicUrl(filePath);

      imageUrl =
        publicData?.publicUrl || "";

    }

    const proofData = {

      username: username,

      url: proofUrl,

      reference: reference,

      description: description,

      image_url: imageUrl,

      submitted_at:
        new Date().toISOString()

    };

    showStatus(
      taskId,
      "Saving your proof...",
      "success"
    );

    const {
      error: submissionError
    } =
      await db
        .from("task_submissions")
        .insert({

          user_id: currentUser.id,

          task_id: task.id,

          proof: JSON.stringify(proofData),

          status: "PENDING"

        });

    if (submissionError) {

      console.error(
        submissionError
      );

      throw new Error(
        submissionError.message ||
        "Could not save your proof."
      );
    }

    showStatus(
      taskId,
      "Proof submitted successfully. It is now waiting for review.",
      "success"
    );

    button.textContent =
      "Proof Submitted";

    button.disabled = true;

  } catch (error) {

    console.error(error);

    showStatus(
      taskId,
      error.message ||
      "Something went wrong while submitting your proof.",
      "error"
    );

    resetSubmitButton(taskId);
  }
}

loadTasks();
</script>

</body>
  </html>
