<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f36">
<title>NAIJA TASK — Available Tasks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#087f36;
  --green2:#0b9b45;
  --darkgreen:#064d25;
  --lime:#b7ef43;
  --bg:#f3f8f5;
  --text:#17251c;
  --muted:#68756d;
  --orange:#ff6b00;
  --red:#d92d20;
  --border:#e2eae4;
  --white:#fff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  background:linear-gradient(120deg,var(--darkgreen),var(--green2));
  color:white;
  padding:20px 16px 24px;
  border-radius:0 0 24px 24px;
}
.top-inner,.container{
  width:min(100%,760px);
  margin:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
}
.brand-mark{
  width:39px;height:39px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--lime);color:var(--darkgreen);
  font-weight:1000;
}
.top-sub{font-size:13px;opacity:.9;margin-top:7px}
.user-row{
  margin-top:20px;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
}
.user-name{font-weight:700;overflow-wrap:anywhere}
.small-label{font-size:12px;opacity:.85;margin-bottom:5px}
.balance-pill{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
  padding:10px 13px;border-radius:12px;
  white-space:nowrap;font-weight:800;
}
.container{padding:18px 14px 100px}
.heading-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:14px;
}
h1{font-size:23px;margin:0 0 6px}
.subtitle{font-size:13px;color:var(--muted);line-height:1.5}
.refresh-btn{
  border:1px solid var(--border);background:white;
  padding:10px 13px;border-radius:12px;color:var(--green);
  font-weight:800;
}
.filters{
  display:flex;gap:8px;overflow:auto;padding:2px 0 14px;
}
.filter{
  flex-shrink:0;border:1px solid var(--border);background:white;
  color:#536158;border-radius:999px;padding:9px 14px;font-size:13px;
}
.filter.active{background:var(--green);color:white;border-color:var(--green)}
.notice{
  padding:12px 13px;border-radius:13px;
  background:#eaf6ed;border:1px solid #d0e9d6;
  color:#245f36;font-size:13px;line-height:1.5;margin-bottom:14px;
}
.notice.warn{background:#fff6e5;border-color:#ffe0a3;color:#825400}
.task-list{display:grid;gap:13px}
.task-card{
  background:white;border:1px solid var(--border);
  border-radius:18px;padding:16px;
  box-shadow:0 3px 12px rgba(14,50,27,.035);
}
.card-top{display:flex;gap:12px;align-items:flex-start}
.platform-icon{
  width:48px;height:48px;border-radius:15px;
  background:#eef7f0;display:grid;place-items:center;
  flex-shrink:0;overflow:hidden;font-size:22px;font-weight:900;
}
.platform-icon img{width:28px;height:28px;object-fit:contain}
.card-main{flex:1;min-width:0}
.task-title{font-size:16px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.platform-name{font-size:12px;color:var(--muted);margin-top:5px}
.live-badge{
  font-size:10px;font-weight:900;color:#16743a;
  background:#e8f8ec;border-radius:999px;padding:5px 8px;
  display:inline-block;margin-top:7px;
}
.task-description{
  color:#526158;font-size:13px;line-height:1.55;
  margin:13px 0;white-space:pre-wrap;overflow-wrap:anywhere;
}
.card-bottom{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding-top:12px;border-top:1px solid #edf1ee;
}
.reward-label{font-size:11px;color:var(--muted)}
.reward{font-size:22px;font-weight:900;color:var(--green);margin-top:3px}
.slots{font-size:11px;color:var(--muted);margin-top:4px}
.primary-btn{
  border:0;background:var(--green);color:white;
  border-radius:12px;padding:12px 15px;font-weight:800;
}
.primary-btn:disabled{opacity:.5;cursor:not-allowed}
.perform-btn{background:var(--orange);white-space:nowrap}
.empty,.loading,.error-box{
  background:white;border:1px solid var(--border);border-radius:16px;
  padding:26px 17px;text-align:center;color:var(--muted);
  font-size:14px;line-height:1.6;
}
.error-box{color:#9b2c2c;background:#fff4f3;border-color:#ffd8d4}
.hidden{display:none!important}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(8,28,15,.65);
  z-index:1000;display:none;align-items:center;justify-content:center;
  padding:12px;
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(100%,520px);max-height:94dvh;overflow:auto;
  background:white;border-radius:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.25);
}
.modal-header{
  position:sticky;top:0;z-index:2;background:white;
  border-bottom:1px solid #edf1ee;padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.modal-title{font-size:18px;font-weight:900}
.close-btn{
  border:0;background:#f0f3f1;border-radius:50%;
  width:35px;height:35px;font-size:22px;color:#39463d;
}
.progress{display:flex;gap:5px;padding:12px 18px 0}
.progress span{height:4px;border-radius:99px;background:#e6ece7;flex:1}
.progress span.done{background:var(--green)}
.modal-body{padding:20px 18px 22px}
.step-indicator{
  text-align:center;color:var(--muted);font-size:12px;
  margin-bottom:15px;
}
.step-icon{
  width:66px;height:66px;border-radius:20px;
  display:grid;place-items:center;margin:0 auto 15px;
  background:#fff2d7;font-size:31px;
}
.step-heading{text-align:center;font-size:21px;margin:0 0 10px}
.step-text{
  font-size:14px;color:#5d6961;line-height:1.65;
  margin:0 0 18px;overflow-wrap:anywhere;
}
.summary-box{
  background:#f6faf7;border:1px solid var(--border);
  border-radius:15px;padding:14px;margin:15px 0;
}
.summary-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid #e8eee9;font-size:13px;
}
.summary-row:last-child{border-bottom:0}
.summary-row span:first-child{color:var(--muted)}
.summary-row strong{text-align:right;overflow-wrap:anywhere}
.field{margin:15px 0}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
.field input[type=text],.field textarea{
  width:100%;border:1px solid #dbe4dd;border-radius:12px;
  padding:12px;background:white;outline:none;
}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.help-text{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.copy-row,.link-row{
  border:1px solid var(--border);border-radius:12px;
  padding:11px;display:flex;gap:8px;align-items:center;margin-top:8px;
}
.copy-value,.link-value{
  min-width:0;flex:1;font-size:13px;overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.mini-btn{
  flex-shrink:0;border:1px solid #dce6de;border-radius:9px;
  background:white;color:var(--green);font-weight:800;padding:9px 10px;
}
.upload-box{
  display:block;text-align:center;padding:24px 12px;
  border:2px dashed #bfd3c3;background:#f8fbf8;
  border-radius:16px;cursor:pointer;
}
.upload-box .upload-icon{font-size:32px;margin-bottom:8px}
.upload-box strong{display:block;font-size:14px}
.upload-box small{display:block;margin-top:7px;color:var(--muted);line-height:1.5}
.upload-box input{display:none}
.preview{
  width:100%;max-height:230px;object-fit:contain;
  margin-top:12px;border-radius:12px;background:#eef2ef;
}
.modal-actions{display:grid;gap:9px;margin-top:22px}
.action-main{
  width:100%;border:0;border-radius:13px;
  padding:14px;background:var(--orange);color:white;
  font-weight:900;font-size:15px;
}
.action-main:disabled{opacity:.55;cursor:not-allowed}
.action-secondary{
  width:100%;border:1px solid #e2e5e3;background:white;
  color:var(--red);border-radius:13px;padding:13px;font-weight:800;
}
.modal-footer{
  text-align:center;color:#7b877e;font-size:11px;line-height:1.5;
  margin-top:15px;
}
.success-icon{
  width:76px;height:76px;background:#e8f8ec;color:var(--green);
  border-radius:50%;display:grid;place-items:center;
  font-size:38px;margin:8px auto 18px;
}
.inline-error{
  background:#fff1f0;color:#a52b23;border:1px solid #ffd8d4;
  border-radius:10px;padding:11px;font-size:13px;line-height:1.5;
  margin-top:12px;
}
.inline-success{
  background:#eaf8ee;color:#1e6834;border:1px solid #cdebd4;
  border-radius:10px;padding:11px;font-size:13px;line-height:1.5;
  margin-top:12px;
}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;background:white;
  border-top:1px solid var(--border);padding:9px 8px;
}
.bottom-nav-inner{
  width:min(100%,760px);display:flex;justify-content:space-around;gap:5px;
}
.nav-item{
  color:#6a776e;text-decoration:none;text-align:center;
  font-size:11px;padding:5px 8px;min-width:55px;
}
.nav-item b{display:block;font-size:19px;margin-bottom:3px}
.nav-item.active{color:var(--green);font-weight:900}
@media(min-width:600px){
  .container{padding-top:24px}
  .modal-body{padding:23px}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark">NT</div>
      <div>NAIJA TASK</div>
    </div>
    <div class="top-sub">Complete Tasks. Earn Naira.</div>
    <div class="user-row">
      <div>
        <div class="small-label">Welcome back</div>
        <div class="user-name" id="userName">Loading account…</div>
      </div>
      <div class="balance-pill" id="balancePill">₦—</div>
    </div>
  </div>
</header>

<main class="container">
  <div class="heading-row">
    <div>
      <h1>Available Tasks</h1>
      <div class="subtitle">Choose a task, follow its instructions, and submit genuine proof.</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" type="button">↻ Refresh</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">All tasks</button>
    <button class="filter" data-filter="youtube">YouTube</button>
    <button class="filter" data-filter="tiktok">TikTok</button>
    <button class="filter" data-filter="facebook">Facebook</button>
    <button class="filter" data-filter="instagram">Instagram</button>
    <button class="filter" data-filter="telegram">Telegram</button>
    <button class="filter" data-filter="whatsapp">WhatsApp</button>
    <button class="filter" data-filter="other">Other</button>
  </div>

  <div id="notice" class="notice hidden"></div>
  <div id="taskList" class="task-list">
    <div class="loading">Loading real tasks from NAIJA TASK…</div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="nav-item" href="dashboard.html"><b>⌂</b>Home</a>
    <a class="nav-item active" href="task.html"><b>▤</b>Tasks</a>
    <a class="nav-item" href="proofs.html"><b>▣</b>My Proofs</a>
    <a class="nav-item" href="wallet.html"><b>₦</b>Wallet</a>
    <a class="nav-item" href="profile.html"><b>●</b>Profile</a>
  </div>
</nav>

<!-- One modal containing all five screens -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog"
     aria-modal="true" aria-labelledby="modalTitle">
  <section class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Perform Task</div>
      <button class="close-btn" id="closeModal" type="button" aria-label="Close">×</button>
    </div>
    <div class="progress" id="progress">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://jwakveeiynpakunwjzkj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";
  const PROOF_BUCKET = "task-proofs";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const state = {
    user: null,
    profile: null,
    tasks: [],
    submissions: [],
    filter: "all",
    currentTask: null,
    step: 1,
    photo: null,
    submitting: false
  };

  const platformMap = {
    youtube: {label:"YouTube", icon:"youtube", color:"FF0033", emoji:"▶"},
    tiktok: {label:"TikTok", icon:"tiktok", color:"111111", emoji:"♪"},
    facebook: {label:"Facebook", icon:"facebook", color:"0866FF", emoji:"f"},
    instagram: {label:"Instagram", icon:"instagram", color:"C13584", emoji:"◎"},
    telegram: {label:"Telegram", icon:"telegram", color:"229ED9", emoji:"➤"},
    whatsapp: {label:"WhatsApp", icon:"whatsapp", color:"25D366", emoji:"◉"},
    x: {label:"X", icon:"x", color:"111111", emoji:"𝕏"},
    other: {label:"Task", icon:"", color:"087f36", emoji:"✓"}
  };

  function text(value) {
    return value === null || value === undefined ? "" : String(value);
  }

  function esc(value) {
    return text(value).replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[char]));
  }

  function money(value) {
    const number = Number(value);
    return Number.isFinite(number)
      ? "₦" + number.toLocaleString("en-NG",{maximumFractionDigits:2})
      : "₦0";
  }

  function normalise(value) {
    return text(value).trim().toLowerCase().replace(/[\s-]+/g,"_");
  }

  function platformFor(task) {
    const combined = [
      task.platform, task.category, task.category_name, task.task_type,
      task.title, task.description, task.task_link, task.post_link
    ].map(text).join(" ").toLowerCase();

    if (combined.includes("youtube") || combined.includes("youtu.be")) return "youtube";
    if (combined.includes("tiktok")) return "tiktok";
    if (combined.includes("instagram") || combined.includes("instagr.am")) return "instagram";
    if (combined.includes("facebook") || combined.includes("fb.com")) return "facebook";
    if (combined.includes("telegram") || combined.includes("t.me/")) return "telegram";
    if (combined.includes("whatsapp") || combined.includes("wa.me/")) return "whatsapp";
    if (/\bx\b/.test(combined) || combined.includes("twitter.com") || combined.includes("x.com")) return "x";
    return "other";
  }

  function platformIcon(key) {
    const p = platformMap[key] || platformMap.other;
    if (!p.icon) return `<span aria-hidden="true">${esc(p.emoji)}</span>`;
    const src = `https://cdn.simpleicons.org/${p.icon}/${p.color}`;
    return `<img src="${src}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${esc(p.emoji)}'">`;
  }

  function getTaskLink(task) {
    const candidate = text(task.task_link || task.post_link || task.url).trim();
    if (!candidate) return "";
    try {
      const url = new URL(candidate);
      if (url.protocol !== "https:" && url.protocol !== "http:") return "";
      return url.href;
    } catch {
      return "";
    }
  }

  function taskIsPublished(task) {
    if (task.active === false || task.active === 0 || text(task.active).toLowerCase() === "false") return false;

    const status = normalise(task.status);
    if (status && ["inactive","disabled","deleted","draft","rejected","cancelled","canceled","paused"].includes(status)) return false;

    const moderation = normalise(task.moderation_status);
    if (moderation && !["approved","active","published","live","not_required"].includes(moderation)) return false;

    const payment = normalise(task.payment_status);
    if (payment && ["unfunded","payment_required","pending_payment","failed","rejected","cancelled","canceled"].includes(payment)) return false;

    const now = Date.now();
    if (task.start_date && !Number.isNaN(Date.parse(task.start_date)) &&
        Date.parse(task.start_date) > now) return false;
    if (task.expiry_date && !Number.isNaN(Date.parse(task.expiry_date)) &&
        Date.parse(task.expiry_date) < now) return false;

    return true;
  }

  function taskAudience(task) {
    return normalise(task.task_audience || "normal");
  }

  function taskEligibility(task) {
    const audience = taskAudience(task);

    if (["activation","activation_task","activate","activation_only"].includes(audience)) {
      return {ok:true, note:"Activation task"};
    }

    if (["vip","vip_only","vip_task"].includes(audience)) {
      // Do not guess VIP status from a column that has not been confirmed.
      return {ok:false, note:"VIP eligibility must be verified by the platform."};
    }

    if (state.profile && state.profile.is_activated === false) {
      return {ok:false, note:"Activate your account to access normal tasks. Activation tasks remain available when published."};
    }

    return {ok:true, note:""};
  }

  function taskReward(task) {
    if (task.reward_per_worker !== null && task.reward_per_worker !== undefined &&
        task.reward_per_worker !== "") return Number(task.reward_per_worker) || 0;
    return Number(task.reward) || 0;
  }

  function submissionFor(taskId) {
    return state.submissions.filter(s => String(s.task_id) === String(taskId));
  }

  function alreadySubmitted(taskId) {
    return submissionFor(taskId).length > 0;
  }

  function visibleTasks() {
    return state.tasks.filter(task => {
      if (!taskIsPublished(task)) return false;
      if (!taskEligibility(task).ok) return false;
      if (alreadySubmitted(task.id)) return false;

      if (state.filter !== "all") {
        const p = platformFor(task);
        if (state.filter === "other") {
          if (p !== "other") return false;
        } else if (p !== state.filter) return false;
      }
      return true;
    });
  }

  function showNotice(message, warning=false) {
    const el = $("notice");
    el.textContent = message;
    el.className = "notice" + (warning ? " warn" : "");
  }

  function hideNotice() {
    $("notice").classList.add("hidden");
  }

  function renderTasks() {
    const list = $("taskList");
    const tasks = visibleTasks();

    if (!tasks.length) {
      const hasRecords = state.tasks.length > 0;
      list.innerHTML = `
        <div class="empty">
          <div style="font-size:30px;margin-bottom:10px">▤</div>
          <strong>${hasRecords ? "No eligible tasks found" : "No tasks available right now"}</strong>
          <div style="margin-top:8px">
            ${hasRecords
              ? "Tasks may be inactive, awaiting approval or funding, already submitted, or outside your account's eligibility."
              : "When approved and properly funded tasks become available, they will appear here."}
          </div>
          <button class="primary-btn" id="emptyRefresh" style="margin-top:15px">Refresh tasks</button>
        </div>`;
      $("emptyRefresh").addEventListener("click", loadTasks);
      return;
    }

    list.innerHTML = tasks.map(task => {
      const pkey = platformFor(task);
      const p = platformMap[pkey] || platformMap.other;
      const title = text(task.title || "Untitled task");
      const description = text(task.description || task.requirements || "Follow the instructions inside this task.");
      const slotsValue = task.slots ?? task.max_total_completions ?? task.max_completions ?? "—";
      const reward = taskReward(task);

      return `
        <article class="task-card">
          <div class="card-top">
            <div class="platform-icon">${platformIcon(pkey)}</div>
            <div class="card-main">
              <div class="task-title">${esc(title)}</div>
              <div class="platform-name">${esc(p.label)}</div>
              <span class="live-badge">● LIVE TASK</span>
            </div>
          </div>
          <div class="task-description">${esc(description.length > 180 ? description.slice(0,180)+"…" : description)}</div>
          <div class="card-bottom">
            <div>
              <div class="reward-label">Reward per approved task</div>
              <div class="reward">${money(reward)}</div>
              <div class="slots">Slots listed: ${esc(slotsValue)}</div>
            </div>
            <button class="primary-btn perform-btn" data-perform="${esc(task.id)}" type="button">
              Perform Task →
            </button>
          </div>
        </article>`;
    }).join("");

    list.querySelectorAll("[data-perform]").forEach(button => {
      button.addEventListener("click", () => {
        const task = state.tasks.find(t => String(t.id) === button.dataset.perform);
        if (task) openTask(task);
      });
    });
  }

  async function loadProfile() {
    const {data, error} = await supabase
      .from("profiles")
      .select("id,full_name,phone,balance,is_activated,role")
      .eq("id", state.user.id)
      .maybeSingle();

    if (error) throw error;
    state.profile = data || {id:state.user.id};
    $("userName").textContent = state.profile.full_name || state.user.email || "Tasker";
    $("balancePill").textContent = money(state.profile.balance || 0);
  }

  async function loadSubmissions() {
    const {data,error} = await supabase
      .from("task_submissions")
      .select("id,task_id,status,created_at,rejection_reason")
      .eq("user_id",state.user.id)
      .limit(500);

    if (error) throw error;
    state.submissions = data || [];
  }

  async function loadTasks() {
    $("taskList").innerHTML = '<div class="loading">Loading real tasks from NAIJA TASK…</div>';
    $("refreshBtn").disabled = true;
    hideNotice();

    try {
      const {data,error} = await supabase.rpc("get_available_tasks");

      if (error) {
        console.error("get_available_tasks error:",error);
        throw new Error("Could not load tasks from the task database: " + error.message);
      }

      state.tasks = Array.isArray(data) ? data : [];
      renderTasks();

      if (state.tasks.length === 0) {
        showNotice("The database returned no tasks. Check that a task is active, approved, funded, and allowed by get_available_tasks().",true);
      }
    } catch (error) {
      console.error(error);
      $("taskList").innerHTML = `
        <div class="error-box">
          <strong>Unable to load tasks</strong>
          <div style="margin-top:8px">${esc(error.message || "Unknown database error")}</div>
          <button class="primary-btn" id="retryTasks" style="margin-top:15px">Try again</button>
        </div>`;
      $("retryTasks").addEventListener("click",loadTasks);
    } finally {
      $("refreshBtn").disabled = false;
    }
  }

  function openTask(task) {
    const eligibility = taskEligibility(task);
    if (!eligibility.ok) {
      showNotice(eligibility.note,true);
      return;
    }

    if (!taskIsPublished(task)) {
      showNotice("This task is not currently available.",true);
      return;
    }

    if (alreadySubmitted(task.id)) {
      showNotice("You have already submitted this task. Check My Proofs for its status.",true);
      return;
    }

    state.currentTask = task;
    state.step = 1;
    state.photo = null;
    state.submitting = false;
    $("modalTitle").textContent = "Perform Task";
    $("modalBackdrop").classList.add("open");
    document.body.style.overflow = "hidden";
    renderStep();
  }

  function closeModal() {
    if (state.submitting) return;
    $("modalBackdrop").classList.remove("open");
    document.body.style.overflow = "";
    state.currentTask = null;
    state.photo = null;
  }

  function progressUpdate() {
    $("progress").querySelectorAll("span").forEach((bar,index) => {
      bar.classList.toggle("done",index < state.step);
    });
  }

  function taskInstructions(task) {
    const requirements = text(task.requirements).trim();
    const description = text(task.description).trim();
    if (requirements && description && requirements !== description) {
      return requirements + "\n\n" + description;
    }
    return requirements || description || "Follow the task requirements carefully and submit genuine proof.";
  }

  function needsUsername(task) {
    const combined = [
      task.requirements,task.description,task.required_proof,task.proof_type
    ].map(text).join(" ").toLowerCase();

    return /\b(your username|your handle|account username|profile username|username required|enter username|enter your handle)\b/.test(combined);
  }

  function needsPhoto(task) {
    if (task.upload_required === true || task.proof_required === true) return true;
    const proof = [
      task.required_proof,task.proof_type,task.requirements
    ].map(text).join(" ").toLowerCase();

    return /photo|image|screenshot|screen shot|upload/.test(proof);
  }

  function renderStep() {
    const task = state.currentTask;
    if (!task) return;
    progressUpdate();

    if (state.step === 1) return renderWarning(task);
    if (state.step === 2) return renderSummary(task);
    if (state.step === 3) return renderInstructions(task);
    if (state.step === 4) return renderUpload(task);
    if (state.step === 5) return renderSuccess(task);
  }

  function renderWarning(task) {
    const platform = platformMap[platformFor(task)].label;
    $("modalBody").innerHTML = `
      <div class="step-indicator">STEP 1 OF 5 · BEFORE YOU START</div>
      <div class="step-icon">⚠️</div>
      <h2 class="step-heading">Before you start this task</h2>
      <p class="step-text">
        Make sure you can access the required ${esc(platform)} account and that the task link works.
        Read the instructions carefully, complete the task genuinely, and submit proof that matches the requirements.
        Incorrect, misleading, or unrelated proof may be rejected under NAIJA TASK rules.
      </p>
      <div class="notice">
        <strong>Important:</strong> Do not submit fake screenshots or claim work you have not completed.
        Your reward is credited only after successful review.
      </div>
      <div class="modal-actions">
        <button class="action-main" id="continueBtn">I understand, continue →</button>
        <button class="action-secondary" id="cancelBtn">Cancel Task</button>
      </div>`;
    $("continueBtn").addEventListener("click",() => {state.step=2;renderStep();});
    $("cancelBtn").addEventListener("click",closeModal);
  }

  function renderSummary(task) {
    const pkey = platformFor(task);
    const platform = platformMap[pkey].label;
    const slots = task.slots ?? task.max_total_completions ?? task.max_completions ?? "—";

    $("modalBody").innerHTML = `
      <div class="step-indicator">STEP 2 OF 5 · TASK SUMMARY</div>
      <h2 class="step-heading">Review this task</h2>
      <p class="step-text" style="text-align:center">Confirm the details before you begin.</p>
      <div class="summary-box">
        <div class="summary-row"><span>Task Type</span><strong>${esc(platform)}</strong></div>
        <div class="summary-row"><span>Task Title</span><strong>${esc(task.title || "Untitled task")}</strong></div>
        <div class="summary-row"><span>You can earn</span><strong style="color:var(--green)">${money(taskReward(task))}</strong></div>
        <div class="summary-row"><span>Slots listed</span><strong>${esc(slots)}</strong></div>
        <div class="summary-row"><span>Status</span><strong style="color:var(--green)">● Live</strong></div>
      </div>
      <div class="modal-actions">
        <button class="action-main" id="continueBtn">Submit Proof · Continue →</button>
        <button class="action-secondary" id="cancelBtn">Cancel Task</button>
      </div>
      <div class="modal-footer">Reward will be added to your wallet after successful verification.</div>`;
    $("continueBtn").addEventListener("click",() => {state.step=3;renderStep();});
    $("cancelBtn").addEventListener("click",closeModal);
  }

  function renderInstructions(task) {
    const instructions = taskInstructions(task);
    const copyText = text(task.copy_text).trim();
    const link = getTaskLink(task);

    $("modalBody").innerHTML = `
      <div class="step-indicator">STEP 3 OF 5 · TASK INSTRUCTIONS</div>
      <h2 class="step-heading">Complete the task</h2>
      <p class="step-text">Follow the task owner's actual instructions. Do not skip required steps.</p>

      <div class="summary-box">
        <strong style="font-size:13px">Instructions</strong>
        <div style="white-space:pre-wrap;line-height:1.7;font-size:14px;margin-top:10px">${esc(instructions)}</div>
      </div>

      ${copyText ? `
        <div class="field">
          <label>Comment or text to use</label>
          <div class="copy-row">
            <div class="copy-value" id="copyValue">${esc(copyText)}</div>
            <button class="mini-btn" id="copyBtn" type="button">Copy</button>
          </div>
        </div>` : ""}

      <div class="field">
        <label>Task Link</label>
        ${link ? `
          <div class="link-row">
            <div class="link-value">${esc(link)}</div>
            <button class="mini-btn" id="openLinkBtn" type="button">Open ↗</button>
          </div>
          <div class="help-text">Open the real task link, complete the task, then return here to submit proof.</div>
        ` : `
          <div class="notice warn">No valid task link is saved for this task. Do not guess a link. Contact support or the task poster before proceeding.</div>
        `}
      </div>

      <div class="modal-actions">
        <button class="action-main" id="continueBtn">I completed the task →</button>
        <button class="action-secondary" id="cancelBtn">Cancel Task</button>
      </div>
      <div class="modal-footer">Reward will be added to your wallet after successful verification.</div>`;

    const copyBtn = $("copyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click",async () => {
        try {
          await navigator.clipboard.writeText(copyText);
          copyBtn.textContent = "Copied ✓";
        } catch {
          const area = document.createElement("textarea");
          area.value = copyText;
          document.body.appendChild(area);
          area.select();
          const success = document.execCommand("copy");
          area.remove();
          copyBtn.textContent = success ? "Copied ✓" : "Select text";
        }
      });
    }

    const openBtn = $("openLinkBtn");
    if (openBtn) {
      openBtn.addEventListener("click",() => {
        const safeLink = getTaskLink(task);
        if (safeLink) window.open(safeLink,"_blank","noopener,noreferrer");
      });
    }

    $("continueBtn").addEventListener("click",() => {
      if (!link) {
        showModalError("This task has no valid link. You cannot continue until the task owner fixes it.");
        return;
      }
      state.step=4;
      renderStep();
    });
    $("cancelBtn").addEventListener("click",closeModal);
  }

  function renderUpload(task) {
    const photoRequired = needsPhoto(task);
    const usernameRequired = needsUsername(task);

    $("modalBody").innerHTML = `
      <div class="step-indicator">STEP 4 OF 5 · SUBMIT PROOF</div>
      <h2 class="step-heading">Upload your proof</h2>
      <p class="step-text">Upload clear, genuine evidence showing that you completed this task.</p>

      <label class="upload-box" for="proofPhoto">
        <div class="upload-icon">📷</div>
        <strong id="uploadLabel">Upload Screenshot${photoRequired ? " (Required)" : " (Optional)"}</strong>
        <small>Tap to choose an image from your phone.<br>JPG, PNG or WEBP · Maximum 5 MB</small>
        <input id="proofPhoto" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <img id="photoPreview" class="preview hidden" alt="Selected proof preview">

      ${usernameRequired ? `
        <div class="field">
          <label for="workerUsername">Your platform username / handle *</label>
          <input id="workerUsername" type="text" maxlength="120" placeholder="Enter the username you used">
        </div>` : ""}

      <div class="field">
        <label for="proofDetails">Proof details${task.proof_required === true ? " *" : " (if needed)"}</label>
        <textarea id="proofDetails" maxlength="2000" placeholder="Explain what you completed, or enter the requested proof details."></textarea>
        <div class="help-text">Never enter your password, verification code, or other private login details.</div>
      </div>

      <div id="submitError" class="inline-error hidden"></div>
      <div id="submitNotice" class="inline-success hidden"></div>

      <div class="modal-actions">
        <button class="action-main" id="submitBtn">Submit Proof</button>
        <button class="action-secondary" id="cancelBtn">Cancel Task</button>
      </div>
      <div class="modal-footer">Your submission will be reviewed. A submission does not guarantee approval or payment.</div>`;

    $("proofPhoto").addEventListener("change",event => {
      const file = event.target.files && event.target.files[0];
      state.photo = null;
      $("photoPreview").classList.add("hidden");
      $("photoPreview").removeAttribute("src");

      if (!file) return;
      const allowed = ["image/jpeg","image/png","image/webp"];
      if (!allowed.includes(file.type)) {
        event.target.value = "";
        showSubmitError("Choose a JPG, PNG, or WEBP image.");
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        event.target.value = "";
        showSubmitError("Your image is larger than 5 MB. Choose a smaller image.");
        return;
      }

      state.photo = file;
      $("uploadLabel").textContent = file.name;
      $("photoPreview").src = URL.createObjectURL(file);
      $("photoPreview").classList.remove("hidden");
      clearSubmitError();
    });

    $("submitBtn").addEventListener("click",submitProof);
    $("cancelBtn").addEventListener("click",closeModal);
  }

  function showModalError(message) {
    const body = $("modalBody");
    let el = $("modalGeneralError");
    if (!el) {
      el = document.createElement("div");
      el.id = "modalGeneralError";
      el.className = "inline-error";
      body.prepend(el);
    }
    el.textContent = message;
  }

  function showSubmitError(message) {
    const el = $("submitError");
    if (!el) return;
    el.textContent = message;
    el.classList.remove("hidden");
  }

  function clearSubmitError() {
    const el = $("submitError");
    if (el) {
      el.textContent = "";
      el.classList.add("hidden");
    }
  }

  async function submitProof() {
    if (state.submitting) return;
    clearSubmitError();

    const task = state.currentTask;
    if (!task || !state.user) {
      showSubmitError("Your login session is missing. Sign in again and retry.");
      return;
    }

    const photoRequired = needsPhoto(task);
    const usernameRequired = needsUsername(task);
    const details = text($("proofDetails")?.value).trim();
    const username = text($("workerUsername")?.value).trim();

    if (photoRequired && !state.photo) {
      showSubmitError("This task requires a screenshot or photo. Please select one.");
      return;
    }
    if (usernameRequired && !username) {
      showSubmitError("Enter the username requested by this task.");
      return;
    }
    if (task.proof_required === true && !details && !state.photo) {
      showSubmitError("This task requires proof details or a screenshot.");
      return;
    }

    state.submitting = true;
    const submitBtn = $("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";

    let storagePath = "";
    let photoUrl = "";

    try {
      // Check again before upload. A database unique constraint is still
      // recommended to prevent simultaneous duplicate submissions.
      const {data:existing,error:checkError} = await supabase
        .from("task_submissions")
        .select("id")
        .eq("user_id",state.user.id)
        .eq("task_id",task.id)
        .limit(1);

      if (checkError) throw new Error("Could not verify previous submissions: " + checkError.message);
      if (existing && existing.length) {
        throw new Error("You have already submitted this task. Check My Proofs for its status.");
      }

      if (state.photo) {
        const extMap = {
          "image/jpeg":"jpg",
          "image/png":"png",
          "image/webp":"webp"
        };
        const ext = extMap[state.photo.type] || "jpg";
        storagePath = `${state.user.id}/${task.id}/${Date.now()}.${ext}`;

        const {error:uploadError} = await supabase.storage
          .from(PROOF_BUCKET)
          .upload(storagePath,state.photo,{
            contentType:state.photo.type,
            upsert:false
          });

        if (uploadError) {
          throw new Error("Photo upload failed: " + uploadError.message +
            ". Check that the task-proofs storage bucket and upload policy allow signed-in users to upload.");
        }

        const {data:signedData,error:signedError} = await supabase.storage
          .from(PROOF_BUCKET)
          .createSignedUrl(storagePath,60 * 60 * 24 * 7);

        if (!signedError && signedData?.signedUrl) photoUrl = signedData.signedUrl;
      }

      const proofObject = {
        photo_url:photoUrl || null,
        storage_path:storagePath || null,
        file_name:state.photo ? state.photo.name : null,
        text:details || null,
        username:username || null,
        comment:text(task.copy_text).trim() || null,
        submitted_from:"task.html"
      };

      const {error:insertError} = await supabase
        .from("task_submissions")
        .insert({
          user_id:state.user.id,
          task_id:task.id,
          proof:JSON.stringify(proofObject),
          status:"pending"
        });

      if (insertError) {
        // Do not delete an uploaded proof automatically; retain it for troubleshooting.
        throw new Error("Proof could not be saved: " + insertError.message);
      }

      state.submissions.push({
        id:"new-" + Date.now(),
        task_id:task.id,
        status:"pending",
        created_at:new Date().toISOString()
      });

      state.step=5;
      renderStep();
      renderTasks();

    } catch (error) {
      console.error("Proof submission failed:",error);
      showSubmitError(error.message || "Submission failed. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Proof";
    } finally {
      state.submitting = false;
    }
  }

  function renderSuccess(task) {
    $("modalTitle").textContent = "Submission Received";
    $("modalBody").innerHTML = `
      <div class="step-indicator">STEP 5 OF 5 · COMPLETE</div>
      <div class="success-icon">✓</div>
      <h2 class="step-heading">Proof submitted successfully!</h2>
      <p class="step-text" style="text-align:center">
        Your proof for <strong>${esc(task.title || "this task")}</strong> has been sent for review.
        Your reward is not credited until the submission is approved.
      </p>
      <div class="summary-box">
        <div class="summary-row"><span>Submission status</span><strong style="color:var(--orange)">Pending review</strong></div>
        <div class="summary-row"><span>Potential reward</span><strong style="color:var(--green)">${money(taskReward(task))}</strong></div>
      </div>
      <div class="modal-actions">
        <button class="action-main" id="viewProofsBtn">View My Proofs</button>
        <button class="action-secondary" id="doneBtn" style="color:var(--green)">Back to Tasks</button>
      </div>
      <div class="modal-footer">Keep your proof genuine and wait for the review result.</div>`;

    $("viewProofsBtn").addEventListener("click",() => {
      window.location.href = "proofs.html";
    });
    $("doneBtn").addEventListener("click",closeModal);
  }

  async function initialise() {
    const {data:{session},error} = await supabase.auth.getSession();
    if (error) throw error;

    if (!session?.user) {
      window.location.href = "login.html?redirect=task.html";
      return;
    }

    state.user = session.user;
    await loadProfile();
    await loadSubmissions();
    await loadTasks();

    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get("task_id");
    if (requestedId) {
      const requestedTask = state.tasks.find(t => String(t.id) === requestedId);
      if (requestedTask && taskIsPublished(requestedTask) &&
          !alreadySubmitted(requestedTask.id)) {
        openTask(requestedTask);
      }
    }
  }

  $("refreshBtn").addEventListener("click",async () => {
    try {
      await loadSubmissions();
      await loadTasks();
    } catch(error) {
      console.error(error);
      showNotice(error.message || "Could not refresh task data.",true);
    }
  });

  $("filters").querySelectorAll("[data-filter]").forEach(button => {
    button.addEventListener("click",() => {
      state.filter = button.dataset.filter;
      $("filters").querySelectorAll(".filter").forEach(btn =>
        btn.classList.toggle("active",btn === button)
      );
      renderTasks();
    });
  });

  $("closeModal").addEventListener("click",closeModal);
  $("modalBackdrop").addEventListener("click",event => {
    if (event.target === $("modalBackdrop")) closeModal();
  });

  document.addEventListener("keydown",event => {
    if (event.key === "Escape" && !$("modalBackdrop").classList.contains("open")) return;
    if (event.key === "Escape" && !state.submitting) closeModal();
  });

  initialise().catch(error => {
    console.error("Initialisation error:",error);
    $("taskList").innerHTML = `
      <div class="error-box">
        <strong>Unable to open your task dashboard</strong>
        <div style="margin-top:8px">${esc(error.message || "Please sign in again and retry.")}</div>
        <button class="primary-btn" onclick="location.reload()" style="margin-top:15px">Reload</button>
      </div>`;
  });
})();
</script>
</body>
</html>
