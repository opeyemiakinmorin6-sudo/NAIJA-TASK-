<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Available Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#0b8f3c;
  --green-dark:#08752f;
  --green-light:#eaf8ee;
  --bg:#f5fff7;
  --text:#17231b;
  --muted:#647067;
  --border:#dcebe0;
  --red:#c62828;
  --orange:#b86b00;
  --blue:#1267a8;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--green);
  color:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
}

.header-inner{
  max-width:760px;
  margin:auto;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:3px;
  font-size:12px;
  opacity:.9;
}

.back-btn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.13);
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-weight:800;
}

.container{
  max-width:760px;
  margin:auto;
  padding:16px 13px 50px;
}

.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(20,70,35,.05);
}

.hero h1{
  font-size:23px;
  font-weight:900;
}

.hero p{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

.notice{
  margin-top:13px;
  background:var(--green-light);
  color:var(--green-dark);
  border-radius:11px;
  padding:10px 12px;
  font-size:12px;
  font-weight:700;
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
  padding:28px 16px;
  text-align:center;
}

.error{
  color:var(--red);
}

.task-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:17px;
  box-shadow:0 5px 18px rgba(20,70,35,.06);
}

.task-head{
  padding:16px;
  border-bottom:1px solid #edf2ee;
}

.platform-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.platform-icon,
.platform-fallback{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:12px;
}

.platform-icon{
  object-fit:contain;
  padding:7px;
  background:#f1f6f2;
}

.platform-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green);
  color:#fff;
  font-weight:900;
}

.platform-name{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.task-title{
  margin-top:3px;
  font-size:19px;
  font-weight:900;
  line-height:1.3;
}

.task-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.meta-box{
  background:#f7faf8;
  border-radius:11px;
  padding:10px;
}

.meta-label{
  color:#758079;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
}

.meta-value{
  margin-top:4px;
  font-size:14px;
  font-weight:900;
}

.reward{
  color:var(--green-dark);
}

.remaining{
  color:var(--green-dark);
}

.remaining.low{
  color:var(--orange);
}

.remaining.none{
  color:var(--red);
}

.task-body{
  padding:16px;
}

.section{
  margin-bottom:18px;
}

.section:last-child{
  margin-bottom:0;
}

.section-title{
  margin-bottom:8px;
  font-size:14px;
  font-weight:900;
}

.description{
  color:#4e5b53;
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.owner{
  display:inline-block;
  background:var(--green-light);
  color:var(--green-dark);
  border-radius:9px;
  padding:7px 10px;
  font-size:13px;
  font-weight:800;
}

.link-box,
.copy-box{
  background:#f7faf8;
  border:1px solid #dfeae2;
  border-radius:12px;
  padding:12px;
}

.task-link{
  display:block;
  color:var(--blue);
  font-size:13px;
  line-height:1.45;
  word-break:break-all;
  margin-bottom:10px;
}

.copy-text{
  color:#35433a;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.action-btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-size:13px;
  font-weight:900;
}

.open-btn{
  background:var(--blue);
  color:#fff;
}

.copy-btn{
  background:#e9f6ed;
  color:var(--green-dark);
}

.copy-btn.copied{
  background:var(--green);
  color:#fff;
}

.start-btn,
.submit-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:var(--green);
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.start-btn:active,
.submit-btn:active{
  transform:scale(.99);
}

.submit-btn:disabled{
  opacity:.6;
}

.status-box{
  border-radius:12px;
  padding:12px;
  font-size:13px;
  line-height:1.45;
  font-weight:800;
}

.status-success{
  background:#eaf8ee;
  color:var(--green-dark);
}

.status-warning{
  background:#fff7e8;
  color:var(--orange);
}

.status-error{
  background:#fff0ef;
  color:var(--red);
}

.field{
  margin-bottom:14px;
}

.field-label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:900;
}

input[type=text],
input[type=url],
textarea{
  width:100%;
  border:1px solid #cbd9cf;
  border-radius:10px;
  padding:12px;
  outline:none;
  background:#fff;
  color:var(--text);
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(11,143,60,.08);
}

.photo-upload{
  position:relative;
  min-height:155px;
  border:2px dashed var(--green);
  border-radius:15px;
  background:#effbf2;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.photo-upload input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:5;
}

.upload-content{
  padding:18px;
  pointer-events:none;
}

.upload-icon{
  font-size:38px;
}

.upload-title{
  margin-top:7px;
  color:var(--green-dark);
  font-size:16px;
  font-weight:900;
}

.upload-subtitle{
  margin-top:5px;
  color:#65736b;
  font-size:11px;
}

.photo-preview{
  display:none;
  width:100%;
  max-height:330px;
  object-fit:contain;
  margin-top:10px;
  border-radius:13px;
  background:#f2f2f2;
}

.photo-selected{
  border-style:solid;
}

.photo-selected .upload-content{
  display:none;
}

.message{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:10px;
  font-size:13px;
  line-height:1.45;
}

.message.success{
  display:block;
  background:#eaf8ee;
  color:var(--green-dark);
}

.message.error{
  display:block;
  background:#fff0ef;
  color:var(--red);
}

.locked{
  padding:12px;
  border-radius:12px;
  background:#f4f5f4;
  color:#59645d;
  font-size:13px;
  font-weight:800;
}

@media(max-width:430px){
  .task-meta{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">NAIJA TASK</div>
      <div class="subtitle">Complete tasks. Earn money.</div>
    </div>

    <button class="back-btn" onclick="goBack()">Back</button>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Available Tasks</h1>
    <p>
      Complete genuine tasks, follow the poster's instructions
      and submit clear proof for review.
    </p>

    <div class="notice">
      📷 Photo proof is required for every task.
    </div>
  </section>

  <div id="tasksArea" class="loading">
    Loading available tasks...
  </div>

</main>

<script>
const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Keep the CURRENT publishable key already used
  in your local project here.
*/
const SUPABASE_KEY =
     "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";



const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const TASK_PROOF_BUCKET = "task-proofs";

const tasksArea =
  document.getElementById("tasksArea");

let currentUser = null;
let loadedTasks = [];
let completionCounts = {};
let userTaskStates = {};

const platformIcons = {
  TikTok:"https://cdn.simpleicons.org/tiktok",
  YouTube:"https://cdn.simpleicons.org/youtube",
  Instagram:"https://cdn.simpleicons.org/instagram",
  Facebook:"https://cdn.simpleicons.org/facebook",
  X:"https://cdn.simpleicons.org/x",
  Twitter:"https://cdn.simpleicons.org/x",
  Telegram:"https://cdn.simpleicons.org/telegram",
  WhatsApp:"https://cdn.simpleicons.org/whatsapp",
  LinkedIn:"https://cdn.simpleicons.org/linkedin",
  Snapchat:"https://cdn.simpleicons.org/snapchat",
  Discord:"https://cdn.simpleicons.org/discord",
  Spotify:"https://cdn.simpleicons.org/spotify",
  Audiomack:"https://cdn.simpleicons.org/audiomack",
  Google:"https://cdn.simpleicons.org/google"
};

function goBack(){
  if(history.length > 1){
    history.back();
  }else{
    location.href="dashboard.html";
  }
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeUrl(value){
  if(!value) return "";
  let url=String(value).trim();
  if(!url) return "";
  if(!/^https?:\/\//i.test(url)){
    url="https://"+url;
  }
  return url;
}

function expired(task){
  if(!task.expiry_date) return false;
  return new Date(task.expiry_date).getTime() <= Date.now();
}

function capacity(task){
  const value =
    task.max_total_completions ??
    task.max_completions ??
    task.slots ??
    0;

  const n=Number(value);

  return Number.isFinite(n) && n>0 ? n : 0;
}

function remaining(task){
  return Math.max(
    0,
    capacity(task) -
    Number(completionCounts[task.id] || 0)
  );
}

function userState(task){
  return userTaskStates[task.id] || null;
}

function platformHTML(type){
  const name=type || "Task";
  const icon=platformIcons[name];

  if(!icon){
    return `<div class="platform-fallback">NT</div>`;
  }

  return `
    <img
      class="platform-icon"
      src="${icon}"
      alt="${escapeHTML(name)}"
      onerror="
        this.style.display='none';
        this.nextElementSibling.style.display='flex';
      "
    >
    <div class="platform-fallback" style="display:none">NT</div>
  `;
}

function linkHTML(task,index){
  const url=normalizeUrl(
    task.task_link ||
    task.post_link ||
    ""
  );

  if(!url){
    return `
      <div class="link-box">
        <div class="description">
          No external task link was provided.
        </div>
      </div>
    `;
  }

  return `
    <div class="link-box">
      <a
        class="task-link"
        href="${escapeHTML(url)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHTML(url)}
      </a>

      <div class="action-row">
        <button
          class="action-btn open-btn"
          onclick="openTask(${index})"
          type="button"
        >
          Open Task
        </button>

        <button
          class="action-btn copy-btn"
          id="copy-link-${index}"
          onclick="copyLink(${index})"
          type="button"
        >
          Copy Link
        </button>
      </div>
    </div>
  `;
}

function copyTextHTML(task,index){
  if(!task.copy_text) return "";

  return `
    <div class="section">
      <div class="section-title">Copy Text</div>

      <div class="copy-box">
        <div class="copy-text">
          ${escapeHTML(task.copy_text)}
        </div>

        <div class="action-row" style="margin-top:9px">
          <button
            class="action-btn copy-btn"
            id="copy-text-${index}"
            onclick="copyTaskText(${index})"
            type="button"
          >
            Copy Text
          </button>
        </div>
      </div>
    </div>
  `;
}

function actionHTML(task,index){
  const left=remaining(task);
  const state=userState(task);

  if(expired(task)){
    return `
      <div class="status-box status-error">
        This task has expired.
      </div>
    `;
  }

  if(left<=0){
    return `
      <div class="status-box status-warning">
        This task is full. All available worker slots have been used.
      </div>
    `;
  }

  if(state==="APPROVED"){
    return `
      <div class="status-box status-success">
        ✓ You already completed this task.
        The same task cannot be completed twice.
      </div>
    `;
  }

  if(state==="PENDING"){
    return `
      <div class="status-box status-warning">
        ⏳ Your proof for this task is already under review.
        Do not submit it again.
      </div>
    `;
  }

  if(state==="REJECTED"){
    return `
      <div class="section">
        <div class="status-box status-error">
          Your previous proof was rejected. You may submit corrected proof.
        </div>

        <button
          class="start-btn"
          style="margin-top:10px"
          onclick="showProof(${index})"
          type="button"
        >
          Submit Corrected Proof
        </button>

        ${proofForm(index)}
      </div>
    `;
  }

  return `
    <div class="section">
      <button
        class="start-btn"
        onclick="showProof(${index})"
        type="button"
      >
        Start Task & Submit Proof
      </button>

      ${proofForm(index)}
    </div>
  `;
}

function proofForm(index){
  return `
    <div
      id="proof-${index}"
      style="display:none;margin-top:14px"
    >
      <div class="section-title">
        Submit Proof
      </div>

      <div class="description" style="margin-bottom:13px">
        Complete the task according to the poster's instructions.
        Then provide the requested details and upload a clear photo
        or screenshot.
      </div>

      <form onsubmit="submitProof(event,${index})">

        <div class="field">
          <label class="field-label">
            Username / Account Used *
          </label>

          <input
            type="text"
            id="username-${index}"
            placeholder="Username you used"
            required
          >
        </div>

        <div class="field">
          <label class="field-label">
            Comment / Report *
          </label>

          <textarea
            id="comment-${index}"
            placeholder="Explain what you completed..."
            required
          ></textarea>
        </div>

        <div class="field">
          <label class="field-label">
            Extra Proof Link
          </label>

          <input
            type="url"
            id="proof-link-${index}"
            placeholder="https://..."
          >
        </div>

        <div class="field">
          <label class="field-label">
            Photo Proof *
          </label>

          <div
            class="photo-upload"
            id="upload-${index}"
          >
            <input
              type="file"
              id="photo-${index}"
              accept="image/jpeg,image/png,image/webp"
              required
              onchange="selectPhoto(event,${index})"
            >

            <div class="upload-content">
              <div class="upload-icon">📷</div>

              <div class="upload-title">
                TAP TO UPLOAD PHOTO
              </div>

              <div class="upload-subtitle">
                JPG, PNG or WEBP • Maximum 5MB
              </div>
            </div>
          </div>

          <img
            id="preview-${index}"
            class="photo-preview"
            alt="Selected proof"
          >
        </div>

        <button
          class="submit-btn"
          id="submit-${index}"
          type="submit"
        >
          Submit Proof
        </button>

        <div
          id="message-${index}"
          class="message"
        ></div>

      </form>
    </div>
  `;
}

function taskCard(task,index){
  const left=remaining(task);

  return `
    <article class="task-card">

      <div class="task-head">

        <div class="platform-row">

          ${platformHTML(task.task_type)}

          <div>
            <div class="platform-name">
              ${escapeHTML(
                task.task_type || "General Task"
              )}
            </div>

            <div class="task-title">
              ${escapeHTML(task.title)}
            </div>
          </div>

        </div>

        <div class="task-meta">

          <div class="meta-box">
            <div class="meta-label">Reward</div>
            <div class="meta-value reward">
              ₦${Number(task.reward || 0).toLocaleString()}
            </div>
          </div>

          <div class="meta-box">
            <div class="meta-label">Remaining</div>
            <div class="
              meta-value remaining
              ${left<=0 ? "none" : left<=5 ? "low" : ""}
            ">
              ${left.toLocaleString()}
            </div>
          </div>

          <div class="meta-box">
            <div class="meta-label">Total Slots</div>
            <div class="meta-value">
              ${capacity(task).toLocaleString()}
            </div>
          </div>

          <div class="meta-box">
            <div class="meta-label">Status</div>
            <div class="meta-value">
              ${
                expired(task)
                ? "EXPIRED"
                : left<=0
                ? "FULL"
                : userState(task)==="APPROVED"
                ? "COMPLETED"
                : userState(task)==="PENDING"
                ? "REVIEW"
                : "LIVE"
              }
            </div>
          </div>

        </div>
      </div>

      <div class="task-body">

        <div class="section">
          <div class="section-title">
            Task Description
          </div>

          <div class="description">
            ${escapeHTML(
              task.description ||
              "No additional instructions were provided by the poster."
            )}
          </div>
        </div>

        <div class="section">
          <div class="section-title">
            Task Poster
          </div>

          <span class="owner">
            ${escapeHTML(
              task.uploader_username ||
              "NAIJA TASK Poster"
            )}
          </span>
        </div>

        <div class="section">
          <div class="section-title">
            Task Link
          </div>

          ${linkHTML(task,index)}
        </div>

        ${copyTextHTML(task,index)}

        ${actionHTML(task,index)}

      </div>
    </article>
  `;
}

async function loadTasks(){

  tasksArea.className="loading";
  tasksArea.innerHTML="Loading available tasks...";

  completionCounts={};
  userTaskStates={};

  const {
    data,
    error
  }=await db
    .from("tasks")
    .select(`
      id,
      title,
      description,
      reward,
      slots,
      max_total_completions,
      max_completions,
      max_completions_per_user,
      expiry_date,
      requirements,
      proof_type,
      proof_required,
      active,
      status,
      task_type,
      task_link,
      uploader_username,
      copy_text,
      post_link,
      upload_required,
      created_at
    `)
    .eq("active",true)
    .eq("status","LIVE")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);

    tasksArea.className="error";
    tasksArea.innerHTML=`
      <strong>Unable to load tasks.</strong>
      <br><br>
      ${escapeHTML(error.message)}
    `;
    return;
  }

  loadedTasks=(data || []).filter(
    task=>!expired(task)
  );

  if(!loadedTasks.length){
    tasksArea.className="empty";
    tasksArea.innerHTML=`
      <strong>No live tasks available right now.</strong>
      <br><br>
      Please check again later.
    `;
    return;
  }

  const ids=loadedTasks.map(t=>t.id);

  const {
    data:completions,
    error:completionError
  }=await db
    .from("task_completions")
    .select("task_id,user_id")
    .in("task_id",ids);

  if(completionError){
    console.error(completionError);

    tasksArea.className="error";
    tasksArea.innerHTML=`
      <strong>Could not calculate task availability.</strong>
      <br><br>
      ${escapeHTML(completionError.message)}
    `;
    return;
  }

  (completions || []).forEach(row=>{
    completionCounts[row.task_id]=
      Number(completionCounts[row.task_id] || 0)+1;

    if(row.user_id===currentUser.id){
      userTaskStates[row.task_id]="APPROVED";
    }
  });

  /*
    Pending/rejected submissions are checked separately.
    Approved completion always takes priority.
  */
  const {
    data:subs
  }=await db
    .from("task_submissions")
    .select("task_id,status")
    .eq("user_id",currentUser.id)
    .in("task_id",ids);

  (subs || []).forEach(row=>{
    if(userTaskStates[row.task_id]==="APPROVED") return;

    const status=String(
      row.status || ""
    ).toUpperCase();

    if(status==="PENDING"){
      userTaskStates[row.task_id]="PENDING";
    }else if(status==="REJECTED"){
      userTaskStates[row.task_id]="REJECTED";
    }else if(status==="APPROVED"){
      userTaskStates[row.task_id]="APPROVED";
    }
  });

  tasksArea.className="";

  tasksArea.innerHTML=
    loadedTasks.map(
      (task,index)=>taskCard(task,index)
    ).join("");
}

function showProof(index){

  const task=loadedTasks[index];

  if(!task) return;

  if(remaining(task)<=0){
    alert("This task is already full.");
    return;
  }

  if(
    userTaskStates[task.id]==="APPROVED" ||
    userTaskStates[task.id]==="PENDING"
  ){
    return;
  }

  const box=document.getElementById(
    `proof-${index}`
  );

  if(!box) return;

  box.style.display="block";

  box.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

  trackStart(task);
}

async function trackStart(task){

  try{
    await db
      .from("task_activity")
      .insert({
        task_id:task.id,
        user_id:currentUser.id,
        activity_type:"STARTED"
      });
  }catch(e){
    console.log("Activity tracking skipped:",e);
  }
}

function selectPhoto(event,index){

  const file=event.target.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    event.target.value="";
    alert("Please select an image.");
    return;
  }

  if(file.size>5*1024*1024){
    event.target.value="";
    alert("Photo must be 5MB or smaller.");
    return;
  }

  const preview=document.getElementById(
    `preview-${index}`
  );

  const box=document.getElementById(
    `upload-${index}`
  );

  const reader=new FileReader();

  reader.onload=e=>{
    preview.src=e.target.result;
    preview.style.display="block";
    box.classList.add("photo-selected");
  };

  reader.readAsDataURL(file);
}

function showMessage(index,type,text){

  const box=document.getElementById(
    `message-${index}`
  );

  if(!box) return;

  box.className=`message ${type}`;
  box.textContent=text;
}

async function submitProof(event,index){

  event.preventDefault();

  const task=loadedTasks[index];

  if(!task) return;

  if(remaining(task)<=0){
    showMessage(
      index,
      "error",
      "This task is already full."
    );
    await loadTasks();
    return;
  }

  const state=userTaskStates[task.id];

  if(state==="APPROVED" || state==="PENDING"){
    showMessage(
      index,
      "error",
      "You cannot submit this task again."
    );
    return;
  }

  if(expired(task)){
    showMessage(
      index,
      "error",
      "This task has expired."
    );
    return;
  }

  const username=document
    .getElementById(`username-${index}`)
    .value.trim();

  const comment=document
    .getElementById(`comment-${index}`)
    .value.trim();

  const proofLink=document
    .getElementById(`proof-link-${index}`)
    .value.trim();

  const fileInput=document.getElementById(
    `photo-${index}`
  );

  const file=fileInput.files?.[0];

  if(!username){
    showMessage(index,"error","Enter the username used.");
    return;
  }

  if(!comment){
    showMessage(index,"error","Enter your report/comment.");
    return;
  }

  if(!file){
    showMessage(index,"error","Photo proof is required.");
    return;
  }

  if(file.size>5*1024*1024){
    showMessage(index,"error","Photo must be 5MB or smaller.");
    return;
  }

  const button=document.getElementById(
    `submit-${index}`
  );

  button.disabled=true;
  button.textContent="Uploading proof...";

  let uploadedPath=null;

  try{

    /*
      Re-check immediately before upload.
      This prevents stale browser state.
    */
    const {
      data:latest
    }=await db
      .from("task_completions")
      .select("id")
      .eq("task_id",task.id)
      .eq("user_id",currentUser.id)
      .limit(1);

    if(latest?.length){
      throw new Error(
        "You have already completed this task."
      );
    }

    const {
      data:pending
    }=await db
      .from("task_submissions")
      .select("id,status")
      .eq("task_id",task.id)
      .eq("user_id",currentUser.id)
      .in("status",["PENDING","APPROVED"])
      .limit(1);

    if(pending?.length){
      throw new Error(
        "You already have a submission for this task."
      );
    }

    const extension=
      file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "jpg";

    uploadedPath=
      `${currentUser.id}/${task.id}/${Date.now()}.${extension}`;

    const {
      error:uploadError
    }=await db
      .storage
      .from(TASK_PROOF_BUCKET)
      .upload(
        uploadedPath,
        file,
        {
          contentType:file.type,
          upsert:false
        }
      );

    if(uploadError) throw uploadError;

    button.textContent="Saving proof...";

    const proof={
      photo:{
        bucket:TASK_PROOF_BUCKET,
        path:uploadedPath,
        name:file.name,
        type:file.type,
        size:file.size
      },
      worker_username:username,
      worker_comment:comment,
      worker_link:proofLink || null,
      submitted_at:new Date().toISOString()
    };

    const {
      error:insertError
    }=await db
      .from("task_submissions")
      .insert({
        user_id:currentUser.id,
        task_id:task.id,
        proof:JSON.stringify(proof),
        status:"PENDING"
      });

    if(insertError) throw insertError;

    userTaskStates[task.id]="PENDING";

    showMessage(
      index,
      "success",
      "Proof submitted successfully. It is now under review."
    );

    button.textContent="Proof Submitted ✓";

    event.target
      .querySelectorAll("input,textarea")
      .forEach(el=>el.disabled=true);

    await loadTasks();

  }catch(error){

    console.error(error);

    if(uploadedPath){
      try{
        await db
          .storage
          .from(TASK_PROOF_BUCKET)
          .remove([uploadedPath]);
      }catch(e){
        console.log("Orphan cleanup failed:",e);
      }
    }

    button.disabled=false;
    button.textContent="Submit Proof";

    showMessage(
      index,
      "error",
      error?.message ||
      "Could not submit your proof."
    );
  }
}

function openTask(index){

  const task=loadedTasks[index];

  if(!task) return;

  const url=normalizeUrl(
    task.task_link ||
    task.post_link ||
    ""
  );

  if(!url){
    alert("This task has no external link.");
    return;
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

async function copyReliable(text){

  try{
    if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}

  try{
    const area=document.createElement("textarea");
    area.value=text;
    area.style.position="fixed";
    area.style.left="-9999px";
    document.body.appendChild(area);
    area.focus();
    area.select();

    const result=document.execCommand("copy");

    area.remove();

    return result;
  }catch(e){
    return false;
  }
}

async function copyLink(index){

  const task=loadedTasks[index];

  const url=normalizeUrl(
    task?.task_link ||
    task?.post_link ||
    ""
  );

  if(!url) return;

  const ok=await copyReliable(url);

  const btn=document.getElementById(
    `copy-link-${index}`
  );

  if(ok){
    btn.textContent="Copied ✓";

    setTimeout(()=>{
      btn.textContent="Copy Link";
    },1500);
  }else{
    alert("Copy was blocked. Long-press the link to copy it.");
  }
}

async function copyTaskText(index){

  const task=loadedTasks[index];

  if(!task?.copy_text) return;

  const ok=await copyReliable(
    task.copy_text
  );

  const btn=document.getElementById(
    `copy-text-${index}`
  );

  if(ok){
    btn.textContent="Copied ✓";

    setTimeout(()=>{
      btn.textContent="Copy Text";
    },1500);
  }else{
    alert("Copy was blocked. Select the text manually.");
  }
}

async function startPage(){

  const {
    data,
    error
  }=await db.auth.getUser();

  if(error || !data?.user){
    location.href="index.html";
    return;
  }

  currentUser=data.user;

  await loadTasks();
}

startPage();
</script>
