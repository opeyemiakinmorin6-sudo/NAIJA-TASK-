<script>

/* =====================================================
   NAIJA TASK — TASK PAGE

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Paste your existing Supabase publishable key here.
*/
const SUPABASE_KEY =

/* =====================================================
   BASIC FUNCTIONS
   ===================================================== */

function goBack(){

  if(document.referrer){
    history.back();
  }else{
    window.location.href = "dashboard.html";
  }

}


function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showError(message){

  const box = document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";

}


function formatDate(date){

  if(!date){
    return "No deadline";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return "No deadline";
  }

  return d.toLocaleDateString(
    "en-NG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


function formatRequirements(requirements){

  if(!requirements){
    return "Follow the task description.";
  }

  if(Array.isArray(requirements)){
    return requirements.join("\n");
  }

  if(typeof requirements === "object"){

    return Object.entries(requirements)
      .map(([key,value]) => `${key}: ${value}`)
      .join("\n");

  }

  return String(requirements);

}


function getTaskIcon(task){

  const text = (
    (task.title || "") +
    " " +
    (task.description || "") +
    " " +
    (task.task_type || "")
  ).toLowerCase();

  if(text.includes("tiktok")){
    return "🎵";
  }

  if(text.includes("youtube")){
    return "▶️";
  }

  if(text.includes("instagram")){
    return "📸";
  }

  if(text.includes("facebook")){
    return "📘";
  }

  if(text.includes("telegram")){
    return "✈️";
  }

  if(text.includes("survey")){
    return "📝";
  }

  if(
    text.includes("app") ||
    text.includes("download")
  ){
    return "📱";
  }

  if(
    text.includes("website") ||
    text.includes("web")
  ){
    return "🌐";
  }

  return "✅";

}


function formatType(type){

  if(!type){
    return "Task";
  }

  return String(type)
    .replace(/_/g," ")
    .replace(/\b\w/g,
      letter => letter.toUpperCase()
    );

}


function getSafeExtension(file){

  const name = file.name || "";

  const parts = name.split(".");

  if(parts.length < 2){
    return "jpg";
  }

  const ext = parts.pop().toLowerCase();

  const allowed = [
    "jpg",
    "jpeg",
    "png",
    "webp"
  ];

  return allowed.includes(ext)
    ? ext
    : "jpg";

}


/* =====================================================
   CURRENT USER
   ===================================================== */

async function getCurrentUser(){

  const {
    data,
    error
  } = await db.auth.getUser();

  if(error){
    throw error;
  }

  if(!data || !data.user){

    window.location.href = "index.html";

    return null;
  }

  return data.user;

}


/* =====================================================
   EXPIRY CHECK
   ===================================================== */

function isTaskExpired(task){

  if(!task.expiry_date){
    return false;
  }

  const expiry =
    new Date(task.expiry_date);

  if(isNaN(expiry.getTime())){
    return false;
  }

  return new Date() > expiry;

}


/* =====================================================
   LOAD TASKS
   ===================================================== */

async function loadTasks(){

  const loading =
    document.getElementById("loading");

  const list =
    document.getElementById("tasksList");

  try{

    const user = await getCurrentUser();

    if(!user){
      return;
    }

    const {
      data: tasks,
      error
    } = await db
      .from("tasks")
      .select(`
        id,
        title,
        description,
        reward,
        slots,
        expiry_date,
        requirements,
        proof_type,
        active,
        task_type,
        task_link,
        uploader_username,
        copy_text,
        post_link,
        upload_required,
        created_at
      `)
      .eq("active", true)
      .order("created_at", {
        ascending:false
      });


    if(error){
      throw error;
    }


    loading.style.display = "none";


    if(!tasks || tasks.length === 0){

      document.getElementById(
        "taskCount"
      ).textContent = "0";

      list.innerHTML = `
        <div class="empty">

          <div style="font-size:40px;">
            📭
          </div>

          <h3>No tasks available</h3>

          <div>
            New tasks will appear here when they are posted.
          </div>

        </div>
      `;

      return;
    }


    document.getElementById(
      "taskCount"
    ).textContent = tasks.length;


    list.innerHTML = "";


    tasks.forEach(task => {

      list.appendChild(
        createTaskCard(task)
      );

    });

  }
  catch(error){

    console.error(error);

    loading.style.display = "none";

    showError(
      "Unable to load tasks: " +
      (error.message || "Unknown error")
    );

  }

}


/* =====================================================
   CREATE TASK CARD
   ===================================================== */

function createTaskCard(task){

  const card =
    document.createElement("div");

  card.className = "task-card";


  const icon =
    getTaskIcon(task);


  const reward =
    Number(task.reward || 0);


  const slots =
    task.slots === null ||
    task.slots === undefined
      ? "Available"
      : task.slots;


  const expired =
    isTaskExpired(task);


  card.innerHTML = `

    <div class="task-top">

      <div class="task-icon">
        ${icon}
      </div>

      <div style="flex:1;">

        <div class="task-title">
          ${escapeHTML(task.title || "Untitled Task")}
        </div>

        <div class="task-owner">
          Posted by:
          <strong>
            ${escapeHTML(
              task.uploader_username ||
              "NAIJA TASK"
            )}
          </strong>
        </div>

      </div>

      <div class="reward">
        ₦${reward.toLocaleString()}
      </div>

    </div>


    <div class="task-meta">

      <div class="meta">
        📌 ${formatType(task.task_type)}
      </div>

      <div class="meta">
        👥 Slots: ${escapeHTML(slots)}
      </div>

      <div class="meta">
        📅 ${formatDate(task.expiry_date)}
      </div>

    </div>


    <button
      class="start-btn"
      type="button"
      ${expired ? "disabled" : ""}
    >
      ${expired ? "Task Expired" : "Start Task"}
    </button>


    <div class="details"></div>

  `;


  const startButton =
    card.querySelector(".start-btn");

  const details =
    card.querySelector(".details");


  if(expired){

    startButton.style.background =
      "#999";

    startButton.style.cursor =
      "not-allowed";

    return card;

  }


  startButton.addEventListener(
    "click",
    () => {

      if(details.classList.contains("open")){

        details.classList.remove("open");

        startButton.textContent =
          "Start Task";

        return;
      }


      details.innerHTML =
        buildDetails(task);


      details.classList.add("open");

      startButton.textContent =
        "Close Task";


      setupProofForm(
        details,
        task
      );

    }
  );


  return card;

}


/* =====================================================
   TASK DETAILS
   ===================================================== */

function buildDetails(task){

  const link =
    task.task_link ||
    task.post_link ||
    "";


  const copyText =
    task.copy_text || "";


  const requirements =
    formatRequirements(

  return `

    <div class="section">

      <div class="section-title">
        📋 Task Description
      </div>

      <div class="description">
        ${escapeHTML(
          task.description ||

        )}
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        👤 Task Owner
      </div>

      <div>
        ${escapeHTML(
          task.uploader_username ||
          "NAIJA TASK"
        )}
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        📌 Task Requirements
      </div>

      <div class="description">
        ${escapeHTML(requirements)}
      </div>

    </div>


    ${
      link
      ?
      `
      <div class="section">

        <div class="section-title">
          🔗 Task Link
        </div>

        <div class="link-row">

          <button
            class="link-btn"
            type="button"
            onclick="openTaskLink(${JSON.stringify(link)})"
          >
            🔗 Open Link
          </button>

          <button
            class="copy-btn"
            type="button"
            onclick="copyText(${JSON.stringify(link)})"
          >
            Copy
          </button>

        </div>

      </div>
      `
      :
      ""
    }


    ${
      copyText
      ?
      `
      <div class="section">

        <div class="section-title">

        </div>

        <div class="description">

        </div>

        <button
          class="copy-btn"
          style="margin-top:8px;"
          type="button"
          onclick="copyText(${JSON.stringify(copyText)})"
        >
          Copy Text
        </button>

      </div>
      `
      :
      ""
    }


    <div class="section">

      <div class="section-title">
        🧾 Submit Your Proof
      </div>

      <div class="small">
        Complete the task first, then submit your proof below.
      </div>

      <div class="status-box">
        📸 Photo proof is required for this task.
      </div>

      ${
        expired
        ?
        `
        <div class="message error" style="display:block;">
          This task has expired and can no longer receive submissions.
        </div>
        `
        :
        `
        <form class="proof-form">

          <label>
            Username / Account Used
            <span class="required">*</span>
          </label>

          <input
            type="text"
            name="worker_username"
            placeholder="@username or account used"

          >


          <label>

            <span class="required">*</span>
          </label>

          <textarea
            name="worker_comment"
            placeholder="Tell the task owner what you completed..."
            required
          ></textarea>


          <label>
            Extra Proof Link
          </label>

          <input
            type="url"
            name="worker_link"
            placeholder="Optional proof link"
          >


          <label>
            Photo Proof
            <span class="required">*</span>
          </label>

          <div class="file-box">

            <input
              type="file"
              name="proof_photo"
              accept="image/jpeg,image/png,image/webp"
              required
            >

            <div class="file-note">
              Upload a clear screenshot/photo.
              Maximum size: 5MB.
            </div>

            <img
              class="preview"
              alt="Proof preview"
            >

          </div>


          <div
            class="message form-message"
          ></div>


          <button
            class="submit-btn"

          >
            Submit Proof

/* =====================================================
   PROOF FORM
   ===================================================== */

function setupProofForm(details, task){

  const form =
    details.querySelector(".proof-form");

  if(!form){
    return;
  }


  const photo =
    form.querySelector(
      'input[name="proof_photo"]'
    );


  const preview =
    form.querySelector(".preview");


  photo.addEventListener(
    "change",
    () => {

      const file =
        photo.files[0];

      if(!file){
        preview.style.display = "none";
        return;
      }


      if(file.size > 5 * 1024 * 1024){

        showFormMessage(
          form,
          "Photo is larger than 5MB.",
          true
        );

        photo.value = "";

        preview.style.display = "none";

        return;
      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];


      if(!allowedTypes.includes(file.type)){

        showFormMessage(
          form,
          "Only JPG, JPEG, PNG or WEBP images are allowed.",
          true
        );

        photo.value = "";

        preview.style.display = "none";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        event => {

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      await submitProof(
        form,
        task
      );

    }
  );

}


/* =====================================================
   SUBMIT PROOF
   ===================================================== */

async function submitProof(form, task){

  const button =
    form.querySelector(".submit-btn");


  const message =
    form.querySelector(".form-message");


  if(button.disabled){
    return;
  }


  try{

    button.disabled = true;

    button.textContent =
      "Checking...";


    if(isTaskExpired(task)){

      throw new Error(
        "This task has expired and can no longer be submitted."
      );

    }


    const user =
      await getCurrentUser();


    if(!user){
      return;
    }


    const workerUsername =
      form
        .querySelector(
          '[name="worker_username"]'
        )
        .value
        .trim();


    const workerComment =
      form
        .querySelector(
          '[name="worker_comment"]'
        )
        .value
        .trim();


    const workerLink =
      form
        .querySelector(
          '[name="worker_link"]'
        )
        .value
        .trim();


    const photo =
      form
        .querySelector(
          '[name="proof_photo"]'
        )
        .files[0];


    if(!workerUsername){

      throw new Error(
        "Enter the username or account you used."
      );

    }


    if(!workerComment){

      throw new Error(
        "Enter your comment/report."
      );

    }


    if(workerLink){

      try{

        new URL(workerLink);

      }catch(error){

        throw new Error(
          "Please enter a valid Extra Proof Link."
        );

      }

    }


    if(!photo){

      throw new Error(
        "Photo proof is required."
      );

    }


    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];


    if(!allowedTypes.includes(photo.type)){

      throw new Error(
        "Only JPG, JPEG, PNG or WEBP images are allowed."
      );

    }


    if(photo.size > 5 * 1024 * 1024){

      throw new Error(
        "Photo must be 5MB or smaller."
      );

    }


    button.textContent =
      "Checking previous proof...";


    const {
      data: existing,
      error: existingError
    } = await db
      .from("task_submissions")
      .select("id,status")
      .eq("user_id", user.id)
      .eq("task_id", task.id)
      .in(
        "status",
        ["PENDING","APPROVED"]
      )
      .limit(1);


    if(existingError){
      throw existingError;
    }


    if(existing && existing.length > 0){

      throw new Error(
        "You already submitted this task."
      );

    }


    /* =================================================
       UPLOAD PHOTO
       ================================================= */

    button.textContent =
      "Uploading photo...";


    const extension =
      getSafeExtension(photo);


    const filePath =
      `${user.id}/${task.id}/${Date.now()}.${extension}`;


    const {
      error: uploadError
    } = await db
      .storage
      .from("task proof")
      .upload(
        filePath,
        photo,
        {
          contentType:photo.type,
          upsert:false
        }
      );


    if(uploadError){

      throw new Error(
        "Photo upload failed: " +
        uploadError.message
      );

    }


    /* =================================================
       SAVE PROOF
       ================================================= */

    button.textContent =
      "Saving proof...";


    const proofData = {

      photo:{
        bucket:"task proof",
        path:filePath,
        name:photo.name,
        type:photo.type,
        size:photo.size
      },

      worker_username:
        workerUsername,

      worker_comment:
        workerComment,

      worker_link:
        workerLink,

      task_owner:
        task.uploader_username || "",

      task_requirements:
        task.requirements || null,

      submitted_at:
        new Date().toISOString()

    };


    const {
      error: insertError
    } = await db
      .from("task_submissions")
      .insert({

        user_id:user.id,

        task_id:task.id,

        proof:
          JSON.stringify(proofData),

        status:"PENDING"

      });


    if(insertError){

      await db
        .storage
        .from("task proof")
        .remove([filePath]);


      throw new Error(
        "Proof submission failed: " +
        insertError.message
      );

    }


    showFormMessage(
      form,
      "✅ Proof submitted successfully. It is now waiting for review.",
      false
    );


    form
      .querySelectorAll(
        "input, textarea, button"
      )
      .forEach(element => {

        element.disabled = true;

      });


    button.textContent =
      "Proof Submitted";


  }
  catch(error){

    console.error(error);


    showFormMessage(
      form,
      error.message ||
      "Something went wrong.",
      true
    );


    button.disabled = false;

    button.textContent =
      "Submit Proof";

  }

}


/* =====================================================
   FORM MESSAGE
   ===================================================== */

function showFormMessage(
  form,
  message,
  isError
){

  const box =
    form.querySelector(
      ".form-message"
    );


  box.textContent =
    message;


  box.className =
    "message form-message " +
    (isError ? "error" : "success");


  box.style.display =
    "block";

}


/* =====================================================
   OPEN LINK
   ===================================================== */

function openTaskLink(link){

  if(!link){

    alert(
      "No link was provided for this task."
    );

    return;
  }


  let finalLink =
    String(link).trim();


  if(
    !finalLink.startsWith("http://") &&
    !finalLink.startsWith("https://")
  ){

    finalLink =
      "https://" + finalLink;

  }


  /*
    Directly redirect the worker to the exact
    link saved by the task poster.
  */

  window.location.href =
    finalLink;

}


/* =====================================================
   COPY TEXT
   ===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

    alert("Copied successfully.");

  }
  catch(error){

    const input =
      document.createElement("textarea");

    input.value =
      text;

    document.body.appendChild(input);

    input.select();

    document.execCommand("copy");

    input.remove();

    alert("Copied successfully.");

  }

}


/* =====================================================
   START
   ===================================================== */

loadTasks();

</script>
