<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4faf6;
  color:#18251d;
}

button,input,textarea{font-family:inherit}

header{
  background:linear-gradient(145deg,#0b8f3c,#087b34);
  color:#fff;
  border-radius:0 0 28px 28px;
  padding:17px 15px 24px;
}

.header-inner,
.container{
  width:100%;
  max-width:760px;
  margin:auto;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.back{
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.badge{
  background:rgba(255,255,255,.15);
  padding:6px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
}

.heading{
  display:flex;
  gap:12px;
  align-items:center;
}

.page-icon{
  width:50px;
  height:50px;
  border-radius:15px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

h1{
  margin:0 0 4px;
  font-size:24px;
}

header p{
  margin:0;
  font-size:12px;
  opacity:.9;
}

.container{
  padding:18px 13px 45px;
}

.page-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.page-title{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.page-subtitle{
  margin:4px 0 0;
  color:#758179;
  font-size:11px;
}

.count{
  background:#e7f7ec;
  color:#0b8f3c;
  padding:7px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.task-card{
  background:white;
  border:1px solid #e1ebe4;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:15px;
  box-shadow:0 4px 16px rgba(0,0,0,.045);
}

.main{
  padding:15px;
}

.task-top{
  display:flex;
  gap:12px;
}

.icon{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:14px;
  background:#e8f8ed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.task-title{
  margin:2px 0 5px;
  font-size:16px;
  font-weight:900;
  line-height:1.3;
}

.description{
  margin:0;
  color:#738077;
  font-size:11px;
  line-height:1.55;
}

.platform{
  display:inline-block;
  margin-top:7px;
  padding:5px 8px;
  border-radius:7px;
  background:#eef8f1;
  color:#0b8f3c;
  font-size:9px;
  font-weight:900;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.summary-box{
  background:#f6faf7;
  border:1px solid #e5eee8;
  border-radius:12px;
  padding:10px;
}

.label{
  display:block;
  color:#78847c;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:5px;
}

.value{
  font-size:15px;
  font-weight:900;
}

.reward{
  color:#0b8f3c;
}

.start{
  width:100%;
  border:0;
  background:#0b8f3c;
  color:white;
  padding:13px;
  border-radius:10px;
  margin-top:14px;
  font-size:13px;
  font-weight:900;
}

.start.open{
  background:#086f2f;
}

.details{
  display:none;
  padding:0 15px 17px;
}

.details.open{
  display:block;
}

.divider{
  border-top:1px solid #e7eee9;
  padding-top:17px;
}

.section{
  display:flex;
  align-items:center;
  gap:7px;
  margin:17px 0 9px;
}

.section-icon{
  width:28px;
  height:28px;
  border-radius:8px;
  background:#e8f8ed;
  color:#0b8f3c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.section-title{
  font-size:13px;
  font-weight:900;
}

.box{
  background:#f7faf8;
  border:1px solid #e3ebe5;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.box-label{
  color:#748079;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

.box-text{
  color:#2d3b32;
  font-size:12px;
  line-height:1.65;
  white-space:pre-line;
  word-break:break-word;
}

.copy-row{
  display:flex;
  gap:7px;
}

.copy-content{
  flex:1;
  background:white;
  border:1px solid #dfe8e1;
  border-radius:9px;
  padding:10px;
  font-size:12px;
  word-break:break-word;
}

.copy-btn{
  border:0;
  background:#e7f7ec;
  color:#0b8f3c;
  border-radius:9px;
  padding:0 11px;
  font-size:10px;
  font-weight:900;
}

.link-actions{
  display:flex;
  gap:7px;
}

.open-link{
  flex:1;
  background:#0b8f3c;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

.link-copy{
  border:0;
  background:#e7f7ec;
  color:#0b8f3c;
  padding:0 12px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
}

.poster-box{
  background:#edf9f1;
  border:1px solid #dcefe2;
  border-radius:12px;
  padding:12px;
  color:#41604b;
  font-size:11px;
  line-height:1.65;
}

.required{
  color:#c62828;
  font-size:9px;
  font-weight:900;
}

.steps{
  border:1px solid #e2ebe5;
  border-radius:12px;
  overflow:hidden;
}

.step{
  display:flex;
  gap:10px;
  padding:11px;
  border-bottom:1px solid #edf2ee;
  font-size:11px;
  line-height:1.5;
}

.step:last-child{
  border-bottom:0;
}

.number{
  width:25px;
  height:25px;
  min-width:25px;
  border-radius:50%;
  background:#e8f8ed;
  color:#0b8f3c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
}

.warning{
  background:#fff9ea;
  border:1px solid #f1dfb5;
  color:#6d5725;
  border-radius:11px;
  padding:12px;
  margin-top:13px;
  font-size:10px;
  line-height:1.6;
}

.proof{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #e7eee9;
}

.proof-title{
  margin:0 0 4px;
  font-size:16px;
  font-weight:900;
}

.proof-subtitle{
  margin:0 0 13px;
  color:#758179;
  font-size:10px;
  line-height:1.5;
}

.proof-required{
  background:#e8f8ed;
  color:#0b8f3c;
  padding:8px 10px;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
  margin-bottom:12px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #d7e3da;
  background:white;
  border-radius:10px;
  padding:11px;
  font-size:12px;
  outline:none;
}

.field textarea{
  min-height:95px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#0b8f3c;
}

.upload-info{
  background:#edf8f0;
  border-radius:9px;
  padding:10px;
  color:#4f6d59;
  font-size:10px;
  line-height:1.55;
  margin-bottom:10px;
}

.preview{
  display:none;
  width:100%;
  max-height:240px;
  object-fit:contain;
  margin-top:9px;
  border:1px solid #dce7df;
  border-radius:10px;
}

.submit{
  width:100%;
  border:0;
  background:#0b8f3c;
  color:white;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  font-weight:900;
}

.submit:disabled{
  opacity:.6;
}

.success{
  display:none;
  background:#e7f8ec;
  border:1px solid #cfead7;
  color:#0b8f3c;
  border-radius:10px;
  padding:11px;
  margin-top:10px;
  font-size:11px;
  font-weight:700;
}

.message{
  background:white;
  border:1px solid #e2ebe5;
  border-radius:17px;
  padding:38px 18px;
  text-align:center;
  color:#758179;
  font-size:12px;
  line-height:1.65;
}

.message-icon{
  font-size:30px;
  margin-bottom:8px;
}

.message-title{
  color:#25342b;
  font-size:14px;
  font-weight:900;
  margin-bottom:5px;
}

.refresh{
  margin-top:13px;
  border:0;
  background:#0b8f3c;
  color:white;
  padding:11px 17px;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

@media(max-width:480px){
  .link-actions{
    flex-direction:column;
  }

  .link-copy{
    padding:11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="header-top">
      <a href="dashboard.html" class="back">← Dashboard</a>
      <div class="badge">NAIJA TASK</div>
    </div>

    <div class="heading">
      <div class="page-icon">📋</div>

      <div>
        <h1>Available Tasks</h1>
        <p>Complete genuine tasks and earn Naira.</p>
      </div>
    </div>

  </div>
</header>

<main class="container">

  <div class="page-bar">
    <div>
      <h2 class="page-title">Tasks</h2>
      <p class="page-subtitle">
        Choose a task and follow the poster's instructions.
      </p>
    </div>

    <div class="count" id="taskCount">0 tasks</div>
  </div>

  <div id="tasks">

    <div class="message">
      <div class="message-icon">⏳</div>
      <div class="message-title">Loading tasks</div>
      Please wait while available tasks are loaded.
    </div>

  </div>

</main>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Put your existing publishable key here locally.
  Do NOT use a secret/service-role key.
*/
const SUPABASE_KEY =
"PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks(){

  const box =
    document.getElementById("tasks");

  try{

    const {
      data:{user},
      error:userError
    } =
    await db.auth.getUser();

    if(userError || !user){

      location.href="index.html";
      return;

    }

    currentUser=user;

    /*
      Do not add created_at here unless that column
      is confirmed in your tasks table.
    */

    const {
      data,
      error
    } =
    await db
      .from("tasks")
      .select(`
        id,
        title,
        description,
        reward,
        slots,
        expiry_date,
        requirements,
        proof_type,
        proof_required,
        max_completions,
        active,
        task_type,
        task_link,
        uploader_username,
        copy_text,
        post_link,
        upload_required
      `)
      .eq("active",true);

    if(error){

      console.error(error);

      showError(
        "Unable to load tasks",
        error.message
      );

      return;

    }

    if(!data || data.length===0){

      document.getElementById("taskCount")
        .textContent="0 tasks";

      box.innerHTML=`
        <div class="message">
          <div class="message-icon">📋</div>
          <div class="message-title">
            No tasks available
          </div>
          There are no available tasks right now.
          <br>
          <button class="refresh" onclick="loadTasks()">
            Refresh Tasks
          </button>
        </div>
      `;

      return;
    }

    document.getElementById("taskCount")
      .textContent =
      data.length +
      (data.length===1 ? " task":" tasks");

    box.innerHTML="";

    data.forEach(createTaskCard);

  }
  catch(error){

    console.error(error);

    showError(
      "Something went wrong",
      "Please try again."
    );

  }
}


/* =========================================================
   CREATE TASK CARD
========================================================= */

function createTaskCard(task){

  const card=document.createElement("div");
  card.className="task-card";

  const main=document.createElement("div");
  main.className="main";

  main.innerHTML=`

    <div class="task-top">

      <div class="icon">
        ${getTaskIcon(task)}
      </div>

      <div style="flex:1">

        <div class="task-title">
          ${escapeHTML(task.title || "Task")}
        </div>

        <p class="description">
          ${escapeHTML(
            task.description ||
            "Complete this task according to the poster's instructions."
          )}
        </p>

        <span class="platform">
          ${escapeHTML(
            getPlatform(task)
          )}
        </span>

      </div>

    </div>

    <div class="summary">

      <div class="summary-box">
        <span class="label">Task Reward</span>
        <span class="value reward">
          ₦${Number(task.reward||0).toLocaleString("en-NG")}
        </span>
      </div>

      <div class="summary-box">
        <span class="label">Availability</span>
        <span class="value">
          ${
            Number(task.slots||0)>0
            ? Number(task.slots)+" slots"
            : "Check"
          }
        </span>
      </div>

    </div>

    <button class="start">
      ▶ Start Task
    </button>
  `;

  const details=document.createElement("div");
  details.className="details";

  const divider=document.createElement("div");
  divider.className="divider";

  details.appendChild(divider);

  buildDetails(divider,task);

  const start=main.querySelector(".start");

  start.onclick=()=>{

    const opened =
      details.classList.toggle("open");

    if(opened){

      start.textContent="▲ Hide Task Details";
      start.classList.add("open");

    }else{

      start.textContent="▶ Start Task";
      start.classList.remove("open");

    }

  };

  card.appendChild(main);
  card.appendChild(details);

  document.getElementById("tasks")
    .appendChild(card);
}


/* =========================================================
   DETAILS
========================================================= */

function buildDetails(parent,task){

  addSection(
    parent,
    "📖",
    "Creator's Instructions"
  );

  const creatorBox=document.createElement("div");
  creatorBox.className="poster-box";

  creatorBox.textContent =
    task.description ||
    "Follow the instructions provided by the task poster.";

  parent.appendChild(creatorBox);


  /* PLATFORM */

  addSection(
    parent,
    "📱",
    "Social Media / Platform"
  );

  parent.appendChild(
    detailBox(
      "Platform selected by poster",
      getPlatform(task)
    )
  );


  /* POSTER USERNAME */

  if(task.uploader_username){

    addSection(
      parent,
      "👤",
      "Creator / Account"
    );

    const box=document.createElement("div");
    box.className="box";

    box.innerHTML=`
      <div class="box-label">
        Creator Username
      </div>
    `;

    box.appendChild(
      copyRow(task.uploader_username)
    );

    parent.appendChild(box);

  }


  /* REQUIRED COMMENT */

  if(task.copy_text){

    addSection(
      parent,
      "💬",
      "Required Comment"
    );

    const box=document.createElement("div");
    box.className="box";

    box.innerHTML=`
      <div class="box-label">
        Comment chosen by poster
      </div>
    `;

    const row=copyRow(
      task.copy_text,
      "Copy Comment"
    );

    box.appendChild(row);

    parent.appendChild(box);

  }


  /* TASK LINK */

  if(task.task_link){

    addSection(
      parent,
      "🔗",
      getPlatform(task)+" Link"
    );

    parent.appendChild(
      linkBox(
        task.task_link,
        "🔗 Open "+getPlatform(task)
      )
    );

  }


  /* POST LINK */

  if(
    task.post_link &&
    task.post_link !== task.task_link
  ){

    addSection(
      parent,
      "📢",
      "Post"
    );

    parent.appendChild(
      linkBox(
        task.post_link,
        "📢 Open Post"
      )
    );

  }


  /* REQUIREMENTS */

  if(task.requirements){

    const requirements =
      formatRequirements(task.requirements);

    if(requirements){

      addSection(
        parent,
        "📌",
        "Poster Requirements"
      );

      parent.appendChild(
        detailBox(
          "Requirements",
          requirements
        )
      );

    }

  }


  /* STEPS */

  addSection(
    parent,
    "✅",
    "How To Complete"
  );

  const steps=document.createElement("div");
  steps.className="steps";

  [
    "Read the creator's instructions.",
    "Open the selected social media or website link.",
    "Complete the task exactly as requested.",
    "Use the creator's username/comment when requested.",
    "Prepare your own proof information.",
    "Upload your photo proof and submit."
  ].forEach((text,index)=>{

    steps.innerHTML += `
      <div class="step">
        <div class="number">${index+1}</div>
        <div>${escapeHTML(text)}</div>
      </div>
    `;

  });

  parent.appendChild(steps);


  /* DEADLINE */

  if(task.expiry_date){

    addSection(
      parent,
      "⏰",
      "Deadline"
    );

    parent.appendChild(
      detailBox(
        "Task deadline",
        formatDate(task.expiry_date)
      )
    );

  }


  /* WARNING */

  parent.innerHTML += `
    <div class="warning">
      <b>⚠️ Important</b><br>
      Submit genuine proof from the work you actually
      completed. Fake, reused or unrelated proof may be rejected.
    </div>
  `;


  /* WORKER PROOF */

  buildWorkerProof(parent,task);
}


/* =========================================================
   WORKER PROOF
========================================================= */

function buildWorkerProof(parent,task){

  addSection(
    parent,
    "📤",
    "Your Proof"
  );

  const proof=document.createElement("div");
  proof.className="proof";

  proof.innerHTML=`

    <h3 class="proof-title">
      Submit Your Proof
    </h3>

    <p class="proof-subtitle">
      These are the worker's own submission details.
      Your photo proof is required for every task.
    </p>

    <div class="proof-required">
      📷 PHOTO PROOF — REQUIRED FOR EVERY TASK
    </div>

    <!-- WORKER USERNAME -->

    <div class="field">
      <label>
        👤 Your Username / Account Used
        <span class="required">REQUIRED</span>
      </label>

      <input
        class="worker-username"
        type="text"
        placeholder="@yourusername"
        autocomplete="off"
      >
    </div>


    <!-- WORKER COMMENT -->

    <div class="field">
      <label>
        💬 Your Comment / Report
        <span class="required">REQUIRED</span>
      </label>

      <textarea
        class="worker-comment"
        placeholder="Tell the poster what you completed..."
      ></textarea>
    </div>


    <!-- EXTRA FIELD -->

    ${buildExtraWorkerField(task)}


    <!-- PHOTO -->

    <div class="upload-info">
      📸 Upload a clear photo or screenshot proving
      that you completed this task.
      <br><br>
      Maximum size: 5MB.
    </div>

    <div class="field">

      <label>
        📷 Photo Proof
        <span class="required">REQUIRED</span>
      </label>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
      >

      <img
        class="preview"
        alt="Proof preview"
      >

    </div>

    <button class="submit">
      Submit Proof
    </button>

    <div class="success">
      ✅ Proof submitted successfully and is waiting for poster review.
    </div>
  `;

  parent.appendChild(proof);

  const fileInput=
    proof.querySelector(".photo-input");

  const preview=
    proof.querySelector(".preview");

  fileInput.addEventListener(
    "change",
    ()=>{

      const file=fileInput.files[0];

      if(!file){

        preview.style.display="none";
        return;

      }

      if(!file.type.startsWith("image/")){

        alert("Please select an image.");
        fileInput.value="";
        return;

      }

      if(file.size > 5*1024*1024){

        alert("Photo must be 5MB or smaller.");
        fileInput.value="";
        return;

      }

      const reader=new FileReader();

      reader.onload=e=>{
        preview.src=e.target.result;
        preview.style.display="block";
      };

      reader.readAsDataURL(file);

    }
  );

  proof.querySelector(".submit")
    .onclick=()=>submitProof(
      task,
      proof
    );
}


/* =========================================================
   EXTRA WORKER FIELD
========================================================= */

function buildExtraWorkerField(task){

  const type=
    String(task.proof_type||"")
      .toLowerCase();

  /*
    Photo is already mandatory.
    This field is only an EXTRA field based
    on the poster's proof choice.
  */

  if(
    type.includes("url") ||
    type.includes("link")
  ){

    return `
      <div class="field">
        <label>
          🔗 Your Proof Link
        </label>

        <input
          class="extra-proof"
          type="url"
          placeholder="https://..."
        >
      </div>
    `;

  }

  if(type.includes("reference")){

    return `
      <div class="field">
        <label>
          🔖 Your Reference ID
        </label>

        <input
          class="extra-proof"
          type="text"
          placeholder="Enter reference ID"
        >
      </div>
    `;

  }

  return "";
}


/* =========================================================
   SUBMIT PROOF
========================================================= */

async function submitProof(task,proof){

  const button=
    proof.querySelector(".submit");

  const username=
    proof.querySelector(".worker-username")
      .value.trim();

  const comment=
    proof.querySelector(".worker-comment")
      .value.trim();

  const photoInput=
    proof.querySelector(".photo-input");

  const extra=
    proof.querySelector(".extra-proof");

  const extraValue=
    extra ? extra.value.trim() : "";

  if(!username){

    alert("Please enter the username/account you used.");
    return;

  }

  if(!comment){

    alert("Please enter your comment/report.");
    return;

  }

  const file=
    photoInput.files[0];

  if(!file){

    alert("Photo proof is required for every task.");
    return;

  }

  if(!file.type.startsWith("image/")){

    alert("Please select an image.");
    return;

  }

  if(file.size > 5*1024*1024){

    alert("Photo must be 5MB or smaller.");
    return;

  }

  button.disabled=true;
  button.textContent="Uploading Proof...";

  try{

    const {
      data:{user},
      error:userError
    } =
    await db.auth.getUser();

    if(userError || !user){

      location.href="index.html";
      return;

    }


    /* =========================================
       UPLOAD PHOTO
    ========================================= */

    const extension=
      file.name.split(".").pop();

    const path=
      user.id+
      "/"+
      task.id+
      "/"+
      Date.now()+
      "."+
      extension;

    const {
      error:uploadError
    } =
    await db.storage
      .from("task proof")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );

    if(uploadError){

      console.error(uploadError);

      alert(
        "Photo upload failed: "+
        uploadError.message
      );

      resetButton(button);
      return;

    }


    /* =========================================
       SAVE COMPLETE WORKER PROOF
    ========================================= */

    const proofData={
      photo:{
        storage_path:path,
        file_name:file.name
      },

      worker:{
        username:username,
        comment:comment,
        extra:extraValue
      },

      poster_requirements:{
        creator_username:
          task.uploader_username || "",

        required_comment:
          task.copy_text || "",

        description:
          task.description || "",

        platform:
          getPlatform(task),

        task_link:
          task.task_link || ""
      }
    };


    const {
      error
    } =
    await db
      .from("task_submissions")
      .insert({

        user_id:user.id,

        task_id:task.id,

        proof:
          JSON.stringify(proofData),

        status:"PENDING"

      });


    if(error){

      console.error(error);

      alert(
        "Proof submission failed: "+
        error.message
      );

      resetButton(button);
      return;

    }


    button.textContent="Submitted ✓";

    const success=
      proof.querySelector(".success");

    success.style.display="block";

  }
  catch(error){

    console.error(error);

    alert(
      "Something went wrong. Please try again."
    );

    resetButton(button);

  }
}


/* =========================================================
   HELPERS
========================================================= */

function resetButton(button){

  button.disabled=false;
  button.textContent="Submit Proof";

}


function addSection(parent,icon,title){

  const section=document.createElement("div");
  section.className="section";

  section.innerHTML=`
    <div class="section-icon">${icon}</div>
    <div class="section-title">
      ${escapeHTML(title)}
    </div>
  `;

  parent.appendChild(section);
}


function detailBox(label,value){

  const box=document.createElement("div");
  box.className="box";

  box.innerHTML=`
    <div class="box-label">
      ${escapeHTML(label)}
    </div>

    <div class="box-text">
      ${escapeHTML(value)}
    </div>
  `;

  return box;
}


function copyRow(value,text="Copy"){

  const row=document.createElement("div");
  row.className="copy-row";

  const content=document.createElement("div");
  content.className="copy-content";
  content.textContent=value;

  const button=document.createElement("button");
  button.className="copy-btn";
  button.textContent=text;

  button.onclick=async()=>{

    try{

      await navigator.clipboard.writeText(
        String(value)
      );

      const old=button.textContent;

      button.textContent="Copied ✓";

      setTimeout(()=>{
        button.textContent=old;
      },1500);

    }
    catch(e){

      alert(
        "Copy failed. Please copy it manually."
      );

    }

  };

  row.appendChild(content);
  row.appendChild(button);

  return row;
}


function linkBox(url,text){

  const box=document.createElement("div");
  box.className="box";

  const actions=document.createElement("div");
  actions.className="link-actions";

  const open=document.createElement("a");

  open.className="open-link";
  open.href=url;
  open.target="_blank";
  open.rel="noopener noreferrer";
  open.textContent=text;

  const copy=document.createElement("button");

  copy.className="link-copy";
  copy.textContent="Copy Link";

  copy.onclick=async()=>{

    try{

      await navigator.clipboard.writeText(url);

      copy.textContent="Copied ✓";

      setTimeout(()=>{
        copy.textContent="Copy Link";
      },1500);

    }
    catch(e){

      alert(
        "Copy failed. Please copy the link manually."
      );

    }

  };

  actions.appendChild(open);
  actions.appendChild(copy);

  box.appendChild(actions);

  return box;
}


/* =========================================================
   PLATFORM
========================================================= */

function getPlatform(task){

  const type=
    String(task.task_type||"")
      .toLowerCase();

  const title=
    String(task.title||"")
      .toLowerCase();

  const text=type+" "+title;

  if(text.includes("tiktok")) return "TikTok";
  if(text.includes("youtube")) return "YouTube";
  if(text.includes("instagram")) return "Instagram";
  if(text.includes("facebook")) return "Facebook";
  if(text.includes("telegram")) return "Telegram";
  if(text.includes("whatsapp")) return "WhatsApp";
  if(text.includes("website")) return "Website";
  if(text.includes("web")) return "Website";
  if(text.includes("app")) return "App";
  if(text.includes("survey")) return "Survey";

  return task.task_type
    ? formatType(task.task_type)
    : "General";
}


function getTaskIcon(task){

  const p=getPlatform(task);

  if(p==="TikTok") return "🎵";
  if(p==="YouTube") return "▶️";
  if(p==="Instagram") return "📸";
  if(p==="Facebook") return "📘";
  if(p==="Telegram") return "✈️";
  if(p==="WhatsApp") return "💬";
  if(p==="Website") return "🌐";
  if(p==="App") return "📱";
  if(p==="Survey") return "📝";

  return "📋";
}


function formatType(value){

  return String(value||"")
    .replace(/[_-]+/g," ")
    .replace(/\b\w/g,l=>l.toUpperCase());
}


/* =========================================================
   REQUIREMENTS
========================================================= */

function formatRequirements(value){

  if(!value) return "";

  if(typeof value==="string")
    return value;

  if(Array.isArray(value))
    return value.join("\n");

  if(typeof value==="object")
    return Object.entries(value)
      .map(([key,val])=>key+": "+val)
      .join("\n");

  return String(value);
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

  const date=new Date(value);

  if(Number.isNaN(date.getTime()))
    return String(value);

  return date.toLocaleString(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   ERROR
========================================================= */

function showError(title,message){

  document.getElementById("tasks").innerHTML=`

    <div class="message">

      <div class="message-icon">⚠️</div>

      <div class="message-title">
        ${escapeHTML(title)}
      </div>

      ${escapeHTML(message)}

      <br>

      <button
        class="refresh"
        onclick="loadTasks()"
      >
        Try Again
      </button>

    </div>

  `;
}
