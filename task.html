<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4faf6;
  color: #18251d;
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

a {
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   HEADER
========================================================= */

header {
  background: linear-gradient(
    145deg,
    #0b8f3c,
    #087b34
  );
  color: white;
  border-radius: 0 0 28px 28px;
  padding: 18px 16px 25px;
  box-shadow: 0 5px 20px rgba(11,143,60,.15);
}

.header-inner {
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  opacity: .95;
}

.header-badge {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 10px;
  font-weight: 800;
}

.page-heading {
  display: flex;
  align-items: center;
  gap: 13px;
}

.page-icon {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: rgba(255,255,255,.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

header h1 {
  margin: 0 0 5px;
  font-size: 25px;
  letter-spacing: -.3px;
}

header p {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  opacity: .9;
}


/* =========================================================
   MAIN
========================================================= */

.container {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 19px 14px 40px;
}


/* =========================================================
   PAGE BAR
========================================================= */

.page-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.page-title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
}

.page-subtitle {
  margin: 4px 0 0;
  color: #75837a;
  font-size: 11px;
}

.task-count {
  flex-shrink: 0;
  background: #e7f7ec;
  color: #0b8f3c;
  border-radius: 20px;
  padding: 7px 10px;
  font-size: 10px;
  font-weight: 900;
}


/* =========================================================
   TASK CARD
========================================================= */

.task-card {
  background: white;
  border: 1px solid #e1ebe4;
  border-radius: 18px;
  margin-bottom: 15px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,.045);
}

.task-card-main {
  padding: 16px;
}

.task-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.task-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 14px;
  background: #e8f8ed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.task-heading {
  flex: 1;
  min-width: 0;
}

.task-title {
  margin: 2px 0 5px;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.3;
}

.task-description {
  margin: 0;
  color: #738077;
  font-size: 11px;
  line-height: 1.55;
}

.task-type {
  display: inline-block;
  margin-top: 7px;
  background: #eef8f1;
  color: #0b8f3c;
  border-radius: 7px;
  padding: 5px 7px;
  font-size: 9px;
  font-weight: 900;
}


/* =========================================================
   REWARD / SLOT SUMMARY
========================================================= */

.summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 15px;
}

.summary-box {
  background: #f6faf7;
  border: 1px solid #e5eee8;
  border-radius: 12px;
  padding: 11px;
}

.summary-label {
  display: block;
  color: #78847c;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.summary-value {
  color: #17251b;
  font-size: 15px;
  font-weight: 900;
}

.summary-value.reward-value {
  color: #0b8f3c;
}


/* =========================================================
   SLOT BAR
========================================================= */

.slot-section {
  margin-top: 14px;
}

.slot-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.slot-label {
  color: #748079;
  font-size: 10px;
}

.slot-number {
  color: #0b8f3c;
  font-size: 10px;
  font-weight: 900;
}

.slot-bar {
  height: 6px;
  background: #e9eee9;
  border-radius: 20px;
  overflow: hidden;
}

.slot-progress {
  height: 100%;
  width: 100%;
  background: #0b8f3c;
  border-radius: 20px;
}


/* =========================================================
   STATUS
========================================================= */

.task-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 13px;
  background: #e8f8ed;
  color: #0b8f3c;
  border-radius: 20px;
  padding: 6px 9px;
  font-size: 9px;
  font-weight: 900;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #0b8f3c;
  border-radius: 50%;
}


/* =========================================================
   START BUTTON
========================================================= */

.start-task-btn {
  width: 100%;
  margin-top: 14px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
}

.start-task-btn:active {
  transform: scale(.99);
}

.start-task-btn.open {
  background: #086f2f;
}


/* =========================================================
   DETAILS
========================================================= */

.task-details {
  display: none;
  padding: 0 16px 17px;
}

.task-details.open {
  display: block;
}

.details-divider {
  border-top: 1px solid #e8eee9;
  padding-top: 17px;
}

.detail-heading {
  margin: 0 0 11px;
  font-size: 16px;
  font-weight: 900;
}


/* =========================================================
   INTRO
========================================================= */

.detail-intro {
  background: #edf9f1;
  border: 1px solid #dcefe2;
  border-radius: 12px;
  padding: 12px;
  color: #41604b;
  font-size: 11px;
  line-height: 1.65;
  margin-bottom: 13px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 17px 0 9px;
}

.section-heading-icon {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: #e8f8ed;
  color: #0b8f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.section-heading-text {
  font-size: 13px;
  font-weight: 900;
}


/* =========================================================
   INSTRUCTION BOX
========================================================= */

.detail-box {
  background: #f7faf8;
  border: 1px solid #e4ece6;
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 10px;
}

.detail-label {
  color: #748079;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.detail-text {
  color: #2d3b32;
  font-size: 12px;
  line-height: 1.65;
  white-space: pre-line;
  word-break: break-word;
}


/* =========================================================
   STEPS
========================================================= */

.steps-box {
  background: white;
  border: 1px solid #e2ebe5;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 11px;
}

.step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
  border-bottom: 1px solid #edf2ee;
}

.step:last-child {
  border-bottom: none;
}

.step-number {
  width: 25px;
  height: 25px;
  min-width: 25px;
  border-radius: 50%;
  background: #e8f8ed;
  color: #0b8f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
}

.step-text {
  color: #3c4b42;
  font-size: 11px;
  line-height: 1.55;
  padding-top: 3px;
}


/* =========================================================
   COPY ROW
========================================================= */

.copy-row {
  display: flex;
  gap: 7px;
}

.copy-content {
  flex: 1;
  min-width: 0;
  background: white;
  border: 1px solid #dfe8e1;
  border-radius: 9px;
  padding: 10px;
  color: #29372f;
  font-size: 12px;
  line-height: 1.5;
  word-break: break-word;
}

.copy-btn {
  border: none;
  background: #e7f7ec;
  color: #0b8f3c;
  border-radius: 9px;
  padding: 0 12px;
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}


/* =========================================================
   LINKS
========================================================= */

.link-actions {
  display: flex;
  gap: 7px;
}

.task-link {
  flex: 1;
  min-width: 0;
  background: #0b8f3c;
  color: white;
  text-decoration: none;
  text-align: center;
  padding: 11px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 900;
}

.link-copy-btn {
  border: none;
  background: #e7f7ec;
  color: #0b8f3c;
  padding: 0 12px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}


/* =========================================================
   WARNING
========================================================= */

.task-warning {
  background: #fff9ea;
  border: 1px solid #f1dfb5;
  color: #6d5725;
  border-radius: 11px;
  padding: 12px;
  margin-top: 13px;
  font-size: 10px;
  line-height: 1.65;
}

.task-warning-title {
  font-weight: 900;
  margin-bottom: 4px;
}


/* =========================================================
   CHECKLIST
========================================================= */

.checklist-box {
  background: #f4fbf6;
  border: 1px solid #dcebe0;
  border-radius: 12px;
  padding: 12px;
  margin-top: 11px;
}

.checklist-title {
  font-size: 11px;
  font-weight: 900;
  margin-bottom: 9px;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-bottom: 7px;
  color: #526158;
  font-size: 10px;
  line-height: 1.5;
}

.check-item:last-child {
  margin-bottom: 0;
}

.check-icon {
  color: #0b8f3c;
  font-weight: 900;
}


/* =========================================================
   PROOF SECTION
========================================================= */

.proof-container {
  margin-top: 18px;
  border-top: 1px solid #e7eee9;
  padding-top: 18px;
}

.proof-header {
  margin-bottom: 12px;
}

.proof-title {
  margin: 0 0 4px;
  font-size: 16px;
  font-weight: 900;
}

.proof-subtitle {
  margin: 0;
  color: #758179;
  font-size: 10px;
  line-height: 1.5;
}

.proof-type {
  display: inline-flex;
  align-items: center;
  background: #e8f8ed;
  color: #0b8f3c;
  border-radius: 8px;
  padding: 7px 9px;
  margin-bottom: 12px;
  font-size: 10px;
  font-weight: 900;
}


/* =========================================================
   PROOF FIELD
========================================================= */

.proof-field {
  margin-bottom: 12px;
}

.proof-field label {
  display: block;
  margin-bottom: 6px;
  color: #28372e;
  font-size: 11px;
  font-weight: 900;
}

.proof-field input,
.proof-field textarea {
  width: 100%;
  border: 1px solid #d7e3da;
  background: white;
  color: #25332b;
  border-radius: 10px;
  padding: 11px;
  font-size: 12px;
  outline: none;
}

.proof-field input:focus,
.proof-field textarea:focus {
  border-color: #0b8f3c;
  box-shadow: 0 0 0 3px rgba(11,143,60,.08);
}

.proof-field textarea {
  min-height: 100px;
  resize: vertical;
}


/* =========================================================
   UPLOAD INFO
========================================================= */

.upload-info {
  background: #edf8f0;
  border-radius: 9px;
  padding: 10px;
  color: #4f6d59;
  font-size: 10px;
  line-height: 1.55;
  margin-bottom: 11px;
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

.image-preview {
  display: none;
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  margin-top: 9px;
  background: #f8fbf9;
  border: 1px solid #dce7df;
  border-radius: 10px;
}


/* =========================================================
   SUBMIT
========================================================= */

.submit-proof-btn {
  width: 100%;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
}

.submit-proof-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* =========================================================
   SUCCESS
========================================================= */

.success-message {
  display: none;
  background: #e7f8ec;
  border: 1px solid #cfead7;
  color: #0b8f3c;
  border-radius: 10px;
  padding: 11px;
  margin-top: 10px;
  font-size: 11px;
  line-height: 1.5;
  font-weight: 700;
}


/* =========================================================
   EMPTY / LOADING / ERROR
========================================================= */

.message {
  background: white;
  border: 1px solid #e2ebe5;
  border-radius: 17px;
  padding: 38px 18px;
  text-align: center;
  color: #758179;
  font-size: 12px;
  line-height: 1.65;
  box-shadow: 0 4px 15px rgba(0,0,0,.035);
}

.message-icon {
  font-size: 30px;
  margin-bottom: 8px;
}

.message-title {
  color: #25342b;
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 5px;
}

.refresh-btn {
  margin-top: 13px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 11px 17px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

  header {
    padding-top: 16px;
  }

  .container {
    padding-left: 12px;
    padding-right: 12px;
  }

  .task-card-main {
    padding: 14px;
  }

  .task-details {
    padding-left: 14px;
    padding-right: 14px;
  }

  .summary-row {
    gap: 7px;
  }

  .link-actions {
    flex-direction: column;
  }

  .task-link {
    width: 100%;
  }

  .link-copy-btn {
    width: 100%;
    padding: 11px;
  }

  .copy-btn {
    padding: 0 10px;
  }

}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media (max-width: 350px) {

  .page-heading {
    gap: 9px;
  }

  .page-icon {
    width: 44px;
    height: 44px;
  }

  header h1 {
    font-size: 22px;
  }

  .task-title {
    font-size: 15px;
  }

}

</style>

</head>

<!-- =======================================================
     HEADER
======================================================= -->

<header>

  <div class="header-inner">

    <div class="header-top">

      <a
        href="dashboard.html"
        class="back"
      >
        ← Dashboard
      </a>

      <div class="header-badge">
        NAIJA TASK
      </div>

    </div>


    <div class="page-heading">

      <div class="page-icon">
        📋
      </div>

      <div>

        <h1>
          Available Tasks
        </h1>

        <p>
          Complete genuine tasks and earn Naira.
        </p>

      </div>

    </div>

  </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


  <div class="page-bar">

    <div>

      <h2 class="page-title">
        Tasks
      </h2>

      <p class="page-subtitle">
        Choose a task and follow its instructions carefully.
      </p>

    </div>

    <div
      class="task-count"
      id="taskCount"
    >
      0 tasks
    </div>

  </div>


  <div id="tasks">

    <div class="message">

      <div class="message-icon">
        ⏳
      </div>

      <div class="message-title">
        Loading tasks
      </div>

      Please wait while available tasks are loaded.

    </div>

  </div>


</main>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jwakveeiynpakunwjzkj.supabase.co";


/*
   Use your existing PUBLISHABLE key here.

   NEVER use:
   - secret key
   - service_role key
   - admin key
*/

const SUPABASE_KEY =
"PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";


const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

  const tasksBox =
    document.getElementById("tasks");

  try {

    const {
      data: {
        user
      },
      error: userError
    } =
      await db.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      user;


    const {
      data,
      error
    } =
      await db
        .from("tasks")
        .select(`
          id,
          title,
          description,
          reward,
          slots,
          expiry_date,
          requirements,
          proof_type,
          proof_required,
          max_completions,
          active,
          task_type,
          task_link,
          uploader_username,
          copy_text,
          post_link,
          upload_required
        `)
        .eq(
          "active",
          true
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      showError(
        "Unable to load tasks",
        "There was a problem loading available tasks."
      );

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      document.getElementById(
        "taskCount"
      ).textContent =
        "0 tasks";


      tasksBox.innerHTML = `

        <div class="message">

          <div class="message-icon">
            📋
          </div>

          <div class="message-title">
            No tasks available
          </div>

          There are no available tasks for you right now.

          <br>

          Please check again later.

          <br>

          <button
            class="refresh-btn"
            onclick="loadTasks()"
          >
            Refresh Tasks
          </button>

        </div>

      `;

      return;

    }


    document.getElementById(
      "taskCount"
    ).textContent =
      data.length +
      (
        data.length === 1
          ? " task"
          : " tasks"
      );


    tasksBox.innerHTML = "";


    data.forEach(
      function(task) {

        createTaskCard(
          task
        );

      }
    );


  }
  catch (error) {

    console.error(error);

    showError(
      "Something went wrong",
      "Please try again."
    );

  }

}


/* =========================================================
   CREATE TASK CARD
========================================================= */

function createTaskCard(task) {

  const tasksBox =
    document.getElementById("tasks");


  const card =
    document.createElement("div");

  card.className =
    "task-card";


  /* -------------------------------------------------------
     MAIN CARD
  ------------------------------------------------------- */

  const main =
    document.createElement("div");

  main.className =
    "task-card-main";


  /* -------------------------------------------------------
     TOP
  ------------------------------------------------------- */

  const top =
    document.createElement("div");

  top.className =
    "task-top";


  const icon =
    document.createElement("div");

  icon.className =
    "task-icon";

  icon.textContent =
    getTaskIcon(task);


  const heading =
    document.createElement("div");

  heading.className =
    "task-heading";


  const title =
    document.createElement("div");

  title.className =
    "task-title";

  title.textContent =
    task.title ||
    "Task";


  const description =
    document.createElement("p");

  description.className =
    "task-description";

  description.textContent =
    task.description ||
    "Complete this task according to the instructions.";


  heading.appendChild(
    title
  );

  heading.appendChild(
    description
  );


  if (task.task_type) {

    const type =
      document.createElement("span");

    type.className =
      "task-type";

    type.textContent =
      formatTaskType(
        task.task_type
      );

    heading.appendChild(
      type
    );

  }


  top.appendChild(
    icon
  );

  top.appendChild(
    heading
  );


  main.appendChild(
    top
  );


  /* -------------------------------------------------------
     SUMMARY
  ------------------------------------------------------- */

  const summary =
    document.createElement("div");

  summary.className =
    "summary-row";


  const rewardBox =
    document.createElement("div");

  rewardBox.className =
    "summary-box";


  rewardBox.innerHTML = `

    <span class="summary-label">
      Task Reward
    </span>

    <span class="summary-value reward-value">
      ₦${Number(
        task.reward || 0
      ).toLocaleString("en-NG")}
    </span>

  `;


  const slotBox =
    document.createElement("div");

  slotBox.className =
    "summary-box";


  const slots =
    Number(
      task.slots || 0
    );


  slotBox.innerHTML = `

    <span class="summary-label">
      Availability
    </span>

/* =========================================================
   ICON
========================================================= */

function getTaskIcon(
  task
) {

  const type =
    String(
      task.task_type || ""
    ).toLowerCase();


  const title =
    String(
      task.title || ""
    ).toLowerCase();


  const text =
    type + " " + title;


  if (
    text.includes("tiktok")
  ) {

    return "🎵";

  }


  if (
    text.includes("youtube")
  ) {

    return "▶️";

  }


  if (
    text.includes("instagram")
  ) {

    return "📸";

  }


  if (
    text.includes("facebook")
  ) {

    return "📘";

  }


  if (
    text.includes("telegram")
  ) {

    return "✈️";

  }


  if (
    text.includes("whatsapp")
  ) {

    return "💬";

  }


  if (
    text.includes("website") ||
    text.includes("web")
  ) {

    return "🌐";

  }


  if (
    text.includes("app") ||
    text.includes("download")
  ) {

    return "📱";

  }


  if (
    text.includes("survey")
  ) {

    return "📝";

  }


  if (
    text.includes("follow")
  ) {

    return "➕";

  }


  if (
    text.includes("like")
  ) {

    return "❤️";

  }


  return "📋";

}


/* =========================================================
   TASK TYPE
========================================================= */

function formatTaskType(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  if (!text) {

    return "General Task";

  }


  return text
    .replace(
      /[_-]+/g,
      " "
    )
    .replace(
      /\b\w/g,
      function(letter) {

        return letter.toUpperCase();

      }
    );

}


/* =========================================================
   PROOF TYPE
========================================================= */

function getProofType(
  task
) {

  if (
    !task.proof_required &&
    !task.upload_required
  ) {

    return "Optional";

  }


  const raw =
    String(
      task.proof_type || ""
    )
    .trim()
    .toLowerCase();


  if (
    raw.includes("screenshot") ||
    raw.includes("image") ||
    raw.includes("photo")
  ) {

    return "Screenshot / Image";

  }


  if (
    raw.includes("username")
  ) {

    return "Username";

  }


  if (
    raw === "url" ||
    raw.includes("proof url") ||
    raw.includes("link")
  ) {

    return "URL";

  }


  if (
    raw.includes("reference")
  ) {

    return "Reference ID";

  }


  if (
    raw.includes("text")
  ) {

    return "Text";

  }


  return "Text";

}


/* =========================================================
   BUILD PROOF FIELD
========================================================= */

function buildProofField(
  container,
  task
) {

  const rawType =
    String(
      task.proof_type || "Text"
    )
    .trim()
    .toLowerCase();


  let type =
    "text";


  if (
    rawType.includes("screenshot") ||
    rawType.includes("image") ||
    rawType.includes("photo")
  ) {

    type =
      "screenshot";

  }

  else if (
    rawType.includes("username")
  ) {

    type =
      "username";

  }

  else if (
    rawType === "url" ||
    rawType.includes("proof url") ||
    rawType.includes("link")
  ) {

    type =
      "url";

  }

  else if (
    rawType.includes("reference")
  ) {

    type =
      "reference";

  }


  /* -------------------------------------------------------
     SCREENSHOT
  ------------------------------------------------------- */

  if (
    type === "screenshot"
  ) {

    container.innerHTML = `

      <div class="upload-info">

        📸 Upload a clear screenshot showing
        that you completed the task.

        <br><br>

        Maximum image size: 5MB.

      </div>


      <div class="proof-field">

        <label>
          📸 Screenshot / Picture
        </label>

        <input
          type="file"
          class="proof-input"
          accept="image/*"
        >

        <img
          class="image-preview"
          alt="Proof preview"
        >

      </div>


      <div class="proof-field">

        <label>
          📝 Proof Description
        </label>

        <textarea
          class="proof-description"
          placeholder="Briefly explain what the screenshot shows..."
        ></textarea>

      </div>

    `;


    const fileInput =
      container.querySelector(
        ".proof-input"
      );


    const preview =
      container.querySelector(
        ".image-preview"
      );


    fileInput.addEventListener(
      "change",
      function() {

        const file =
          fileInput.files[0];


        if (!file) {

          preview.style.display =
            "none";

          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "Please select an image file."
          );

          fileInput.value =
            "";

          preview.style.display =
            "none";

          return;

        }


        if (
          file.size >
          5 * 1024 * 1024
        ) {

          alert(
            "Image must be 5MB or smaller."
          );

          fileInput.value =
            "";

          preview.style.display =
            "none";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            preview.src =
              event.target.result;

            preview.style.display =
              "block";

          };


        reader.readAsDataURL(
          file
        );

      }
    );


    return;

  }


  /* -------------------------------------------------------
     USERNAME
  ------------------------------------------------------- */

  if (
    type === "username"
  ) {

    container.innerHTML = `

      <div class="proof-field">

        <label>
          👤 Your Username
        </label>

        <input
          type="text"
          class="proof-input"
          placeholder="@yourusername"
          autocomplete="off"
        >

      </div>

    `;

    return;

  }


  /* -------------------------------------------------------
     URL
  ------------------------------------------------------- */

  if (
    type === "url"
  ) {

    container.innerHTML = `

      <div class="proof-field">

        <label>
          🔗 Proof URL
        </label>

        <input
          type="url"
          class="proof-input"
          placeholder="https://..."
          autocomplete="off"
        >

      </div>

    `;

    return;

  }


  /* -------------------------------------------------------
     REFERENCE
  ------------------------------------------------------- */

  if (
    type === "reference"
  ) {

    container.innerHTML = `

      <div class="proof-field">

        <label>
          🔖 Reference ID
        </label>

        <input
          type="text"
          class="proof-input"
          placeholder="Enter reference ID"
          autocomplete="off"
        >

      </div>

    `;

    return;

  }


  /* -------------------------------------------------------
     TEXT
  ------------------------------------------------------- */

  container.innerHTML = `

    <div class="proof-field">

      <label>
        📝 Your Proof
      </label>

      <textarea
        class="proof-input"
        placeholder="Describe what you completed..."
      ></textarea>

    </div>

  `;

}


/* =========================================================
   SUBMIT PROOF
========================================================= */

async function submitProof(
  task,
  container,
  button
) {

  button.disabled =
    true;

  button.textContent =
    "Submitting...";


  try {

    const {
      data: {
        user
      },
      error: userError
    } =
      await db.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "index.html";

      return;

    }


    /* -----------------------------------------------------
       PROOF TYPE
    ----------------------------------------------------- */

    const rawType =
      String(
        task.proof_type || "Text"
      )
      .trim()
      .toLowerCase();


    let type =
      "text";


    if (
      rawType.includes("screenshot") ||
      rawType.includes("image") ||
      rawType.includes("photo")
    ) {

      type =
        "screenshot";

    }

    else if (
      rawType.includes("username")
    ) {

      type =
        "username";

    }

    else if (
      rawType === "url" ||
      rawType.includes("proof url") ||
      rawType.includes("link")
    ) {

      type =
        "url";

    }

    else if (
      rawType.includes("reference")
    ) {

      type =
        "reference";

    }


    /* -----------------------------------------------------
       SCREENSHOT
    ----------------------------------------------------- */

    if (
      type === "screenshot"
    ) {

      const fileInput =
        container.querySelector(
          'input[type="file"]'
        );


      const descriptionInput =
        container.querySelector(
          ".proof-description"
        );


      if (!fileInput) {

        alert(
          "Image upload field is missing. Please refresh the page."
        );

        resetSubmitButton(
          button
        );

        return;

      }


      const file =
        fileInput.files[0];


      if (!file) {

        alert(
          "Please select a picture first."
        );

        resetSubmitButton(
          button
        );

        return;

      }


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "Please select an image file."
        );

        resetSubmitButton(
          button
        );

        return;

      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        alert(
          "Image must be 5MB or smaller."
        );

        resetSubmitButton(
          button
        );

        return;

      }


      /* ---------------------------------------------------
         STORAGE PATH
      --------------------------------------------------- */

      const extension =
        file.name
          .split(".")
          .pop();


      const filePath =
        user.id +
        "/" +
        task.id +
        "/" +
        Date.now() +
        "." +
        extension;


      const {
        error: uploadError
      } =
        await db.storage
          .from("task proof")
          .upload(
            filePath,
            file,
            {
              cacheControl:
                "3600",
              upsert:
                false
            }
          );


      if (
        uploadError
      ) {

        console.error(
          uploadError
        );

        alert(
          "Picture upload failed: " +
          uploadError.message
        );

        resetSubmitButton(
          button
        );

        return;

      }


      const description =
        descriptionInput
          ? descriptionInput.value.trim()
          : "";


      const proofData =
        JSON.stringify({

          type:
            "screenshot",

          storage_path:
            filePath,

          file_name:
            file.name,

          description:
            description

        });


      const {
        error: submitError
      } =
        await db
          .from("task_submissions")
          .insert({

            user_id:
              user.id,

            task_id:
              task.id,

            proof:
              proofData,

            status:
              "PENDING"

          });


      if (
        submitError
      ) {

        console.error(
          submitError
        );

        alert(
          "Proof submission failed: " +
          submitError.message
        );

        resetSubmitButton(
          button
        );

        return;

      }


      showSuccess(
        button
      );

      return;

    }


    /* -----------------------------------------------------
       TEXT / USERNAME / URL / REFERENCE
    ----------------------------------------------------- */

    const input =
      container.querySelector(
        ".proof-input"
      );


    if (!input) {

      alert(
        "Please enter your proof."
      );

      resetSubmitButton(
        button
      );

      return;

    }


    const proofValue =
      input.value.trim();


    if (!proofValue) {

      alert(
        "Please enter your proof."
      );

      resetSubmitButton(
        button
      );

      return;

    }


    /* -----------------------------------------------------
       URL
    ----------------------------------------------------- */

    if (
      type === "url"
    ) {

      try {

        const url =
          new URL(
            proofValue
          );


        if (
          url.protocol !==
            "http:" &&
          url.protocol !==
            "https:"
        ) {

          throw new Error(
            "Invalid protocol"
          );

        }

      }
      catch (error) {

        alert(
          "Please enter a valid URL starting with https:// or http://"
        );

        resetSubmitButton(
          button
        );

        return;

      }

    }


    /* -----------------------------------------------------
       USERNAME
    ----------------------------------------------------- */

    if (
      type === "username" &&
      proofValue.length < 2
    ) {

      alert(
        "Please enter a valid username."
      );

      resetSubmitButton(
        button
      );

      return;

    }


    /* -----------------------------------------------------
       REFERENCE
    ----------------------------------------------------- */

    if (
      type === "reference" &&
      proofValue.length < 2
    ) {

      alert(
        "Please enter a valid reference ID."
      );

      resetSubmitButton(
        button
      );

      return;

    }


    /* -----------------------------------------------------
       PROOF DATA
    ----------------------------------------------------- */

    const proofData =
      JSON.stringify({

        type:
          type,

        value:
          proofValue

      });


    const {
      error
    } =
      await db
        .from("task_submissions")
        .insert({

          user_id:
            user.id,

          task_id:
            task.id,

          proof:
            proofData,

          status:
            "PENDING"

        });


    if (error) {

      console.error(
        error
      );

      alert(
        "Submission failed: " +
        error.message
      );

      resetSubmitButton(
        button
      );

      return;

    }


    showSuccess(
      button
    );


  }
  catch (error) {

    console.error(
      error
    );

    alert(
      "Something went wrong. Please try again."
    );

    resetSubmitButton(
      button
    );

  }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
  button
) {

  button.textContent =
    "Submitted ✓";

  button.disabled =
    true;


  const proofContainer =
    button.parentElement;


  const success =
    proofContainer.querySelector(
      ".success-message"
    );


  if (success) {

    success.style.display =
      "block";

  }

}


/* =========================================================
   RESET BUTTON
========================================================= */

function resetSubmitButton(
  button
) {

  button.disabled =
    false;

  button.textContent =
    "Submit Proof";

}


/* =========================================================
   COPY
========================================================= */

async function copyText(
  value,
  button
) {

  try {

    await navigator.clipboard.writeText(
      String(value)
    );


    const oldText =
      button.textContent;


    button.textContent =
      "Copied ✓";


    setTimeout(
      function() {

        button.textContent =
          oldText;

      },
      1500
    );


  }
  catch (error) {

    console.error(
      error
    );

    alert(
      "Copy failed. Please copy it manually."
    );

  }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
  value
) {

  try {

    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return String(
        value
      );

    }


    return date.toLocaleString(
      "en-NG",
      {
        dateStyle:
          "medium",

        timeStyle:
          "short"
      }
    );

  }
  catch (error) {

    return String(
      value
    );

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  title,
  message
) {

  const tasksBox =
    document.getElementById(
      "tasks"
    );


  tasksBox.innerHTML = `

    <div class="message">

      <div class="message-icon">
        ⚠️
      </div>

      <div class="message-title">
        ${escapeHTML(title)}
      </div>

      ${escapeHTML(message)}

      <br>

      <button
        class="refresh-btn"
        onclick="loadTasks()"
      >
        Try Again
      </button>

    </div>

  `;

}


/* =========================================================
   START
========================================================= */

loadTasks();

</script>
