<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #17251b;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 22px 16px 27px;
  border-radius: 0 0 25px 25px;
}

.header-inner {
  max-width: 720px;
  margin: auto;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 13px;
  display: inline-block;
  margin-bottom: 20px;
}

.page-icon {
  font-size: 27px;
  margin-bottom: 7px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 13px;
  opacity: .9;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 20px 14px 35px;
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.title-row h2 {
  font-size: 18px;
  margin: 0;
}

.task-count {
  background: #e8f8ed;
  color: #0b8f3c;
  padding: 6px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}

.task-card {
  background: white;
  border: 1px solid #e3eee6;
  border-radius: 16px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.task-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.task-icon {
  width: 45px;
  height: 45px;
  min-width: 45px;
  border-radius: 12px;
  background: #e9f8ee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.task-title {
  font-size: 16px;
  font-weight: 800;
  margin: 2px 0 5px;
}

.task-description {
  color: #718078;
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
}

.reward-box {
  background: #f1fbf4;
  border-radius: 11px;
  padding: 11px;
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reward-label {
  color: #718078;
  font-size: 11px;
}

.reward {
  color: #0b8f3c;
  font-size: 17px;
  font-weight: 800;
}

.details {
  margin-top: 12px;
  font-size: 11px;
  color: #657268;
  line-height: 1.7;
  white-space: pre-line;
}

.complete-btn {
  width: 100%;
  margin-top: 13px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.complete-btn:disabled {
  opacity: .65;
  cursor: not-allowed;
}

.message {
  background: white;
  border-radius: 15px;
  padding: 32px 18px;
  text-align: center;
  color: #718078;
  font-size: 13px;
  line-height: 1.6;
  box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.refresh-btn {
  margin-top: 15px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <div class="page-icon">
      📋
    </div>

    <h1>Tasks</h1>

    <p>
      Complete tasks and earn Naira.
    </p>

  </div>
</header>


<main class="container">

  <div class="title-row">

    <h2>
      Available Tasks
    </h2>

    <div
      class="task-count"
      id="taskCount">
      0 tasks
    </div>

  </div>


  <div id="tasks">

    <div class="message">
      ⏳<br><br>
      Loading available tasks...
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";


/*
  KEEP YOUR CURRENT SUPABASE
  PUBLISHABLE KEY HERE.

  DO NOT USE THE SECRET/SERVICE-ROLE KEY.
*/

const SUPABASE_KEY =
  


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadTasks() {

  const tasksBox =
    document.getElementById("tasks");


  try {

    const {
      data: { user },
      error: userError
    } = await db.auth.getUser();


    if (userError || !user) {

      window.location.href =
        "index.html";

      return;
    }

     const {
  data,
  error
} = await db
  .from("tasks")
  .select(
    "id, title, description, reward, slots, expiry_date, requirements, proof_type, proof_required, max_completions, active"
  )
  .eq("active", true)
  .order("created_at", {
    ascending: false
  }); 



    if (error) {

      console.error(error);

      tasksBox.innerHTML =
        `
        <div class="message">
          ❌<br><br>
          Unable to load tasks right now.
          <br>
          Please try again later.
          <br><br>

          <button
            class="refresh-btn"
            onclick="loadTasks()">
            Try Again
          </button>
        </div>
        `;

      return;
    }


    if (!data || data.length === 0) {

      document.getElementById(
        "taskCount"
      ).textContent = "0 tasks";


      tasksBox.innerHTML =
        `
        <div class="message">
          📋<br><br>
          <strong>No tasks available</strong>
          <br><br>
          There are no available tasks for you right now.
          Please check again later.
        </div>
        `;

      return;
    }


    document.getElementById(
      "taskCount"
    ).textContent =
      data.length +
      (data.length === 1
        ? " task"
        : " tasks");


    tasksBox.innerHTML = "";


    data.forEach(function(task) {

      const card =
        document.createElement("div");

      card.className =
        "task-card";


      const top =
        document.createElement("div");

      top.className =
        "task-top";


      const icon =
        document.createElement("div");

      icon.className =
        "task-icon";

      
        const taskTitle = (task.title || "").toLowerCase();

if (taskTitle.includes("tiktok")) {
  icon.textContent = "🎵";
} else if (taskTitle.includes("youtube")) {
  icon.textContent = "▶️";
} else if (taskTitle.includes("instagram")) {
  icon.textContent = "📸";
} else if (taskTitle.includes("facebook")) {
  icon.textContent = "📘";
} else if (
  taskTitle.includes("download") ||
  taskTitle.includes("app")
) {
  icon.textContent = "📱";
} else {
  icon.textContent = "📋";
}


      const info =
        document.createElement("div");


      const title =
        document.createElement("div");

      title.className =
        "task-title";

      title.textContent =
        task.title ||
        "Task";


      const description =
        document.createElement("p");

      description.className =
        "task-description";

      description.textContent =
        task.description ||
        "Complete this task according to the instructions.";


      info.appendChild(title);
      info.appendChild(description);

      top.appendChild(icon);
      top.appendChild(info);


      const rewardBox =
        document.createElement("div");

      rewardBox.className =
        "reward-box";


      const rewardLabel =
        document.createElement("span");

      rewardLabel.className =
        "reward-label";

      rewardLabel.textContent =
        "TASK REWARD";


      const reward =
        document.createElement("span");

      reward.className =
        "reward";

      reward.textContent =
        "₦" +
        Number(
          task.reward || 0
        ).toLocaleString("en-NG");


      rewardBox.appendChild(
        rewardLabel
      );

      rewardBox.appendChild(
        reward
      );


      const details =
        document.createElement("div");

      details.className =
        "details";


      const proofText =
        task.proof_required
          ? (task.proof_type || "Text")
          : "Not required";


      details.textContent =
        "🧾 Proof: " +
        proofText;


      if (task.requirements) {

        details.textContent +=
          "\n📝 Requirements: " +
          task.requirements;
      }


      if (task.expiry_date) {

        details.textContent +=
          "\n⏰ Deadline: " +
          task.expiry_date;
      }


      const button =
        document.createElement("button");

      button.className =
        "complete-btn";

      button.textContent =
        "Complete Task";


      button.onclick =
        function() {

          startTask(
            task.id,
            button
          );

        };


      card.appendChild(top);
      card.appendChild(rewardBox);
      card.appendChild(details);
      card.appendChild(button);


      tasksBox.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    tasksBox.innerHTML =
      `
      <div class="message">
        ❌<br><br>
        Something went wrong while loading tasks.
        <br><br>

        <button
          class="refresh-btn"
          onclick="loadTasks()">
          Try Again
        </button>
      </div>
      `;

  }

}


async function startTask(
  taskId,
  button
) {

  button.disabled = true;

  button.textContent =
    "Loading...";


  try {

    const {
      data: task,
      error
    } = await db
      .from("tasks")
      .select(
        "id, title, description, reward, proof_type, proof_required"
      )
      .eq("id", taskId)
      .single();


    if (error || !task) {

      alert(
        "Unable to load this task."
      );

      button.disabled = false;

      button.textContent =
        "Complete Task";

      return;
    }


    let proof = "";


    if (task.proof_required) {

      proof = prompt(
        "Complete the task first, then enter your proof.\n\nProof type: " +
        (task.proof_type || "Text")
      );


      if (proof === null) {

        button.disabled = false;

        button.textContent =
          "Complete Task";

        return;
      }


      proof =
        proof.trim();


      if (!proof) {

        alert(
          "Proof is required."
        );

        button.disabled = false;

        button.textContent =
          "Complete Task";

        return;
      }

    } else {

      proof = prompt(
        "Complete the task first.\n\nAdd your proof or note:"
      );


      if (proof === null) {

        button.disabled = false;

        button.textContent =
          "Complete Task";

        return;
      }

      proof =
        proof.trim();

    }


    const {
      data: { user }
    } =
      await db.auth.getUser();


    if (!user) {

      window.location.href =
        "index.html";

      return;
    }


    const {
      error: submissionError
    } =
      await db
        .from("task_submissions")
        .insert({

          user_id: user.id,

          task_id: task.id,

          proof: proof,

          status: "PENDING"

        });


    if (submissionError) {

      console.error(
        submissionError
      );

      alert(
        "Submission failed: " +
        submissionError.message
      );

      button.disabled = false;

      button.textContent =
        "Complete Task";

      return;
    }


    alert(
      "✅ Task submitted successfully.\n\nYour proof is now pending review."
    );


    button.textContent =
      "Submitted ✓";


    button.disabled =
      true;


  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong. Please try again."
    );

    button.disabled = false;

    button.textContent =
      "Complete Task";

  }

}


loadTasks();

</script>

</body>
  </html>
