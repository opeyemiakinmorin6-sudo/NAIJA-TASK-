<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4faf6;
  color:#18251d;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

header{
  background:linear-gradient(145deg,#0b8f3c,#087b34);
  color:#fff;
  border-radius:0 0 25px 25px;
  padding:16px 14px 21px;
}

.header-inner,
.container{
  width:100%;
  max-width:760px;
  margin:auto;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.back{
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.badge{
  background:rgba(255,255,255,.15);
  padding:6px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
}

.heading{
  display:flex;
  gap:11px;
  align-items:center;
}

.page-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

h1{
  margin:0 0 4px;
  font-size:23px;
}

header p{
  margin:0;
  font-size:11px;
  opacity:.9;
}

.container{
  padding:17px 12px 40px;
}

.page-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.page-title{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.page-subtitle{
  margin:3px 0 0;
  color:#758179;
  font-size:10px;
}

.count{
  background:#e7f7ec;
  color:#0b8f3c;
  padding:7px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

/* =========================
   TASK CARD
========================= */

.task-card{
  background:#fff;
  border:1px solid #e1ebe4;
  border-radius:17px;
  overflow:hidden;
  margin-bottom:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.045);
}

.main{
  padding:13px;
}

.task-top{
  display:flex;
  gap:11px;
  align-items:flex-start;
}

.icon{
  width:47px;
  height:47px;
  min-width:47px;
  border-radius:14px;
  background:#f0f8f2;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.icon img{
  width:29px;
  height:29px;
  object-fit:contain;
}

.icon-fallback{
  font-size:22px;
}

.task-title{
  margin:2px 0 4px;
  font-size:15px;
  font-weight:900;
  line-height:1.3;
}

.description{
  margin:0;
  color:#738077;
  font-size:10.5px;
  line-height:1.45;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.platform{
  display:inline-block;
  margin-top:6px;
  padding:4px 7px;
  border-radius:7px;
  background:#eef8f1;
  color:#0b8f3c;
  font-size:8px;
  font-weight:900;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:12px;
}

.summary-box{
  background:#f7faf8;
  border:1px solid #e5eee8;
  border-radius:11px;
  padding:8px;
}

.label{
  display:block;
  color:#78847c;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:4px;
}

.value{
  font-size:14px;
  font-weight:900;
}

.reward{
  color:#0b8f3c;
}

.start{
  width:100%;
  border:0;
  background:#0b8f3c;
  color:white;
  padding:11px;
  border-radius:9px;
  margin-top:11px;
  font-size:12px;
  font-weight:900;
}

.start.open{
  background:#086f2f;
}

/* =========================
   COMPACT DETAILS
========================= */

.details{
  display:none;
  padding:0 13px 14px;
}

.details.open{
  display:block;
}

.divider{
  border-top:1px solid #e7eee9;
  padding-top:11px;
}

.compact-info{
  background:#f7faf8;
  border:1px solid #e3ebe5;
  border-radius:11px;
  padding:10px;
  margin-bottom:8px;
}

.info-label{
  color:#78847c;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:5px;
}

.info-text{
  color:#2d3b32;
  font-size:11px;
  line-height:1.5;
  white-space:pre-line;
  word-break:break-word;
}

.creator{
  background:#edf9f1;
  border:1px solid #dcefe2;
}

.creator strong{
  color:#0b8f3c;
}

.action-row{
  display:flex;
  gap:7px;
  margin:8px 0;
}

.open-link{
  flex:1;
  background:#0b8f3c;
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:10px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
}

.copy-link{
  border:0;
  background:#e7f7ec;
  color:#0b8f3c;
  padding:0 11px;
  border-radius:9px;
  font-size:9px;
  font-weight:900;
}

.copy-row{
  display:flex;
  gap:6px;
}

.copy-content{
  flex:1;
  background:#fff;
  border:1px solid #dfe8e1;
  border-radius:8px;
  padding:9px;
  font-size:11px;
  word-break:break-word;
}

.copy-btn{
  border:0;
  background:#e7f7ec;
  color:#0b8f3c;
  border-radius:8px;
  padding:0 10px;
  font-size:9px;
  font-weight:900;
}

.requirement{
  margin-top:8px;
}

.requirement-list{
  margin:0;
  padding-left:17px;
  color:#39483f;
  font-size:10.5px;
  line-height:1.55;
}

/* =========================
   PROOF
========================= */

.proof{
  margin-top:11px;
  padding-top:11px;
  border-top:1px solid #e7eee9;
}

.proof-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.proof-title{
  margin:0;
  font-size:14px;
  font-weight:900;
}

.proof-badge{
  background:#e7f8ec;
  color:#0b8f3c;
  padding:5px 7px;
  border-radius:7px;
  font-size:8px;
  font-weight:900;
}

.field{
  margin-bottom:9px;
}

.field label{
  display:block;
  margin-bottom:5px;
  font-size:10px;
  font-weight:900;
}

.required{
  color:#c62828;
  font-size:8px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #d7e3da;
  background:#fff;
  border-radius:9px;
  padding:10px;
  font-size:11px;
  outline:none;
}

.field textarea{
  min-height:70px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#0b8f3c;
}

.upload-info{
  background:#edf8f0;
  border-radius:8px;
  padding:8px;
  color:#4f6d59;
  font-size:9px;
  line-height:1.45;
  margin-bottom:8px;
}

.preview{
  display:none;
  width:100%;
  max-height:190px;
  object-fit:contain;
  margin-top:7px;
  border:1px solid #dce7df;
  border-radius:9px;
}

.submit{
  width:100%;
  border:0;
  background:#0b8f3c;
  color:#fff;
  padding:11px;
  border-radius:9px;
  font-size:12px;
  font-weight:900;
}

.submit:disabled{
  opacity:.6;
}

.success{
  display:none;
  background:#e7f8ec;
  border:1px solid #cfead7;
  color:#0b8f3c;
  border-radius:9px;
  padding:9px;
  margin-top:8px;
  font-size:10px;
  font-weight:700;
}

.warning{
  background:#fff9ea;
  border:1px solid #f1dfb5;
  color:#6d5725;
  border-radius:9px;
  padding:8px;
  margin:8px 0;
  font-size:9px;
  line-height:1.45;
}

.message{
  background:#fff;
  border:1px solid #e2ebe5;
  border-radius:16px;
  padding:35px 17px;
  text-align:center;
  color:#758179;
  font-size:11px;
  line-height:1.6;
}

.message-icon{
  font-size:28px;
  margin-bottom:7px;
}

.message-title{
  color:#25342b;
  font-size:14px;
  font-weight:900;
  margin-bottom:4px;
}

.refresh{
  margin-top:12px;
  border:0;
  background:#0b8f3c;
  color:#fff;
  padding:10px 16px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
}

@media(max-width:480px){

  .action-row{
    flex-direction:column;
  }

  .copy-link{
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="header-top">
      <a href="dashboard.html" class="back">← Dashboard</a>
      <div class="badge">NAIJA TASK</div>
    </div>

    <div class="heading">
      <div class="page-icon">📋</div>

      <div>
        <h1>Available Tasks</h1>
        <p>Complete genuine tasks and earn Naira.</p>
      </div>
    </div>

  </div>
</header>

<main class="container">

  <div class="page-bar">

    <div>
      <h2 class="page-title">Tasks</h2>
      <p class="page-subtitle">
        Choose a task and complete the instructions.
      </p>
    </div>

    <div class="count" id="taskCount">
      0 tasks
    </div>

  </div>

  <div id="tasks">

    <div class="message">
      <div class="message-icon">⏳</div>
      <div class="message-title">Loading tasks</div>
      Please wait while available tasks are loaded.
    </div>

  </div>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jwakveeiynpakunwjzkj.supabase.co";

const SUPABASE_KEY =
        "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;


/* =========================================================
   REAL BRAND LOGOS
========================================================= */

const PLATFORM_LOGOS={

  TikTok:"https://cdn.simpleicons.org/tiktok",

  YouTube:"https://cdn.simpleicons.org/youtube",

  Instagram:"https://cdn.simpleicons.org/instagram",

  Facebook:"https://cdn.simpleicons.org/facebook",

  Telegram:"https://cdn.simpleicons.org/telegram",

  WhatsApp:"https://cdn.simpleicons.org/whatsapp",

  X:"https://cdn.simpleicons.org/x"

};


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks(){

  const box=
    document.getElementById("tasks");

  try{

    const {
      data:{user},
      error:userError
    }=
    await db.auth.getUser();

    if(userError || !user){

      location.href="index.html";
      return;

    }

    currentUser=user;

    const {
      data,
      error
    }=
    await db
      .from("tasks")
      .select(`
        id,
        title,
        description,
        reward,
        slots,
        expiry_date,
        requirements,
        proof_type,
        proof_required,
        max_completions,
        active,
        task_type,
        task_link,
        uploader_username,
        copy_text,
        post_link,
        upload_required
      `)
      .eq("active",true);

    if(error){

      console.error(error);

      showError(
        "Unable to load tasks",
        error.message
      );

      return;
    }

    if(!data || data.length===0){

      document.getElementById("taskCount")
        .textContent="0 tasks";

      box.innerHTML=`
        <div class="message">

          <div class="message-icon">📋</div>

          <div class="message-title">
            No tasks available
          </div>

          There are no available tasks right now.

          <br>

          <button
            class="refresh"
            onclick="loadTasks()"
          >
            Refresh Tasks
          </button>

        </div>
      `;

      return;
    }

    document.getElementById("taskCount")
      .textContent=
      data.length+
      (data.length===1 ? " task":" tasks");

    box.innerHTML="";

    data.forEach(createTaskCard);

  }
  catch(error){

    console.error(error);

    showError(
      "Something went wrong",
      "Please try again."
    );

  }
}


/* =========================================================
   CREATE TASK CARD
========================================================= */

function createTaskCard(task){

  const card=
    document.createElement("div");

  card.className="task-card";

  const main=
    document.createElement("div");

  main.className="main";

  main.innerHTML=`

    <div class="task-top">

      <div class="icon">
        ${getTaskIcon(task)}
      </div>

      <div style="flex:1">

        <div class="task-title">
          ${escapeHTML(
            task.title || "Task"
          )}
        </div>

        <p class="description">
          ${escapeHTML(
            task.description ||
            "Complete this task according to the poster's instructions."
          )}
        </p>

        <span class="platform">
          ${escapeHTML(
            getPlatform(task)
          )}
        </span>

      </div>

    </div>

    <div class="summary">

      <div class="summary-box">

        <span class="label">
          Task Reward
        </span>

        <span class="value reward">
          ₦${Number(
            task.reward||0
          ).toLocaleString("en-NG")}
        </span>

      </div>

      <div class="summary-box">

        <span class="label">
          Available Slots
        </span>

        <span class="value">
          ${
            Number(task.slots||0)>0
            ? Number(task.slots)+" slots"
            : "Check"
          }
        </span>

      </div>

    </div>

    <button class="start">
      ▶ Start Task
    </button>
  `;


  const details=
    document.createElement("div");

  details.className="details";


  const divider=
    document.createElement("div");

  divider.className="divider";

  details.appendChild(divider);


  buildDetails(
    divider,
    task
  );


  const start=
    main.querySelector(".start");


  start.onclick=async()=>{

    const opened=
      details.classList.toggle("open");

    if(opened){

      start.textContent=
        "▲ Close Task";

      start.classList.add("open");

    }
    else{

      start.textContent=
        "▶ Start Task";

      start.classList.remove("open");

    }

  };


  card.appendChild(main);
  card.appendChild(details);

  document
    .getElementById("tasks")
    .appendChild(card);
}


/* =========================================================
   BUILD COMPACT DETAILS
========================================================= */

function buildDetails(parent,task){

  /* CREATOR INSTRUCTIONS */

  const creator=
    document.createElement("div");

  creator.className=
    "compact-info creator";

  creator.innerHTML=`

    <div class="info-label">
      Creator's Instructions
    </div>

    <div class="info-text">
      ${escapeHTML(
        task.description ||
        "Follow the task instructions carefully."
      )}
    </div>

  `;

  parent.appendChild(creator);


  /* CREATOR USERNAME */

  if(task.uploader_username){

    const box=
      document.createElement("div");

    box.className="compact-info";

    box.innerHTML=`

      <div class="info-label">
        Creator Username
      </div>

    `;

    box.appendChild(
      copyRow(
        task.uploader_username,
        "Copy Username"
      )
    );

    parent.appendChild(box);
  }


  /* REQUIRED COMMENT */

  if(task.copy_text){

    const box=
      document.createElement("div");

    box.className="compact-info";

    box.innerHTML=`

      <div class="info-label">
        Required Comment
      </div>

    `;

    box.appendChild(
      copyRow(
        task.copy_text,
        "Copy Comment"
      )
    );

    parent.appendChild(box);
  }


  /* TASK LINK */

  if(task.task_link){

    const box=
      document.createElement("div");

    box.className="compact-info";

    box.innerHTML=`

      <div class="info-label">
        ${escapeHTML(
          getPlatform(task)
        )} Task Link
      </div>

    `;

    const row=
      document.createElement("div");

    row.className="action-row";

    const open=
      document.createElement("a");

    open.className="open-link";

    open.href=task.task_link;

    open.target="_blank";

    open.rel=
      "noopener noreferrer";

    open.textContent=
      "🔗 Open "+
      getPlatform(task);


    const copy=
      document.createElement("button");

    copy.className="copy-link";

    copy.textContent=
      "Copy Link";


    copy.onclick=async()=>{

      try{

        await navigator.clipboard
          .writeText(task.task_link);

        copy.textContent=
          "Copied ✓";

        setTimeout(()=>{

          copy.textContent=
            "Copy Link";

        },1500);

      }
      catch(e){

        alert(
          "Copy failed. Please copy the link manually."
        );

      }

    };


    row.appendChild(open);
    row.appendChild(copy);

    box.appendChild(row);

    parent.appendChild(box);
  }


  /* POST LINK */

  if(
    task.post_link &&
    task.post_link!==task.task_link
  ){

    const box=
      document.createElement("div");

    box.className="compact-info";

    box.innerHTML=`

      <div class="info-label">
        Post Link
      </div>

    `;

    const row=
      document.createElement("div");

    row.className="action-row";

    const open=
      document.createElement("a");

    open.className="open-link";

    open.href=
      task.post_link;

    open.target="_blank";

    open.rel=
      "noopener noreferrer";

    open.textContent=
      "📢 Open Post";


    const copy=
      document.createElement("button");

    copy.className="copy-link";

    copy.textContent=
      "Copy Link";


    copy.onclick=async()=>{

      try{

        await navigator.clipboard
          .writeText(task.post_link);

        copy.textContent=
          "Copied ✓";

        setTimeout(()=>{

          copy.textContent=
            "Copy Link";

        },1500);

      }
      catch(e){

        alert(
          "Copy failed."
        );

      }

    };


    row.appendChild(open);
    row.appendChild(copy);

    box.appendChild(row);

    parent.appendChild(box);
  }


  /* REQUIREMENTS */

  const requirements=
    formatRequirements(
      task.requirements
    );

  if(requirements){

    const box=
      document.createElement("div");

    box.className=
      "compact-info requirement";

    box.innerHTML=`

      <div class="info-label">
        Poster Requirements
      </div>

      <div class="info-text">
        ${escapeHTML(requirements)}
      </div>

    `;

    parent.appendChild(box);
  }


  /* DEADLINE */

  if(task.expiry_date){

    const box=
      document.createElement("div");

    box.className=
      "compact-info";

    box.innerHTML=`

      <div class="info-label">
        Deadline
      </div>

      <div class="info-text">
        ${escapeHTML(
          formatDate(task.expiry_date)
        )}
      </div>

    `;

    parent.appendChild(box);
  }


  /* SHORT WARNING */

  const warning=
    document.createElement("div");

  warning.className="warning";

  warning.innerHTML=
    "<b>⚠️ Submit genuine proof.</b> "+
    "Fake, reused or unrelated proof may be rejected.";

  parent.appendChild(warning);


  /* WORKER PROOF */

  buildWorkerProof(
    parent,
    task
  );
}


/* =========================================================
   WORKER PROOF
========================================================= */

function buildWorkerProof(parent,task){

  const proof=
    document.createElement("div");

  proof.className="proof";

  proof.innerHTML=`

    <div class="proof-heading">

      <h3 class="proof-title">
        Submit Your Proof
      </h3>

      <div class="proof-badge">
        PHOTO REQUIRED
      </div>

    </div>


    <div class="field">

      <label>
        👤 Your Username / Account Used
        <span class="required">
          REQUIRED
        </span>
      </label>

      <input
        class="worker-username"
        type="text"
        placeholder="@yourusername"
        autocomplete="off"
      >

    </div>


    <div class="field">

      <label>
        💬 Your Comment / Report
        <span class="required">
          REQUIRED
        </span>
      </label>

      <textarea
        class="worker-comment"
        placeholder="Tell the poster what you completed..."
      ></textarea>

    </div>


    ${buildExtraWorkerField(task)}


    <div class="upload-info">
      📷 Upload a clear photo or screenshot showing
      that you completed the task. Maximum 5MB.
    </div>


    <div class="field">

      <label>
        📷 Photo Proof
        <span class="required">
          REQUIRED
        </span>
      </label>

      <input
        class="photo-input"
        type="file"
        accept="image/*"
      >

      <img
        class="preview"
        alt="Proof preview"
      >

    </div>


    <button class="submit">
      Submit Proof
    </button>


    <div class="success">
      ✅ Proof submitted successfully and is waiting for review.
    </div>

  `;


  parent.appendChild(proof);


  const fileInput=
    proof.querySelector(
      ".photo-input"
    );

  const preview=
    proof.querySelector(
      ".preview"
    );


  fileInput.addEventListener(
    "change",
    ()=>{

      const file=
        fileInput.files[0];

      if(!file){

        preview.style.display=
          "none";

        return;
      }


      if(!file.type.startsWith("image/")){

        alert(
          "Please select an image."
        );

        fileInput.value="";

        return;
      }


      if(
        file.size >
        5*1024*1024
      ){

        alert(
          "Photo must be 5MB or smaller."
        );

        fileInput.value="";

        return;
      }


      const reader=
        new FileReader();


      reader.onload=e=>{

        preview.src=
          e.target.result;

        preview.style.display=
          "block";

      };


      reader.readAsDataURL(file);

    }
  );


  proof.querySelector(
    ".submit"
  ).onclick=()=>{

    submitProof(
      task,
      proof
    );

  };
}


/* =========================================================
   EXTRA PROOF FIELD
========================================================= */

function buildExtraWorkerField(task){

  const type=
    String(
      task.proof_type||""
    ).toLowerCase();


  if(
    type.includes("url") ||
    type.includes("link")
  ){

    return `

      <div class="field">

        <label>
          🔗 Your Proof Link
        </label>

        <input
          class="extra-proof"
          type="url"
          placeholder="https://..."
        >

      </div>

    `;

  }


  if(
    type.includes("reference")
  ){

    return `

      <div class="field">

        <label>
          🔖 Your Reference ID
        </label>

        <input
          class="extra-proof"
          type="text"
          placeholder="Enter reference ID"
        >

      </div>

    `;

  }


  return "";
}


/* =========================================================
   SUBMIT PROOF
========================================================= */

async function submitProof(task,proof){

  const button=
    proof.querySelector(
      ".submit"
    );

  const username=
    proof.querySelector(
      ".worker-username"
    ).value.trim();

  const comment=
    proof.querySelector(
      ".worker-comment"
    ).value.trim();

  const photoInput=
    proof.querySelector(
      ".photo-input"
    );

  const extra=
    proof.querySelector(
      ".extra-proof"
    );

  const extraValue=
    extra
    ? extra.value.trim()
    : "";


  if(!username){

    alert(
      "Please enter the username/account you used."
    );

    return;
  }


  if(!comment){

    alert(
      "Please enter your comment/report."
    );

    return;
  }


  const file=
    photoInput.files[0];


  if(!file){

    alert(
      "Photo proof is required for every task."
    );

    return;
  }


  if(
    !file.type.startsWith("image/")
  ){

    alert(
      "Please select an image."
    );

    return;
  }


  if(
    file.size >
    5*1024*1024
  ){

    alert(
      "Photo must be 5MB or smaller."
    );

    return;
  }


  button.disabled=true;

  button.textContent=
    "Checking Task...";


  try{

    const {
      data:{user},
      error:userError
    }=
    await db.auth.getUser();


    if(
      userError ||
      !user
    ){

      location.href=
        "index.html";

      return;
    }


    /* =========================================
       CHECK DUPLICATE SUBMISSION
    ========================================= */

    const {
      data:existing,
      error:existingError
    }=
    await db
      .from("task_submissions")
      .select("id,status")
      .eq("user_id",user.id)
      .eq("task_id",task.id)
      .in(
        "status",
        ["PENDING","APPROVED"]
      )
      .limit(1);


    if(existingError){

      console.error(
        existingError
      );

      alert(
        "Could not check your previous submission: "+
        existingError.message
      );

      resetButton(button);

      return;
    }


    if(
      existing &&
      existing.length>0
    ){

      alert(
        "You have already submitted this task."
      );

      resetButton(button);

      return;
    }


    /* =========================================
       UPLOAD PHOTO
    ========================================= */

    button.textContent=
      "Uploading Photo...";


    const extension=
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const path=
      user.id+
      "/"+
      task.id+
      "/"+
      Date.now()+
      "."+
      extension;


    const {
      error:uploadError
    }=
    await db.storage
      .from("task proof")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


    if(uploadError){

      console.error(
        uploadError
      );

      alert(
        "Photo upload failed: "+
        uploadError.message
      );

      resetButton(button);

      return;
    }


    /* =========================================
       SAVE PROOF
    ========================================= */

    button.textContent=
      "Submitting Proof...";


    const proofData={

      photo:{
        storage_path:path,
        file_name:file.name
      },

      worker:{
        username:username,
        comment:comment,
        extra:extraValue
      },

      poster_requirements:{

        creator_username:
          task.uploader_username || "",

        required_comment:
          task.copy_text || "",

        description:
          task.description || "",

        platform:
          getPlatform(task),

        task_link:
          task.task_link || "",

        post_link:
          task.post_link || ""

      }

    };


    const {
      error
    }=
    await db
      .from("task_submissions")
      .insert({

        user_id:user.id,

        task_id:task.id,

        proof:
          JSON.stringify(
            proofData
          ),

        status:"PENDING"

      });


    if(error){

      console.error(error);

      alert(
        "Proof submission failed: "+
        error.message
      );

      resetButton(button);

      return;
    }


    button.textContent=
      "Submitted ✓";


    const success=
      proof.querySelector(
        ".success"
      );

    success.style.display=
      "block";


    /* Disable the form after success */

    proof.querySelectorAll(
      "input,textarea"
    ).forEach(
      element=>{
        element.disabled=true;
      }
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Something went wrong. Please try again."
    );

    resetButton(button);
  }
}


/* =========================================================
   LOGO / PLATFORM
========================================================= */

function getPlatform(task){

  const type=
    String(
      task.task_type||""
    ).toLowerCase();

  const title=
    String(
      task.title||""
    ).toLowerCase();

  const text=
    type+" "+title;


  if(text.includes("tiktok"))
    return "TikTok";

  if(text.includes("youtube"))
    return "YouTube";

  if(text.includes("instagram"))
    return "Instagram";

  if(text.includes("facebook"))
    return "Facebook";

  if(text.includes("telegram"))
    return "Telegram";

  if(text.includes("whatsapp"))
    return "WhatsApp";

  if(
    text.includes("twitter") ||
    text.includes(" x ") ||
    text==="x"
  )
    return "X";

  if(text.includes("website"))
    return "Website";

  if(
    text.includes("web")
  )
    return "Website";

  if(
    text.includes("app")
  )
    return "App";

  if(
    text.includes("survey")
  )
    return "Survey";


  return task.task_type
    ? formatType(
        task.task_type
      )
    : "General";
}


function getTaskIcon(task){

  const platform=
    getPlatform(task);

  const logo=
    PLATFORM_LOGOS[
      platform
    ];


  if(logo){

    return `

      <img
        src="${logo}"
        alt="${escapeHTML(platform)}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
      >

      <span
        class="icon-fallback"
        style="display:none"
      >
        📋
      </span>

    `;

  }


  if(platform==="Website")
    return `<span class="icon-fallback">🌐</span>`;

  if(platform==="App")
    return `<span class="icon-fallback">📱</span>`;

  if(platform==="Survey")
    return `<span class="icon-fallback">📝</span>`;

  return `<span class="icon-fallback">📋</span>`;
}


/* =========================================================
   COPY
========================================================= */

function copyRow(value,text="Copy"){

  const row=
    document.createElement("div");

  row.className="copy-row";


  const content=
    document.createElement("div");

  content.className=
    "copy-content";

  content.textContent=
    value;


  const button=
    document.createElement("button");

  button.className=
    "copy-btn";

  button.textContent=
    text;


  button.onclick=async()=>{

    try{

      await navigator.clipboard
        .writeText(
          String(value)
        );

      const old=
        button.textContent;

      button.textContent=
        "Copied ✓";


      setTimeout(()=>{

        button.textContent=
          old;

      },1500);

    }
    catch(e){

      alert(
        "Copy failed. Please copy manually."
      );

    }

  };


  row.appendChild(content);
  row.appendChild(button);

  return row;
}


/* =========================================================
   REQUIREMENTS
========================================================= */

function formatRequirements(value){

  if(!value)
    return "";

  if(typeof value==="string")
    return value;

  if(Array.isArray(value))
    return value.join("\n");

  if(typeof value==="object"){

    return Object.entries(value)
      .map(
        ([key,val])=>
          key+": "+val
      )
      .join("\n");
  }

  return String(value);
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

  const date=
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  )
    return String(value);


  return date.toLocaleString(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}


/* =========================================================
   TYPE
========================================================= */

function formatType(value){

  return String(value||"")
    .replace(
      /[_-]+/g,
      " "
    )
    .replace(
      /\b\w/g,
      l=>l.toUpperCase()
    );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   RESET BUTTON
========================================================= */

function resetButton(button){

  button.disabled=false;

  button.textContent=
    "Submit Proof";
}
