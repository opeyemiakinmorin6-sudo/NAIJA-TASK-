/* =====================================================

const PLATFORM_INFO = {

  },

  }

};


/* =====================================================
   BASIC FUNCTIONS
   ===================================================== */

function goBack(){

  if(document.referrer){
    history.back();
  }else{
    window.location.href =
      "dashboard.html";
  }

}


function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showError(message){

  const box =
    document.getElementById("errorBox");

  box.textContent = message;

  box.style.display = "block";

}


function formatDate(date){

  if(!date){
    return "No deadline";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return "No deadline";
  }

  return d.toLocaleDateString(
    "en-NG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


function formatType(type){

  if(!type){
    return "Other";
  }

  const key =
    String(type)
      .toLowerCase()
      .replace(/[\s-]+/g,"_");


  if(PLATFORM_INFO[key]){
    return PLATFORM_INFO[key].name;
  }


  return String(type)
    .replace(/_/g," ")
    .replace(/\b\w/g,
      letter =>
        letter.toUpperCase()
    );

}


/* =====================================================
   PLATFORM LOGO
   ===================================================== */

function getPlatformKey(task){

  const raw =
    String(
      task.task_type || ""
    )
    .toLowerCase()
    .trim()
    .replace(/[\s-]+/g,"_");


  if(PLATFORM_INFO[raw]){
    return raw;
  }


  const text = (
    (task.title || "") +
    " " +
    (task.description || "")
  ).toLowerCase();


  const keys = [
    "tiktok",
    "youtube",
    "instagram",
    "facebook",
    "snapchat",
    "telegram",
    "whatsapp",
    "linkedin",
    "pinterest",
    "reddit",
    "threads",
    "discord",
    "messenger",
    "twitch",
    "tumblr",
    "quora",
    "medium",
    "wechat",
    "signal",
    "google"
  ];


  for(const key of keys){

    if(text.includes(key)){
      return key;
    }

  }


  if(text.includes("twitter")){
    return "x";
  }

  if(text.includes("website")){
    return "website";
  }

  if(
    text.includes("download") ||
    text.includes("app")
  ){
    return "app_download";
  }

  if(text.includes("survey")){
    return "survey";
  }


  return "other";

}


function getPlatformHTML(task){

  const key =
    getPlatformKey(task);

  const platform =
    PLATFORM_INFO[key] ||
    PLATFORM_INFO.other;


  if(platform.logo){

    return `
      <img
        src="${platform.logo}"
        alt="${escapeHTML(platform.name)}"
        onerror="this.style.display='none';"
      >
    `;

  }


  return `
    <div class="task-icon-fallback">
      NT
    </div>
  `;

}


/* =====================================================
   CURRENT USER
   ===================================================== */

async function getCurrentUser(){

  const {
    data,
    error
  } = await db.auth.getUser();


  if(error){
    throw error;
  }


  if(
    !data ||
    !data.user
  ){

    window.location.href =
      "index.html";

    return null;

  }


  return data.user;

}


/* =====================================================
   EXPIRY
   ===================================================== */

function isTaskExpired(task){

  if(!task.expiry_date){
    return false;
  }

  const expiry =
    new Date(task.expiry_date);


  if(isNaN(expiry.getTime())){
    return false;
  }


  return new Date() > expiry;

}


/* =====================================================
   START TASK TRACKING
   ===================================================== */

async function trackTaskStart(task){

  const user =
    await getCurrentUser();


  if(!user){
    return false;
  }


  const {
    error
  } = await db
    .from("task_activity")
    .insert({

      task_id:task.id,

      user_id:user.id,

      activity_type:"TASK_STARTED"

    });


  if(error){

    console.error(
      "Task tracking error:",
      error
    );

    /*
      Do not stop the Tasker from opening
      the task if tracking fails.
    */

  }


  return true;

}


/* =====================================================
   LOAD TASKS
   ===================================================== */

async function loadTasks(){

  const loading =
    document.getElementById(
      "loading"
    );


  const list =
    document.getElementById(
      "tasksList"
    );


  try{

    const user =
      await getCurrentUser();


    if(!user){
      return;
    }


    const {
      data:tasks,
      error
    } = await db
      .from("tasks")
      .select(`
        id,
        title,
        description,
        reward,
        slots,
        expiry_date,
        requirements,
        proof_type,
        active,
        task_type,
        task_link,
        uploader_username,
        copy_text,
        post_link,
        upload_required,
        created_at
      `)
      .eq("active",true)
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){
      throw error;
    }


    loading.style.display =
      "none";


    if(
      !tasks ||
      tasks.length === 0
    ){

      document.getElementById(
        "taskCount"
      ).textContent = "0";


      list.innerHTML = `

        <div class="empty">

          <div class="empty-title">
            No tasks available
          </div>

          <div>
            New tasks will appear here
            when they are posted.
          </div>

        </div>

      `;

      return;

    }


    document.getElementById(
      "taskCount"
    ).textContent =
      tasks.length;


    list.innerHTML = "";


    tasks.forEach(task => {

      list.appendChild(
        createTaskCard(task)
      );

    });

  }
  catch(error){

    console.error(error);


    loading.style.display =
      "none";


    showError(
      "Unable to load tasks: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =====================================================
   CREATE TASK CARD
   ===================================================== */

function createTaskCard(task){

  const card =
    document.createElement("div");


  card.className =
    "task-card";


  const reward =
    Number(
      task.reward || 0
    );


  const slots =
    task.slots === null ||
    task.slots === undefined
      ? "Available"
      : task.slots;


  const expired =
    isTaskExpired(task);


  const platform =
    formatType(
      task.task_type
    );


  card.innerHTML = `

    <div class="task-top">

      <div class="task-icon">
        ${getPlatformHTML(task)}
      </div>


      <div class="task-main">

        <div class="task-title">
          ${escapeHTML(
            task.title ||
            "Untitled Task"
          )}
        </div>

        <div class="task-owner">
          Posted by:
          <strong>
            ${escapeHTML(
              task.uploader_username ||
              "NAIJA TASK"
            )}
          </strong>
        </div>

      </div>


      <div class="reward">
        ₦${reward.toLocaleString()}
      </div>

    </div>


    <div class="task-meta">

      <div class="meta">
        ${escapeHTML(platform)}
      </div>

      <div class="meta">
        Slots: ${escapeHTML(slots)}
      </div>

      <div class="meta">
        ${escapeHTML(
          formatDate(
            task.expiry_date
          )
        )}
      </div>

    </div>


    <button
      class="start-btn"
      type="button"
      ${expired ? "disabled" : ""}
    >
      ${
        expired
          ? "Task Expired"
          : "Start Task"
      }
    </button>


    <div class="details"></div>

  `;


  const startButton =
    card.querySelector(
      ".start-btn"
    );


  const details =
    card.querySelector(
      ".details"
    );


  if(expired){

    return card;

  }


  startButton.addEventListener(
    "click",
    async () => {

      if(
        details.classList.contains(
          "open"
        )
      ){

        details.classList.remove(
          "open"
        );

        startButton.textContent =
          "Start Task";

        return;

      }


      startButton.disabled =
        true;


      startButton.textContent =
        "Opening...";


      /*
        Record the Tasker starting
        the task.
      */

      await trackTaskStart(task);


      details.innerHTML =
        buildDetails(task);


      details.classList.add(
        "open"
      );


      startButton.disabled =
        false;


      startButton.textContent =
        "Close Task";


      setupProofForm(
        details,
        task
      );

    }
  );


  return card;

}


/* =====================================================
   TASK DETAILS
   ===================================================== */

function buildDetails(task){

  const link =
    task.task_link ||
    task.post_link ||
    "";


  const copyText =
    task.copy_text ||
    "";


  const expired =
    isTaskExpired(task);


  const platformKey =
    getPlatformKey(task);


  const platform =
    PLATFORM_INFO[
      platformKey
    ] ||
    PLATFORM_INFO.other;


  return `

    <div class="section">

      <div class="section-title">
        Task Instructions
      </div>

      <div class="description">
        ${escapeHTML(
          task.description ||

      </div>

    </div>


    <div class="section">

      <div class="section-title">

      <div class="platform-line">

              platform.name
            )}"

          >

          ""

        <span>
          ${escapeHTML(
            platform.name
          )}
        </span>

      </div>

    </div>


    <div class="section">

      <div class="section-title">
        Task Owner
      </div>

      <div class="owner-name">
        ${escapeHTML(
          task.uploader_username ||
          "NAIJA TASK"
        )}
      </div>

    </div>


    ${
      link
      ?
      `

      <div class="section">

        <div class="section-title">
          Task Link
        </div>

        <div class="url-box">
          ${escapeHTML(link)}
        </div>

        <div class="link-row">

          <button
            class="link-btn"
            type="button"
            onclick="openTaskLink(${JSON.stringify(link)})"
          >

          </button>

          <button
            class="copy-btn"
            type="button"
            onclick="copyTaskLink(this, ${JSON.stringify(link)})"

          </button>

        </div>

        <div class="copy-status">
          Link copied successfully.
        </div>

      </div>

      `
      :
      `
      <div class="section">

        <div class="section-title">
          Task Link
        </div>

        <div class="small">

    ${

      ?

        </div>

        <button

          style="margin-top:9px;width:100%;"
          type="button"
          onclick="copyTaskText(this, ${JSON.stringify(copyText)})"
        >
          Copy Text
        </button>

        <div class="copy-status">
          Text copied successfully.
        </div>

      </div>

      `
      :
      ""
    }


    <div class="section">

      <div class="section-title">
        Submit Proof
      </div>

      <div class="small">
        Complete the task first, then submit
        clear proof for the task owner to review.
      </div>


      <div class="status-box">
        Photo proof is required for every task.
      </div>


      ${
        expired
        ?
        `

        <div
          class="message error"
          style="display:block;"
        >
          This task has expired and can no longer
          receive submissions.
        </div>

        `
        :
        `

        <form class="proof-form">

          <label>
            Username / Account Used
            <span class="required">*</span>
          </label>

          <input
            type="text"
            name="worker_username"
            placeholder="@username or account used"
            required
          >


          <label>
            Comment / Report
            <span class="required">*</span>
          </label>

          <textarea
            name="worker_comment"
            placeholder="Tell the task owner what you completed..."
            required
          ></textarea>


          <label>
            Extra Proof Link
          </label>

          <input
            type="url"
            name="worker_link"
            placeholder="Optional proof link"
          >


          <label>
            Photo Proof
            <span class="required">*</span>
          </label>

          <div class="file-box">

            <input
              type="file"
              name="proof_photo"
              accept="image/jpeg,image/png,image/webp"
              required
            >

            <div class="file-note">
              JPG, JPEG, PNG or WEBP.
              Maximum size: 5MB.
            </div>

            <img
              class="preview"
              alt="Proof preview"
            >

          </div>


          <div class="message form-message"></div>


          <button
            class="submit-btn"
            type="submit"
          >
            Submit Proof
          </button>

        </form>

        `
      }

    </div>

  `;

}


/* =====================================================
   PROOF FORM
   ===================================================== */

function setupProofForm(
  details,
  task
){

  const form =
    details.querySelector(
      ".proof-form"
    );


  if(!form){
    return;
  }


  const photo =
    form.querySelector(
      'input[name="proof_photo"]'
    );


  const preview =
    form.querySelector(
      ".preview"
    );


  photo.addEventListener(
    "change",
    () => {

      const file =
        photo.files[0];


      if(!file){

        preview.style.display =
          "none";

        return;

      }


      if(
        file.size >
        5 * 1024 * 1024
      ){

        showFormMessage(
          form,
          "Photo is larger than 5MB.",
          true
        );

        photo.value = "";

        preview.style.display =
          "none";

        return;

      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];


      if(
        !allowedTypes.includes(
          file.type
        )
      ){

        showFormMessage(
          form,
          "Only JPG, JPEG, PNG or WEBP images are allowed.",
          true
        );

        photo.value = "";

        preview.style.display =
          "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        event => {

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      await submitProof(
        form,
        task
      );

    }
  );

}


/* =====================================================
   SUBMIT PROOF
   ===================================================== */

async function submitProof(
  form,
  task
){

  const button =
    form.querySelector(
      ".submit-btn"
    );


  if(button.disabled){
    return;
  }


  try{

    button.disabled =
      true;

    button.textContent =
      "Checking...";


    if(
      isTaskExpired(task)
    ){

      throw new Error(
        "This task has expired and can no longer be submitted."
      );

    }


    const user =
      await getCurrentUser();


    if(!user){
      return;
    }


    const workerUsername =
      form
        .querySelector(
          '[name="worker_username"]'
        )
        .value
        .trim();


    const workerComment =
      form
        .querySelector(
          '[name="worker_comment"]'
        )
        .value
        .trim();


    const workerLink =
      form
        .querySelector(
          '[name="worker_link"]'
        )
        .value
        .trim();


    const photo =
      form
        .querySelector(
          '[name="proof_photo"]'
        )
        .files[0];


    if(!workerUsername){

      throw new Error(
        "Enter the username or account you used."
      );

    }


    if(!workerComment){

      throw new Error(
        "Enter your comment/report."
      );

    }


    if(workerLink){

      try{

        new URL(workerLink);

      }catch(error){

        throw new Error(
          "Please enter a valid Extra Proof Link."
        );

      }

    }


    if(!photo){

      throw new Error(
        "Photo proof is required."
      );

    }


    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];


    if(
      !allowedTypes.includes(
        photo.type
      )
    ){

      throw new Error(
        "Only JPG, JPEG, PNG or WEBP images are allowed."
      );

    }


    if(
      photo.size >
      5 * 1024 * 1024
    ){

      throw new Error(
        "Photo must be 5MB or smaller."
      );

    }


    /* ================================================
       DUPLICATE CHECK
       ================================================ */

    button.textContent =
      "Checking previous proof...";


    const {
      data:existing,
      error:existingError
    } = await db
      .from("task_submissions")
      .select("id,status")
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "task_id",
        task.id
      )
      .in(
        "status",
        [
          "PENDING",
          "APPROVED"
        ]
      )
      .limit(1);


    if(existingError){
      throw existingError;
    }


    if(
      existing &&
      existing.length > 0
    ){

      throw new Error(
        "You already submitted this task."
      );

    }


    /* ================================================
       PHOTO UPLOAD
       ================================================ */

    button.textContent =
      "Uploading photo...";


    const extension =
      getSafeExtension(photo);


    const filePath =
      `${user.id}/${task.id}/${Date.now()}.${extension}`;


    const {
      error:uploadError
    } = await db
      .storage
      .from("task proof")
      .upload(
        filePath,
        photo,
        {
          contentType:photo.type,
          upsert:false
        }
      );


    if(uploadError){

      throw new Error(
        "Photo upload failed: " +
        uploadError.message
      );

    }


    /* ================================================
       SAVE PROOF
       ================================================ */

    button.textContent =
      "Saving proof...";


    const proofData = {

      photo:{
        bucket:"task proof",
        path:filePath,
        name:photo.name,
        type:photo.type,
        size:photo.size
      },

      worker_username:
        workerUsername,

      worker_comment:
        workerComment,

      worker_link:
        workerLink,

      task_owner:
        task.uploader_username ||
        "",

      submitted_at:
        new Date().toISOString()

    };


    const {
      error:insertError
    } = await db
      .from("task_submissions")
      .insert({

        user_id:user.id,

        task_id:task.id,

        proof:
          JSON.stringify(
            proofData
          ),

        status:"PENDING"

      });


    if(insertError){

      await db
        .storage
        .from("task proof")
        .remove([
          filePath
        ]);


      throw new Error(
        "Proof submission failed: " +
        insertError.message
      );

    }


    showFormMessage(
      form,
      "Proof submitted successfully. It is now waiting for review.",
      false
    );


    form
      .querySelectorAll(
        "input, textarea, button"
      )
      .forEach(
        element => {
          element.disabled = true;
        }
      );


    button.textContent =
      "Proof Submitted";

  }
  catch(error){

    console.error(error);


    showFormMessage(
      form,
      error.message ||
      "Something went wrong.",
      true
    );


    button.disabled =
      false;


    button.textContent =
      "Submit Proof";

  }

}


/* =====================================================
   FILE EXTENSION
   ===================================================== */

function getSafeExtension(file){

  const name =
    file.name || "";


  const parts =
    name.split(".");


  if(parts.length < 2){
    return "jpg";
  }


  const ext =
    parts
      .pop()
      .toLowerCase();


  const allowed = [
    "jpg",
    "jpeg",
    "png",
    "webp"
  ];


  return allowed.includes(ext)
    ? ext
    : "jpg";

}


/* =====================================================
   FORM MESSAGE
   ===================================================== */

function showFormMessage(
  form,
  message,
  isError
){

  const box =
    form.querySelector(
      ".form-message"
    );


  box.textContent =
    message;


  box.className =
    "message form-message " +
    (
      isError
        ? "error"
        : "success"
    );


  box.style.display =
    "block";

}


/* =====================================================
   OPEN LINK
   ===================================================== */

function openTaskLink(link){

  if(!link){

    alert(
      "No link was provided for this task."
    );

    return;

  }


  let finalLink =
    String(link).trim();


  if(
    !finalLink.startsWith(
      "http://"
    ) &&
    !finalLink.startsWith(
      "https://"
    )
  ){

    finalLink =
      "https://" +
      finalLink;

  }


  /*
    Open the exact saved task URL.
  */

  window.location.href =
    finalLink;

}


/* =====================================================
   COPY SYSTEM
   ===================================================== */

async function copyValue(text){

  /*
    Modern clipboard
  */

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return true;

  }


  /*
    Android/browser fallback
  */

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  textarea.style.top =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();

  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  const success =
    document.execCommand(
      "copy"
    );


  textarea.remove();


  if(!success){

    throw new Error(
      "Copy was blocked by the browser."
    );

  }


  return true;

}


async function copyTaskLink(
  button,
  text
){

  const section =
    button.closest(
      ".section"
    );


  const status =
    section.querySelector(
      ".copy-status"
    );


  try{

    await copyValue(text);


    status.textContent =
      "Link copied successfully.";

    status.classList.add(
      "show"
    );


    setTimeout(
      () => {
        status.classList.remove(
          "show"
        );
      },
      2500
    );

  }
  catch(error){

    status.textContent =
      "Copy failed. Press and hold the link to copy it.";

    status.classList.add(
      "show"
    );

  }

}


async function copyTaskText(
  button,
  text
){

  const section =
    button.closest(
      ".section"
    );


  const status =
    section.querySelector(
      ".copy-status"
    );


  try{

    await copyValue(text);


    status.textContent =
      "Text copied successfully.";

    status.classList.add(
      "show"
    );


    setTimeout(
      () => {
        status.classList.remove(
          "show"
        );
      },
      2500
    );

  }
  catch(error){

    status.textContent =
      "Copy failed. Press and hold the text to copy it.";

    status.classList.add(
      "show"
    );

  }

}
