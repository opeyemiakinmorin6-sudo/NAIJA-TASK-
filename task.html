<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #17251b;
  padding-bottom: 75px;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 22px 16px 25px;
}

.header-inner {
  max-width: 720px;
  margin: auto;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 13px;
  display: inline-block;
  margin-bottom: 20px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 13px;
  opacity: .9;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 18px 14px;
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
}

.title-row h2 {
  font-size: 18px;
  margin: 0;
}

.task-count {
  background: #e8f8ed;
  color: #0b8f3c;
  padding: 6px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}

.task-card {
  background: white;
  border: 1px solid #e3eee6;
  border-radius: 16px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.task-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.task-icon {
  width: 45px;
  height: 45px;
  min-width: 45px;
  border-radius: 12px;
  background: #e9f8ee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.task-title {
  font-size: 16px;
  font-weight: 800;
  margin: 2px 0 5px;
}

.task-description {
  color: #718078;
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
}

.reward-box {
  background: #f1fbf4;
  border-radius: 11px;
  padding: 11px;
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reward-label {
  color: #718078;
  font-size: 11px;
}

.reward {
  color: #0b8f3c;
  font-size: 17px;
  font-weight: 800;
}

.details {
  margin-top: 12px;
  font-size: 11px;
  color: #657268;
  line-height: 1.7;
}

.complete-btn {
  width: 100%;
  margin-top: 13px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.message {
  background: white;
  border-radius: 15px;
  padding: 30px 18px;
  text-align: center;
  color: #718078;
  font-size: 13px;
  line-height: 1.6;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #e3eae5;
  z-index: 20;
}

.bottom-inner {
  max-width: 720px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.bottom-nav a {
  text-decoration: none;
  color: #758079;
  text-align: center;
  padding: 9px 2px 8px;
  font-size: 10px;
}

.bottom-nav a span {
  display: block;
  font-size: 19px;
  margin-bottom: 3px;
}

.bottom-nav a.active {
  color: #0b8f3c;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>Available Tasks</h1>
    <p>Complete tasks and earn Naira.</p>

  </div>
</header>

<div class="container">

  <div class="title-row">
    <h2>Tasks for you</h2>
    <div class="task-count" id="taskCount">0 tasks</div>
  </div>

  <div id="tasks">
    <div class="message">
      Loading available tasks...
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="bottom-inner">

    <a href="dashboard.html">
      <span>🏠</span>
      Home
    </a>

    <a href="task.html" class="active">
      <span>📋</span>
      Tasks
    </a>

    <a href="wallet.html">
      <span>💰</span>
      Wallet
    </a>

    <a href="profile.html">
      <span>👤</span>
      Profile
    </a>

  </div>
</nav>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Enter your CURRENT SUPABASE PUBLISHABLE KEY here.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadTasks() {

  const tasksBox =
    document.getElementById("tasks");

  try {

    const {
      data: { user },
      error: userError
    } = await db.auth.getUser();

    if (userError || !user) {
      window.location.href = "index.html";
      return;
    }


    const {
      data,
      error
    } = await db
      .from("tasks")
      .select(
        "id, title, description, reward, slots, expiry_date, requirements, proof_type, proof_required, max_completions"
      )
      .eq("active", true)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      tasksBox.innerHTML =
        '<div class="message">' +
        'Unable to load tasks.<br><br>' +
        'Please try again later.' +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      document.getElementById(
        "taskCount"
      ).textContent = "0 tasks";

      tasksBox.innerHTML =
        '<div class="message">' +
        'No tasks are available right now.' +
        '<br><br>' +
        'Please check again later.' +
        '</div>';

      return;
    }


    document.getElementById(
      "taskCount"
    ).textContent =
      data.length +
      (data.length === 1 ? " task" : " tasks");


    tasksBox.innerHTML = "";


    data.forEach(task => {

      const card =
        document.createElement("div");

      card.className = "task-card";


      const top =
        document.createElement("div");

      top.className = "task-top";


      const icon =
        document.createElement("div");

      icon.className = "task-icon";
      icon.textContent = "📋";


      const info =
        document.createElement("div");


      const title =
        document.createElement("div");

      title.className = "task-title";
      title.textContent =
        task.title || "Task";


      const description =
        document.createElement("p");

      description.className =
        "task-description";

      description.textContent =
        task.description ||
        "Complete this task according to the instructions.";


      info.appendChild(title);
      info.appendChild(description);

      top.appendChild(icon);
      top.appendChild(info);


      const rewardBox =
        document.createElement("div");

      rewardBox.className =
        "reward-box";


      const rewardLabel =
        document.createElement("span");

      rewardLabel.className =
        "reward-label";

      rewardLabel.textContent =
        "TASK REWARD";


      const reward =
        document.createElement("span");

      reward.className =
        "reward";

      reward.textContent =
        "₦" +
        Number(
          task.reward || 0
        ).toLocaleString("en-NG");


      rewardBox.appendChild(rewardLabel);
      rewardBox.appendChild(reward);


      const details =
        document.createElement("div");

      details.className = "details";

      let proofText =
        task.proof_required
          ? (task.proof_type || "Text")
          : "Not required";

      details.textContent =
        "Proof: " + proofText;

      if (task.requirements) {

        details.textContent +=
          "\nRequirements: " +
          task.requirements;
      }


      const button =
        document.createElement("button");

      button.className =
        "complete-btn";

      button.textContent =
        "Complete Task";

      button.onclick =
        function() {
          startTask(task.id);
        };


      card.appendChild(top);
      card.appendChild(rewardBox);
      card.appendChild(details);
      card.appendChild(button);

      tasksBox.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    tasksBox.innerHTML =
      '<div class="message">' +
      'Something went wrong while loading tasks.' +
      '</div>';
  }
}


async function startTask(taskId) {

  const {
    data: task,
    error
  } = await db
    .from("tasks")
    .select(
      "id, title, description, reward, proof_type, proof_required"
    )
    .eq("id", taskId)
    .single();


  if (error || !task) {

    alert(
      "Unable to load this task."
    );

    return;
  }


  let proof = "";


  if (task.proof_required) {

    proof = prompt(
      "Complete the task first, then enter your proof.\n\nProof type: " +
      (task.proof_type || "Text")
    );


    if (proof === null) {
      return;
    }


    proof = proof.trim();


    if (!proof) {

      alert("Proof is required.");

      return;
    }

  } else {

    proof = prompt(
      "Complete the task first.\n\nAdd your proof or note:"
    );


    if (proof === null) {
      return;
    }

    proof = proof.trim();
  }


  const {
    data: { user }
  } = await db.auth.getUser();


  if (!user) {

    window.location.href =
      "index.html";

    return;
  }


  const {
    error: submissionError
  } = await db
    .from("task_submissions")
    .insert({
      user_id: user.id,
      task_id: task.id,
      proof: proof,
      status: "PENDING"
    });


  if (submissionError) {

    console.error(submissionError);

    alert(
      "Submission failed: " +
      submissionError.message
    );

    return;
  }


  alert(
    "Task submitted successfully. Your proof is now pending review."
  );
}


loadTasks();

</script>

</body>
  </html>
