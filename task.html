<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f36">

<title>Available Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --green:#087f36;
  --green2:#0b9b45;
  --dark:#064d25;
  --lime:#b7ef43;
  --bg:#f3f8f5;
  --text:#17231b;
  --muted:#647067;
  --border:#dce8df;
  --red:#c62828;
  --orange:#a65f00;
  --blue:#1267a8;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:linear-gradient(120deg,var(--dark),var(--green2));
  color:#fff;
  box-shadow:0 3px 14px #0002;
}

.header-inner{
  max-width:760px;
  margin:auto;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{font-size:21px;font-weight:900;letter-spacing:.3px}
.subtitle{font-size:12px;margin-top:4px;opacity:.9}

.back-btn{
  border:1px solid #ffffff55;
  background:#ffffff18;
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-weight:800;
}

.container{
  max-width:760px;
  margin:auto;
  padding:15px 12px 45px;
}

.hero{
  background:linear-gradient(135deg,#fff,#eff9f1);
  border:1px solid var(--border);
  border-radius:18px;
  padding:19px;
  margin-bottom:16px;
  box-shadow:0 5px 18px #164d2510;
}

.hero h1{font-size:23px;font-weight:900}
.hero p{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.6}

.notice{
  margin-top:13px;
  padding:11px;
  border-radius:11px;
  background:#e5f6e9;
  color:var(--dark);
  font-size:12px;
  font-weight:800;
  line-height:1.5;
}

.loading,.empty,.error{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:27px 15px;
  text-align:center;
  line-height:1.6;
}

.error{color:var(--red)}

.task-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 5px 18px #164d2510;
}

.task-head{padding:15px;border-bottom:1px solid #edf2ee}

.platform-row{display:flex;align-items:center;gap:11px}

.platform-icon,.platform-fallback{
  width:44px;height:44px;flex:0 0 44px;
  border-radius:12px;
}

.platform-icon{
  object-fit:contain;
  padding:7px;
  background:#f1f6f2;
}

.platform-fallback{
  display:flex;align-items:center;justify-content:center;
  background:var(--green);color:#fff;font-weight:900;
}

.platform-name{
  color:var(--muted);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;
}

.task-title{margin-top:4px;font-size:18px;font-weight:900;line-height:1.35}

.task-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.meta-box{background:#f6faf7;border-radius:10px;padding:10px}
.meta-label{color:#758079;font-size:10px;font-weight:800;text-transform:uppercase}
.meta-value{margin-top:4px;font-size:14px;font-weight:900}
.reward,.remaining{color:var(--dark)}
.remaining.low{color:var(--orange)}
.remaining.none{color:var(--red)}

.task-body{padding:15px}
.section{margin-bottom:17px}
.section:last-child{margin-bottom:0}
.section-title{margin-bottom:8px;font-size:14px;font-weight:900}

.description{
  color:#4e5b53;font-size:14px;line-height:1.65;
  white-space:pre-wrap;overflow-wrap:anywhere;
}

.owner{
  display:inline-block;background:#e8f7ec;color:var(--dark);
  border-radius:9px;padding:7px 10px;font-size:13px;font-weight:800;
}

.link-box,.copy-box{
  background:#f7faf8;border:1px solid #dfeae2;
  border-radius:12px;padding:12px;
}

.task-link{
  display:block;color:var(--blue);font-size:13px;
  line-height:1.5;overflow-wrap:anywhere;margin-bottom:10px;
}

.copy-text{
  color:#35433a;font-size:13px;line-height:1.6;
  white-space:pre-wrap;overflow-wrap:anywhere;
}

.action-row{display:flex;flex-wrap:wrap;gap:8px}

.action-btn{
  border:0;border-radius:9px;padding:10px 12px;
  font-size:13px;font-weight:900;
}

.open-btn{background:var(--blue);color:#fff}
.copy-btn{background:#e8f6ec;color:var(--dark)}
.copy-btn.copied{background:var(--green);color:#fff}

.start-btn,.submit-btn{
  width:100%;border:0;border-radius:12px;padding:14px;
  background:var(--green);color:#fff;font-size:15px;font-weight:900;
}

.start-btn:active,.submit-btn:active{transform:scale(.99)}
.submit-btn:disabled{opacity:.65;cursor:wait}

.status-box{
  border-radius:12px;padding:12px;
  font-size:13px;line-height:1.5;font-weight:800;
}
.status-success{background:#eaf8ee;color:var(--dark)}
.status-warning{background:#fff7e8;color:var(--orange)}
.status-error{background:#fff0ef;color:var(--red)}

.field{margin-bottom:14px}
.field-label{display:block;margin-bottom:6px;font-size:13px;font-weight:900}

input[type=text],input[type=url],textarea{
  width:100%;border:1px solid #cbd9cf;border-radius:10px;
  padding:12px;outline:none;background:#fff;color:var(--text);
}

textarea{min-height:95px;resize:vertical}

input:focus,textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px #0b8f3c14;
}

.photo-upload{
  position:relative;min-height:145px;border:2px dashed var(--green);
  border-radius:15px;background:#effbf2;display:flex;
  align-items:center;justify-content:center;text-align:center;overflow:hidden;
}

.photo-upload input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;z-index:5;cursor:pointer;
}

.upload-content{padding:17px;pointer-events:none}
.upload-icon{font-size:36px}
.upload-title{margin-top:7px;color:var(--dark);font-size:15px;font-weight:900}
.upload-subtitle{margin-top:5px;color:#65736b;font-size:11px;line-height:1.5}

.photo-preview{
  display:none;width:100%;max-height:300px;object-fit:contain;
  margin-top:10px;border-radius:12px;background:#f2f2f2;
}

.photo-selected{border-style:solid}
.photo-selected .upload-content{display:none}

.message{
  display:none;margin-top:10px;padding:11px;border-radius:10px;
  font-size:13px;line-height:1.5;
}
.message.success{display:block;background:#eaf8ee;color:var(--dark)}
.message.error{display:block;background:#fff0ef;color:var(--red)}

.hidden{display:none!important}

@media(max-width:430px){
  .task-meta{grid-template-columns:1fr 1fr}
  .task-title{font-size:17px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div>
      <div class="brand">NAIJA TASK</div>
      <div class="subtitle">Complete Tasks. Earn Naira.</div>
    </div>
    <button class="back-btn" type="button" onclick="goBack()">Back</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>Available Tasks</h1>
    <p>Choose a task, follow the poster's instructions, and submit clear evidence for review.</p>
    <div class="notice">📷 Photo proof is required for every task. Rewards are subject to review and approval.</div>
  </section>

  <div id="tasksArea" class="loading" role="status" aria-live="polite">
    Loading available tasks...
  </div>
</main>

<script>
"use strict";

/* Keep your existing Supabase project URL and use its current publishable key. */
const SUPABASE_URL = "https://jwakveeiynpakunwjzkj.supabase.co";
const SUPABASE_KEY = "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const TASK_PROOF_BUCKET = "task-proofs";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tasksArea = document.getElementById("tasksArea");

let currentUser = null;
let loadedTasks = [];
let completionCounts = {};
let userTaskStates = {};
let settings = {};

const platformIcons = {
  TikTok:"https://cdn.simpleicons.org/tiktok",
  YouTube:"https://cdn.simpleicons.org/youtube",
  Instagram:"https://cdn.simpleicons.org/instagram",
  Facebook:"https://cdn.simpleicons.org/facebook",
  X:"https://cdn.simpleicons.org/x",
  Twitter:"https://cdn.simpleicons.org/x",
  Telegram:"https://cdn.simpleicons.org/telegram",
  WhatsApp:"https://cdn.simpleicons.org/whatsapp",
  LinkedIn:"https://cdn.simpleicons.org/linkedin",
  Snapchat:"https://cdn.simpleicons.org/snapchat",
  Discord:"https://cdn.simpleicons.org/discord",
  Spotify:"https://cdn.simpleicons.org/spotify",
  Audiomack:"https://cdn.simpleicons.org/audiomack",
  Google:"https://cdn.simpleicons.org/google"
};

function goBack(){
  if(history.length > 1) history.back();
  else location.href = "dashboard.html";
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeUrl(value){
  if(!value) return "";
  let url = String(value).trim();
  if(!url) return "";

  if(!/^https?:\/\//i.test(url)) url = "https://" + url;

  try{
    const parsed = new URL(url);
    if(!["http:","https:"].includes(parsed.protocol)) return "";
    return parsed.href;
  }catch(e){
    return "";
  }
}

function expired(task){
  if(!task.expiry_date) return false;
  const time = new Date(task.expiry_date).getTime();
  return Number.isFinite(time) && time <= Date.now();
}

function capacity(task){
  const value = task.max_total_completions ?? task.max_completions ?? task.slots ?? 0;
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function remaining(task){
  const limit = capacity(task);
  if(!limit) return 0;
  return Math.max(0, limit - Number(completionCounts[task.id] || 0));
}

function userState(task){
  return userTaskStates[task.id] || "";
}

function platformHTML(type){
  const name = type || "Task";
  const icon = platformIcons[name];

  if(!icon) return `<div class="platform-fallback">NT</div>`;

  return `
    <img class="platform-icon"
      src="${icon}" alt="${escapeHTML(name)}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="platform-fallback" style="display:none">NT</div>
  `;
}

/*
  Requirements may be stored as text or JSON.
  Unknown formats fall back to the existing username/comment fields,
  avoiding accidental removal of evidence the admin may expect.
*/
function getRequirements(task){
  const raw = task.requirements ?? task.required_proof ?? "";
  let parsed = raw;

  if(typeof raw === "string"){
    try{ parsed = JSON.parse(raw); }
    catch(e){ parsed = raw; }
  }

  let text = "";

  if(typeof parsed === "string") text = parsed;
  else if(Array.isArray(parsed)) text = parsed.join(" ");
  else if(parsed && typeof parsed === "object") text = JSON.stringify(parsed);

  const lower = text.toLowerCase();

  const explicitObject = parsed && typeof parsed === "object" && !Array.isArray(parsed)
    ? parsed : {};

  const hasUsernameFlag =
    typeof explicitObject.username_required === "boolean" ||
    typeof explicitObject.require_username === "boolean";

  const hasCommentFlag =
    typeof explicitObject.comment_required === "boolean" ||
    typeof explicitObject.require_comment === "boolean";

  const usernameRequired = hasUsernameFlag
    ? Boolean(explicitObject.username_required ?? explicitObject.require_username)
    : (!text || /username|account name|profile name/.test(lower));

  const commentRequired = hasCommentFlag
    ? Boolean(explicitObject.comment_required ?? explicitObject.require_comment)
    : (!text || /comment|report|explain|description of work/.test(lower));

  return {
    usernameRequired,
    commentRequired
  };
}

function linkHTML(task,index){
  const url = normalizeUrl(task.task_link || task.post_link || "");

  if(!url){
    return `<div class="link-box"><div class="description">No external task link was provided.</div></div>`;
  }

  return `
    <div class="link-box">
      <a class="task-link" href="${escapeHTML(url)}"
        target="_blank" rel="noopener noreferrer">${escapeHTML(url)}</a>
      <div class="action-row">
        <button class="action-btn open-btn" type="button" onclick="openTask(${index})">Open Task</button>
        <button class="action-btn copy-btn" id="copy-link-${index}" type="button" onclick="copyLink(${index})">Copy Link</button>
      </div>
    </div>
  `;
}

function copyTextHTML(task,index){
  if(!task.copy_text) return "";

  return `
    <div class="section">
      <div class="section-title">Text to Copy</div>
      <div class="copy-box">
        <div class="copy-text">${escapeHTML(task.copy_text)}</div>
        <div class="action-row" style="margin-top:9px">
          <button class="action-btn copy-btn" id="copy-text-${index}" type="button" onclick="copyTaskText(${index})">Copy Text</button>
        </div>
      </div>
    </div>
  `;
}

function statusHTML(task,index){
  const state = userState(task);
  const left = remaining(task);

  if(expired(task)){
    return `<div class="status-box status-error">This task has expired.</div>`;
  }

  if(left <= 0){
    return `<div class="status-box status-warning">This task is full or has no configured slots.</div>`;
  }

  if(state === "APPROVED"){
    return `<div class="status-box status-success">✓ Your task completion has been recorded.</div>`;
  }

  if(state === "PENDING"){
    return `<div class="status-box status-warning">⏳ Your proof is already under review. Please do not submit it again.</div>`;
  }

  if(state === "REJECTED"){
    return `
      <div class="status-box status-error">Your previous proof was rejected. Check the poster's instructions and submit corrected proof.</div>
      <button class="start-btn" style="margin-top:10px" type="button" onclick="showProof(${index})">Submit Corrected Proof</button>
      ${proofForm(task,index)}
    `;
  }

  return `
    <button class="start-btn" type="button" onclick="showProof(${index})">Start Task &amp; Submit Proof</button>
    ${proofForm(task,index)}
  `;
}

function proofForm(task,index){
  const req = getRequirements(task);

  return `
    <div id="proof-${index}" class="hidden" style="margin-top:14px">
      <div class="section-title">Submit Your Proof</div>
      <div class="description" style="margin-bottom:13px">
        Complete the task first. Upload a clear photo or screenshot showing your work.
      </div>

      <form onsubmit="submitProof(event,${index})">
        ${req.usernameRequired ? `
          <div class="field">
            <label class="field-label" for="username-${index}">Username / Account Used *</label>
            <input type="text" id="username-${index}" maxlength="120"
              placeholder="Enter the account you used" required>
          </div>` : ""}

        ${req.commentRequired ? `
          <div class="field">
            <label class="field-label" for="comment-${index}">Comment / Report *</label>
            <textarea id="comment-${index}" maxlength="3000"
              placeholder="Explain what you completed..." required></textarea>
          </div>` : ""}

        <div class="field">
          <label class="field-label" for="proof-link-${index}">Extra Proof Link (optional)</label>
          <input type="url" id="proof-link-${index}" maxlength="1000"
            placeholder="https://...">
        </div>

        <div class="field">
          <label class="field-label" for="photo-${index}">Photo Proof *</label>
          <div class="photo-upload" id="upload-${index}">
            <input type="file" id="photo-${index}"
              accept="image/jpeg,image/png,image/webp"
              required onchange="selectPhoto(event,${index})">
            <div class="upload-content">
              <div class="upload-icon">📷</div>
              <div class="upload-title">TAP TO UPLOAD PHOTO</div>
              <div class="upload-subtitle">JPG, PNG or WEBP · Maximum 5MB</div>
            </div>
          </div>
          <img id="preview-${index}" class="photo-preview" alt="Selected proof preview">
        </div>

        <button class="submit-btn" id="submit-${index}" type="submit">Submit Proof</button>
        <div id="message-${index}" class="message" role="status" aria-live="polite"></div>
      </form>
    </div>
  `;
}

function taskCard(task,index){
  const left = remaining(task);
  const state = userState(task);
  const taskName = task.task_type || "General Task";

  const status = expired(task) ? "EXPIRED"
    : left <= 0 ? "FULL"
    : state === "APPROVED" ? "COMPLETED"
    : state === "PENDING" ? "UNDER REVIEW"
    : "LIVE";

  return `
    <article class="task-card">
      <div class="task-head">
        <div class="platform-row">
          ${platformHTML(taskName)}
          <div>
            <div class="platform-name">${escapeHTML(taskName)}</div>
            <div class="task-title">${escapeHTML(task.title || "Untitled Task")}</div>
          </div>
        </div>

        <div class="task-meta">
          <div class="meta-box">
            <div class="meta-label">Advertised Reward</div>
            <div class="meta-value reward">₦${Number(task.reward || 0).toLocaleString("en-NG")}</div>
          </div>
          <div class="meta-box">
            <div class="meta-label">Remaining Slots</div>
            <div class="meta-value remaining ${left <= 0 ? "none" : left <= 5 ? "low" : ""}">${left.toLocaleString("en-NG")}</div>
          </div>
          <div class="meta-box">
            <div class="meta-label">Total Slots</div>
            <div class="meta-value">${capacity(task).toLocaleString("en-NG")}</div>
          </div>
          <div class="meta-box">
            <div class="meta-label">Status</div>
            <div class="meta-value">${status}</div>
          </div>
        </div>
      </div>

      <div class="task-body">
        <div class="section">
          <div class="section-title">Task Instructions</div>
          <div class="description">${escapeHTML(task.description || "Follow any additional instructions provided by the poster.")}</div>
        </div>

        <div class="section">
          <div class="section-title">Task Poster</div>
          <span class="owner">${escapeHTML(task.uploader_username || "NAIJA TASK Poster")}</span>
        </div>

        <div class="section">
          <div class="section-title">Task Link</div>
          ${linkHTML(task,index)}
        </div>

        ${copyTextHTML(task,index)}
        <div class="section">${statusHTML(task,index)}</div>
      </div>
    </article>
  `;
}

async function loadSettings(){
  const {data,error} = await db
    .from("platform_settings")
    .select("maintenance_mode,job_posting_enabled,task_approval_required,photo_proof_enabled")
    .limit(1)
    .maybeSingle();

  if(error){
    console.warn("Platform settings could not be read:",error.message);
    return;
  }

  settings = data || {};

  if(settings.maintenance_mode === true){
    tasksArea.className = "status-box status-warning";
    tasksArea.textContent = "NAIJA TASK is temporarily under maintenance. Please try again later.";
    return false;
  }

  if(settings.job_posting_enabled === false){
    tasksArea.className = "empty";
    tasksArea.textContent = "Task availability is temporarily disabled by the platform administrator.";
    return false;
  }

  if(settings.photo_proof_enabled === false){
    tasksArea.className = "status-box status-warning";
    tasksArea.textContent = "Task submissions are temporarily unavailable because proof uploads are disabled.";
    return false;
  }

  return true;
}

async function loadTasks(){
  tasksArea.className = "loading";
  tasksArea.textContent = "Loading available tasks...";

  completionCounts = {};
  userTaskStates = {};

  const allowed = await loadSettings();
  if(allowed === false) return;

  const {data,error} = await db
    .from("tasks")
    .select(`
      id,title,description,reward,slots,
      max_total_completions,max_completions,
      max_completions_per_user,expiry_date,
      requirements,required_proof,proof_type,proof_required,
      active,status,task_type,task_link,uploader_username,
      copy_text,post_link,upload_required,created_at
    `)
    .eq("active",true)
    .eq("status","LIVE")
    .order("created_at",{ascending:false});

  if(error){
    console.error("Task query failed:",error);
    tasksArea.className = "error";
    tasksArea.textContent = "Unable to load tasks. Database response: " + error.message;
    return;
  }

  loadedTasks = (data || []).filter(task => !expired(task));

  if(!loadedTasks.length){
    tasksArea.className = "empty";
    tasksArea.textContent = "No live tasks are available right now. Please check again later.";
    return;
  }

  const ids = loadedTasks.map(task => task.id);

  /*
    Read completion records. If the table stores statuses, count approved
    completions only. If no status column exists, report the query error
    rather than silently displaying incorrect slot counts.
  */
  const {data:completions,error:completionError} = await db
    .from("task_completions")
    .select("task_id,user_id,status")
    .in("task_id",ids);

  if(completionError){
    console.error("Completion query failed:",completionError);
    tasksArea.className = "error";
    tasksArea.textContent = "Could not verify task slots. Please try again later.";
    return;
  }

  const completedUsers = new Set();

  (completions || []).forEach(row => {
    const status = String(row.status || "").toUpperCase();
    const isCompleted = !status || ["APPROVED","COMPLETED","SUCCESS"].includes(status);

    if(isCompleted){
      const key = `${row.task_id}:${row.user_id}`;
      if(!completedUsers.has(key)){
        completedUsers.add(key);
        completionCounts[row.task_id] = (completionCounts[row.task_id] || 0) + 1;
      }

      if(row.user_id === currentUser.id){
        userTaskStates[row.task_id] = "APPROVED";
      }
    }
  });

  const {data:subs,error:subError} = await db
    .from("task_submissions")
    .select("task_id,status,created_at")
    .eq("user_id",currentUser.id)
    .in("task_id",ids)
    .order("created_at",{ascending:false});

  if(subError){
    console.error("Submission query failed:",subError);
    tasksArea.className = "error";
    tasksArea.textContent = "Could not verify your previous submissions. Please try again later.";
    return;
  }

  /*
    Preserve approved states. A newer pending submission takes precedence
    over an older rejected submission.
  */
  (subs || []).forEach(row => {
    if(userTaskStates[row.task_id] === "APPROVED") return;

    const status = String(row.status || "").toUpperCase();

    if(status === "PENDING"){
      userTaskStates[row.task_id] = "PENDING";
    }else if(status === "REJECTED" && !userTaskStates[row.task_id]){
      userTaskStates[row.task_id] = "REJECTED";
    }else if(status === "APPROVED"){
      userTaskStates[row.task_id] = "APPROVED";
    }
  });

  /*
    Pending proofs reserve a slot in this page's display. This is a
    display safeguard, not a replacement for database-side slot locking.
  */
  const pendingTaskIds = new Set(
    (subs || [])
      .filter(row => String(row.status || "").toUpperCase() === "PENDING")
      .map(row => row.task_id)
  );

  pendingTaskIds.forEach(id => {
    if(!completedUsers.has(`${id}:${currentUser.id}`)){
      completionCounts[id] = (completionCounts[id] || 0) + 1;
    }
  });

  tasksArea.className = "";
  tasksArea.innerHTML = loadedTasks.map((task,index) => taskCard(task,index)).join("");
}

function showProof(index){
  const task = loadedTasks[index];
  if(!task) return;

  if(expired(task)){
    alert("This task has expired.");
    return;
  }

  if(remaining(task) <= 0){
    alert("This task is full or has no available slots.");
    return;
  }

  const state = userState(task);
  if(state === "APPROVED" || state === "PENDING") return;

  const box = document.getElementById(`proof-${index}`);
  if(!box) return;

  box.classList.remove("hidden");
  box.scrollIntoView({behavior:"smooth",block:"start"});

  trackStart(task);
}

async function trackStart(task){
  try{
    const {error} = await db.from("task_activity").insert({
      task_id:task.id,
      user_id:currentUser.id,
      activity_type:"STARTED"
    });

    if(error) console.warn("Task activity was not recorded:",error.message);
  }catch(error){
    console.warn("Task activity tracking failed:",error);
  }
}

function selectPhoto(event,index){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  const allowedTypes = ["image/jpeg","image/png","image/webp"];

  if(!allowedTypes.includes(file.type)){
    event.target.value = "";
    alert("Choose a JPG, PNG or WEBP image.");
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    event.target.value = "";
    alert("Your photo must be 5MB or smaller.");
    return;
  }

  const preview = document.getElementById(`preview-${index}`);
  const box = document.getElementById(`upload-${index}`);

  if(preview.dataset.objectUrl){
    URL.revokeObjectURL(preview.dataset.objectUrl);
  }

  const objectUrl = URL.createObjectURL(file);
  preview.dataset.objectUrl = objectUrl;
  preview.src = objectUrl;
  preview.style.display = "block";
  box.classList.add("photo-selected");
}

function showMessage(index,type,message){
  const box = document.getElementById(`message-${index}`);
  if(!box) return;

  box.className = `message ${type}`;
  box.textContent = message;
}

async function submitProof(event,index){
  event.preventDefault();

  const task = loadedTasks[index];
  if(!task || !currentUser) return;

  const button = document.getElementById(`submit-${index}`);
  if(button.disabled) return;

  if(expired(task)){
    showMessage(index,"error","This task has expired.");
    return;
  }

  if(userState(task) === "APPROVED" || userState(task) === "PENDING"){
    showMessage(index,"error","You already completed this task or have a submission under review.");
    return;
  }

  const req = getRequirements(task);
  const usernameEl = document.getElementById(`username-${index}`);
  const commentEl = document.getElementById(`comment-${index}`);
  const linkEl = document.getElementById(`proof-link-${index}`);
  const fileInput = document.getElementById(`photo-${index}`);

  const username = usernameEl ? usernameEl.value.trim() : "";
  const comment = commentEl ? commentEl.value.trim() : "";
  const proofLink = linkEl ? linkEl.value.trim() : "";
  const file = fileInput && fileInput.files ? fileInput.files[0] : null;

  if(req.usernameRequired && !username){
    showMessage(index,"error","Enter the username or account used.");
    return;
  }

  if(req.commentRequired && !comment){
    showMessage(index,"error","Enter your task report.");
    return;
  }

  if(proofLink && !normalizeUrl(proofLink)){
    showMessage(index,"error","Enter a valid HTTP or HTTPS proof link.");
    return;
  }

  if(!file){
    showMessage(index,"error","Photo proof is required.");
    return;
  }

  if(!["image/jpeg","image/png","image/webp"].includes(file.type) ||
     file.size > 5 * 1024 * 1024){
    showMessage(index,"error","Choose a JPG, PNG or WEBP image up to 5MB.");
    return;
  }

  button.disabled = true;
  button.textContent = "Checking submission...";

  let uploadedPath = null;

  try{
    /*
      These checks improve the user experience, but they cannot prevent
      simultaneous requests from multiple devices. Enforce uniqueness and
      slot limits in the database/RPC as well.
    */
    const {data:existingCompletions,error:checkCompletionError} = await db
      .from("task_completions")
      .select("id")
      .eq("task_id",task.id)
      .eq("user_id",currentUser.id)
      .limit(1);

    if(checkCompletionError) throw checkCompletionError;

    if(existingCompletions && existingCompletions.length){
      throw new Error("You have already completed this task.");
    }

    const {data:existingSubs,error:checkSubError} = await db
      .from("task_submissions")
      .select("id,status")
      .eq("task_id",task.id)
      .eq("user_id",currentUser.id)
      .in("status",["PENDING","APPROVED"])
      .limit(1);

    if(checkSubError) throw checkSubError;

    if(existingSubs && existingSubs.length){
      throw new Error("You already have a pending or approved submission for this task.");
    }

    button.textContent = "Uploading photo...";

    const extension = file.type === "image/png" ? "png"
      : file.type === "image/webp" ? "webp" : "jpg";

    uploadedPath = `${currentUser.id}/${task.id}/${crypto.randomUUID()}.${extension}`;

    const {error:uploadError} = await db.storage
      .from(TASK_PROOF_BUCKET)
      .upload(uploadedPath,file,{
        contentType:file.type,
        upsert:false
      });

    if(uploadError) throw uploadError;

    button.textContent = "Saving submission...";

    /*
      Keep the existing proof object structure so the admin can continue
      reading photo.bucket, photo.path, worker_username and worker_comment.
    */
    const proof = {
      photo:{
        bucket:TASK_PROOF_BUCKET,
        path:uploadedPath,
        name:file.name,
        type:file.type,
        size:file.size
      },
      worker_username:username || null,
      worker_comment:comment || null,
      worker_link:proofLink ? normalizeUrl(proofLink) : null,
      submitted_at:new Date().toISOString()
    };

    const {error:insertError} = await db
      .from("task_submissions")
      .insert({
        user_id:currentUser.id,
        task_id:task.id,
        proof:JSON.stringify(proof),
        status:"PENDING"
      });

    if(insertError) throw insertError;

    userTaskStates[task.id] = "PENDING";

    showMessage(index,"success","Proof submitted successfully. Your submission is now awaiting admin review.");

    button.textContent = "Proof Submitted ✓";

    event.target.querySelectorAll("input,textarea,button").forEach(el => {
      el.disabled = true;
    });

    /*
      Refresh list state after a successful insert.
      Do not remove uploaded proof after the submission has been saved.
    */
    uploadedPath = null;
    await loadTasks();

  }catch(error){
    console.error("Proof submission failed:",error);

    if(uploadedPath){
      try{
        const {error:cleanupError} = await db.storage
          .from(TASK_PROOF_BUCKET)
          .remove([uploadedPath]);

        if(cleanupError) console.warn("Uploaded file cleanup failed:",cleanupError.message);
      }catch(cleanupError){
        console.warn("Uploaded file cleanup failed:",cleanupError);
      }
    }

    button.disabled = false;
    button.textContent = "Submit Proof";

    showMessage(index,"error",error && error.message
      ? error.message
      : "Could not submit proof. Please try again.");
  }
}

function openTask(index){
  const task = loadedTasks[index];
  if(!task) return;

  const url = normalizeUrl(task.task_link || task.post_link || "");
  if(!url){
    alert("This task has no valid external link.");
    return;
  }

  window.open(url,"_blank","noopener,noreferrer");
}

async function copyReliable(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}

  try{
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly","");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();

    const result = document.execCommand("copy");
    area.remove();
    return result;
  }catch(e){
    return false;
  }
}

async function copyLink(index){
  const task = loadedTasks[index];
  const url = normalizeUrl(task && (task.task_link || task.post_link));
  if(!url) return;

  const ok = await copyReliable(url);
  const btn = document.getElementById(`copy-link-${index}`);

  if(ok && btn){
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => {
      if(btn.isConnected){
        btn.textContent = "Copy Link";
        btn.classList.remove("copied");
      }
    },1500);
  }else{
    alert("Copy was blocked. Long-press the link to copy it.");
  }
}

async function copyTaskText(index){
  const task = loadedTasks[index];
  if(!task || !task.copy_text) return;

  const ok = await copyReliable(task.copy_text);
  const btn = document.getElementById(`copy-text-${index}`);

  if(ok && btn){
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => {
      if(btn.isConnected){
        btn.textContent = "Copy Text";
        btn.classList.remove("copied");
      }
    },1500);
  }else{
    alert("Copy was blocked. Select the text manually.");
  }
}

async function startPage(){
  if(!window.supabase){
    tasksArea.className = "error";
    tasksArea.textContent = "The Supabase library could not load. Check your internet connection and refresh.";
    return;
  }

  if(!SUPABASE_KEY || SUPABASE_KEY === "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY"){
    tasksArea.className = "error";
    tasksArea.textContent = "Add your existing Supabase publishable key to the SUPABASE_KEY setting before using this page.";
    return;
  }

  try{
    const {data,error} = await db.auth.getUser();

    if(error || !data || !data.user){
      location.href = "index.html";
      return;
    }

    currentUser = data.user;
    await loadTasks();

  }catch(error){
    console.error("Page startup failed:",error);
    tasksArea.className = "error";
    tasksArea.textContent = "Could not start the task page. Please refresh and try again.";
  }
}

startPage();
</script>
