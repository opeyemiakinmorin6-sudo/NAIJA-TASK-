<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — NAIJA TASK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5fff7;
      color: #111;
    }

    header {
      background: #0b8f3c;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 16px;
      opacity: 0.95;
    }

    .logout {
      border: 1px solid white;
      background: white;
      color: #0b8f3c;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    #welcomeText {
      margin-bottom: 0;
      color: #555;
    }

    .menu {
      display: grid;
      gap: 11px;
    }

    .menu a {
      display: block;
      padding: 15px;
      background: #0b8f3c;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
    }

    .menu a:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 15px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <header>
    <h1>NAIJA TASK</h1>
    <p>Complete Tasks. Earn Naira.</p>

    <button class="logout" onclick="logoutUser()">
      Logout
    </button>
  </header>

  <main class="container">

    <section class="card">
      <h2>Welcome</h2>

      <p id="welcomeText">
        Checking your account...
      </p>

      <p id="statusText" class="status"></p>
    </section>

    <section class="card">
      <h3>My Account</h3>

      <div class="menu">

        <a href="task.html">
          📋 Tasks
        </a>

        <a href="wallet.html">
          💰 Wallet
        </a>

        <a href="referrals.html">
          👥 Referrals
        </a>

        <a href="withdrawal.html">
          💸 Withdrawal
        </a>

        <a href="profile.html">
          👤 Profile
        </a>

      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://jwakveeiynpakunwjzkj.supabase.co";

    /*
      Use ONLY your Supabase publishable/anon key here.
      Never put a Supabase secret/service-role key in HTML.
    */
    const SUPABASE_KEY =
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function checkUser() {

      const welcomeText =
        document.getElementById("welcomeText");

      const statusText =
        document.getElementById("statusText");

      try {

        const {
          data: { user },
          error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user) {
          window.location.href = "index.html";
          return;
        }

        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("full_name")
          .eq("id", user.id)
          .maybeSingle();

        if (profileError) {
          console.error(profileError);

          welcomeText.textContent =
            "Welcome, " + (user.email || "User") + ".";

          statusText.textContent =
            "Your account is active.";
          return;
        }

        const name =
          profile?.full_name ||
          user.email ||
          "User";

        welcomeText.textContent =
          "Welcome, " + name + "!";

        statusText.textContent = "";

      } catch (error) {

        console.error(error);

        statusText.textContent =
          "Unable to load your account.";

        statusText.classList.add("error");
      }
    }


    async function logoutUser() {

      try {

        await supabaseClient.auth.signOut();

      } finally {

        window.location.href =
          "index.html";
      }
    }


    checkUser();
  </script>

</body>
  </html>
