<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAIJA TASK — Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5fff7;
      color: #17221a;
      padding-bottom: 80px;
    }

    header {
      background: #0b8f3c;
      color: white;
      padding: 24px 18px 28px;
      border-radius: 0 0 24px 24px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .welcome {
      margin-top: 18px;
      font-size: 14px;
      opacity: .9;
    }

    .name {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 700;
    }

    .balance-card {
      background: white;
      color: #17221a;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .balance-label {
      font-size: 13px;
      color: #68736b;
    }

    .balance {
      font-size: 30px;
      font-weight: 800;
      margin-top: 7px;
    }

    .container {
      padding: 20px 16px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .action {
      background: white;
      padding: 17px;
      border-radius: 16px;
      text-decoration: none;
      color: #17221a;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
      font-weight: 700;
    }

    .action span {
      display: block;
      color: #0b8f3c;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .task-section {
      margin-top: 28px;
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .view-all {
      color: #0b8f3c;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .task-card {
      background: white;
      padding: 17px;
      border-radius: 17px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .task-title {
      font-size: 16px;
      font-weight: 800;
    }

    .task-info {
      margin-top: 9px;
      color: #68736b;
      font-size: 13px;
    }

    .task-bottom {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reward {
      color: #0b8f3c;
      font-size: 18px;
      font-weight: 800;
    }

    .task-btn {
      background: #0b8f3c;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      background: white;
      padding: 25px 18px;
      border-radius: 17px;
      text-align: center;
      color: #68736b;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .activity {
      margin-top: 28px;
    }

    .activity-box {
      background: white;
      padding: 18px;
      border-radius: 17px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .activity-row {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #edf1ee;
      font-size: 14px;
    }

    .activity-row:last-child {
      border-bottom: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 5px;
      box-shadow: 0 -3px 15px rgba(0,0,0,.08);
      z-index: 10;
    }

    .nav-item {
      text-align: center;
      text-decoration: none;
      color: #68736b;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-item.active {
      color: #0b8f3c;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #68736b;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">NAIJA TASK</div>

  <div class="welcome">Welcome back</div>
  <div class="name" id="userName">Loading...</div>

  <div class="balance-card">
    <div class="balance-label">Available Balance</div>
    <div class="balance" id="balance">₦0.00</div>
  </div>
</header>

<main class="container">

  <div class="section-title">Quick Actions</div>

  <div class="actions">
    <a class="action" href="task.html">
      <span>✓</span>
      Tasks
    </a>

    <a class="action" href="wallet.html">
      <span>₦</span>
      Wallet
    </a>

    <a class="action" href="withdrawal.html">
      <span>↗</span>
      Withdraw
    </a>

    <a class="action" href="referrals.html">
      <span>👥</span>
      Referrals
    </a>
  </div>

  <section class="task-section">

    <div class="task-top">
      <div class="section-title">Available Tasks</div>
      <a class="view-all" href="task.html">View all</a>
    </div>

    <div id="tasks">
      <div class="loading">Loading available tasks...</div>
    </div>

  </section>

  <section class="activity">

    <div class="section-title">Recent Activity</div>

    <div class="activity-box">

      <div class="activity-row">
        <span>Completed Tasks</span>
        <strong id="completedTasks">0</strong>
      </div>

      <div class="activity-row">
        <span>Pending Tasks</span>
        <strong id="pendingTasks">0</strong>
      </div>

      <div class="activity-row">
        <span>Referral Earnings</span>
        <strong id="referralEarnings">₦0.00</strong>
      </div>

    </div>

  </section>

</main>

<nav class="bottom-nav">

  <a class="nav-item active" href="dashboard.html">
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a class="nav-item" href="task.html">
    <span class="nav-icon">✓</span>
    Tasks
  </a>

  <a class="nav-item" href="wallet.html">
    <span class="nav-icon">₦</span>
    Wallet
  </a>

  <a class="nav-item" href="profile.html">
    <span class="nav-icon">●</span>
    Profile
  </a>

</nav>

<script>
  const SUPABASE_URL = "https://jwakveeiynpakunwjzkj.supabase.co";

  // Use your current Supabase PUBLISHABLE key here locally.
  // Do NOT use the secret/service-role key.
  const SUPABASE_KEY =
    "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadDashboard() {

    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {
      window.location.href = "index.html";
      return;
    }

    loadProfile(user.id);
    loadTasks();
    loadActivity(user.id);
  }

  async function loadProfile(userId) {

    const { data } = await supabaseClient
      .from("profiles")
      .select("full_name, balance")
      .eq("id", userId)
      .maybeSingle();

    if (data) {
      document.getElementById("userName").textContent =
        data.full_name || "NAIJA TASK User";

      document.getElementById("balance").textContent =
        "₦" + Number(data.balance || 0).toLocaleString("en-NG", {
          minimumFractionDigits: 2
        });
    }
  }

  async function loadTasks() {

    const box = document.getElementById("tasks");

    const { data, error } = await supabaseClient
      .from("tasks")
      .select("id, title, description, reward, slots")
      .eq("active", true)
      .order("created_at", { ascending: false })
      .limit(5);

    if (error) {
      box.innerHTML =
        '<div class="empty">Unable to load tasks right now.</div>';
      return;
    }

    if (!data || data.length === 0) {
      box.innerHTML =
        '<div class="empty">No tasks available right now.</div>';
      return;
    }

    box.innerHTML = "";

    data.forEach(task => {

      const card = document.createElement("div");
      card.className = "task-card";

      card.innerHTML = `
        <div class="task-title">${escapeHtml(task.title || "Task")}</div>

        <div class="task-info">
          ${escapeHtml(task.description || "Complete this task and submit your proof.")}
        </div>

        <div class="task-bottom">
          <div class="reward">
            ₦${Number(task.reward || 0).toLocaleString("en-NG")}
          </div>

          <a class="task-btn" href="task.html">
            Start Task
          </a>
        </div>
      `;

      box.appendChild(card);
    });
  }

  async function loadActivity(userId) {

    const { data: submissions } = await supabaseClient
      .from("task_submissions")
      .select("status")
      .eq("user_id", userId);

    if (submissions) {

      const completed = submissions.filter(
        x => String(x.status).toUpperCase() === "APPROVED"
      ).length;

      const pending = submissions.filter(
        x => String(x.status).toUpperCase() === "PENDING"
      ).length;

      document.getElementById("completedTasks").textContent = completed;
      document.getElementById("pendingTasks").textContent = pending;
    }

    const { data: referrals } = await supabaseClient
      .from("referrals")
      .select("reward, status")
      .eq("referrer_user_id", userId);

    if (referrals) {

      const total = referrals
        .filter(x => String(x.status).toUpperCase() === "APPROVED")
        .reduce((sum, x) => sum + Number(x.reward || 0), 0);

      document.getElementById("referralEarnings").textContent =
        "₦" + total.toLocaleString("en-NG", {
          minimumFractionDigits: 2
        });
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadDashboard();
</script>

</body>
                                       </html>
