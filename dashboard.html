<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard — Naija Task</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.menu {
  display: grid;
  gap: 12px;
}

.menu a {
  display: block;
  padding: 16px;
  background: #0b8f3c;
  color: white;
  text-decoration: none;
  text-align: center;
  border-radius: 10px;
  font-weight: bold;
}

.logout {
  background: white;
  color: #0b8f3c;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>

  <h1>Naija Task</h1>

  <p>Complete Tasks. Earn Naira.</p>

  <button class="logout" onclick="logoutUser()">
    Logout
  </button>

</header>

<div class="container">

  <div class="card">

    <h3>Welcome</h3>

    <p id="welcomeText">
      Checking account...
    </p>

  </div>

  <div class="card">

    <h3>My Account</h3>

    <div class="menu">

      <a href="tasks.html">
        📋 Tasks
      </a>

      <a href="wallet.html">
        💰 Wallet
      </a>

      <a href="referrals.html">
        👥 Referrals
      </a>

      
      <a href="withdrawal.html">
        💸 Withdrawal
      </a>
        
     

      <a href="profile.html">
        👤 Profile
      </a>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

const SUPABASE_KEY = "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkUser() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    window.location.href =
      "index.html";

    return;
  }

  const { data: profile } =
    await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq("id", user.id)
      .single();

  const name =
    profile?.full_name ||
    user.email ||
    "User";

  document.getElementById("welcomeText").textContent =
    "Welcome, " + name + "!";
}


async function logoutUser() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";
}


checkUser();

</script>

</body>
</html>
