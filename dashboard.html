<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tasks — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4faf6;
  color: #18251d;
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

a {
  -webkit-tap-highlight-color: transparent;
}

/* HEADER */

header {
  background: linear-gradient(145deg,#0b8f3c,#087b34);
  color: white;
  border-radius: 0 0 28px 28px;
  padding: 18px 16px 25px;
  box-shadow: 0 5px 20px rgba(11,143,60,.15);
}

.header-inner {
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  opacity: .95;
}

.header-badge {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 10px;
  font-weight: 800;
}

.page-heading {
  display: flex;
  align-items: center;
  gap: 13px;
}

.page-icon {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: rgba(255,255,255,.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

header h1 {
  margin: 0 0 5px;
  font-size: 25px;
  letter-spacing: -.3px;
}

header p {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
  opacity: .9;
}

/* MAIN */

.container {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 19px 14px 40px;
}

/* PAGE BAR */

.page-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.page-title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
}

.page-subtitle {
  margin: 4px 0 0;
  color: #75837a;
  font-size: 11px;
}

.task-count {
  flex-shrink: 0;
  background: #e7f7ec;
  color: #0b8f3c;
  border-radius: 20px;
  padding: 7px 10px;
  font-size: 10px;
  font-weight: 900;
}

/* CARD */

.task-card {
  background: white;
  border: 1px solid #e1ebe4;
  border-radius: 18px;
  margin-bottom: 15px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,.045);
}

.task-card-main {
  padding: 16px;
}

.task-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.task-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 14px;
  background: #e8f8ed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

.task-heading {
  flex: 1;
  min-width: 0;
}

.task-title {
  margin: 2px 0 5px;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.3;
}

.task-description {
  margin: 0;
  color: #738077;
  font-size: 11px;
  line-height: 1.55;
}

.task-type {
  display: inline-block;
  margin-top: 7px;
  background: #eef8f1;
  color: #0b8f3c;
  border-radius: 7px;
  padding: 5px 7px;
  font-size: 9px;
  font-weight: 900;
}

/* SUMMARY */

.summary-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 15px;
}

.summary-box {
  background: #f6faf7;
  border: 1px solid #e5eee8;
  border-radius: 12px;
  padding: 11px;
}

.summary-label {
  display: block;
  color: #78847c;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.summary-value {
  color: #17251b;
  font-size: 15px;
  font-weight: 900;
}

.summary-value.reward-value {
  color: #0b8f3c;
}

/* SLOT */

.slot-section {
  margin-top: 14px;
}

.slot-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.slot-label {
  color: #748079;
  font-size: 10px;
}

.slot-number {
  color: #0b8f3c;
  font-size: 10px;
  font-weight: 900;
}

.slot-bar {
  height: 6px;
  background: #e9eee9;
  border-radius: 20px;
  overflow: hidden;
}

.slot-progress {
  height: 100%;
  background: #0b8f3c;
  border-radius: 20px;
}

/* STATUS */

.task-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 13px;
  background: #e8f8ed;
  color: #0b8f3c;
  border-radius: 20px;
  padding: 6px 9px;
  font-size: 9px;
  font-weight: 900;
}

.status-dot {
  width: 6px;
  height: 6px;
  background: #0b8f3c;
  border-radius: 50%;
}

/* BUTTON */

.start-task-btn {
  width: 100%;
  margin-top: 14px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
}

.start-task-btn.open {
  background: #086f2f;
}

/* DETAILS */

.task-details {
  display: none;
  padding: 0 16px 17px;
}

.task-details.open {
  display: block;
}

.details-divider {
  border-top: 1px solid #e8eee9;
  padding-top: 17px;
}

.detail-heading {
  margin: 0 0 11px;
  font-size: 16px;
  font-weight: 900;
}

.detail-intro {
  background: #edf9f1;
  border: 1px solid #dcefe2;
  border-radius: 12px;
  padding: 12px;
  color: #41604b;
  font-size: 11px;
  line-height: 1.65;
  margin-bottom: 13px;
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 17px 0 9px;
}

.section-heading-icon {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: #e8f8ed;
  color: #0b8f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.section-heading-text {
  font-size: 13px;
  font-weight: 900;
}

.detail-box {
  background: #f7faf8;
  border: 1px solid #e4ece6;
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 10px;
}

.detail-label {
  color: #748079;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.detail-text {
  color: #2d3b32;
  font-size: 12px;
  line-height: 1.65;
  white-space: pre-line;
  word-break: break-word;
}

/* STEPS */

.steps-box {
  background: white;
  border: 1px solid #e2ebe5;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 11px;
}

.step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
  border-bottom: 1px solid #edf2ee;
}

.step:last-child {
  border-bottom: none;
}

.step-number {
  width: 25px;
  height: 25px;
  min-width: 25px;
  border-radius: 50%;
  background: #e8f8ed;
  color: #0b8f3c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
}

.step-text {
  color: #3c4b42;
  font-size: 11px;
  line-height: 1.55;
  padding-top: 3px;
}

/* COPY */

.copy-row {
  display: flex;
  gap: 7px;
}

.copy-content {
  flex: 1;
  min-width: 0;
  background: white;
  border: 1px solid #dfe8e1;
  border-radius: 9px;
  padding: 10px;
  color: #29372f;
  font-size: 12px;
  line-height: 1.5;
  word-break: break-word;
}

.copy-btn {
  border: none;
  background: #e7f7ec;
  color: #0b8f3c;
  border-radius: 9px;
  padding: 0 12px;
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}

/* LINKS */

.link-actions {
  display: flex;
  gap: 7px;
}

.task-link {
  flex: 1;
  min-width: 0;
  background: #0b8f3c;
  color: white;
  text-decoration: none;
  text-align: center;
  padding: 11px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 900;
}

.link-copy-btn {
  border: none;
  background: #e7f7ec;
  color: #0b8f3c;
  padding: 0 12px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}

/* WARNING */

.task-warning {
  background: #fff9ea;
  border: 1px solid #f1dfb5;
  color: #6d5725;
  border-radius: 11px;
  padding: 12px;
  margin-top: 13px;
  font-size: 10px;
  line-height: 1.65;
}

.task-warning-title {
  font-weight: 900;
  margin-bottom: 4px;
}

/* CHECKLIST */

.checklist-box {
  background: #f4fbf6;
  border: 1px solid #dcebe0;
  border-radius: 12px;
  padding: 12px;
  margin-top: 11px;
}

.checklist-title {
  font-size: 11px;
  font-weight: 900;
  margin-bottom: 9px;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-bottom: 7px;
  color: #526158;
  font-size: 10px;
  line-height: 1.5;
}

.check-item:last-child {
  margin-bottom: 0;
}

.check-icon {
  color: #0b8f3c;
  font-weight: 900;
}

/* PROOF */

.proof-container {
  margin-top: 18px;
  border-top: 1px solid #e7eee9;
  padding-top: 18px;
}

.proof-title {
  margin: 0 0 4px;
  font-size: 16px;
  font-weight: 900;
}

.proof-subtitle {
  margin: 0;
  color: #758179;
  font-size: 10px;
  line-height: 1.5;
}

.proof-type {
  display: inline-flex;
  align-items: center;
  background: #e8f8ed;
  color: #0b8f3c;
  border-radius: 8px;
  padding: 7px 9px;
  margin: 12px 0;
  font-size: 10px;
  font-weight: 900;
}

/* PROOF FIELD */

.proof-field {
  margin-bottom: 12px;
}

.proof-field label {
  display: block;
  margin-bottom: 6px;
  color: #28372e;
  font-size: 11px;
  font-weight: 900;
}

.proof-field input,
.proof-field textarea {
  width: 100%;
  border: 1px solid #d7e3da;
  background: white;
  color: #25332b;
  border-radius: 10px;
  padding: 11px;
  font-size: 12px;
  outline: none;
}

.proof-field input:focus,
.proof-field textarea:focus {
  border-color: #0b8f3c;
  box-shadow: 0 0 0 3px rgba(11,143,60,.08);
}

.proof-field textarea {
  min-height: 100px;
  resize: vertical;
}

/* UPLOAD */

.photo-required {
  background: #eaf8ee;
  border: 1px solid #cfe8d6;
  color: #176b36;
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 11px;
  line-height: 1.55;
}

.upload-info {
  background: #edf8f0;
  border-radius: 9px;
  padding: 10px;
  color: #4f6d59;
  font-size: 10px;
  line-height: 1.55;
  margin-bottom: 11px;
}

.image-preview {
  display: none;
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  margin-top: 9px;
  background: #f8fbf9;
  border: 1px solid #dce7df;
  border-radius: 10px;
}

/* SUBMIT */

.submit-proof-btn {
  width: 100%;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
}

.submit-proof-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.success-message {
  display: none;
  background: #e7f8ec;
  border: 1px solid #cfead7;
  color: #0b8f3c;
  border-radius: 10px;
  padding: 11px;
  margin-top: 10px;
  font-size: 11px;
  line-height: 1.5;
  font-weight: 700;
}

/* MESSAGES */

.message {
  background: white;
  border: 1px solid #e2ebe5;
  border-radius: 17px;
  padding: 38px 18px;
  text-align: center;
  color: #758179;
  font-size: 12px;
  line-height: 1.65;
  box-shadow: 0 4px 15px rgba(0,0,0,.035);
}

.message-icon {
  font-size: 30px;
  margin-bottom: 8px;
}

.message-title {
  color: #25342b;
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 5px;
}

.refresh-btn {
  margin-top: 13px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 11px 17px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
}

@media (max-width:480px) {

  header {
    padding-top: 16px;
  }

  .container {
    padding-left: 12px;
    padding-right: 12px;
  }

  .task-card-main {
    padding: 14px;
  }

  .task-details {
    padding-left: 14px;
    padding-right: 14px;
  }

  .link-actions {
    flex-direction: column;
  }

  .task-link {
    width: 100%;
  }

  .link-copy-btn {
    width: 100%;
    padding: 11px;
  }

  .copy-btn {
    padding: 0 10px;
  }

}

@media (max-width:350px) {

  .page-heading {
    gap: 9px;
  }

  .page-icon {
    width: 44px;
    height: 44px;
  }

  header h1 {
    font-size: 22px;
  }

  .task-title {
    font-size: 15px;
  }

}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="header-top">

      <a href="dashboard.html" class="back">
        ← Dashboard
      </a>

      <div class="header-badge">
        NAIJA TASK
      </div>

    </div>

    <div class="page-heading">

      <div class="page-icon">
        📋
      </div>

      <div>

        <h1>
          Available Tasks
        </h1>

        <p>
          Complete genuine tasks and earn Naira.
        </p>

      </div>

    </div>

  </div>

</header>

<main class="container">

  <div class="page-bar">

    <div>

      <h2 class="page-title">
        Tasks
      </h2>

      <p class="page-subtitle">
        Choose a task and follow its instructions carefully.
      </p>

    </div>

    <div class="task-count" id="taskCount">
      0 tasks
    </div>

  </div>

  <div id="tasks">

    <div class="message">

      <div class="message-icon">
        ⏳
      </div>

      <div class="message-title">
        Loading tasks
      </div>

      Please wait while available tasks are loaded.

    </div>

  </div>

</main>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jwakveeiynpakunwjzkj.supabase.co";

/*
  PASTE YOUR EXISTING SUPABASE PUBLISHABLE KEY HERE.
  Do not use a secret/service-role key.
*/

const SUPABASE_KEY =
  

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

  const tasksBox =
    document.getElementById("tasks");

  try {

    const {
      data: authData,
      error: authError
    } = await db.auth.getUser();

    if (
      authError ||
      !authData ||
      !authData.user
    ) {

      window.location.href =
        "index.html";

      return;

    }

    currentUser =
      authData.user;

    const {
      data,
      error
    } = await db
      .from("tasks")
      .select(`
        id,
        title,
        description,
        reward,
        slots,
        expiry_date,
        requirements,
        proof_type,
        proof_required,
        max_completions,
        active,
        task_type,
        task_link,
        uploader_username,
        copy_text,
        post_link,
        upload_required
      `)
      .eq("active", true)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      showError(
        "Unable to load tasks",
        error.message || "There was a problem loading available tasks."
      );

      return;

    }

    if (
      !data ||
      data.length === 0
    ) {

      document.getElementById(
        "taskCount"
      ).textContent = "0 tasks";

      tasksBox.innerHTML = `

        <div class="message">

          <div class="message-icon">
            📋
          </div>

          <div class="message-title">
            No tasks available
          </div>

          There are no available tasks for you right now.

          <br>

          Please check again later.

          <br>

          <button
            class="refresh-btn"
            onclick="loadTasks()"
          >
            Refresh Tasks
          </button>

        </div>

      `;

      return;

    }

    document.getElementById(
      "taskCount"
    ).textContent =
      data.length +
      (
        data.length === 1
          ? " task"
          : " tasks"
      );

    tasksBox.innerHTML = "";

    data.forEach(function(task) {

      createTaskCard(task);

    });

  }
  catch (error) {

    console.error(error);

    showError(
      "Something went wrong",
      "Please try again."
    );

  }

}


/* =========================================================
   CREATE CARD
========================================================= */

function createTaskCard(task) {

  const tasksBox =
    document.getElementById("tasks");

  const card =
    document.createElement("div");

  card.className =
    "task-card";

  const main =
    document.createElement("div");

  main.className =
    "task-card-main";

  /* TOP */

  const top =
    document.createElement("div");

  top.className =
    "task-top";

  const icon =
    document.createElement("div");

  icon.className =
    "task-icon";

  icon.textContent =
    getTaskIcon(task);

  const heading =
    document.createElement("div");

  heading.className =
    "task-heading";

  const title =
    document.createElement("div");

  title.className =
    "task-title";

  title.textContent =
    task.title || "Task";

  const description =
    document.createElement("p");

  description.className =
    "task-description";

  description.textContent =
    task.description ||
    "Complete this task according to the instructions.";

  heading.appendChild(title);
  heading.appendChild(description);

  if (task.task_type) {

    const type =
      document.createElement("span");

    type.className =
      "task-type";

    type.textContent =
      formatTaskType(task.task_type);

    heading.appendChild(type);

  }

  top.appendChild(icon);
  top.appendChild(heading);

  main.appendChild(top);


  /* SUMMARY */

  const summary =
    document.createElement("div");

  summary.className =
    "summary-row";

  const rewardBox =
    document.createElement("div");

  rewardBox.className =
    "summary-box";

  const rewardLabel =
    document.createElement("span");

  rewardLabel.className =
    "summary-label";

  rewardLabel.textContent =
    "Task Reward";

  const rewardValue =
    document.createElement("span");

  rewardValue.className =
    "summary-value reward-value";

  rewardValue.textContent =
    "₦" +
    Number(task.reward || 0)
      .toLocaleString("en-NG");

  rewardBox.appendChild(rewardLabel);
  rewardBox.appendChild(rewardValue);

  const slotBox =
    document.createElement("div");

  slotBox.className =
    "summary-box";

  const slotLabel =
    document.createElement("span");

  slotLabel.className =
    "summary-label";

  slotLabel.textContent =
    "Availability";

  const slotValue =
    document.createElement("span");

  slotValue.className =
    "summary-value";

  const slots =
    Number(task.slots || 0);

  slotValue.textContent =
    slots > 0
      ? slots +
        (slots === 1 ? " slot" : " slots")
      : "Check";

  slotBox.appendChild(slotLabel);
  slotBox.appendChild(slotValue);

  summary.appendChild(rewardBox);
  summary.appendChild(slotBox);

  main.appendChild(summary);


  /* SLOT BAR */

  const slotSection =
    document.createElement("div");

  slotSection.className =
    "slot-section";

  const slotTop =
    document.createElement("div");

  slotTop.className =
    "slot-top";

  const slotLabelText =
    document.createElement("span");

  slotLabelText.className =
    "slot-label";

  slotLabelText.textContent =
    "Available slots";

  const slotNumber =
    document.createElement("span");

  slotNumber.className =
    "slot-number";

  slotNumber.textContent =
    slots > 0
      ? slots + " remaining"
      : "Availability varies";

  slotTop.appendChild(slotLabelText);
  slotTop.appendChild(slotNumber);

  const bar =
    document.createElement("div");

  bar.className =
    "slot-bar";

  const progress =
    document.createElement("div");

  progress.className =
    "slot-progress";

  progress.style.width =
    slots > 0 ? "100%" : "0%";

  bar.appendChild(progress);

  slotSection.appendChild(slotTop);

function getTaskIcon(task) {

  const type =
    String(task.task_type || "")
      .toLowerCase();

  const title =
    String(task.title || "")
      .toLowerCase();

  const text =
    type + " " + title;

  if (text.includes("tiktok")) return "🎵";
  if (text.includes("youtube")) return "▶️";
  if (text.includes("instagram")) return "📸";
  if (text.includes("facebook")) return "📘";
  if (text.includes("telegram")) return "✈️";
  if (text.includes("whatsapp")) return "💬";
  if (text.includes("website") || text.includes("web")) return "🌐";
  if (text.includes("app") || text.includes("download")) return "📱";
  if (text.includes("survey")) return "📝";
  if (text.includes("follow")) return "➕";
  if (text.includes("like")) return "❤️";

  return "📋";

}


/* =========================================================
   TASK TYPE
========================================================= */

function formatTaskType(value) {

  const text =
    String(value || "").trim();

  if (!text) {
    return "General Task";
  }

  return text
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, function(letter) {
      return letter.toUpperCase();
    });

}


/* =========================================================
   GET ADDITIONAL PROOF TYPES
========================================================= */

function getAdditionalProofTypes(task) {

  const raw =
    String(task.proof_type || "")
      .trim()
      .toLowerCase();

  if (!raw) {
    return [];
  }

  const normalized =
    raw
      .replace(/\|/g, ",")
      .replace(/\+/g, ",")
      .replace(/\//g, ",")
      .replace(/;/g, ",");

  const parts =
    normalized
      .split(",")
      .map(function(item) {
        return item.trim();
      })
      .filter(Boolean);

  const result = [];

  parts.forEach(function(part) {

    let type = null;

    if (
      part.includes("username") ||
      part.includes("user name")
    ) {

      type = "username";

    }
    else if (
      part === "url" ||
      part.includes("proof url") ||
      part.includes("website url") ||
      part.includes("link")
    ) {

      type = "url";

    }
    else if (
      part.includes("reference") ||
      part.includes("ref id") ||
      part.includes("reference id")
    ) {

      type = "reference";

    }
    else if (
      part === "text" ||
      part.includes("description") ||
      part.includes("proof text")
    ) {

      type = "text";

    }

    /*
      Photo/screenshot/image are deliberately ignored
      here because PHOTO IS ALWAYS REQUIRED separately.
    */

    if (
      type &&
      !result.includes(type)
    ) {

      result.push(type);

    }

  });

  return result;

}


/* =========================================================
   PROOF TYPE DISPLAY
========================================================= */

function getProofType(task) {

  const extras =
    getAdditionalProofTypes(task);

  if (extras.length === 0) {

    return "📷 Photo Proof — Required";

  }

  const labels =
    extras.map(function(type) {

      if (type === "username") {
        return "👤 Username";
      }

      if (type === "url") {
        return "🔗 URL";
      }

      if (type === "reference") {
        return "🔖 Reference ID";
      }

      if (type === "text") {
        return "📝 Text";
      }

      return type;

    });

  return (
    "📷 Photo Required + " +
    labels.join(" + ")
  );

}


/* =========================================================
   BUILD PROOF FIELD
========================================================= */

function buildProofField(
  container,
  task
) {

  container.innerHTML = "";


  /* -------------------------------------------------------
     PHOTO — ALWAYS REQUIRED
  ------------------------------------------------------- */

  const photoRequired =
    document.createElement("div");

  photoRequired.className =
    "photo-required";

  photoRequired.textContent =
    "📷 Photo proof is required for EVERY task. Upload a clear photo or screenshot showing your completed task.";

  container.appendChild(photoRequired);


  const uploadInfo =
    document.createElement("div");

  uploadInfo.className =
    "upload-info";

  uploadInfo.textContent =
    "Maximum image size: 5MB. Accepted image formats depend on your device/browser.";

  container.appendChild(uploadInfo);


  const photoField =
    document.createElement("div");

  photoField.className =
    "proof-field";

  const photoLabel =
    document.createElement("label");

  photoLabel.textContent =
    "📸 Upload Photo / Screenshot *";

  const fileInput =
    document.createElement("input");

  fileInput.type =
    "file";

  fileInput.className =
    "proof-photo";

  fileInput.accept =
    "image/*";

  fileInput.required =
    true;

  const preview =
    document.createElement("img");

  preview.className =
    "image-preview";

  preview.alt =
    "Proof preview";

  photoField.appendChild(photoLabel);
  photoField.appendChild(fileInput);
  photoField.appendChild(preview);

  container.appendChild(photoField);


  fileInput.addEventListener(
    "change",
    function() {

      const file =
        fileInput.files &&
        fileInput.files[0];

      if (!file) {

        preview.style.display =
          "none";

        preview.removeAttribute("src");

        return;

      }

      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "Please select an image file."
        );

        fileInput.value =
          "";

        preview.style.display =
          "none";

        return;

      }

      if (
        file.size >
        5 * 1024 * 1024
      ) {

        alert(
          "Image must be 5MB or smaller."
        );

        fileInput.value =
          "";

        preview.style.display =
          "none";

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };

      reader.readAsDataURL(file);

    }
  );


  /* -------------------------------------------------------
     ADDITIONAL PROOF
  ------------------------------------------------------- */

  const extras =
    getAdditionalProofTypes(task);

  extras.forEach(function(type) {

    if (type === "username") {

      createUsernameField(container);

    }

    if (type === "url") {

      createUrlField(container);

    }

    if (type === "reference") {

      createReferenceField(container);

    }

    if (type === "text") {

      createTextField(container);

    }

  });

}

/* =========================================================
   SUBMIT PROOF
========================================================= */

async function submitProof(
  task,
  container,
  button
) {

  button.disabled =
    true;

  button.textContent =
    "Submitting...";

  try {

    const {
      data: authData,
      error: userError
    } = await db.auth.getUser();

    if (
      userError ||
      !authData ||
      !authData.user
    ) {

      window.location.href =
        "index.html";

      return;

    }

    const user =
      authData.user;


    /* -------------------------------------------------------
       PHOTO REQUIRED
    ------------------------------------------------------- */

    const photoInput =
      container.querySelector(
        ".proof-photo"
      );

    if (!photoInput) {

      alert(
        "Photo upload field is missing. Please refresh the page."
      );

      resetSubmitButton(button);

      return;

    }

    const file =
      photoInput.files &&
      photoInput.files[0];

    if (!file) {

      alert(
        "Please upload a photo or screenshot before submitting."
      );

      resetSubmitButton(button);

      return;

    }

    if (
      !file.type.startsWith("image/")
    ) {

      alert(
        "Please select an image file."
      );

      resetSubmitButton(button);

      return;

    }

    if (
      file.size >
      5 * 1024 * 1024
    ) {

      alert(
        "Image must be 5MB or smaller."
      );

      resetSubmitButton(button);

      return;

    }


    /* -------------------------------------------------------
       ADDITIONAL FIELDS
    ------------------------------------------------------- */

    const additional = {};


    const usernameInput =
      container.querySelector(
        ".extra-username"
      );

    if (usernameInput) {

      const value =
        usernameInput.value.trim();

      if (!value) {

        alert(
          "Please enter your username."
        );

        resetSubmitButton(button);

        return;

      }

      if (value.length < 2) {

        alert(
          "Please enter a valid username."
        );

        resetSubmitButton(button);

        return;

      }

      additional.username =
        value;

    }


    const urlInput =
      container.querySelector(
        ".extra-url"
      );

    if (urlInput) {

      const value =
        urlInput.value.trim();

      if (!value) {

        alert(
          "Please enter the proof URL."
        );

        resetSubmitButton(button);

        return;

      }

      try {

        const parsed =
          new URL(value);

        if (
          parsed.protocol !== "http:" &&
          parsed.protocol !== "https:"
        ) {

          throw new Error(
            "Invalid URL"
          );

        }

      }
      catch (error) {

        alert(
          "Please enter a valid URL starting with https:// or http://"
        );

        resetSubmitButton(button);

        return;

      }

      additional.url =
        value;

    }


    const referenceInput =
      container.querySelector(
        ".extra-reference"
      );

    if (referenceInput) {

      const value =
        referenceInput.value.trim();

      if (!value) {

        alert(
          "Please enter the reference ID."
        );

        resetSubmitButton(button);

        return;

      }

      if (value.length < 2) {

        alert(
          "Please enter a valid reference ID."
        );

        resetSubmitButton(button);

        return;

      }

      additional.reference =
        value;

    }


    const textInput =
      container.querySelector(
        ".extra-text"
      );

    if (textInput) {

      const value =
        textInput.value.trim();

      if (!value) {

        alert(
          "Please enter the proof description."
        );

        resetSubmitButton(button);

        return;

      }

      additional.text =
        value;

    }


    /* -------------------------------------------------------
       STORAGE
    ------------------------------------------------------- */

    const originalName =
      String(file.name || "proof");

    const extension =
      originalName.includes(".")
        ? originalName
            .split(".")
            .pop()
            .toLowerCase()
        : "jpg";

    const safeExtension =
      /^[a-z0-9]+$/i.test(extension)
        ? extension
        : "jpg";

    const filePath =
      user.id +
      "/" +
      task.id +
      "/" +
      Date.now() +
      "." +
      safeExtension;


    const {
      error: uploadError
    } = await db.storage
      .from("task proof")
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


    if (uploadError) {

      console.error(
        uploadError
      );

      alert(
        "Picture upload failed: " +
        uploadError.message
      );

      resetSubmitButton(button);

      return;

    }


    /* -------------------------------------------------------
       ONE UNIFIED PROOF RECORD
    ------------------------------------------------------- */

    const proofData =
      JSON.stringify({

        photo: {

          type: "photo",

          storage_path:
            filePath,

          file_name:
            originalName

        },

        additional:
          additional

      });


    const {
      error: submitError
    } = await db
      .from("task_submissions")
      .insert({

        user_id:
          user.id,

        task_id:
          task.id,

        proof:
          proofData,

        status:
          "PENDING"

      });


    if (submitError) {

      console.error(
        submitError
      );

      alert(
        "Proof submission failed: " +
        submitError.message
      );

      resetSubmitButton(button);

      return;

    }


    showSuccess(button);

  }
  catch (error) {

    console.error(error);

    alert(
      "Something went wrong. Please try again."
    );

    resetSubmitButton(button);

  }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(button) {

  button.textContent =
    "Submitted ✓";

  button.disabled =
    true;

  const proofContainer =
    button.parentElement;

  const success =
    proofContainer.querySelector(
      ".success-message"
    );

  if (success) {

    success.style.display =
      "block";

  }

}


/* =========================================================
   RESET BUTTON
========================================================= */

function resetSubmitButton(button) {

  button.disabled =
    false;

  button.textContent =
    "Submit Proof";

}


/* =========================================================
   COPY
========================================================= */

async function copyText(
  value,
  button
) {

  try {

    await navigator.clipboard.writeText(
      String(value)
    );

    const oldText =
      button.textContent;

    button.textContent =
      "Copied ✓";

    setTimeout(function() {

      button.textContent =
        oldText;

    }, 1500);

  }
  catch (error) {

    console.error(error);

    alert(
      "Copy failed. Please copy it manually."
    );

  }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value) {

  try {

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return String(value);

    }

    return date.toLocaleString(
      "en-NG",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }
  catch (error) {

    return String(value);

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  title,
  message
) {

  const tasksBox =
    document.getElementById("tasks");

  tasksBox.innerHTML = "";

  const box =
    document.createElement("div");

  box.className =
    "message";

  const icon =
    document.createElement("div");

  icon.className =
    "message-icon";

  icon.textContent =
    "⚠️";

  const titleBox =
    document.createElement("div");

  titleBox.className =
    "message-title";

  titleBox.textContent =
    title;

  const messageBox =
    document.createElement("div");

  messageBox.textContent =
    message;

  const button =
    document.createElement("button");

  button.className =
    "refresh-btn";

  button.textContent =
    "Try Again";

  button.onclick =
    loadTasks;

  box.appendChild(icon);
  box.appendChild(titleBox);
  box.appendChild(messageBox);
  box.appendChild(button);

  tasksBox.appendChild(box);

}


/* =========================================================
   START
========================================================= */

loadTasks();

</script>
