function applyGraphicsQuality(){

 const ua=navigator.userAgent||"",lowDevice=/Android 8|HUAWEI|HONOR/i.test(ua)||(navigator.deviceMemory&&navigator.deviceMemory<=3)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4);
 const scale=graphicsQuality==="low"?.62:graphicsQuality==="high"?1.15:graphicsQuality==="balanced"?.88:lowDevice?.72:1;
 const max=graphicsQuality==="high"?1.2:lowDevice?1:1.1;
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,max)*scale);renderer.setSize(window.innerWidth,window.innerHeight,false);
}
function phoneSettings(){
 let selected=phoneSelectedStyle();
 phoneSub("Settings",'<div class="ph-section">PHONE APPEARANCE</div><div class="ph-banner"><b>Choose your phone style</b><small>Switch between an iPhone-inspired look and a Huawei EMUI-inspired look. This changes the game phone only.</small></div><div class="ph-tools"><button class="ph-chip" id="phStyleIphone"> iPhone style</button><button class="ph-chip" id="phStyleHuawei">HUAWEI style</button><button class="ph-chip" id="phStyleAuto">Auto detect</button></div><p class="ph-muted">Current style: <b>'+(selected==="huawei"?"Huawei EMUI-inspired":"iPhone-inspired")+'</b></p><div class="ph-section">GRAPHICS PERFORMANCE</div><div class="ph-banner"><b>Game graphics</b><small>Lower settings help older Android phones run more smoothly. Recommended for Huawei Y9: Auto or Low.</small></div><div class="ph-tools"><button class="ph-chip" data-quality="auto">AUTO</button><button class="ph-chip" data-quality="low">LOW</button><button class="ph-chip" data-quality="balanced">BALANCED</button><button class="ph-chip" data-quality="high">HIGH</button></div><p class="ph-muted">Current setting: '+safeText(graphicsQuality.toUpperCase())+'</p><div class="ph-section">PRIVACY & DEVICE</div><div class="ph-item"><span class="ph-icon">🔐</span><div><b>Chat safety</b><small>Friends-only chat, reporting and blocking. The game server restricts links and phone numbers.</small></div></div><button class="ph-item" id="phClearNotes"><span class="ph-icon">🧹</span><div><b>Clear notes</b><small>Remove notes saved on this device</small></div></button><button class="ph-item" id="phResetApps"><span class="ph-icon">↩️</span><div><b>Reset downloaded apps</b><small>Restore the default phone app layout</small></div></button>');
 $("phStyleIphone").onclick=()=>setPhoneStyle("iphone");$("phStyleHuawei").onclick=()=>setPhoneStyle("huawei");$("phStyleAuto").onclick=()=>setPhoneStyle("auto");
 document.querySelectorAll("[data-quality]").forEach(b=>b.onclick=()=>{graphicsQuality=b.dataset.quality;try{localStorage.setItem("starlife_graphics_quality",graphicsQuality);}catch(e){}applyGraphicsQuality();toast("Graphics set to "+graphicsQuality.toUpperCase());phoneSettings();});
 $("phClearNotes").onclick=()=>{try{localStorage.removeItem(phoneKey("notes"));toast("Device notes cleared");}catch(e){}};
 $("phResetApps").onclick=()=>{phoneSaveInstalled(["messages","contacts","phone","settings"]);toast("Phone apps reset");phoneHome();};
}

function interact(){
 const s=actionSpot;if(!s)return;
 if(activeVehicle){exitDriveVehicle();return;}
 if(s.kind==="driveVehicle"){enterDriveVehicle(s.vehicle);return;}
 if(s.kind==="interiorExit"){exitBuildingInterior();return;}
 if(s.kind==="work"||s.kind==="food"||s.kind==="home"||s.kind==="market"){enterBuildingInterior(s);return;}
 if(s.kind==="landmark"){
  const a=AREAS.find(x=>x.id===s.area);
  openModal('<h2>🏛️ '+safeText(s.label)+'</h2><p>You are exploring '+safeText(a?.name||"this area")+'. Walk around the landmark, meet people and discover the character of this neighbourhood.</p><button class="primary" id="meet">🤝 Meet someone nearby</button><button class="secondary" id="dismiss">Close</button>');
  $("meet").onclick=openConversation;$("dismiss").onclick=closeModal;
 }
}
function buildInteriorRoom(){
 if(interiorGroup)return interiorGroup;
 interiorGroup=new THREE.Group();interiorGroup.position.set(1000,0,1000);scene.add(interiorGroup);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(24,.35,20),material(0xc5a77c));floor.position.set(0,-.2,0);interiorGroup.add(floor);
 const wallColor=0xe8ddc5,trim=0x6b4730;
 meshBox(24,8,.5,wallColor,0,0,-10,interiorGroup);
 meshBox(.5,8,20,wallColor,-12,0,0,interiorGroup);
 meshBox(.5,8,20,wallColor,12,0,0,interiorGroup);
 // Front wall leaves a wide doorway so the room reads as an enterable space.
 meshBox(8,8,.5,wallColor,-8,0,10,interiorGroup);
 meshBox(8,8,.5,wallColor,8,0,10,interiorGroup);
 meshBox(24,.45,20,0x74543b,0,8,0,interiorGroup);
 meshBox(8,.3,.5,trim,0,0,9.7,interiorGroup);
 // Counter, shelves, seating and warm practical lighting.
 meshBox(8,1.2,1.5,0x815536,-5,0,-5,interiorGroup);
 meshBox(8,.25,1.5,0xd5b27a,-5,1.2,-5,interiorGroup);
 for(let i=0;i<4;i++){meshBox(1.1,2.6,.45,0x986d48,7,0,-7+i*3.2,interiorGroup);}
 meshBox(4,.7,2.5,0x285c45,4,0,-1,interiorGroup);
 meshBox(4,.35,2.5,0xd0a66d,4,.7,-1,interiorGroup);
 const lamp=new THREE.PointLight(0xffd89a,1.2,28);lamp.position.set(0,6,0);interiorGroup.add(lamp);
 const sign=labelSprite("WELCOME", "#075638");sign.position.set(0,5.5,-9.65);sign.scale.set(8,2,1);interiorGroup.add(sign);
 return interiorGroup;
}
function enterBuildingInterior(place){
 exteriorPosition={x:player.x,z:player.z};exteriorYaw=yaw;exteriorCameraDistance=cameraDistance;
 currentInterior=place;buildInteriorRoom();if(place.kind==="home")buildHomeDecor();
 interiorExitSpot={kind:"interiorExit",label:"EXIT BUILDING",x:1000,z:1007,area:place.area,icon:"🚪"};spots.push(interiorExitSpot);
 player.x=1000;player.z=1002;player.angle=Math.PI;playerGroup.position.set(player.x,characterGroundY(),player.z);
 yaw=0;cameraDistance=7;
 const title=safeText(place.label||"Neighbourhood building");
 const description=place.kind==="work"?"Step inside your local workplace and choose a shift.":place.kind==="food"||place.kind==="market"?"Take a seat and choose something to eat.":"Welcome home. Check your home options and take a rest.";
 openModal('<div style="font-size:11px;font-weight:900;color:#087f43;letter-spacing:1px">BUILDING INTERIOR</div><h2>🏠 '+title+'</h2><p>'+description+'</p><button class="primary" id="interiorUse">Use this place</button><button class="secondary" id="interiorExit">Step back outside</button>');
 $("interiorUse").onclick=()=>{closeModal();if(place.kind==="work")openWork();else if(place.kind==="home")openHome();else openFood();};
 $("interiorExit").onclick=exitBuildingInterior;
}
function exitBuildingInterior(){
 if(!currentInterior||!exteriorPosition)return;
 player.x=exteriorPosition.x;player.z=exteriorPosition.z;playerGroup.position.set(player.x,characterGroundY(),player.z);
 yaw=exteriorYaw;cameraDistance=exteriorCameraDistance;currentInterior=null;exteriorPosition=null;
 if(interiorExitSpot){const i=spots.indexOf(interiorExitSpot);if(i>=0)spots.splice(i,1);interiorExitSpot=null;}
 closeModal();updateAction();toast("Back outside in Star Life.");
}
function bindJoystick(){
 const pad=$("joystick"),stick=$("stick");let active=false,pid=null;
 function set(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=39,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}joy.x=dx/max;joy.y=dy/max;stick.style.transform="translate("+dx+"px,"+dy+"px)";}
 pad.addEventListener("pointerdown",e=>{active=true;pid=e.pointerId;pad.setPointerCapture(pid);set(e);});
 pad.addEventListener("pointermove",e=>{if(active&&e.pointerId===pid)set(e);});
 const reset=()=>{active=false;pid=null;joy.x=joy.y=0;stick.style.transform="translate(0,0)";};
 pad.addEventListener("pointerup",reset);pad.addEventListener("pointercancel",reset);pad.addEventListener("lostpointercapture",reset);
}
function bindLook(){
 const c=$("world");
 c.addEventListener("pointerdown",e=>{if(modalOpen||e.pointerType==="mouse"&&e.button!==0)return;touchLook={id:e.pointerId,x:e.clientX,y:e.clientY};});
 c.addEventListener("pointermove",e=>{if(!touchLook||touchLook.id!==e.pointerId)return;const dx=e.clientX-touchLook.x;touchLook.x=e.clientX;touchLook.y=e.clientY;yaw-=dx*.006;});
 c.addEventListener("pointerup",()=>touchLook=null);c.addEventListener("pointercancel",()=>touchLook=null);
}
function resize(){if(!renderer||!camera)return;const w=window.innerWidth,h=window.innerHeight;applyGraphicsQuality();camera.aspect=w/h;camera.updateProjectionMatrix();}
function animate(){
 requestAnimationFrame(animate);if(!renderer||!scene)return;const dt=Math.min(clock.getDelta(),.04);frame++;
 if(player){updateWorld(dt);if(frame%4===0)updateAction();}
 const ua=navigator.userAgent||"",lowDevice=/Android 8|HUAWEI|HONOR/i.test(ua)||(navigator.deviceMemory&&navigator.deviceMemory<=3);
 const targetFps=graphicsQuality==="low"||graphicsQuality==="auto"&&lowDevice?30:60,now=performance.now();
 if(now-lastRenderAt>=1000/targetFps){renderer.render(scene,camera);lastRenderAt=now;}
}
function startRenderer(){
 renderer=new THREE.WebGLRenderer({canvas:$("world"),antialias:false,alpha:false,powerPreference:"low-power"});
 graphicsQuality="auto";try{graphicsQuality=localStorage.getItem("starlife_graphics_quality")||"auto";}catch(e){}renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight,false);
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x91c4d8);scene.fog=new THREE.Fog(0x91c4d8,115,330);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,600);
 const hemi=new THREE.HemisphereLight(0xfff0d5,0x435847,1.35);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffe1b1,1.5);sun.position.set(-80,120,60);scene.add(sun);
 buildCity();buildDriveVehicles();buildPeople();buildTraffic();makePlayer();clock=new THREE.Clock();resize();spawnAtState();
 camera.position.set(player.x,8,player.z+cameraDistance);camera.lookAt(player.x,1.5,player.z);
 window.addEventListener("resize",resize);
}
function showError(message){
 $("loading").style.display="none";$("hud").style.display="none";$("joystick").style.display="none";
 $("err").style.display="flex";$("err").innerHTML='<div><div style="font-size:32px">🌍</div><h2>Could not open Star Life</h2><p>'+safeText(message)+'</p><p>Check your connection and try again.</p><a href="starlife.html">Return to Star Life menu</a></div>';
}
async function init(){
 try{
  if(!window.supabase||!window.THREE)throw new Error("A game service did not load. Please refresh with a stable internet connection.");
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{user},error:authError}=await db.auth.getUser();if(authError)throw authError;if(!user){location.replace("login.html");return;}
  const {data:flag,error:flagError}=await db.from("platform_feature_flags").select("enabled").eq("key","starlife").maybeSingle();
  if(flagError||!flag||flag.enabled!==true)throw new Error("Naija Star Life is not currently open. Please return to the game menu.");
  const {data:gameState,error:stateError}=await db.rpc("starlife_state");if(stateError)throw stateError;state=gameState;
  if(!state||!state.career){location.replace("starlife.html");return;}
  if(!state.adult_confirmed||!state.background||!state.look){location.replace("starlife.html");return;}
  const {data:wakeData,error:wakeError}=await db.rpc("starlife_wake");if(wakeError)throw wakeError;if(wakeData?.state)state=wakeData.state;
  try{const {data:p}=await db.rpc("starlife_locations_list");places=p||[];}catch(e){console.warn("Locations list unavailable",e);}
  startRenderer();bindJoystick();bindLook();updateHud();
  $("loading").style.display="none";$("hud").style.display="flex";$("joystick").style.display="block";$("quick").style.display="flex";$("hint").style.display="block";
  setTimeout(()=>$("hint").style.display="none",6500);
  $("action").addEventListener("click",interact);$("brake").addEventListener("pointerdown",e=>{e.preventDefault();driveBrake=true;});$("brake").addEventListener("pointerup",()=>driveBrake=false);$("brake").addEventListener("pointercancel",()=>driveBrake=false);$("brake").addEventListener("pointerleave",()=>driveBrake=false);$("phone").onclick=openPhone;$("map").onclick=openTravel;
  $("menu").onclick=()=>openModal('<h2>🌍 Star Life menu</h2><p>Customise your character, manage your day or explore.</p><button class="option" id="menuLook">✨ Character studio<small>Skin tone, hairstyle and outfit colour</small></button><button class="option" id="menuPhone">📱 Player phone</button><button class="option" id="menuWork">💼 Find work</button><button class="option" id="menuTravel">🚌 Travel</button><button class="secondary" id="exitGame">Return to Star Life hub</button>');
  $("zoomIn").onclick=()=>cameraDistance=Math.max(6,cameraDistance-1.5);$("zoomOut").onclick=()=>cameraDistance=Math.min(18,cameraDistance+1.5);
  $("close").onclick=closeModal;$("modal").addEventListener("pointerdown",e=>{if(e.target===$("modal"))closeModal();});
  document.addEventListener("keydown",e=>{keys[e.key]=true;if(e.key==="Escape")closeModal();});
  document.addEventListener("keyup",e=>{keys[e.key]=false;});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){joy.x=joy.y=0;}});
  $("sheetContent").addEventListener("click",e=>{
   if(e.target.id==="menuLook")openCharacterStudio();if(e.target.id==="menuPhone")openPhone();if(e.target.id==="menuWork")openWork();if(e.target.id==="menuTravel")openTravel();
   if(e.target.id==="exitGame")location.href="starlife.html";
  });
  openWelcome();animate();
 }catch(e){console.error("Star Life fresh build startup:",e);showError(e.message||"Unexpected startup error.");}
}
init();
</script>
