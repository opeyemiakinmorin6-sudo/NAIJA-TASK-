<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#064d25">
<title>Naija Star Life · 3D Open World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--green:#087f36;--dark:#064d25;--light:#0b9b45;--lime:#b7ef43;--text:#173326;--muted:#708176;--line:#e0eae3;--red:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2a17;font-family:Arial,Helvetica,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.chip{background:rgba(6,77,37,.88);color:#fff;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip b{color:var(--lime)}
#bar{flex:1;min-width:50px;max-width:120px;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--lime)}
#back{pointer-events:auto;margin-left:auto;background:rgba(6,77,37,.88);color:#fff;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:800;text-decoration:none}
#place{position:fixed;top:calc(52px + env(safe-area-inset-top));left:10px;background:rgba(255,255,255,.92);color:var(--dark);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800;z-index:5;pointer-events:none}
#joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:6;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.65)}
#act{position:fixed;right:20px;bottom:calc(34px + env(safe-area-inset-bottom));min-width:88px;height:88px;border-radius:44px;border:0;background:var(--lime);color:var(--dark);font-weight:900;font-size:13px;padding:0 14px;z-index:6;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;max-width:86vw;text-align:center;z-index:8;display:none}
#modal{position:fixed;inset:0;background:rgba(5,25,14,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#box{background:#fff;color:var(--text);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text;touch-action:pan-y}
#box h2{margin:0 0 8px;font-size:19px}#box p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:14px;background:var(--green);color:#fff;margin-top:10px}
.btn.alt{background:#e8f4eb;color:var(--dark)}.btn:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin-top:9px;font:inherit;font-weight:700;color:var(--text)}
.opt small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.up{color:#17682e;font-weight:800}.down{color:var(--red);font-weight:800}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
#wake{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;line-height:1.7;z-index:40;opacity:1;transition:opacity 1.6s}
#msgScreen{position:fixed;inset:0;background:#0b2a17;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30;font-size:15px;line-height:1.6}
#msgScreen a{color:var(--lime);font-weight:800}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="display:none">
  <span class="chip">⚡ <span id="eTxt">100</span></span>
  <div id="bar"><i id="eBar"></i></div>
  <span class="chip">🪙 <b id="cTxt">0</b></span>
  <span class="chip">⭐ <b id="fTxt">0</b></span>
  <a id="back" href="starlife.html">Menu</a>
</div>
<div id="place"></div>
<div id="joy"><div id="knob"></div></div>
<button id="act" type="button"></button>
<div id="toast"></div>
<div id="modal"><div id="box"></div></div>
<div id="wake"></div>
<div id="msgScreen">Loading Lagos in 3D...</div>

<script>
"use strict";
const db = window.supabase.createClient("https://jwakveeiynpakunwjzkj.supabase.co", "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

/* ============================ WORLD DEFINITION ============================ */
const T = 32;                 // tile size in pixels
const DW = 24, DH = 18;       // district size in tiles
const COLS = 3, ROWS = 3;     // districts across the world
const WORLD_W = COLS * DW * T, WORLD_H = ROWS * DH * T;

/* c,r = position in the 3x3 world grid. Lagoon water fills the bottom-left two cells. */
const DISTRICTS = [
  { id:"ikeja",    name:"Ikeja",           c:0, r:0, ground:"#d7ecc9", work:"Mall Shop" },
  { id:"oshodi",   name:"Oshodi",          c:1, r:0, ground:"#e6e3c6", work:"Market" },
  { id:"ikorodu",  name:"Ikorodu",         c:2, r:0, ground:"#cfe6c0", work:"Boat Dock" },
  { id:"yaba",     name:"Yaba",            c:0, r:1, ground:"#d3e8d6", work:"Print Shop" },
  { id:"surulere", name:"Surulere",        c:1, r:1, ground:"#d9ecc4", work:"Water Stand" },
  { id:"vi",       name:"Victoria Island", c:2, r:1, ground:"#dfe9f0", work:"Office" },
  { id:"lekki",    name:"Lekki",           c:2, r:2, ground:"#f2ead2", work:"Event Hall" }
];
const WATER = [{c:0,r:2},{c:1,r:2}];
let HOME_DISTRICT = null;

/* Extra building lots (tile position, size, and the door spot) and what each district puts in them. */
const LOTS = {
  A:{ tx:16, ty:1,  w:6, h:4, dx:19,  dy:5.4  },
  B:{ tx:16, ty:13, w:6, h:4, dx:19,  dy:17.4 },
  C:{ tx:3,  ty:13, w:5, h:4, dx:5.5, dy:17.4 }
};
const SHOPS = {
  surulere:{ A:"food" }, yaba:{ A:"food" }, oshodi:{ A:"food" }, ikorodu:{ A:"food" },
  ikeja:{ A:"biz", B:"cars" }, vi:{ A:"biz", B:"food" }, lekki:{ A:"cars", B:"food" }
};
const SHOP_INFO = {
  food:{ label:"Restaurant", sign:"FOOD",     spot:"🍲 Eat" },
  biz: { label:"Business Hub", sign:"BUSINESS", spot:"📈 Business Hub" },
  cars:{ label:"Car Dealer", sign:"CARS",     spot:"🚗 Car Dealer" }
};
/* All characters below are fictional. */
const CELEB_POS = {
  ife_marvelle:{ did:"ikeja", tx:9.8, ty:6.8 }, gov_eze:{ did:"ikeja", tx:19.5, ty:9.5 },
  dj_kasa:{ did:"yaba", tx:9.8, ty:6.8 }, mama_put:{ did:"surulere", tx:9.8, ty:6.8 },
  mr_laffs:{ did:"oshodi", tx:9.8, ty:6.8 }, star_ola:{ did:"lekki", tx:9.8, ty:6.8 },
  chief_dike:{ did:"vi", tx:9.8, ty:6.8 }, coach_baba:{ did:"ikorodu", tx:9.8, ty:6.8 }
};
const NAMES = ["Tunde","Amaka","Chidi","Bisi","Emeka","Zainab","Kola","Ngozi","Ibrahim","Folake","Segun","Hauwa"];
const SHIRTS = ["#e53935","#1e88e5","#8e24aa","#fb8c00","#00897b","#6d4c41","#d81b60","#3949ab"];

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const solids = [];     // {x,y,w,h}
const scenery = [];    // drawable things: {k,x,y,w,h,...}
const spots = [];      // interactables: {kind,x,y,did}
const npcs = [];

function districtAt(px, py){
  const c = Math.floor(px / (DW * T)), r = Math.floor(py / (DH * T));
  return DISTRICTS.find(d => d.c === c && d.r === r) || null;
}

function buildWorld(){
  // lagoon
  WATER.forEach(w => {
    const rect = { x:w.c*DW*T, y:w.r*DH*T, w:DW*T, h:DH*T };
    solids.push(rect); scenery.push({ k:"water", ...rect });
  });

  DISTRICTS.forEach((d, idx) => {
    const ox = d.c * DW * T, oy = d.r * DH * T;
    const rand = rng(1000 + idx * 77);
    const taken = [];     // tile rects used (x,y,w,h in tiles)
    const free = (x, y, w, h) => !taken.some(t => x < t.x + t.w + 1 && x + w + 1 > t.x && y < t.y + t.h + 1 && y + h + 1 > t.y);

    // reserved: road bands + building lots
    taken.push({ x:0, y:7, w:DW, h:5 });         // horizontal road band (with margin)
    taken.push({ x:10, y:0, w:5, h:DH });        // vertical road band (with margin)

    // roads (scenery only)
    scenery.push({ k:"road", x:ox, y:oy + 8*T, w:DW*T, h:3*T });
    scenery.push({ k:"road", x:ox + 11*T, y:oy, w:3*T, h:DH*T });

    // work building
    const wb = { x:ox + 3*T, y:oy + 2*T, w:6*T, h:4*T };
    solids.push(wb);
    scenery.push({ k:"work", ...wb, label:d.work });
    taken.push({ x:3, y:2, w:6, h:4 });
    spots.push({ kind:"work", did:d.id, x:ox + 6*T, y:oy + 6.4*T, label:"💼 Work" });

    // bus stop
    scenery.push({ k:"bus", x:ox + 15*T, y:oy + 6*T, w:T, h:2*T });
    spots.push({ kind:"bus", did:d.id, x:ox + 15.5*T, y:oy + 7.2*T, label:"🚌 Bus" });
    if (d.id === "yaba" || d.id === "surulere") spots.push({ kind:"lagoon", did:d.id, x:ox + 12.5*T, y:oy + 17.3*T, label:"🌊 Look out" });

    // every district has a house lot: it is YOUR home only in your home district
    if (!(SHOPS[d.id] && SHOPS[d.id].C)){
      const hb = { x:ox + 3*T, y:oy + 13*T, w:5*T, h:4*T };
      const mine = (HOME_DISTRICT === d.id);
      solids.push(hb);
      scenery.push({ k:mine ? "home" : "house", ...hb, tint:idx % 4, mine });
      taken.push({ x:3, y:13, w:5, h:4 });
      spots.push(mine ? { kind:"home", did:d.id, x:ox + 5.5*T, y:oy + 17.4*T, label:"🏠 Home" }
                      : { kind:"house", did:d.id, x:ox + 5.5*T, y:oy + 17.4*T, label:"🚪 Knock" });
    }

    // food, business hub and car dealer lots
    const shops = SHOPS[d.id] || {};
    Object.keys(shops).forEach(k => {
      const L = LOTS[k], kind = shops[k];
      const r = { x:ox + L.tx*T, y:oy + L.ty*T, w:L.w*T, h:L.h*T };
      solids.push(r);
      scenery.push({ k:"shop", ...r, kind });
      taken.push({ x:L.tx, y:L.ty, w:L.w, h:L.h });
      spots.push({ kind, did:d.id, x:ox + L.dx*T, y:oy + L.dy*T, label:SHOP_INFO[kind].spot });
    });

    // houses
    for (let n = 0, tries = 0; n < 4 && tries < 80; tries++){
      const x = 1 + Math.floor(rand() * (DW - 5)), y = 1 + Math.floor(rand() * (DH - 5));
      if (!free(x, y, 3, 3)) continue;
      taken.push({ x, y, w:3, h:3 });
      const r = { x:ox + x*T, y:oy + y*T, w:3*T, h:3*T };
      solids.push(r);
      scenery.push({ k:"house", ...r, tint:Math.floor(rand() * 4) });
      spots.push({ kind:"house", did:d.id, x:r.x + 1.5*T, y:r.y + 3.4*T, label:"🚪 Knock" });
      n++;
    }
    // trees
    for (let n = 0, tries = 0; n < 16 && tries < 120; tries++){
      const x = Math.floor(rand() * DW), y = Math.floor(rand() * DH);
      if (!free(x, y, 1, 1)) continue;
      taken.push({ x, y, w:1, h:1 });
      solids.push({ x:ox + x*T + 10, y:oy + y*T + 10, w:12, h:14 });
      scenery.push({ k:"tree", x:ox + x*T, y:oy + y*T, w:T, h:T });
      n++;
    }
    // people
    for (let n = 0; n < 4; n++){
      const onRoadX = rand() < 0.5;
      const x = onRoadX ? ox + (11 + rand() * 3) * T : ox + (1 + rand() * (DW - 2)) * T;
      const y = onRoadX ? oy + (1 + rand() * (DH - 2)) * T : oy + (8 + rand() * 3) * T;
      npcs.push({ x, y, did:d.id, color:SHIRTS[Math.floor(rand() * SHIRTS.length)], name:NAMES[Math.floor(rand() * NAMES.length)],
                  dx:0, dy:0, timer:rand() * 2, hs:7 });
    }
  });
}

/* ============================ GAME STATE ============================ */
let state = null, places = [], homes = [], busy = false, modalOpen = false;
let carSpeeds = {}, celebData = {}, celebs = [];
const player = { x:0, y:0, hs:8, dir:1, step:0, face:0, moving:false };
let curDistrict = null, lastSafe = { x:0, y:0 }, walkingCheck = false;
let nearest = null;
const keys = {};
let joy = { x:0, y:0, active:false, id:null };

const canvas = $("c");
let VW = 0, VH = 0;
let camYaw = 0.6;
window.addEventListener("resize", () => resize());

/* ============================ HELPERS ============================ */
function toast(t, ms = 2400){
  const el = $("toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = "none"; }, ms);
}
function setHud(){
  if (!state) return;
  if (typeof refreshLocks === "function") refreshLocks();
  $("eTxt").textContent = state.energy;
  $("eBar").style.width = Math.max(0, Math.min(100, state.energy)) + "%";
  $("cTxt").textContent = state.coins;
  $("fTxt").textContent = state.fame;
  const d = DISTRICTS.find(x => x.id === state.location);
  $("place").textContent = "📍 " + (d ? d.name : "Lagos");
}
function hits(x, y, hs){
  if (x - hs < 0 || y - hs < 0 || x + hs > WORLD_W || y + hs > WORLD_H) return true;
  for (let i = 0; i < solids.length; i++){
    const s = solids[i];
    if (x + hs > s.x && x - hs < s.x + s.w && y + hs > s.y && y - hs < s.y + s.h) return true;
  }
  return false;
}
function tryMove(e, dx, dy){
  if (!hits(e.x + dx, e.y, e.hs)) e.x += dx;
  if (!hits(e.x, e.y + dy, e.hs)) e.y += dy;
}
function spawnAt(did){
  const d = DISTRICTS.find(x => x.id === did) || DISTRICTS.find(x => x.id === "surulere");
  player.x = d.c * DW * T + 12.5 * T;
  player.y = d.r * DH * T + 9.5 * T;
  curDistrict = d.id;
  lastSafe = { x:player.x, y:player.y };
}

/* ============================ MODAL ============================ */
function openModal(html){ $("box").innerHTML = html; $("modal").classList.add("show"); modalOpen = true; joy.x = joy.y = 0; }
function closeModal(){ $("modal").classList.remove("show"); modalOpen = false; }
let modalLocked = false;
$("modal").addEventListener("pointerdown", e => { if (e.target === $("modal") && !modalLocked) closeModal(); });

function delta(label, n){ return n === 0 ? "" : `<div class="row"><span>${label}</span><span class="${n > 0 ? "up" : "down"}">${n > 0 ? "+" : ""}${n}</span></div>`; }

/* ============================ SERVER ACTIONS ============================ */
async function rpc(name, args){
  const { data, error } = await db.rpc(name, args);
  if (error) throw error;
  return data;
}
async function loadPlaces(){
  if (places.length) return;
  try{ places = await rpc("starlife_locations_list") || []; }catch(e){ console.warn(e); }
}

async function openWork(){
  try{
    const jobs = await rpc("starlife_jobs_here");
    const d = DISTRICTS.find(x => x.id === state.location);
    openModal(`<h2>💼 Work in ${esc(d ? d.name : "Lagos")}</h2>
      <p>Take a shift to earn coins. Up to 2 shifts a day, and each uses energy.</p>
      ${(jobs && jobs.length) ? jobs.map(j => `<button class="opt" data-j="${esc(j.id)}">${esc(j.name)} · +${esc(j.pay)} coins · -${esc(j.energy_cost)} energy<small>${esc(j.blurb || "")}</small></button>`).join("") : "<p>No jobs here yet. Grow your fame or try another area.</p>"}
      <button class="btn alt" id="mClose">Close</button>`);
    $("mClose").onclick = closeModal;
    $("box").querySelectorAll("[data-j]").forEach(b => b.onclick = () => doWork(b.dataset.j));
  }catch(e){ toast(e.message || "Could not load jobs."); }
}
async function doWork(id){
  if (busy) return; busy = true;
  try{
    const r = await rpc("starlife_work", { p_job_id:id });
    state = r.state; setHud(); closeModal(); toast("Shift done. You earned " + r.earned + " coins.");
  }catch(e){ toast(e.message || "Could not take the job."); }
  finally{ busy = false; }
}

async function openHome(){
  try{
    if (!homes.length) homes = await rpc("starlife_homes_list") || [];
    const cur = homes.find(h => h.id === state.home_id) || homes[0];
    const ups = homes.filter(h => h.price > (cur ? cur.price : 0));
    openModal(`<h2>🏠 ${esc(cur ? cur.name : "Home")}</h2>
      <p>${esc(cur ? cur.blurb || "" : "")} Resting restores ${esc(cur ? cur.rest_energy : 10)} energy, once a day.</p>
      <button class="btn" id="mRest" ${state.rested_today ? "disabled" : ""}>${state.rested_today ? "You already rested today" : "😴 Rest at home"}</button>
      <h2 style="margin-top:18px">Upgrade your home</h2>
      ${ups.length ? ups.map(h => `<button class="opt" data-h="${esc(h.id)}">${esc(h.name)} · ${esc(h.price)} coins<small>${esc(h.blurb || "")} Rest: ${esc(h.rest_energy)} energy.</small></button>`).join("") : "<p>You live in the best home available. Well done!</p>"}
      <button class="btn alt" id="mClose">Close</button>`);
    $("mClose").onclick = closeModal;
    $("mRest").onclick = async () => {
      if (busy) return; busy = true;
      try{ state = await rpc("starlife_rest"); setHud(); closeModal(); toast("You rested and feel better."); }
      catch(e){ toast(e.message || "Could not rest."); }
      finally{ busy = false; }
    };
    $("box").querySelectorAll("[data-h]").forEach(b => b.onclick = async () => {
      if (busy) return; busy = true;
      try{ state = await rpc("starlife_buy_home", { p_home_id:b.dataset.h }); setHud(); closeModal(); toast("You moved into a better home!"); }
      catch(e){ toast(e.message || "Could not upgrade."); }
      finally{ busy = false; }
    });
  }catch(e){ toast(e.message || "Could not open your home."); }
}

async function openBus(){
  try{
    await loadPlaces();
    openModal(`<h2>🚌 Bus stop</h2><p>Skip the walk. Each trip costs coins and a little energy.</p>
      ${places.map(x => { const here = x.id === state.location;
        return `<button class="opt" data-p="${esc(x.id)}" ${here ? "disabled" : ""}>${esc(x.name)} · ${here ? "you are here" : esc(x.travel_cost) + " coins"}<small>${esc(x.blurb || "")}</small></button>`; }).join("")}
      <button class="btn alt" id="mClose">Close</button>`);
    $("mClose").onclick = closeModal;
    $("box").querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
      if (busy) return; busy = true;
      try{ state = await rpc("starlife_travel", { p_location:b.dataset.p }); spawnAt(state.location); setHud(); closeModal(); toast("You arrived."); }
      catch(e){ toast(e.message || "Could not travel."); }
      finally{ busy = false; }
    });
  }catch(e){ toast(e.message || "Could not open the bus stop."); }
}

async function talk(npc){
  if (busy) return;
  if (state.energy < 10){ toast("You are too tired to chat. Rest at home first."); return; }
  busy = true;
  try{
    const ev = await rpc("starlife_next_event");
    openModal(`<h2>${esc(ev.title)}</h2><p style="color:#173326">${esc(ev.body)}</p>
      ${ev.choices.map((c, i) => `<button class="opt" data-i="${i}">${esc(c)}</button>`).join("")}`);
    $("box").querySelectorAll("[data-i]").forEach(b => b.onclick = async () => {
      $("box").querySelectorAll(".opt").forEach(x => x.disabled = true);
      try{
        const r = await rpc("starlife_resolve", { p_event_id:ev.id, p_choice:Number(b.dataset.i) });
        state = r.state; setHud();
        openModal(`<h2>What happened</h2><p style="color:#173326">${esc(r.text)}</p>${delta("Fame", r.fame)}${delta("Coins", r.coins)}${delta("Energy", r.energy)}<button class="btn" id="mClose">Continue</button>`);
        $("mClose").onclick = closeModal;
      }catch(e){ closeModal(); toast(e.message || "Could not save your choice."); }
    });
  }catch(e){ toast(e.message || "Nobody wants to talk right now."); }
  finally{ busy = false; }
}

/* ============================ FOOD, BUSINESS, CARS, CELEBRITIES ============================ */
async function openFood(){

      celebs.push({ ...c, x:d.c * DW * T + pos.tx * T, y:d.r * DH * T + pos.ty * T, locked:state.fame < c.min_fame });
    });
  }catch(e){ console.warn("Celebrities unavailable:", e.message); }
}

/* ============================ CROSSING DISTRICTS ============================ */
async function checkDistrict(){
  if (walkingCheck || !state) return;
  const d = districtAt(player.x, player.y);
  if (!d){ return; }
  if (d.id === state.location){ lastSafe = { x:player.x, y:player.y }; curDistrict = d.id; return; }
  walkingCheck = true;
  try{
    state = await rpc("starlife_walk", { p_location:d.id });
    curDistrict = d.id; lastSafe = { x:player.x, y:player.y };
    setHud(); toast("You walked into " + d.name + " (-5 energy).");
  }catch(e){
    player.x = lastSafe.x; player.y = lastSafe.y;
    toast(e.message || "You cannot go there right now.");
  }finally{ walkingCheck = false; }
}

window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key === "f" || e.key === "Enter") doAct(); });

const joyEl = $("joy"), knob = $("knob");
function joyMove(e){
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), max = 46;
  if (m > max){ dx = dx / m * max; dy = dy / m * max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx / max; joy.y = dy / max;
}
joyEl.addEventListener("pointerdown", e => { joy.active = true; joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joyEl.addEventListener("pointermove", e => { if (joy.active && e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.active = false; joy.x = joy.y = 0; knob.style.transform = "translate(0,0)"; };
joyEl.addEventListener("pointerup", joyEnd); joyEl.addEventListener("pointercancel", joyEnd);
$("act").addEventListener("click", doAct);

function doAct(){
  if (modalOpen || !nearest || busy) return;
  if (nearest.kind === "work") openWork();
  else if (nearest.kind === "home") openHome();
  else if (nearest.kind === "bus") openBus();
  else if (nearest.kind === "npc") talk(nearest.ref);
  else if (nearest.kind === "food") openFood();
  else if (nearest.kind === "biz") openBiz();
  else if (nearest.kind === "cars") openCars();
  else if (nearest.kind === "celeb") meetCeleb(nearest.ref);
  else if (nearest.kind === "house") knock();
  else if (nearest.kind === "lagoon") lagoon();
}

/* ============================ UPDATE ============================ */
function update(dt){
  if (!state) return;
  // player
  if (!modalOpen){
    let ix = (keys["arrowright"] || keys["d"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] ? 1 : 0);
    let iy = (keys["arrowdown"] || keys["s"] ? 1 : 0) - (keys["arrowup"] || keys["w"] ? 1 : 0);
    if (joy.active){ ix = joy.x; iy = joy.y; }
    player.moving = false;
    if (keys["q"]) camYaw += dt * 1.8;
    if (keys["e"]) camYaw -= dt * 1.8;
    const m = Math.hypot(ix, iy);
    if (m > 0.12){
      const k = Math.min(1, m);
      const sp = 120 * (carSpeeds[state.car_id] || 1) * dt * k;
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
      const mx = (rx * ix + fx * -iy) / m, mz = (rz * ix + fz * -iy) / m;
      tryMove(player, mx * sp, mz * sp);
      player.face = Math.atan2(mx, mz);
      player.step += dt * 9;
      player.moving = true;
      checkDistrict();
    }
  }
  // npcs wander (only those near the player, to save battery)
  npcs.forEach(n => {
    if (Math.abs(n.x - player.x) > 700 || Math.abs(n.y - player.y) > 700) return;
    n.timer -= dt;
    if (n.timer <= 0){
      n.timer = 1.2 + Math.random() * 2.5;
      const a = Math.floor(Math.random() * 5);
      n.dx = a === 0 ? 1 : a === 1 ? -1 : 0; n.dy = a === 2 ? 1 : a === 3 ? -1 : 0;
    }
    const nx = n.x + n.dx * 34 * dt, ny = n.y + n.dy * 34 * dt;
    const d = DISTRICTS.find(x => x.id === n.did);
    const inside = nx > d.c * DW * T + 8 && nx < (d.c + 1) * DW * T - 8 && ny > d.r * DH * T + 8 && ny < (d.r + 1) * DH * T - 8;
    if (inside && !hits(nx, ny, n.hs)){ n.x = nx; n.y = ny; } else { n.timer = 0; }
  });
  // nearest interactable
  let best = null, bd = 56;
  spots.forEach(s => { const d = Math.hypot(s.x - player.x, s.y - player.y); if (d < bd){ bd = d; best = { kind:s.kind, label:s.label }; } });
  npcs.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < Math.min(bd, 44)){ bd = d; best = { kind:"npc", ref:n, label:"💬 Talk to " + n.name }; } });
  celebs.forEach(c => { const d = Math.hypot(c.x - player.x, c.y - player.y); if (d < Math.min(bd, 52)){ bd = d; best = { kind:"celeb", ref:c, label:(c.locked ? "🔒 " : "⭐ Meet ") + c.name }; } });
  nearest = modalOpen ? null : best;
  const a = $("act");
  if (nearest){ a.style.display = "block"; if (a.textContent !== nearest.label) a.textContent = nearest.label; } else a.style.display = "none";
}

/* ============================ 3D SCENE ============================ */
const U = 1 / 16;                 // pixels to world units: one tile is 2 units
let renderer, scene, camera, hemi, sun, marker;
const matCache = {};
const mat = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color:c }));
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
const SKIN = ["#8d5a3b", "#6d4228", "#a8714b", "#5a3825"];
let playerMesh, carGroup, beacon = null;
const npcMeshes = [], celebMeshes = [];

function labelSprite(text, bg, fg, wUnits){
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 64;
  const g = cv.getContext("2d");
  if (bg){ g.fillStyle = bg; g.fillRect(0, 0, 256, 64); }
  g.fillStyle = fg; g.font = "bold 28px Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true }));
  sp.scale.set(wUnits, wUnits / 4, 1);
  return sp;
}

function makePerson(shirt, skin){
  const g = new THREE.Group();
  const body = box(1.0, 1.2, 0.6, shirt); body.position.y = 1.5; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), mat(skin || SKIN[0])); head.position.y = 2.5; g.add(head);
  const hair = box(0.86, 0.22, 0.86, "#222222"); hair.position.y = 2.82; g.add(hair);
  const legL = box(0.38, 0.9, 0.4, "#2b3a55"); legL.geometry.translate(0, -0.45, 0); legL.position.set(-0.26, 0.9, 0); g.add(legL);
  const legR = legL.clone(); legR.position.x = 0.26; g.add(legR);
  const armL = box(0.3, 0.9, 0.3, shirt); armL.geometry.translate(0, -0.45, 0); armL.position.set(-0.65, 1.95, 0); g.add(armL);
  const armR = armL.clone(); armR.position.x = 0.65; g.add(armR);
  g.userData = { legL, legR, armL, armR };
  return g;
}
function animatePerson(g, step, moving){
  const u = g.userData, a = moving ? Math.sin(step) * 0.8 : 0;
  u.legL.rotation.x = a; u.legR.rotation.x = -a; u.armL.rotation.x = -a; u.armR.rotation.x = a;
}

function makeCar(id){
  const g = new THREE.Group();
  const col = { okada:"#ef6c00", tokunbo:"#1565c0", suv:"#2e7d32", luxury:"#212121" }[id] || "#555555";
  if (id === "okada"){
    const b = box(0.7, 0.5, 3.2, col); b.position.y = 0.7; g.add(b);
    [-1.2, 1.2].forEach(z => { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 10), mat("#111111")); w.rotation.z = Math.PI / 2; w.position.set(0, 0.5, z); g.add(w); });
  } else {
    const b = box(2.4, 0.9, 4.4, col); b.position.y = 0.9; g.add(b);
    const c = box(2.0, 0.8, 2.2, col); c.position.set(0, 1.7, -0.2); g.add(c);
    const gl = box(2.02, 0.5, 1.8, "#b3e5fc"); gl.position.set(0, 1.75, -0.2); g.add(gl);
    [[-1.2, 1.4], [1.2, 1.4], [-1.2, -1.4], [1.2, -1.4]].forEach(p => { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 10), mat("#111111")); w.rotation.z = Math.PI / 2; w.position.set(p[0], 0.5, p[1]); g.add(w); });
  }
  return g;
}

function buildBuilding(s){
  const g = new THREE.Group(), w = s.w * U, d = s.h * U;
  let h, wall, roof, label = null, flat = false;
  if (s.k === "work"){ h = 6; wall = "#f3e3b0"; roof = "#b5651d"; label = [s.label, "#064d25", "#ffffff"]; flat = true; }
  else if (s.k === "shop"){
    const cfg = { food:["#ffe0b2", "#e65100", "FOOD"], biz:["#d6e4ff", "#1a237e", "BUSINESS HUB"], cars:["#ffd6d6", "#b71c1c", "CAR DEALER"] }[s.kind];
    h = 6.5; wall = cfg[0]; roof = cfg[1]; label = [cfg[2], cfg[1], "#ffffff"]; flat = true;
  }
  else if (s.k === "home"){ h = 5.5; wall = "#dce8ff"; roof = "#2563a8"; label = ["YOUR HOME", "#2563a8", "#ffffff"]; }
  else { h = 3.6 + ((s.tint || 0) % 2) * 1.2; wall = ["#f4d9c6", "#e6e6e6", "#f7efc9", "#d9ead3"][(s.tint || 0) % 4]; roof = ["#a8442c", "#6b5b95", "#2f6f4f", "#b07a2e"][(s.tint || 0) % 4]; }
  const body = box(w, h, d, wall); body.position.y = h / 2; g.add(body);
  if (flat){ const slab = box(w + 0.6, 0.5, d + 0.6, roof); slab.position.y = h + 0.25; g.add(slab); }
  else { const cone = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.72, 2.6, 4), mat(roof)); cone.rotation.y = Math.PI / 4; cone.position.y = h + 1.3; g.add(cone); }
  const door = box(1.8, 2.6, 0.2, "#5d4037"); door.position.set(0, 1.3, d / 2 + 0.05); g.add(door);
  [-1, 1].forEach(sx => { const win = box(1.6, 1.4, 0.15, "#8ecae6"); win.position.set(sx * w * 0.28, h * 0.58, d / 2 + 0.05); g.add(win); });
  if (label){ const sp = labelSprite(label[0], label[1], label[2], 6.4); sp.position.set(0, h * 0.86, d / 2 + 0.4); g.add(sp); }
  g.position.set((s.x + s.w / 2) * U, 0, (s.y + s.h / 2) * U);
  if (s.k === "home" && s.mine){
    beacon = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.4, 4), new THREE.MeshBasicMaterial({ color:"#ffd54f" }));
    beacon.rotation.x = Math.PI; beacon.position.set(g.position.x, h + 5, g.position.z); scene.add(beacon);
  }
  return g;
}

function buildScene(){
  try{
    renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:"low-power" });
  }catch(e){ throw new Error("WEBGL"); }
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#8fd0f0");
  scene.fog = new THREE.Fog("#8fd0f0", 60, 190);
  camera = new THREE.PerspectiveCamera(55, 1, 0.5, 400);
  hemi = new THREE.HemisphereLight(0xffffff, 0x6b8f5a, 0.9); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(40, 80, 30); scene.add(sun);

  DISTRICTS.forEach(d => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(DW * T * U, DH * T * U), mat(d.ground));
    m.rotation.x = -Math.PI / 2; m.position.set((d.c + 0.5) * DW * T * U, 0, (d.r + 0.5) * DH * T * U); scene.add(m);
  });

  const dashes = [], trees = [];
  scenery.forEach(s => {
    const w = s.w * U, dpt = s.h * U, cx = (s.x + s.w / 2) * U, cz = (s.y + s.h / 2) * U;
    if (s.k === "road"){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, dpt), mat("#4b5058"));
      m.rotation.x = -Math.PI / 2; m.position.set(cx, 0.03, cz); scene.add(m);
      if (s.w > s.h){ for (let x = s.x + 16; x < s.x + s.w; x += 48) dashes.push([ (x + 10) * U, cz, 0 ]); }
      else { for (let y = s.y + 16; y < s.y + s.h; y += 48) dashes.push([ cx, (y + 10) * U, Math.PI / 2 ]); }
    } else if (s.k === "water"){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, dpt), new THREE.MeshLambertMaterial({ color:"#3b8ed0", transparent:true, opacity:0.92 }));
      m.rotation.x = -Math.PI / 2; m.position.set(cx, 0.06, cz); scene.add(m);
    } else if (s.k === "tree"){
      trees.push([(s.x + 16) * U, (s.y + 16) * U]);
    } else if (s.k === "bus"){
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.4, 6), mat("#555555")); pole.position.y = 1.7; g.add(pole);
      const sign = box(1.8, 0.9, 0.12, "#fbc02d"); sign.position.y = 3.3; g.add(sign);
      const sp = labelSprite("BUS", null, "#222222", 1.7); sp.position.set(0, 3.3, 0.2); g.add(sp);
      g.position.set((s.x + 16) * U, 0, (s.y + 32) * U); scene.add(g);
    } else {
      scene.add(buildBuilding(s));
    }
  });

  // road dashes (one draw call)
  if (dashes.length){
    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1.4, 0.02, 0.16), new THREE.MeshBasicMaterial({ color:"#e9e3a0" }), dashes.length);
    const dm = new THREE.Object3D();
    dashes.forEach((p, i) => { dm.position.set(p[0], 0.05, p[1]); dm.rotation.y = p[2]; dm.updateMatrix(); im.setMatrixAt(i, dm.matrix); });
    scene.add(im);
  }
  // trees (two draw calls)
  if (trees.length){
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.32, 1.8, 6), mat("#6d4c41"), trees.length);
    const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(1.5, 3.4, 7), mat("#2e7d32"), trees.length);
    const dm = new THREE.Object3D();
    trees.forEach((p, i) => {
      const k = 0.85 + ((p[0] * 7 + p[1] * 3) % 5) / 12;
      dm.rotation.set(0, 0, 0); dm.scale.set(k, k, k);
      dm.position.set(p[0], 0.9 * k, p[1]); dm.updateMatrix(); trunks.setMatrixAt(i, dm.matrix);
      dm.position.set(p[0], 3.3 * k, p[1]); dm.updateMatrix(); leaves.setMatrixAt(i, dm.matrix);
    });
    scene.add(trunks); scene.add(leaves);
  }

  // people
  npcs.forEach(n => {
    const m = makePerson(n.color, SKIN[Math.floor((n.x + n.y) % SKIN.length)]);
    const tag = labelSprite(n.name, "rgba(0,0,0,0.65)", "#ffffff", 3.4); tag.position.y = 3.9; tag.visible = false; m.add(tag);
    m.userData.tag = tag; scene.add(m); npcMeshes.push(m);
  });
  celebs.forEach(c => {
    const m = makePerson(c.locked ? "#78909c" : "#f9a825", SKIN[1]);
    const star = labelSprite(c.locked ? "🔒" : "⭐", null, "#000000", 2.2); star.position.y = 4.6; m.add(star);
    const tag = labelSprite(c.name, "rgba(0,0,0,0.75)", "#ffd54f", 4.2); tag.position.y = 3.9; tag.visible = false; m.add(tag);
    m.userData.tag = tag; m.userData.star = star; m.position.set(c.x * U, 0, c.y * U); scene.add(m); celebMeshes.push(m);
  });

  // player and car
  playerMesh = makePerson("#1b8f3a", SKIN[0]);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 0.95, 20), new THREE.MeshBasicMaterial({ color:"#b7ef43", side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.08; playerMesh.add(ring);
  scene.add(playerMesh);
  carGroup = null;

  marker = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.5, 24), new THREE.MeshBasicMaterial({ color:"#ffd54f", side:THREE.DoubleSide, transparent:true, opacity:0.9 }));
  marker.rotation.x = -Math.PI / 2; marker.visible = false; scene.add(marker);

  updateSky();
}

let lastCar = "__none__";
function syncCar(){
  const id = state && state.car_id ? state.car_id : null;
  if (id === lastCar) return;
  lastCar = id;
  if (carGroup){ playerMesh.remove(carGroup); carGroup = null; }
  const u = playerMesh.userData;
  if (id){
    carGroup = makeCar(id); playerMesh.add(carGroup);
    u.legL.visible = u.legR.visible = false;
  } else { u.legL.visible = u.legR.visible = true; }
}

function updateSky(){
  const t = new Date(), h = t.getHours() + t.getMinutes() / 60;
  let d;
  if (h < 5 || h >= 19.5) d = 0; else if (h < 6.5) d = (h - 5) / 1.5; else if (h < 18) d = 1; else d = (19.5 - h) / 1.5;
  const col = new THREE.Color("#0a1233").lerp(new THREE.Color("#8fd0f0"), d);
  scene.background = col; scene.fog.color = col;
  hemi.intensity = 0.28 + 0.7 * d; sun.intensity = 0.06 + 0.8 * d;
}

function resize(){
  VW = window.innerWidth; VH = window.innerHeight;
  if (!renderer) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(VW, VH, false);
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
}

const CAM_R = 15, CAM_H = 12;
function camTarget(){
  return new THREE.Vector3(player.x * U + Math.sin(camYaw) * CAM_R, CAM_H, player.y * U + Math.cos(camYaw) * CAM_R);
}
function snapCamera(){ camera.position.copy(camTarget()); camera.lookAt(player.x * U, 1.5, player.y * U); }

function angleLerp(a, b, t){ let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }

function draw(dt){
  syncCar();
  // player
  playerMesh.position.set(player.x * U, carGroup ? 0.2 : 0, player.y * U);
  playerMesh.rotation.y = angleLerp(playerMesh.rotation.y, player.face, Math.min(1, dt * 12));
  animatePerson(playerMesh, player.step, player.moving && !carGroup);

  // people
  npcs.forEach((n, i) => {
    const m = npcMeshes[i]; if (!m) return;
    m.position.set(n.x * U, 0, n.y * U);
    const mv = n.dx !== 0 || n.dy !== 0;
    if (mv) m.rotation.y = angleLerp(m.rotation.y, Math.atan2(n.dx, n.dy), Math.min(1, dt * 8));
    animatePerson(m, performance.now() / 150 + i, mv);
    m.userData.tag.visible = Math.hypot(n.x - player.x, n.y - player.y) < 150;
  });
  const tms = performance.now() / 300;
  celebs.forEach((c, i) => {
    const m = celebMeshes[i]; if (!m) return;
    m.userData.star.position.y = 4.6 + Math.sin(tms + i) * 0.2;
    m.userData.tag.visible = Math.hypot(c.x - player.x, c.y - player.y) < 190;
    m.rotation.y = Math.atan2(player.x - c.x, player.y - c.y) * (Math.hypot(c.x - player.x, c.y - player.y) < 190 ? 1 : 0);
  });
  if (beacon) { beacon.rotation.y += dt * 2; beacon.position.y = 11 + Math.sin(tms) * 0.4; }

  // interaction marker
  if (nearest){
    const ref = nearest.ref || nearest;
    let tx, ty;
    if (nearest.kind === "npc" || nearest.kind === "celeb"){ tx = ref.x; ty = ref.y; }
    else { const sp = spots.find(s => s.kind === nearest.kind && Math.hypot(s.x - player.x, s.y - player.y) < 60); if (sp){ tx = sp.x; ty = sp.y; } }
    if (tx !== undefined){ marker.visible = true; marker.position.set(tx * U, 0.1, ty * U); marker.scale.setScalar(1 + Math.sin(tms * 2) * 0.08); } else marker.visible = false;
  } else marker.visible = false;

  // camera follow
  camera.position.lerp(camTarget(), 1 - Math.pow(0.0005, dt));
  camera.lookAt(player.x * U, 1.5, player.y * U);
  renderer.render(scene, camera);
}

/* turn the camera by dragging anywhere outside the joystick */
let dragCam = null;
canvas.addEventListener("pointerdown", e => { dragCam = { id:e.pointerId, x:e.clientX }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if (dragCam && e.pointerId === dragCam.id){ camYaw -= (e.clientX - dragCam.x) * 0.008; dragCam.x = e.clientX; } });
["pointerup", "pointercancel"].forEach(t => canvas.addEventListener(t, e => { if (dragCam && e.pointerId === dragCam.id) dragCam = null; }));

let last = performance.now(), skyTimer = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  skyTimer -= dt; if (skyTimer <= 0){ skyTimer = 5; updateSky(); }
  draw(dt);
  requestAnimationFrame(loop);
}

/* ============================ START ============================ */
function screen(html){ const m = $("msgScreen"); m.innerHTML = html; m.style.display = "flex"; }

async function init(){
  try{
    const { data: u } = await db.auth.getUser();
    if (!u?.user){ location.replace("login.html"); return; }
    const { data: flag, error } = await db.from("platform_feature_flags").select("enabled").eq("key", "starlife").maybeSingle();
    if (error || !flag || flag.enabled !== true){ screen("Naija Star Life is not open yet.<br><a href='dashboard.html'>Back to dashboard</a>"); return; }
    state = await rpc("starlife_state");
    if (!state.career){ screen("Choose your career first.<br><br><a href='starlife.html'>Open Star Life</a>"); return; }
    if (!state.background) await pickBackground();
    const wk = await rpc("starlife_wake");
    state = wk.state; HOME_DISTRICT = state.home_district;
    await loadPlaces();
    buildWorld();
    await loadExtras();
    buildScene();
    resize();
    if (wk.woke) spawnHome(); else spawnAt(state.location);
    snapCamera();
    setHud();
    $("hud").style.display = "flex";
    $("msgScreen").style.display = "none";
    if (wk.woke) showWake();
    let seen = false; try{ seen = localStorage.getItem("slw3_help") === "1"; }catch(e){}
    if (!seen){
      openModal(`<h2>Welcome to Lagos 🌆</h2>
        <p>Use the joystick to walk and drag on the right side of the screen to turn the camera. Go near a building, bus stop, house or person and tap the green button.</p>
        <p>💼 Work buildings pay coins. 🏠 Your home is in Surulere and restores energy. 💬 Talking to people starts story events. Walking into a new area costs a little energy.</p>
        <p>🍲 Restaurants restore energy. 📈 The Business Hub lets you invest for daily income. 🚗 Cars make you faster. ⭐ Famous (made-up) characters notice you as your fame grows.</p>
        <button class="btn" id="mClose">Start walking</button>`);
      $("mClose").onclick = () => { try{ localStorage.setItem("slw3_help", "1"); }catch(e){} closeModal(); };
    }
    requestAnimationFrame(loop);
  }catch(e){
    console.error(e);
    if (e && e.message === "WEBGL") screen("Your phone or browser cannot show the 3D world.<br><br><a href='starlife-world.html'>Open the lighter 2D world</a>");
    else screen("Could not open the world. Check your internet and refresh.<br><br><a href='starlife-world.html'>Open the lighter 2D world</a> &nbsp; <a href='starlife.html'>Star Life menu</a>");
  }
}
init();
</script>
