const matCache=new Map();
function material(color,roughness=.9){const key=String(color);if(!matCache.has(key))matCache.set(key,new THREE.MeshStandardMaterial({color,roughness}));return matCache.get(key);}
function meshBox(w,h,d,color,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y+h/2,z);m.castShadow=false;m.receiveShadow=true;parent.add(m);return m;}

function labelSprite(text,bg="#123d2b"){const c=document.createElement("canvas");c.width=512;c.height=128;const g=c.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,512,128);g.fillStyle="#fff";g.font="bold 46px Arial";g.textAlign="center";g.textBaseline="middle";g.fillText(text,256,66,480);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:false}));s.scale.set(12,3,1);return s;}

 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);

 }

 colliders.push({x:x+w/2,z:z+d/2,w:w+1,d:d+1});
 if(type){spots.push({kind:type,label:name,x:x+w/2,z:z+d+3,area:area.id,icon:({work:"💼",food:"🍲",home:"🏠",bus:"🚌",landmark:"🏛️",market:"🧺"})[type]||"📍"});}
 return g;

 plane(440,440,0x9eae8a,0,0,-.15);

 }
 // Lane markings.
 for(let p=-205;p<205;p+=12){meshBox(.18,.025,4,0xe8dcae,-6.5,.05,p);meshBox(.18,.025,4,0xe8dcae,6.5,.05,p);meshBox(4,.025,.18,0xe8dcae,p,.05,-6.5);meshBox(4,.025,.18,0xe8dcae,p,.05,6.5);}
}
function buildCity(){
 buildRoads();
 AREAS.forEach((a,i)=>{
  plane(88,88,a.ground,a.x,a.z,.02);
  const offsets=[[-31,-29],[7,-29],[-31,9],[7,9]];

   const w=j===0?23: j===1?25:22,d=j===2?23:20,h=(j===0&&a.id==="vi")?19:8+(i+j)%4*2;

   makeBuilding(a,a.x+o[0],a.z+o[1],w,d,h,title,types[j][0],i+j);
  });
  // Local identity sign, street trees and public benches.
  const sign=labelSprite(a.name.toUpperCase()+" · "+a.tag,"#075638");sign.position.set(a.x,7,a.z-42);sign.scale.set(23,5,1);scene.add(sign);
  [[-42,-42],[42,-42],[-42,42],[42,42]].forEach((p,k)=>{if(k!==2)addTree(a.x+p[0],a.z+p[1],.8+(k%2)*.15);});
  addLamp(a.x-8,a.z-39);addLamp(a.x+8,a.z+39);

  // Area-specific landmark marker.

  spots.push({kind:"landmark",label:lm,x:a.x+28,z:a.z+12,area:a.id,icon:"🏛️"});
 });
 // Lagoon at the lower edge and a visible bridge approach.
 plane(145,35,0x4d9da9,-130,174,-.02);
 for(let x=-194;x<-65;x+=8){const wave=meshBox(4,.03,.12,0x9bd4d3,x,.03,174);}
 // Roadside kiosks and benches.
 for(let i=0;i<14;i++){const x=-180+i*27;meshBox(4,2.8,3,0xe1a65b,x,0,18);meshBox(4.3,.35,3.3,0x8b492b,x,2.8,18);}

function makePerson(shirt=0x16824a,skin=0x754a32){
 const g=new THREE.Group();
 const torso=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.35,8),material(shirt));torso.position.y=1.45;g.add(torso);

 g.userData.phase=Math.random()*6.28;return g;

function canonicalArea(id){
 const raw=String(id||"surulere").toLowerCase().replace(/[\s-]+/g,"_");
 if(DISTRICT_ALIAS[raw])return DISTRICT_ALIAS[raw];
 return AREAS.some(a=>a.id===raw)?raw:"surulere";
}

 if(!player)return null;let best=null,dist=Infinity;
 for(const s of spots){const d=Math.hypot(s.x-player.x,s.z-player.z);if(d<dist){best=s;dist=d;}}

}

 else btn.style.display="none";
}
function collides(x,z){
 if(Math.abs(x)>WORLD.limit||Math.abs(z)>WORLD.limit)return true;
 return colliders.some(c=>x>c.x-c.w/2-1.3&&x<c.x+c.w/2+1.3&&z>c.z-c.d/2-1.3&&z<c.z+c.d/2+1.3);
}
function movePlayer(dt){
 if(!player||modalOpen)return;
 let forward=-joy.y,side=joy.x;
 if(keys.ArrowUp||keys.w)forward=1;if(keys.ArrowDown||keys.s)forward=-1;if(keys.ArrowLeft||keys.a)side=-1;if(keys.ArrowRight||keys.d)side=1;
 const mag=Math.hypot(forward,side);if(mag<.08)return;
 forward/=Math.max(1,mag);side/=Math.max(1,mag);
 const speed=13,dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt,dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;
 const nx=player.x+dx,nz=player.z+dz;
 if(!collides(nx,player.z))player.x=nx;if(!collides(player.x,nz))player.z=nz;
 player.angle=Math.atan2(dx,dz);playerGroup.rotation.y=player.angle;
}
function cameraUpdate(dt){

 if(!state)return;
 $("coins").textContent=Number(state.coins||0).toLocaleString();$("fame").textContent=Number(state.fame||0).toLocaleString();
 $("energyText").textContent=Math.round(state.energy??100);$("energyFill").style.width=Math.max(0,Math.min(100,Number(state.energy??100)))+"%";
 const a=areaForState();$("district").textContent="📍 "+a.name+" · "+a.tag;
}
function toast(msg){const t=$("toast");t.textContent=String(msg||"");t.style.display="block";clearTimeout(lastToast);lastToast=setTimeout(()=>t.style.display="none",2600);}
function openModal(content){$("sheetContent").innerHTML=content; $("modal").classList.add("open");modalOpen=true;joy.x=joy.y=0;updateAction();}
function closeModal(){ $("modal").classList.remove("open");modalOpen=false;updateAction();}
function safeText(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data;}
function setState(next){if(next&&typeof next==="object")state=next;updateHud();}
async function withBusy(fn){if(busy)return;busy=true;try{await fn();}catch(e){toast(e.message||"That action could not be completed.");}finally{busy=false;}}
function openWelcome(){
 openModal('<div style="font-size:11px;font-weight:900;color:#087f43;letter-spacing:1px">YOUR LAGOS STORY STARTS HERE</div><h2>Welcome to the neighbourhood 🇳🇬</h2><p>Explore the streets, meet people, find work and build your life. Use the joystick to walk and drag the open screen to turn the camera. Walk close to a place and tap the green action button.</p><div class="stat-grid"><div class="stat"><b>🚶</b><span>Explore</span></div><div class="stat"><b>💼</b><span>Work</span></div><div class="stat"><b>🤝</b><span>Meet people</span></div></div><button class="primary" id="welcomeGo">Enter Lagos</button>');
 $("welcomeGo").onclick=closeModal;
}
async function openWork(){
 await withBusy(async()=>{
  const jobs=await rpc("starlife_jobs_here");
  openModal('<h2>💼 Work opportunities</h2><p>Choose a shift in '+safeText(areaForState().name)+'. Your game rewards and energy use are controlled by the game server.</p>'+
   ((jobs||[]).length?jobs.map(j=>'<button class="option" data-job="'+safeText(j.id)+'">'+safeText(j.name)+' · +'+safeText(j.pay)+' coins<small>'+safeText(j.blurb||"A shift in your neighbourhood.")+' · Energy cost '+safeText(j.energy_cost)+'</small></button>').join(""):'<p>No shifts are available here right now.</p>')+
   '<button class="secondary" id="dismiss">Close</button>');
  document.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>withBusy(async()=>{const r=await rpc("starlife_work",{p_job_id:b.dataset.job});setState(r.state);closeModal();toast("Shift complete · +"+r.earned+" game coins");}));
  $("dismiss").onclick=closeModal;
 });
}
async function openFood(){
 await withBusy(async()=>{
  const foods=await rpc("starlife_foods_list");
  openModal('<h2>🍲 Mama Put</h2><p>Choose a meal. Prices and energy restoration come from the game.</p>'+
  (foods||[]).map(f=>'<button class="option" data-food="'+safeText(f.id)+'">'+safeText(f.name)+' · '+safeText(f.price)+' coins<small>Restore '+safeText(f.energy)+' energy</small></button>').join("")+
  '<button class="secondary" id="dismiss">Close</button>');
  document.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>withBusy(async()=>{const next=await rpc("starlife_eat",{p_food_id:b.dataset.food});setState(next);closeModal();toast("Meal enjoyed. Take care of yourself!");}));
  $("dismiss").onclick=closeModal;
 });
}
async function openTravel(){
 await withBusy(async()=>{
  if(!places.length){try{places=await rpc("starlife_locations_list")||[];}catch(e){places=[];}}
  const list=places.length?places:AREAS.map(a=>({id:a.id,name:a.name,travel_cost:"",blurb:a.tag}));
  openModal('<h2>🚌 Explore Lagos</h2><p>Travel to another neighbourhood. Your existing game travel rules and costs still apply.</p>'+
  list.map(p=>'<button class="option" data-place="'+safeText(p.id)+'" '+(canonicalArea(p.id)===canonicalArea(state.location)?"disabled":"")+'>'+safeText(p.name)+'<small>'+safeText(p.blurb||"Explore a new part of Lagos.")+(p.travel_cost?" · "+safeText(p.travel_cost)+" coins":"")+'</small></button>').join("")+
  '<button class="secondary" id="dismiss">Close</button>');
  document.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>withBusy(async()=>{const next=await rpc("starlife_travel",{p_location:b.dataset.place});setState(next);spawnAtState();closeModal();toast("You arrived in "+areaForState().name+".");}));
  $("dismiss").onclick=closeModal;
 });
}
async function openHome(){
 await withBusy(async()=>{
  if(!homes.length){try{homes=await rpc("starlife_homes_list")||[];}catch(e){homes=[];}}
  const home=homes.find(h=>h.id===state.home_id)||homes[0];
  openModal('<h2>🏠 Your home</h2><p>'+safeText(home?.blurb||"Your place to rest and plan your next move.")+'</p>'+
   '<div class="stat-grid"><div class="stat"><b>⚡ '+safeText(home?.rest_energy??"—")+'</b><span>Rest energy</span></div><div class="stat"><b>🪙 '+safeText(home?.rent??0)+'</b><span>Weekly rent</span></div><div class="stat"><b>🏡</b><span>'+safeText(home?.name||"Home")+'</span></div></div>'+
   '<button class="primary" id="rest" '+(state.rested_today?"disabled":"")+'>'+(state.rested_today?"Already rested today":"😴 Rest and recover")+'</button>'+
   '<button class="secondary" id="shower">🚿 Take a shower</button><button class="secondary" id="toilet">🚽 Use the toilet</button><button class="secondary" id="dismiss">Close</button>');
  $("rest").onclick=()=>withBusy(async()=>{const next=await rpc("starlife_rest");setState(next);closeModal();toast("You feel rested. Ready for the day.");});
  $("shower").onclick=()=>withBusy(async()=>{const next=await rpc("starlife_home_care",{p_kind:"shower"});setState(next);closeModal();toast("Fresh and ready.");});
  $("toilet").onclick=()=>withBusy(async()=>{const next=await rpc("starlife_home_care",{p_kind:"toilet"});setState(next);closeModal();toast("All sorted.");});
  $("dismiss").onclick=closeModal;
 });
}
async function openConversation(){
 await withBusy(async()=>{
  const event=await rpc("starlife_next_event");
  const greetings=["How far, my person? Lagos is moving today!","You dey alright? Keep your head up. Better days ahead.","Welcome o! How your hustle dey go?"];
  openModal('<h2>🤝 '+safeText("Neighbour")+'</h2><p>'+greetings[Math.floor(Math.random()*greetings.length)]+'</p><h2>'+safeText(event.title)+'</h2><p>'+safeText(event.body)+'</p>'+
   (event.choices||[]).map((c,i)=>'<button class="option" data-choice="'+i+'">'+safeText(c)+'</button>').join(""));
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>withBusy(async()=>{const result=await rpc("starlife_resolve",{p_event_id:event.id,p_choice:Number(b.dataset.choice)});setState(result.state);openModal('<h2>What happened</h2><p>'+safeText(result.text)+'</p><div class="stat-grid"><div class="stat"><b>'+safeText(result.fame||0)+'</b><span>Fame</span></div><div class="stat"><b>'+safeText(result.coins||0)+'</b><span>Coins</span></div><div class="stat"><b>'+safeText(result.energy||0)+'</b><span>Energy</span></div></div><button class="primary" id="done">Continue</button>');$("done").onclick=closeModal;}));
 });
}
async function openPhone(){
 const meter=(name,value)=>'<div style="display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12px"><span style="width:95px">'+name+'</span><div style="height:8px;background:#e4ece4;border-radius:8px;flex:1;overflow:hidden"><i style="display:block;width:'+Math.max(0,Math.min(100,Number(value||0)))+'%;height:100%;background:#0b9651"></i></div><b>'+safeText(value??0)+'</b></div>';
 openModal('<h2>📱 Your phone</h2><div class="stat-grid"><div class="stat"><b>'+safeText(state.coins)+'</b><span>Game coins</span></div><div class="stat"><b>'+safeText(state.fame)+'</b><span>Fame</span></div><div class="stat"><b>'+safeText(state.energy)+'</b><span>Energy</span></div></div><h2>Your needs</h2>'+
 meter("🍗 Hunger",state.hunger)+meter("🚿 Hygiene",state.hygiene)+meter("🚽 Bladder",state.bladder)+meter("🎉 Fun",state.fun)+meter("👥 Social",state.social)+
 '<button class="option" id="phoneWork">💼 Find a job</button><button class="option" id="phoneFood">🍲 Order food</button><button class="option" id="phoneTravel">🚌 Travel around Lagos</button><button class="option" id="phoneHome">🏠 Manage your home</button><button class="secondary" id="dismiss">Close phone</button>');
 $("phoneWork").onclick=openWork;$("phoneFood").onclick=openFood;$("phoneTravel").onclick=openTravel;$("phoneHome").onclick=openHome;$("dismiss").onclick=closeModal;
}
function interact(){
 const s=actionSpot;if(!s)return;
 if(s.kind==="work")openWork();
 else if(s.kind==="food")openFood();
 else if(s.kind==="home")openHome();
 else if(s.kind==="bus")openTravel();
 else if(s.kind==="market")openFood();
 else if(s.kind==="landmark"){
  const a=AREAS.find(x=>x.id===s.area);
  openModal('<h2>🏛️ '+safeText(s.label)+'</h2><p>You are exploring '+safeText(a?.name||"Lagos")+'. Walk around the landmark, meet people and discover the character of this neighbourhood.</p><button class="primary" id="meet">🤝 Meet someone nearby</button><button class="secondary" id="dismiss">Close</button>');
  $("meet").onclick=openConversation;$("dismiss").onclick=closeModal;
 }
}
function bindJoystick(){
 const pad=$("joystick"),stick=$("stick");let active=false,pid=null;
 function set(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=39,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max;}joy.x=dx/max;joy.y=dy/max;stick.style.transform="translate("+dx+"px,"+dy+"px)";}
 pad.addEventListener("pointerdown",e=>{active=true;pid=e.pointerId;pad.setPointerCapture(pid);set(e);});
 pad.addEventListener("pointermove",e=>{if(active&&e.pointerId===pid)set(e);});
 const reset=()=>{active=false;pid=null;joy.x=joy.y=0;stick.style.transform="translate(0,0)";};
 pad.addEventListener("pointerup",reset);pad.addEventListener("pointercancel",reset);pad.addEventListener("lostpointercapture",reset);
}
function bindLook(){
 const c=$("world");
 c.addEventListener("pointerdown",e=>{if(modalOpen||e.pointerType==="mouse"&&e.button!==0)return;touchLook={id:e.pointerId,x:e.clientX,y:e.clientY};});
 c.addEventListener("pointermove",e=>{if(!touchLook||touchLook.id!==e.pointerId)return;const dx=e.clientX-touchLook.x;touchLook.x=e.clientX;touchLook.y=e.clientY;yaw-=dx*.006;});
 c.addEventListener("pointerup",()=>touchLook=null);c.addEventListener("pointercancel",()=>touchLook=null);
}
function resize(){if(!renderer||!camera)return;const w=window.innerWidth,h=window.innerHeight;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function animate(){
 requestAnimationFrame(animate);if(!renderer||!scene)return;const dt=Math.min(clock.getDelta(),.04);frame++;
 if(player){updateWorld(dt);if(frame%4===0)updateAction();}
 renderer.render(scene,camera);
}
function startRenderer(){
 renderer=new THREE.WebGLRenderer({canvas:$("world"),antialias:false,alpha:false,powerPreference:"low-power"});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight,false);
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x91c4d8);scene.fog=new THREE.Fog(0x91c4d8,115,330);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,600);
 const hemi=new THREE.HemisphereLight(0xfff0d5,0x435847,1.35);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffe1b1,1.5);sun.position.set(-80,120,60);scene.add(sun);
 buildCity();buildPeople();buildTraffic();makePlayer();clock=new THREE.Clock();resize();spawnAtState();
 camera.position.set(player.x,8,player.z+cameraDistance);camera.lookAt(player.x,1.5,player.z);
 window.addEventListener("resize",resize);
}
function showError(message){
 $("loading").style.display="none";$("hud").style.display="none";$("joystick").style.display="none";
 $("err").style.display="flex";$("err").innerHTML='<div><div style="font-size:32px">🌍</div><h2>Could not open Star Life</h2><p>'+safeText(message)+'</p><p>Check your connection and try again.</p><a href="starlife.html">Return to Star Life menu</a></div>';
}
async function init(){
 try{
  if(!window.supabase||!window.THREE)throw new Error("A game service did not load. Please refresh with a stable internet connection.");
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{user},error:authError}=await db.auth.getUser();if(authError)throw authError;if(!user){location.replace("login.html");return;}
  const {data:flag,error:flagError}=await db.from("platform_feature_flags").select("enabled").eq("key","starlife").maybeSingle();
  if(flagError||!flag||flag.enabled!==true)throw new Error("Naija Star Life is not currently open. Please return to the game menu.");
  const {data:gameState,error:stateError}=await db.rpc("starlife_state");if(stateError)throw stateError;state=gameState;
  if(!state||!state.career){location.replace("starlife.html");return;}
  if(!state.adult_confirmed||!state.background||!state.look){location.replace("starlife.html");return;}
  const {data:wakeData,error:wakeError}=await db.rpc("starlife_wake");if(wakeError)throw wakeError;if(wakeData?.state)state=wakeData.state;
  try{const {data:p}=await db.rpc("starlife_locations_list");places=p||[];}catch(e){console.warn("Locations list unavailable",e);}
  startRenderer();bindJoystick();bindLook();updateHud();
  $("loading").style.display="none";$("hud").style.display="flex";$("joystick").style.display="block";$("quick").style.display="flex";$("hint").style.display="block";
  setTimeout(()=>$("hint").style.display="none",6500);
  $("action").addEventListener("click",interact);$("phone").onclick=openPhone;$("map").onclick=openTravel;
  $("menu").onclick=()=>openModal('<h2>🌍 Game menu</h2><p>Take a break, change your plans or return to the Star Life hub.</p><button class="option" id="menuPhone">📱 Player phone</button><button class="option" id="menuWork">💼 Find work</button><button class="option" id="menuTravel">🚌 Travel</button><button class="secondary" id="exitGame">Return to Star Life hub</button>');
  $("zoomIn").onclick=()=>cameraDistance=Math.max(6,cameraDistance-1.5);$("zoomOut").onclick=()=>cameraDistance=Math.min(18,cameraDistance+1.5);
  $("close").onclick=closeModal;$("modal").addEventListener("pointerdown",e=>{if(e.target===$("modal"))closeModal();});
  document.addEventListener("keydown",e=>{keys[e.key]=true;if(e.key==="Escape")closeModal();});
  document.addEventListener("keyup",e=>{keys[e.key]=false;});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){joy.x=joy.y=0;}});
  $("sheetContent").addEventListener("click",e=>{
   if(e.target.id==="menuPhone")openPhone();if(e.target.id==="menuWork")openWork();if(e.target.id==="menuTravel")openTravel();
   if(e.target.id==="exitGame")location.href="starlife.html";
  });
  openWelcome();animate();
 }catch(e){console.error("Star Life fresh build startup:",e);showError(e.message||"Unexpected startup error.");}
}
init();
</script>
