<style>
:root{--green:#087f36;--dark:#042b1b;--light:#0b9b45;--lime:#c7f542;--text:#10251b;--muted:#65766b;--line:#cbd8ce;--red:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2a17;font-family:Arial,Helvetica,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.chip{background:rgba(6,77,37,.88);color:#fff;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip b{color:var(--lime)}
#bar{flex:1;min-width:50px;max-width:120px;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}

.hbtn:first-of-type{margin-left:auto}
.hbtn{pointer-events:auto;border:0;background:rgba(6,77,37,.88);color:#fff;border-radius:12px;padding:7px 10px;font-size:15px}
#back{pointer-events:auto;background:rgba(6,77,37,.88);color:#fff;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:800;text-decoration:none}
#place{position:fixed;top:calc(52px + env(safe-area-inset-top));left:10px;background:rgba(255,255,255,.92);color:var(--dark);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800;z-index:5;pointer-events:none}
#zoomBox{position:fixed;right:10px;top:44%;display:flex;flex-direction:column;gap:8px;z-index:6}
#zoomBox .hbtn{font-size:20px;padding:9px 13px;margin:0}
#joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:6;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.65)}
#act{position:fixed;right:20px;bottom:calc(34px + env(safe-area-inset-bottom));min-width:88px;height:88px;border-radius:44px;border:0;background:var(--lime);color:var(--dark);font-weight:900;font-size:13px;padding:0 14px;z-index:6;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}

#modal{position:fixed;inset:0;background:rgba(5,25,14,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#box{background:#fff;color:var(--text);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text;touch-action:pan-y}
#box h2{margin:0 0 8px;font-size:19px}#box p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:14px;background:var(--green);color:#fff;margin-top:10px}
.btn.alt{background:#e8f4eb;color:var(--dark)}.btn:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin-top:9px;font:inherit;font-weight:700;color:var(--text)}
.opt small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.up{color:#17682e;font-weight:800}.down{color:var(--red);font-weight:800}

#wake{position:fixed;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92vw,460px);max-height:22vh;overflow:hidden;background:rgba(4,43,27,.94);color:#fff;border:1px solid rgba(199,245,66,.55);border-radius:16px;display:none;align-items:center;justify-content:center;text-align:center;padding:12px 16px;font-size:14px;line-height:1.45;z-index:4;opacity:1;pointer-events:none;transition:opacity 1.2s}
#needs{position:fixed;top:calc(84px + env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;gap:5px;z-index:5;pointer-events:none}

#phoneBtn{position:fixed;top:calc(52px + env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:14px;border:0;background:rgba(6,77,37,.9);color:#fff;font-size:22px;z-index:6}
.meter{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.meter span{width:92px}.meter i{flex:1;height:9px;background:#e7efe8;border-radius:6px;overflow:hidden}.meter b{display:block;height:100%;background:#0b9b45}
.meter.low b{background:#ef5350}
#msgScreen{position:fixed;inset:0;background:#0b2a17;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30;font-size:15px;line-height:1.6}
#msgScreen a{color:var(--lime);font-weight:800}
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function startupMessage(message){
  const panel = $("msgScreen");
  if(panel){ panel.style.display="flex"; panel.innerHTML=message; }
}
window.addEventListener("error", function(e){
  if(e && e.target && e.target.tagName==="SCRIPT" && e.target.dataset.optional!=="1"){
    startupMessage("A game service could not load. Check your internet connection, then refresh this page.<br><br><small>Failed resource: "+esc(e.target.src || "external script")+"</small><br><br><a href='starlife.html'>Return to Star Life menu</a>");
  }else if(e && e.message){
    console.error("Naija Star Life startup error:",e.message);
  }
}, true);
window.addEventListener("unhandledrejection", function(e){
  console.error("Naija Star Life background request failed:",e.reason);
});
if(!window.supabase || typeof window.supabase.createClient!=="function"){
  startupMessage("The account connection service did not load, so the game cannot start.<br><br>Check your internet connection and refresh. If it continues, try again later.<br><br><a href='starlife.html'>Return to Star Life menu</a>");
  throw new Error("Supabase client library unavailable");
}
const db = window.supabase.createClient("https://jwakveeiynpakunwjzkj.supabase.co", "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D");

/* ============================ WORLD DEFINITION ============================ */
const T = 40;                 // larger tile scale for a wider, more explorable Lagos map
const DW = 24, DH = 18;       // district size in tiles
const COLS = 3, ROWS = 3;     // districts across the world
const WORLD_W = COLS * DW * T, WORLD_H = ROWS * DH * T;

/* c,r = position in the 3x3 world grid. Lagoon water fills the bottom-left two cells. */
const DISTRICTS = [
  { id:"ikeja",    name:"Ikeja",           c:0, r:0, ground:"#d7ecc9", work:"Mall Shop" },
  { id:"oshodi",   name:"Oshodi",          c:1, r:0, ground:"#e6e3c6", work:"Market" },
  { id:"ikorodu",  name:"Ikorodu",         c:2, r:0, ground:"#cfe6c0", work:"Boat Dock" },
  { id:"yaba",     name:"Yaba",            c:0, r:1, ground:"#d3e8d6", work:"Print Shop" },
  { id:"surulere", name:"Surulere",        c:1, r:1, ground:"#d9ecc4", work:"Water Stand" },
  { id:"vi",       name:"Victoria Island", c:2, r:1, ground:"#dfe9f0", work:"Office" },
  { id:"lekki",    name:"Lekki",           c:2, r:2, ground:"#f2ead2", work:"Event Hall" }
];
const WATER = [{c:0,r:2},{c:1,r:2}];
let HOME_DISTRICT = null;

/* Extra building lots (tile position, size, and the door spot) and what each district puts in them. */
const LOTS = {
  A:{ tx:16, ty:1,  w:6, h:4, dx:19,  dy:5.4  },
  B:{ tx:16, ty:13, w:6, h:4, dx:19,  dy:17.4 },
  C:{ tx:3,  ty:13, w:5, h:4, dx:5.5, dy:17.4 },
  D:{ tx:0,  ty:3,  w:3, h:3, dx:1.5, dy:6.4 }
};
const VENUES = { lekki:"BEACH CLUB", vi:"NIGHT CLUB", ikeja:"CINEMA", yaba:"CAFE", surulere:"PITCH", oshodi:"BATH HOUSE", ikorodu:"BOAT DOCK" };

/* More places: small landmark buildings in free corners of each area. */
const LOTS2 = {
  E:{ tx:0,  ty:13, w:3, h:3, dx:1.5, dy:16.4 },
  F:{ tx:14, ty:1,  w:2, h:2, dx:15,  dy:3.4  },
  G:{ tx:14, ty:13, w:2, h:3, dx:15,  dy:16.4 },
  H:{ tx:9,  ty:13, w:2, h:3, dx:10,  dy:16.4 }
};
const PLACES = {
  ikeja:{ E:"hospital", F:"fela_shrine", H:"bank" }, yaba:{ E:"school", H:"salon" },
  surulere:{ E:"gym", F:"kiosk", G:"market" }, oshodi:{ E:"market", F:"kiosk" },
  ikorodu:{ E:"kiosk", G:"salon" }, vi:{ E:"bank", F:"salon" }, lekki:{ E:"gym", G:"dangote_refinery", H:"salon" }
};
const PLACE_INFO = {
  hospital:{ name:"Hospital", sign:"HOSPITAL", icon:"🏥", wall:"#ffffff", roof:"#c62828", blurb:"Look after your health or volunteer on the ward." },
  school:  { name:"School", sign:"SCHOOL", icon:"🎓", wall:"#fff3c4", roof:"#1565c0", blurb:"Learn something new and grow your name." },
  gym:     { name:"Gym", sign:"GYM", icon:"🏋️", wall:"#e0e0e0", roof:"#37474f", blurb:"Train hard and look sharp." },
  market:  { name:"Market stalls", sign:"MARKET", icon:"🧺", wall:"#ffe0b2", roof:"#ef6c00", blurb:"Buy, sell and bargain like a pro." },
  salon:   { name:"Salon and Barber", sign:"SALON", icon:"💈", wall:"#f8bbd0", roof:"#ad1457", blurb:"A fresh look can open doors." },
  kiosk:   { name:"Kiosk", sign:"KIOSK", icon:"🛒", wall:"#c8e6c9", roof:"#2e7d32", blurb:"Snacks, drinks and the latest gist." },
  bank:    { name:"Bank", sign:"BANK", icon:"🏦", wall:"#cfd8dc", roof:"#263238", blurb:"Meet the staff and pick up work." },
  fela_shrine:{ name:"New Afrika Shrine", sign:"FELA SHRINE", icon:"🎷", wall:"#e6bd68", roof:"#8b2f1e", blurb:"Visit Ikeja’s legendary live-music and cultural venue. Explore Afrobeat history, the stage and community atmosphere." },
  dangote_refinery:{ name:"Dangote Refinery Visitor Experience", sign:"DANGOTE REFINERY", icon:"🏭", wall:"#d8e2e8", roof:"#174d67", blurb:"Explore a visitor-style introduction to the Lekki industrial corridor, energy production, engineering and manufacturing. This is a fictional in-game tour, not access to the real facility." }
};
const SHOPS = {
  surulere:{ A:"food" }, yaba:{ A:"food" }, oshodi:{ A:"food" }, ikorodu:{ A:"food" },
  ikeja:{ A:"biz", B:"cars" }, vi:{ A:"biz", B:"food" }, lekki:{ A:"cars", B:"food" }
};
const SHOP_INFO = {
  food:{ label:"Restaurant", sign:"FOOD",     spot:"🍲 Eat" },
  biz: { label:"Business Hub", sign:"BUSINESS", spot:"📈 Business Hub" },
  cars:{ label:"Car Dealer", sign:"CARS",     spot:"🚗 Car Dealer" }
};
/* All characters below are fictional. */
const CELEB_POS = {
  lade_sings:{ did:"oshodi", tx:4.5, ty:9.5 }, mama_nkechi:{ did:"oshodi", tx:21.5, ty:9.5 },
  tolu_beats:{ did:"yaba", tx:4.5, ty:9.5 }, adaora_vale:{ did:"vi", tx:4.5, ty:9.5 },
  baba_jide:{ did:"ikorodu", tx:4.5, ty:9.5 }, sade_stage:{ did:"surulere", tx:4.5, ty:9.5 },
  kc_flow:{ did:"lekki", tx:4.5, ty:9.5 }, ayo_kicks:{ did:"ikeja", tx:4.5, ty:9.5 },
  ife_marvelle:{ did:"ikeja", tx:9.8, ty:6.8 }, gov_eze:{ did:"ikeja", tx:19.5, ty:9.5 },
  dj_kasa:{ did:"yaba", tx:9.8, ty:6.8 }, mama_put:{ did:"surulere", tx:9.8, ty:6.8 },
  mr_laffs:{ did:"oshodi", tx:9.8, ty:6.8 }, star_ola:{ did:"lekki", tx:9.8, ty:6.8 },
  chief_dike:{ did:"vi", tx:9.8, ty:6.8 }, coach_baba:{ did:"ikorodu", tx:9.8, ty:6.8 }
};
const NAMES = ["Tunde","Amaka","Chidi","Bisi","Emeka","Zainab","Kola","Ngozi","Ibrahim","Folake","Segun","Hauwa"];
const SHIRTS = ["#e53935","#1e88e5","#8e24aa","#fb8c00","#00897b","#6d4c41","#d81b60","#3949ab"];

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const solids = [];     // {x,y,w,h}
const scenery = [];    // drawable things: {k,x,y,w,h,...}
const spots = [];      // interactables: {kind,x,y,did}
const npcs = [];

function districtAt(px, py){
  const c = Math.floor(px / (DW * T)), r = Math.floor(py / (DH * T));
  return DISTRICTS.find(d => d.c === c && d.r === r) || null;
}

function buildWorld(){
  // lagoon
  WATER.forEach(w => {
    const rect = { x:w.c*DW*T, y:w.r*DH*T, w:DW*T, h:DH*T };
    solids.push(rect); scenery.push({ k:"water", ...rect });
  });

  DISTRICTS.forEach((d, idx) => {
    const ox = d.c * DW * T, oy = d.r * DH * T;
    const rand = rng(1000 + idx * 77);
    const taken = [];     // tile rects used (x,y,w,h in tiles)
    const free = (x, y, w, h) => !taken.some(t => x < t.x + t.w + 1 && x + w + 1 > t.x && y < t.y + t.h + 1 && y + h + 1 > t.y);

    // reserved: road bands + building lots
    taken.push({ x:0, y:7, w:DW, h:5 });         // horizontal road band (with margin)
    taken.push({ x:10, y:0, w:5, h:DH });        // vertical road band (with margin)

    // roads (scenery only)
    scenery.push({ k:"road", x:ox, y:oy + 8*T, w:DW*T, h:3*T });
    scenery.push({ k:"road", x:ox + 11*T, y:oy, w:3*T, h:DH*T });
    // Large, visible neighbourhood identity sign at the main road junction.
    scenery.push({ k:"districtSign", did:d.id, x:ox + 14.2*T, y:oy + 9.1*T, w:1, h:1 });

    // work building
    const wb = { x:ox + 3*T, y:oy + 2*T, w:6*T, h:4*T };
    solids.push(wb);
    scenery.push({ k:"work", ...wb, label:d.work });
    taken.push({ x:3, y:2, w:6, h:4 });
    spots.push({ kind:"work", did:d.id, x:ox + 6*T, y:oy + 6.4*T, label:"💼 Work" });

    // bus stop
    scenery.push({ k:"bus", x:ox + 15*T, y:oy + 6*T, w:T, h:2*T });
    // Nigerian public transport parked beside the bus stop (visual scenery).
    scenery.push({ k:"danfo", x:ox + 16.2*T, y:oy + 5.6*T, w:2.4*T, h:1.2*T });
    scenery.push({ k:"keke", x:ox + 19.0*T, y:oy + 6.0*T, w:1.3*T, h:1.2*T });
    // A small roadside buka/market stall in each neighbourhood.
    scenery.push({ k:"marketStall", did:d.id, x:ox + 16.2*T, y:oy + 12.2*T, w:2.6*T, h:1.8*T });
    spots.push({ kind:"food", did:d.id, x:ox + 17.5*T, y:oy + 14.25*T, label:"🍲 Mama Put" });
    spots.push({ kind:"bus", did:d.id, x:ox + 15.5*T, y:oy + 7.2*T, label:"🚌 Bus" });
    if (d.id === "yaba" || d.id === "surulere") spots.push({ kind:"lagoon", did:d.id, x:ox + 12.5*T, y:oy + 17.3*T, label:"🌊 Look out" });
    BB_POS.forEach((bp, slot) => {      scenery.push({ k:"billboard", did:d.id, slot, x:ox + bp.tx*T, y:oy + bp.ty*T, w:0, h:0 });      spots.push({ kind:"billboard", did:d.id, slot, x:ox + bp.tx*T, y:oy + bp.ty*T, label:"📢 Billboard" });
    });

    // every district has a house lot: it is YOUR home only in your home district
    if (!(SHOPS[d.id] && SHOPS[d.id].C)){
      const hb = { x:ox + 3*T, y:oy + 13*T, w:5*T, h:4*T };
      const mine = (HOME_DISTRICT === d.id);
      solids.push(hb);
      scenery.push({ k:mine ? "home" : "house", ...hb, tint:idx % 4, mine });
      taken.push({ x:3, y:13, w:5, h:4 });
      spots.push(mine ? { kind:"home", did:d.id, x:ox + 5.5*T, y:oy + 17.4*T, label:"🏠 Home" }
                      : { kind:"house", did:d.id, x:ox + 5.5*T, y:oy + 17.4*T, label:"🚪 Knock" });
    }

    // food, business hub and car dealer lots
    const shops = SHOPS[d.id] || {};
    Object.keys(shops).forEach(k => {
      const L = LOTS[k], kind = shops[k];
      const r = { x:ox + L.tx*T, y:oy + L.ty*T, w:L.w*T, h:L.h*T };
      solids.push(r);
      scenery.push({ k:"shop", ...r, kind });
      taken.push({ x:L.tx, y:L.ty, w:L.w, h:L.h });
      spots.push({ kind, did:d.id, x:ox + L.dx*T, y:oy + L.dy*T, label:SHOP_INFO[kind].spot });
    });

    // hangout venue: fun, social and clean-up activities
    {
      const L = LOTS.D, r = { x:ox + L.tx*T, y:oy + L.ty*T, w:L.w*T, h:L.h*T };
      solids.push(r);
      scenery.push({ k:"shop", ...r, kind:"venue", label:VENUES[d.id] || "VENUE" });
      taken.push({ x:L.tx, y:L.ty, w:L.w, h:L.h });
      spots.push({ kind:"venue", did:d.id, x:ox + L.dx*T, y:oy + L.dy*T, label:"🎉 " + (VENUES[d.id] || "Hang out") });
    }

    // extra landmark buildings
    Object.keys(PLACES[d.id] || {}).forEach(k => {
      const L = LOTS2[k], kind = PLACES[d.id][k];
      const r = { x:ox + L.tx*T, y:oy + L.ty*T, w:L.w*T, h:L.h*T };
      solids.push(r);
      scenery.push({ k:"shop", ...r, kind });
      taken.push({ x:L.tx, y:L.ty, w:L.w, h:L.h });
      spots.push({ kind:"landmark", pk:kind, did:d.id, x:ox + L.dx*T, y:oy + L.dy*T, label:PLACE_INFO[kind].icon + " " + PLACE_INFO[kind].name });
    });

    // houses
    for (let n = 0, tries = 0; n < 4 && tries < 80; tries++){
      const x = 1 + Math.floor(rand() * (DW - 5)), y = 1 + Math.floor(rand() * (DH - 5));
      if (!free(x, y, 3, 3)) continue;
      taken.push({ x, y, w:3, h:3 });
      const r = { x:ox + x*T, y:oy + y*T, w:3*T, h:3*T };
      solids.push(r);
      scenery.push({ k:"house", ...r, tint:Math.floor(rand() * 4) });
      spots.push({ kind:"house", did:d.id, x:r.x + 1.5*T, y:r.y + 3.4*T, label:"🚪 Knock" });
      n++;
    }
    // trees
    for (let n = 0, tries = 0; n < 16 && tries < 120; tries++){
      const x = Math.floor(rand() * DW), y = Math.floor(rand() * DH);
      if (!free(x, y, 1, 1)) continue;
      taken.push({ x, y, w:1, h:1 });
      solids.push({ x:ox + x*T + 10, y:oy + y*T + 10, w:12, h:14 });
      scenery.push({ k:"tree", x:ox + x*T, y:oy + y*T, w:T, h:T });
      n++;
    }
    // people
    for (let n = 0; n < 4; n++){
      const onRoadX = rand() < 0.5;
      const x = onRoadX ? ox + (11 + rand() * 3) * T : ox + (1 + rand() * (DW - 2)) * T;
      const y = onRoadX ? oy + (1 + rand() * (DH - 2)) * T : oy + (8 + rand() * 3) * T;
      npcs.push({ x, y, did:d.id, color:SHIRTS[Math.floor(rand() * SHIRTS.length)], name:NAMES[Math.floor(rand() * NAMES.length)],
                  dx:0, dy:0, timer:rand() * 2, hs:7, mode:"idle", action:"looking around", goal:null,
                  actionTime:2+rand()*4, seed:Math.floor(rand()*99999), facing:rand()*Math.PI*2, socialTarget:null });
    }
  });
}

function toast(t, ms = 2400){
  const el = $("toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = "none"; }, ms);
}
const NEEDS = [["hunger", "🍗"], ["hygiene", "🚿"], ["bladder", "🚽"], ["fun", "🎉"], ["social", "👥"]];
function renderNeeds(){
  if (!state) return;
  const box = $("needs");
  if (!box.dataset.ready){
    box.innerHTML = NEEDS.map(n => `<div class="nrow" id="nr_${n[0]}">${n[1]}<i><b id="nb_${n[0]}"></b></i></div>`).join("");
    box.dataset.ready = "1";
  }
  NEEDS.forEach(n => {
    const v = Math.max(0, Math.min(100, Number(state[n[0]] ?? 0)));
    const b = $("nb_" + n[0]), r = $("nr_" + n[0]);
    if (b) b.style.width = v + "%";
    if (r) r.classList.toggle("low", v < 25);
  });
}
function setHud(){
  if (!state) return;
  renderNeeds();
  if (typeof refreshLocks === "function") refreshLocks();
  $("eTxt").textContent = state.energy;
  $("eBar").style.width = Math.max(0, Math.min(100, state.energy)) + "%";
  $("cTxt").textContent = state.coins;

  const d = DISTRICTS.find(x => x.id === state.location);
  $("place").textContent = "📍 " + (d ? d.name : "Lagos");

function hits(x, y, hs){
  if (inRoom) return hitsRoom(x, y, hs);
  if (x - hs < 0 || y - hs < 0 || x + hs > WORLD_W || y + hs > WORLD_H) return true;
  for (let i = 0; i < solids.length; i++){
    const s = solids[i];
    if (x + hs > s.x && x - hs < s.x + s.w && y + hs > s.y && y - hs < s.y + s.h) return true;
  }
  return false;
}
function tryMove(e, dx, dy){
  if (!hits(e.x + dx, e.y, e.hs)) e.x += dx;
  if (!hits(e.x, e.y + dy, e.hs)) e.y += dy;
}
function spawnAt(did){
  const d = DISTRICTS.find(x => x.id === did) || DISTRICTS.find(x => x.id === "surulere");
  player.x = d.c * DW * T + 12.5 * T;
  player.y = d.r * DH * T + 9.5 * T;
  curDistrict = d.id;
  lastSafe = { x:player.x, y:player.y };
}

function taskIsAlertWorthy(task){
  if(!task || task.active===false || task.active===0 || String(task.active).toLowerCase()==="false") return false;
  const status=String(task.status||"").toLowerCase().replace(/[ _-]/g,"");
  const moderation=String(task.moderation_status||"").toLowerCase();
  const payment=String(task.payment_status||"").toLowerCase().replace(/[ _-]/g,"");
  if(status && !["live","active","published"].includes(status)) return false;
  if(["inactive","disabled","deleted","cancelled","canceled","rejected","expired","paused","draft","completed"].includes(status)) return false;
  if(["rejected","declined","blocked","suspended"].includes(moderation)) return false;
  if(["unfunded","paymentrequired","unpaid","failed","refunded","cancelled","canceled"].includes(payment)) return false;
  if(task.expiry_date && new Date(task.expiry_date)<new Date()) return false;
  const total=Number(task.max_total_completions??task.slots), done=Number(task.completed_count??task.total_completions??0);  if(Number.isFinite(total)&&total>0&&done>=total) return false;
  return true;
}async function startNewTaskAlerts(){

async function checkDistrict(){
  if (walkingCheck || !state) return;
  const d = districtAt(player.x, player.y);
  if (!d){ return; }
  if (d.id === state.location){ lastSafe = { x:player.x, y:player.y }; curDistrict = d.id; return; }
  walkingCheck = true;
  try{
    state = await rpc("starlife_walk", { p_location:d.id });
    curDistrict = d.id; lastSafe = { x:player.x, y:player.y };
    setHud(); toast("You walked into " + d.name + " (-5 energy).");
  }catch(e){
    player.x = lastSafe.x; player.y = lastSafe.y;
    toast(e.message || "You cannot go there right now.");
  }finally{ walkingCheck = false; }
}

const joyEl = $("joy"), knob = $("knob");
function joyMove(e){
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), max = 46;
  if (m > max){ dx = dx / m * max; dy = dy / m * max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx / max; joy.y = dy / max;
}
joyEl.addEventListener("pointerdown", e => { joy.active = true; joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joyEl.addEventListener("pointermove", e => { if (joy.active && e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.active = false; joy.x = joy.y = 0; knob.style.transform = "translate(0,0)"; };
joyEl.addEventListener("pointerup", joyEnd); joyEl.addEventListener("pointercancel", joyEnd);

/* ============================ UPDATE ============================ */
function update(dt){
  if (!state) return;
  // player
  if (!modalOpen){
    let ix = (keys["arrowright"] || keys["d"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] ? 1 : 0);
    let iy = (keys["arrowdown"] || keys["s"] ? 1 : 0) - (keys["arrowup"] || keys["w"] ? 1 : 0);
    if (joy.active){ ix = joy.x; iy = joy.y; }
    player.moving = false;
    if (keys["q"]) camYaw += dt * 1.8;
    if (keys["e"]) camYaw -= dt * 1.8;
    const m = sleeping ? 0 : Math.hypot(ix, iy);
    if (m > 0.12){
      const k = Math.min(1, m);
      const sp = 120 * (carSpeeds[state.car_id] || 1) * dt * k;
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
      const mx = (rx * ix + fx * -iy) / m, mz = (rz * ix + fz * -iy) / m;
      tryMove(player, mx * sp, mz * sp);
      player.face = Math.atan2(mx, mz);
      player.step += dt * 9;
      player.moving = true;
      checkDistrict();
    }
  }
  // NPC daily-life state machine. Distant residents sleep in lightweight simulation.
  const worldHour = new Date().getHours();
  npcs.forEach(n => {
    const near = Math.abs(n.x-player.x)<760 && Math.abs(n.y-player.y)<760;
    if (!near){ n.dx=0; n.dy=0; return; }
    n.actionTime -= dt;
    const district = DISTRICTS.find(x => x.id === n.did);
    if (!district) return;
    const ox=district.c*DW*T, oy=district.r*DH*T;
    const chooseDestination = () => {
      const local = spots.filter(p => p.did===n.did && ["food","bus","work","venue","landmark"].includes(p.kind));
      const candidates = local.length ? local : [
        {x:ox+8*T,y:oy+9.5*T},{x:ox+16*T,y:oy+9.5*T},{x:ox+7*T,y:oy+14*T}
      ];
      const p=candidates[(Math.floor(Math.random()*candidates.length))];
      n.goal={x:p.x+(Math.random()-.5)*22,y:p.y+(Math.random()-.5)*22};
      n.mode="walk"; n.action="walking"; n.actionTime=8+Math.random()*8;
    };
    if (Math.hypot(n.x-player.x,n.y-player.y)<24 && !modalOpen){
      n.mode="greet"; n.action="greeting"; n.goal=null; n.actionTime=Math.max(n.actionTime,1.8);
      n.facing=Math.atan2(player.x-n.x,player.y-n.y);
    } else if (n.mode==="greet"){
      n.mode="idle"; n.action="looking around"; n.actionTime=2+Math.random()*3;
    } else if (n.mode==="walk"){
      if (!n.goal || n.actionTime<=0 || Math.hypot(n.goal.x-n.x,n.goal.y-n.y)<10){
        n.goal=null; n.mode="idle";
        const roll=Math.random();
        n.action=roll<.34?"checking phone":roll<.58?"chatting nearby":roll<.78?"taking a break":"looking around";
        n.actionTime=3+Math.random()*7;
      } else {
        const dx=n.goal.x-n.x, dy=n.goal.y-n.y, d=Math.hypot(dx,dy)||1;
        const step=Math.min(d,24*dt);
        const nx=n.x+dx/d*step, ny=n.y+dy/d*step;
        const inside=nx>ox+8 && nx<ox+DW*T-8 && ny>oy+8 && ny<oy+DH*T-8;
        if(inside && !hits(nx,ny,n.hs)){n.x=nx;n.y=ny;n.dx=dx/d;n.dy=dy/d;}
        else {n.goal=null;n.mode="idle";n.action="looking around";n.actionTime=1.2;}
      }
    } else if(n.actionTime<=0){
      if(Math.random()<.72) chooseDestination();
      else { n.mode="idle"; n.action=worldHour>=18?"relaxing":"checking phone"; n.actionTime=3+Math.random()*5; }
    }
    if(n.mode!=="walk"){ n.dx=0;n.dy=0; }
  });
  // nearest interactable
  let best = null, bd = 56;
  spots.forEach(s => { const d = Math.hypot(s.x - player.x, s.y - player.y); if (d < bd){ bd = d; best = { kind:s.kind, label:s.label, spot:s }; } });
  npcs.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < Math.min(bd, 44)){ bd = d; best = { kind:"npc", ref:n, label:"💬 Talk to " + n.name }; } });
  celebs.forEach(c => { const d = Math.hypot(c.x - player.x, c.y - player.y); if (d < Math.min(bd, 52)){ bd = d; best = { kind:"celeb", ref:c, label:(c.locked ? "🔒 " : "⭐ Meet ") + c.name }; } });
  Object.keys(others).forEach(id => { const o = others[id]; const d = Math.hypot(o.x - player.x, o.y - player.y); if (d < Math.min(bd, 56)){ bd = d; best = { kind:"player", ref:o, label:"👋 " + o.name }; } });
  if (inRoom) best = roomNearest();
  nearest = modalOpen ? null : best;
  const a = $("act");
  if (nearest){ a.style.display = "block"; if (a.textContent !== nearest.label) a.textContent = nearest.label; } else a.style.display = "none";
}

function applyPremiumHuman(target,modelIndex){
  const template=premiumHumanCache[modelIndex%premiumHumanCache.length];
  if(!target||!template||!THREE.SkeletonUtils)return false;
  const keep=target.children.filter(ch=>ch.userData&&ch.userData.keepOnPremium);
  target.children.slice().forEach(ch=>{if(!keep.includes(ch))target.remove(ch);});
  const body=THREE.SkeletonUtils.clone(template.scene);
  body.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(body),size=bounds.getSize(new THREE.Vector3());
  if(!isFinite(size.y)||size.y<=0)return false;
  const scale=3.35/size.y;
  body.scale.setScalar(scale);body.position.y=-bounds.min.y*scale;
  body.traverse(o=>{if(o.isMesh){o.frustumCulled=true;o.castShadow=false;o.receiveShadow=false;}});
  target.add(body);
  target.userData.premium=true;target.userData.premiumBody=body;
  target.userData.premiumMixer=new THREE.AnimationMixer(body);
  target.userData.premiumActions={};
  (template.animations||[]).forEach(clip=>{
    const key=String(clip.name||"").toLowerCase();
    if(key==="idle"||key==="walk"||key==="run"){
      const action=target.userData.premiumMixer.clipAction(clip);
      target.userData.premiumActions[key]=action;
      if(key==="idle")action.play();
    }
  });
  target.userData.premiumCurrent="idle";
  return true;
}
function setPremiumMotion(target,moving,dt){
  const u=target&&target.userData;if(!u||!u.premiumMixer)return;
  const next=moving&&u.premiumActions.walk?"walk":"idle";
  if(next!==u.premiumCurrent){
    const from=u.premiumActions[u.premiumCurrent],to=u.premiumActions[next];
    if(to){to.reset().fadeIn(.18).play();if(from)from.fadeOut(.18);u.premiumCurrent=next;}
  }
  u.premiumMixer.update(dt);
}
async function loadPremiumHumans(){

      premiumHumanCache.push({scene:gltf.scene,animations:gltf.animations||[]});

      });
      const sign = labelSprite("MAMA PUT  •  MARKET","#064d25","#ffffff",2.5);
      sign.position.set(0,3.45,1.62); g.add(sign);
      const produceColors=["#e53935","#f9a825","#43a047","#ff7043","#8e24aa","#fdd835"];
      produceColors.forEach((c,i)=>{

  // road dashes (one draw call)

    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1.4, 0.02, 0.16), new THREE.MeshBasicMaterial({ color:"#f5d76e" }), dashes.length);
    const dm = new THREE.Object3D();
    dashes.forEach((p, i) => { dm.position.set(p[0], 0.05, p[1]); dm.rotation.y = p[2]; dm.updateMatrix(); im.setMatrixAt(i, dm.matrix); });
    scene.add(im);
  }
  // trees (two draw calls)
  if (trees.length){
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.32, 1.8, 6), mat("#6d4c41"), trees.length);
    const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(1.5, 3.4, 7), mat("#2e7d32"), trees.length);

    trees.forEach((p, i) => {

      dm.rotation.set(0, 0, 0); dm.scale.set(k, k, k);
      dm.position.set(p[0], 0.9 * k, p[1]); dm.updateMatrix(); trunks.setMatrixAt(i, dm.matrix);
      dm.position.set(p[0], 3.3 * k, p[1]); dm.updateMatrix(); leaves.setMatrixAt(i, dm.matrix);

      vehicle.userData = { district:d, lane, speed:(lane ? -1 : 1) * (7.5 + (di % 3) * 1.2), start:d.c * DW * T, length:DW * T };

  // people
  npcs.forEach(n => {

let lastCar = "__none__";
function syncCar(){
  const id = state && state.car_id ? state.car_id : null;
  if (id === lastCar) return;
  lastCar = id;
  if (carGroup){ playerMesh.remove(carGroup); carGroup = null; }
  const u = playerMesh.userData;
  if (id){
    carGroup = makeCar(id); playerMesh.add(carGroup);
    if(u.premiumBody)u.premiumBody.visible=false;
    if(u.legL)u.legL.visible=u.legR.visible=false;
  } else {
    if(u.premiumBody)u.premiumBody.visible=true;
    if(u.legL)u.legL.visible=u.legR.visible=true;
  }
}

function updateSky(){
  const t = new Date(), h = t.getHours() + t.getMinutes() / 60;
  let d;
  if (h < 5 || h >= 19.5) d = 0; else if (h < 6.5) d = (h - 5) / 1.5; else if (h < 18) d = 1; else d = (19.5 - h) / 1.5;
  const col = new THREE.Color("#07182d").lerp(new THREE.Color("#66b4df"), d);
  scene.background = col; scene.fog.color = col;
  hemi.intensity = 0.22 + 0.56 * d; sun.intensity = 0.04 + 0.76 * d;
}

function resize(){
  VW = window.innerWidth; VH = window.innerHeight;
  if (!renderer) return;
  const mobileLowEnd=/Android|iPhone|iPad/i.test(navigator.userAgent);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobileLowEnd?1.15:1.35));
  renderer.setSize(VW, VH, false);
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
}


function camTarget(){
  return new THREE.Vector3(player.x * U + Math.sin(camYaw) * camR(), camR() * 0.8, player.y * U + Math.cos(camYaw) * camR());
}
function snapCamera(){ if(!camera)return; camera.position.copy(camTarget()); camera.lookAt(player.x * U, inRoom ? 1.35 : 1.5, player.y * U); camera.updateMatrixWorld(true); }

function angleLerp(a, b, t){ let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }

function draw(dt){
  syncCar();
  trafficCars.forEach(v => {
    const u = v.userData;
    if (inRoom){ v.visible = false; return; }
    v.visible = true;
    const x0 = u.start * U, x1 = (u.start + u.length) * U;
    let x = v.position.x + u.speed * dt;
    if (x > x1) x = x0 - 4;
    if (x < x0 - 4) x = x1;
    v.position.x = x;
  });
  // player
  playerMesh.position.set(player.x * U, carGroup ? 0.2 : 0, player.y * U);
  playerMesh.rotation.y = angleLerp(playerMesh.rotation.y, player.face, Math.min(1, dt * 12));
  if(playerMesh.userData.premium) setPremiumMotion(playerMesh,player.moving&&!carGroup,dt);
  else animatePerson(playerMesh,player.step,player.moving&&!carGroup);
  if (carGroup) carGroup.visible = !inRoom;
  if (sleeping){ playerMesh.rotation.x = -Math.PI / 2; playerMesh.rotation.y = 0; playerMesh.position.y = 1.4; }
  else if (playerMesh.rotation.x !== 0) playerMesh.rotation.x = 0;

  // people
  npcs.forEach((n, i) => {
    const m = npcMeshes[i]; if (!m) return;
    m.position.set(n.x * U, 0, n.y * U);
    const mv = n.dx !== 0 || n.dy !== 0;
    if (mv) m.rotation.y = angleLerp(m.rotation.y, Math.atan2(n.dx, n.dy), Math.min(1, dt * 8));
    if(m.userData.premium)setPremiumMotion(m,mv,dt);
    else animatePerson(m,performance.now()/150+i,mv);
    if(n.mode==="greet"){
      m.rotation.y=angleLerp(m.rotation.y,n.facing,Math.min(1,dt*5));
      m.userData.tag.visible=true;
    } else {
      m.userData.tag.visible = Math.hypot(n.x - player.x, n.y - player.y) < 150;
    }
    m.userData.tag.material.opacity=1;
  });
  const tms = performance.now() / 300;
  celebs.forEach((c, i) => {
    const m = celebMeshes[i]; if (!m) return;
    if(m.userData.premium)setPremiumMotion(m,false,dt);
    m.userData.star.position.y = 4.6 + Math.sin(tms + i) * 0.2;
    m.userData.tag.visible = Math.hypot(c.x - player.x, c.y - player.y) < 190;
    m.rotation.y = Math.atan2(player.x - c.x, player.y - c.y) * (Math.hypot(c.x - player.x, c.y - player.y) < 190 ? 1 : 0);
  });
  if (beacon) { beacon.rotation.y += dt * 2; beacon.position.y = 11 + Math.sin(tms) * 0.4; }

  // interaction marker
  if (nearest){
    const ref = nearest.ref || nearest;
    let tx, ty;
    if (nearest.kind === "npc" || nearest.kind === "celeb" || nearest.kind === "player" || nearest.kind === "room"){ tx = ref.x; ty = ref.y; }
    else { const sp = spots.find(s => s.kind === nearest.kind && Math.hypot(s.x - player.x, s.y - player.y) < 60); if (sp){ tx = sp.x; ty = sp.y; } }
    if (tx !== undefined){ marker.visible = true; marker.position.set(tx * U, 0.1, ty * U); marker.scale.setScalar(1 + Math.sin(tms * 2) * 0.08); } else marker.visible = false;
  } else marker.visible = false;

  updateOthers(dt);

  // camera follow
  camera.position.lerp(camTarget(), 1 - Math.pow(0.0005, dt));
  camera.lookAt(player.x * U, inRoom ? 1.35 : 1.5, player.y * U);
  renderer.render(scene, camera);
}

/* turn the camera by dragging anywhere outside the joystick */
let dragCam = null;
canvas.addEventListener("pointerdown", e => { dragCam = { id:e.pointerId, x:e.clientX }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if (dragCam && !pinching && e.pointerId === dragCam.id){ camYaw -= (e.clientX - dragCam.x) * 0.008; dragCam.x = e.clientX; } });
["pointerup", "pointercancel"].forEach(t => canvas.addEventListener(t, e => { if (dragCam && e.pointerId === dragCam.id) dragCam = null; }));

let last = performance.now(), skyTimer = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); autoWalkStep(dt);
  skyTimer -= dt; if (skyTimer <= 0){ skyTimer = 5; updateSky(); }
  draw(dt);
  requestAnimationFrame(loop);
}

function paintBillboard(key, text, sub, bg){
  const b = billboardMap[key]; if (!b) return;
  const g = b.cv.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, 512, 256);
  g.fillStyle = "#ffffff"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = "bold 44px Arial";
  const words = String(text).split(" "), lines = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > 470 && cur){ lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  const shown = lines.slice(0, 3), y0 = 118 - (shown.length - 1) * 26;
  shown.forEach((ln, i) => g.fillText(ln, 256, y0 + i * 52));
  g.font = "22px Arial"; g.fillStyle = "rgba(255,255,255,0.8)"; g.fillText(sub, 256, 232);
  b.tex.needsUpdate = true;
}
function makeBillboard(s){
  const g = new THREE.Group();
  [-2.6, 2.6].forEach(x => { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6, 6), mat("#555555")); post.position.set(x, 3, 0); g.add(post); });
  const frame = box(6.8, 3.4, 0.3, "#263238"); frame.position.y = 6.2; g.add(frame);
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 256;
  const tex = new THREE.CanvasTexture(cv);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.0), new THREE.MeshBasicMaterial({ map:tex }));
  face.position.set(0, 6.2, 0.18); g.add(face);
  g.position.set(s.x * U, 0, s.y * U);
  scene.add(g);
  billboardMap[s.did + ":" + s.slot] = { cv, tex };

}

/* ---- Original background music (generated in the browser, no copyrighted audio) ---- */
let audioCtx = null, musicOn = false, musicTimer = null, musicStep = 0, noiseBuf = null, masterGain = null, musicStyle = -1;
const MUSIC_STYLES = [
  { name:"Afrobeat",  ms:150, bass:[55,0,0,55,0,0,65.4,0,73.4,0,82.4,0,65.4,0,55,0], lead:[440,0,523.3,0,587.3,0,0,523.3,0,440,0,0,659.3,0,587.3,0], hat:2, snare:[4,12] },
  { name:"Highlife",  ms:135, bass:[55,0,65.4,0,73.4,0,65.4,0,55,0,82.4,0,73.4,0,65.4,0], lead:[0,659.3,0,587.3,0,523.3,0,587.3,0,659.3,0,784,0,659.3,0,587.3], hat:1, snare:[4,12] },
  { name:"Amapiano",  ms:128, bass:[55,0,0,55,0,55,0,0,73.4,0,0,73.4,0,65.4,0,0], lead:[0,0,0,0,523.3,0,0,0,0,0,0,0,587.3,0,0,0], hat:1, snare:[8] }
];
function makeNoise(){
  const len = audioCtx.sampleRate * 0.3, buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}
function envGain(t, a, d, peak){
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  g.connect(masterGain); return g;
}
function tone(type, freq, t, a, d, peak){
  const o = audioCtx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  o.connect(envGain(t, a, d, peak)); o.start(t); o.stop(t + a + d + 0.05);
}
function noiseHit(t, d, peak, hp){
  const n = audioCtx.createBufferSource(); n.buffer = noiseBuf;
  const f = audioCtx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  n.connect(f); f.connect(envGain(t, 0.002, d, peak)); n.start(t); n.stop(t + d + 0.05);
}
function musicTick(){
  const st = MUSIC_STYLES[musicStyle]; if (!st) return;
  const t = audioCtx.currentTime + 0.02, s = musicStep % 16;
  if (s % 4 === 0){ const o = audioCtx.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    o.connect(envGain(t, 0.005, 0.18, 0.7)); o.start(t); o.stop(t + 0.25); }
  if (st.snare.indexOf(s) >= 0) noiseHit(t, 0.12, 0.35, 1200);
  if (s % st.hat === 0) noiseHit(t, 0.04, 0.12, 7000);
  if (st.bass[s]) tone(musicStyle === 2 ? "sine" : "triangle", st.bass[s], t, 0.01, musicStyle === 2 ? 0.2 : 0.28, 0.55);
  if (st.lead[s]) tone("sine", st.lead[s], t, 0.01, 0.3, 0.16);
  musicStep++;
}
function toggleMusic(){
  if (!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain(); masterGain.gain.value = 0.22; masterGain.connect(audioCtx.destination);
      noiseBuf = makeNoise();
    }catch(e){ audioCtx = null; toast("Sound is not available on this device."); return; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  musicStyle++;
  clearInterval(musicTimer);
  if (musicStyle >= MUSIC_STYLES.length){ musicStyle = -1; musicOn = false; $("musicBtn").textContent = "🔇"; return; }
  musicOn = true; musicStep = 0; musicTimer = setInterval(musicTick, MUSIC_STYLES[musicStyle].ms);
  $("musicBtn").textContent = "🔊"; toast("♪ " + MUSIC_STYLES[musicStyle].name);
}
$("musicBtn").addEventListener("click", toggleMusic);

async function syncPresence(){
  if (syncing || inRoom || !state || !state.adult_confirmed || !scene) return;
  syncing = true;
  try{
    const list = await rpc("starlife_presence_sync", { p_x:Math.round(player.x), p_y:Math.round(player.y) });
    applyOthers(Array.isArray(list) ? list : []);
  }catch(e){ if (!isMissingFn(e)) console.warn(e.message); }
  finally{ syncing = false; }
}
function applyOthers(list){
  const seen = {};
  list.forEach(o => {
    seen[o.id] = true;
    let e = others[o.id];
    if (!e){
      const L = o.look || {};
      const mesh = makePerson(L.topColor || L.shirt || "#1e88e5", L.skin || SKIN[0], L);
      const tag = labelSprite(o.name, "rgba(0,0,0,0.65)", "#ffffff", 3.8); tag.position.y = 4.5; mesh.add(tag);
      scene.add(mesh);
      e = others[o.id] = { id:o.id, name:o.name, friend:!!o.friend, x:Number(o.x), y:Number(o.y), tx:Number(o.x), ty:Number(o.y), mesh, moving:false, step:0 };
    }
    e.name = o.name; e.friend = !!o.friend; e.tx = Number(o.x); e.ty = Number(o.y);
  });
  Object.keys(others).forEach(id => { if (!seen[id]){ scene.remove(others[id].mesh); delete others[id]; } });
}
function updateOthers(dt){
  Object.keys(others).forEach(id => {
    const e = others[id], dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
    e.moving = d > 2;
    if (e.moving){
      const st = Math.min(d, 90 * dt); e.x += dx / d * st; e.y += dy / d * st; e.step += dt * 9;
      e.mesh.rotation.y = angleLerp(e.mesh.rotation.y, Math.atan2(dx, dy), Math.min(1, dt * 8));
    }
    e.mesh.position.set(e.x * U, 0, e.y * U);
    if(e.mesh.userData.premium)setPremiumMotion(e.mesh,e.moving,dt);
    else animatePerson(e.mesh,e.step,e.moving);
  });
}

function hitsRoom(x, y, hs){
  if (x - hs < ROOM.x + 14 || y - hs < ROOM.y + 14 || x + hs > ROOM.x + 320 - 14 || y + hs > ROOM.y + 320 - 14) return true;
  for (let i = 0; i < roomSolids.length; i++){
    const s = roomSolids[i];
    if (x + hs > s.x && x - hs < s.x + s.w && y + hs > s.y && y - hs < s.y + s.h) return true;
  }
  return false;
}

/* ---- zoom: buttons, mouse wheel and two-finger pinch ---- */
function setZoom(v){ camDist = Math.max(6, Math.min(34, v)); }
function camR(){ return inRoom ? Math.min(camDist, 13) : camDist; }

canvas.addEventListener("wheel", e => { e.preventDefault(); setZoom(camDist + e.deltaY * 0.02); }, { passive:false });
let pinchLast = null;
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
canvas.addEventListener("touchstart", e => { if (e.touches.length === 2){ pinching = true; pinchLast = touchDist(e.touches); } }, { passive:true });
canvas.addEventListener("touchmove", e => {
  if (pinching && e.touches.length === 2){ const d = touchDist(e.touches); setZoom(camDist - (d - pinchLast) * 0.06); pinchLast = d; }
}, { passive:true });
canvas.addEventListener("touchend", e => { if (e.touches.length < 2){ pinchLast = null; setTimeout(() => { pinching = false; }, 150); } }, { passive:true });

const NAV_STEP = 16;
let navPath = null, navName = "", navLine = null, navStuck = 0, navTick = 0;

const KIND_ICON = { work:"💼", food:"🍲", biz:"📈", cars:"🚗", venue:"🎉", home:"🏠", bus:"🚌", landmark:"📍" };
function placeLabel(s){
  const d = DISTRICTS.find(x => x.id === s.did);
  if (s.kind === "work") return (d ? d.work : "Work");
  if (s.kind === "food") return "Restaurant";
  if (s.kind === "biz") return "Business Hub";
  if (s.kind === "cars") return "Car Dealer";
  if (s.kind === "venue") return VENUES[s.did] || "Hangout";
  if (s.kind === "home") return "Your home";
  if (s.kind === "bus") return "Bus stop";
  if (s.kind === "landmark") return PLACE_INFO[s.pk].name;
  return s.label || "Place";
}
function placeEntries(did){
  const list = [];
  spots.forEach(s => {
    if (s.did !== did || !KIND_ICON[s.kind]) return;
    list.push({ name:placeLabel(s), icon:s.kind === "landmark" ? PLACE_INFO[s.pk].icon : KIND_ICON[s.kind], x:s.x, y:s.y });
  });
  celebs.forEach(c => {
    const d = districtAt(c.x, c.y);
    if (d && d.id === did) list.push({ name:c.name + (c.locked ? " (locked)" : ""), icon:c.locked ? "🔒" : "⭐", x:c.x, y:c.y });
  });
  return list.map(p => Object.assign(p, { dist:Math.hypot(p.x - player.x, p.y - player.y) })).sort((a, b) => a.dist - b.dist);
}

function openPlaces(did){
  if (inRoom){ toast("Go outside first to see places."); return; }
  did = did || state.location;
  const list = placeEntries(did), speed = 120 * (carSpeeds[state.car_id] || 1);
  openModal(`<h2>📍 Places</h2>
    <select id="plArea" style="width:100%;padding:12px;border:2px solid #e0eae3;border-radius:12px;font:inherit;background:#fff;margin-bottom:6px">
      ${DISTRICTS.map(d => `<option value="${d.id}" ${d.id === did ? "selected" : ""}>${esc(d.name)}${d.id === state.location ? " (you are here)" : ""}</option>`).join("")}
    </select>
    ${list.map((p, i) => `<button class="opt" data-pi="${i}">${p.icon} ${esc(p.name)}<small>${Math.round(p.dist / 8)} m away · about ${Math.max(1, Math.round(p.dist / speed))} s on foot${did !== state.location ? " · crossing areas costs energy" : ""}</small></button>`).join("") || "<p>Nothing listed here.</p>"}
    <button class="btn alt" id="mClose">Close</button>`);
  $("mClose").onclick = closeModal;
  $("plArea").onchange = () => openPlaces($("plArea").value);
  $("box").querySelectorAll("[data-pi]").forEach(b => b.onclick = () => { const p = list[Number(b.dataset.pi)]; if (p) startNav(p); });
}

/* shortest walkable route on a 16-pixel grid, then straightened */
function findPath(sx, sy, tx, ty){
  const W = Math.floor(WORLD_W / NAV_STEP), H = Math.floor(WORLD_H / NAV_STEP);
  const cell = (x, y) => [Math.min(W - 1, Math.max(0, Math.floor(x / NAV_STEP))), Math.min(H - 1, Math.max(0, Math.floor(y / NAV_STEP)))];
  const s = cell(sx, sy), t = cell(tx, ty), start = s[1] * W + s[0], goal = t[1] * W + t[0];
  const prev = new Int32Array(W * H).fill(-1); prev[start] = start;
  const queue = [start]; let head = 0;
  while (head < queue.length){
    const cur = queue[head++]; if (cur === goal) break;
    const cx = cur % W, cy = (cur / W) | 0;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
      const nx = cx + d[0], ny = cy + d[1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const id = ny * W + nx; if (prev[id] !== -1) continue;
      if (id !== goal && hits(nx * NAV_STEP + 8, ny * NAV_STEP + 8, 8)) continue;
      prev[id] = cur; queue.push(id);
    }
  }
  if (prev[goal] === -1) return null;
  const cells = []; for (let c = goal; c !== start; c = prev[c]) cells.push(c); cells.reverse();
  const pts = [{ x:sx, y:sy }].concat(cells.map(c => ({ x:(c % W) * NAV_STEP + 8, y:((c / W) | 0) * NAV_STEP + 8 })));
  pts[pts.length - 1] = { x:tx, y:ty };
  const clear = (a, b) => { const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 8); for (let i = 1; i < n; i++){ const k = i / n; if (hits(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, 8)) return false; } return true; };
  const out = []; let i = 0;
  while (i < pts.length - 1){ let j = pts.length - 1; while (j > i + 1 && !clear(pts[i], pts[j])) j--; out.push(pts[j]); i = j; }
  return out;
}

function startNav(p){
  closeModal();
  const path = findPath(player.x, player.y, p.x, p.y);
  if (!path || !path.length){ toast("No walkable route found."); return; }
  navPath = path; navName = p.name; navStuck = 0;
  $("navName").textContent = p.name; $("navBar").style.display = "flex";
  drawNavLine();
}
function cancelNav(){
  navPath = null; $("navBar").style.display = "none";
  if (navLine && scene){ scene.remove(navLine); navLine.geometry.dispose(); navLine = null; }
}
function drawNavLine(){
  if (!scene || typeof THREE === "undefined") return;
  if (navLine){ scene.remove(navLine); navLine.geometry.dispose(); navLine = null; }
  if (!navPath || !navPath.length) return;
  const pts = [new THREE.Vector3(player.x * U, 0.35, player.y * U)].concat(navPath.map(q => new THREE.Vector3(q.x * U, 0.35, q.y * U)));
  navLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color:0xb7ef43 }));
  scene.add(navLine);
}
function autoWalkStep(dt){
  if (!navPath) return;
  if (inRoom || modalOpen || joy.active || keys["w"] || keys["a"] || keys["s"] || keys["d"] || keys["arrowup"] || keys["arrowdown"] || keys["arrowleft"] || keys["arrowright"]){ cancelNav(); return; }
  const t = navPath[0], dx = t.x - player.x, dy = t.y - player.y, d = Math.hypot(dx, dy);
  const sp = 120 * (carSpeeds[state.car_id] || 1) * dt;
  if (d <= Math.max(6, sp)){
    player.x = t.x; player.y = t.y; navPath.shift();
    if (!navPath.length){ const n = navName; cancelNav(); toast("You arrived at " + n + "."); }
    else drawNavLine();
    return;
  }
  const nd = districtAt(player.x + dx / d * 24, player.y + dy / d * 24);
  if (nd && nd.id !== state.location && state.energy < 5){ cancelNav(); toast("Too tired to walk into the next area. Rest at home."); return; }
  const bx = player.x, by = player.y;
  tryMove(player, dx / d * sp, dy / d * sp);
  if (Math.hypot(player.x - bx, player.y - by) < sp * 0.3){ navStuck += dt; if (navStuck > 0.7){ cancelNav(); toast("The way is blocked. Try again."); return; } } else navStuck = 0;
  player.face = Math.atan2(dx, dy); player.step += dt * 9; player.moving = true;
  checkDistrict();
  navTick += dt; if (navTick > 0.4){ navTick = 0; drawNavLine(); }
}
$("navCancel").addEventListener("click", cancelNav);
$("placesBtn").addEventListener("click", () => { if (!modalOpen) openPlaces(); });

/* ---- landmarks: hospital, school, gym, market, salon, kiosk, bank ---- */
async function openLandmark(spot){
  const info = PLACE_INFO[spot.pk];
  try{
    const acts = await rpc("starlife_landmark_actions_list", { p_kind:spot.pk });
    const fx = a => [a.energy ? "⚡" + (a.energy > 0 ? "+" : "") + a.energy : "", a.fame ? "⭐+" + a.fame : "", a.coins_gain ? "🪙+" + a.coins_gain : ""].filter(Boolean).join("  ");
    openModal(`<h2>${info.icon} ${esc(info.name)}</h2><p>${esc(info.blurb)}</p>
      ${acts.map(a => `<button class="opt" data-la="${esc(a.id)}" ${a.uses_today >= a.daily_limit || state.fame < a.min_fame ? "disabled" : ""}>${esc(a.name)} · ${a.price ? esc(a.price) + " coins" : "free"}
        <small>${esc(a.blurb || "")} ${fx(a)} · ${esc(a.uses_today)}/${esc(a.daily_limit)} today${state.fame < a.min_fame ? " · needs " + esc(a.min_fame) + " fame" : ""}</small></button>`).join("") || "<p>Nothing to do here yet.</p>"}
      <button class="btn alt" id="mClose">Close</button>`);
    $("mClose").onclick = closeModal;
    $("box").querySelectorAll("[data-la]").forEach(b => b.onclick = async () => {
      if (busy) return; busy = true;
      try{ state = await rpc("starlife_landmark_do", { p_action_id:b.dataset.la }); setHud(); closeModal(); toast("Done."); }
      catch(e){ toast(e.message || "Could not do that."); }
      finally{ busy = false; }
    });
  }catch(e){
    if(spot.pk==="fela_shrine"||spot.pk==="dangote_refinery"){openLocalLandmark(spot,info);return;}
    toast(isMissingFn(e) ? "This place is not set up yet. Ask the admin to run the places SQL." : (e.message || "Could not open this place."));
  }
}
function openLocalLandmark(spot,info){
 const fela=spot.pk==="fela_shrine";
 const actions=fela?[
  ["🎷 Explore Afrobeat history","Discover the music, creativity and cultural influence associated with Fela Kuti and the Shrine."],
  ["🎤 Visit the performance stage","Imagine a live band warming up while the crowd gathers for music."],
  ["🍲 Visit the food and hangout area","Discover the social side of the venue and the food culture around a night out."],
  ["🤝 Learn about the community","Explore how music venues support artists, crews and creative businesses."]
 ]:[
  ["🏭 Take the industrial orientation","Learn how refining, logistics, safety systems and engineering fit together in a large industrial project."],
  ["🦺 Visit the safety briefing centre","Review protective equipment, restricted zones and why industrial safety rules matter."],
  ["⚙️ Explore engineering careers","Discover mechanical, electrical, process, logistics and operations career paths."],
  ["🌍 Learn about the Lekki industrial corridor","Explore how ports, roads, suppliers and factories connect around the area."]
 ];
 openModal('<small style="color:#087f36;font-weight:900">SPECIAL DESTINATION</small><h2>'+info.icon+" "+esc(info.name)+'</h2><p style="color:#173326">'+esc(info.blurb)+'</p><p style="font-size:12px;color:#66766d">'+(fela?"A respectful in-game visit inspired by the public cultural identity of the New Afrika Shrine.":"A fictional visitor-centre experience inspired by the real industrial project. It does not depict or grant entry to the private operating facility.")+'</p><h3>Choose an experience</h3>'+actions.map((a,i)=>'<button class="opt" data-local-landmark="'+i+'">'+esc(a[0])+'<small>Explore this activity</small></button>').join("")+'<button class="btn alt" id="mClose">Close</button>');
 $("mClose").onclick=closeModal;
 $("box").querySelectorAll("[data-local-landmark]").forEach(b=>b.onclick=()=>{
  const a=actions[Number(b.dataset.localLandmark)];let journal=[];try{journal=JSON.parse(localStorage.getItem("slw3_landmark_journal")||"[]");}catch(e){}
  journal.unshift({place:info.name,activity:a[0],date:new Date().toISOString()});try{localStorage.setItem("slw3_landmark_journal",JSON.stringify(journal.slice(0,60)));}catch(e){}
  openModal('<h2>'+esc(a[0])+'</h2><p style="color:#173326">'+esc(a[1])+'</p><p>Your visit is saved in your local landmark journal. No coins, fame or real-world access have been granted.</p><button class="btn" id="lmAgain">Choose another activity</button><button class="btn alt" id="mClose">Leave destination</button>');
  $("lmAgain").onclick=()=>openLocalLandmark(spot,info);$("mClose").onclick=closeModal;
 });
}

$("helpBtn").addEventListener("click",()=>{if(!modalOpen)openWorldGuide(false);});

async function init(){
  if (typeof THREE === "undefined"){
    screen("The 3D engine could not load. Check your internet and refresh.<br><br><a href='starlife.html'>Return to Star Life menu</a>");
    return;
  }
  setTimeout(() => {
    if ($("msgScreen").style.display !== "none" && !modalLocked)
      screen("Taking too long to load. Check your internet, then refresh.<br><br><a href='starlife.html'>Return to Star Life menu</a>");
  }, 25000);
  try{
    const { data: u } = await db.auth.getUser();
    if (!u?.user){ location.replace("login.html"); return; }
    let alertsSaved=false; try{ alertsSaved=localStorage.getItem(TASK_ALERT_PREF)==="1"; }catch(e){}
    if(alertsSaved && "Notification" in window && Notification.permission==="granted"){
      startNewTaskAlerts().catch(e=>console.warn("Task notification setup failed:",e));
    }
    const { data: flag, error } = await db.from("platform_feature_flags").select("enabled").eq("key", "starlife").maybeSingle();
    if (error || !flag || flag.enabled !== true){ screen("Naija Star Life is not open yet.<br><a href='dashboard.html'>Back to dashboard</a>"); return; }
    state = await rpc("starlife_state");
    if (!state.career){ screen("Choose your career first.<br><br><a href='starlife.html'>Open Star Life</a>"); return; }
    if (!state.adult_confirmed){
      $("msgScreen").style.display = "none";
      await confirmAdult();
      $("msgScreen").style.display = "flex"; $("msgScreen").textContent = "Loading Lagos in 3D...";
    }
    if (!state.background){
      $("msgScreen").style.display = "none";          // let the player see the choice
      await pickBackground();
      $("msgScreen").style.display = "flex"; $("msgScreen").textContent = "Loading Lagos in 3D...";
    }
    if (!state.look){
      $("msgScreen").style.display = "none";
      await openLook(true);
      $("msgScreen").style.display = "flex"; $("msgScreen").textContent = "Loading Lagos in 3D...";
    }
    const wk = await rpc("starlife_wake");
    state = wk.state; HOME_DISTRICT = state.home_district;
    await loadPlaces();
    buildWorld();
    await loadExtras();
    await loadCelebStories();
    buildScene();
    resize();
    if (wk.woke){ spawnHome(); await enterRoom(true); } else spawnAt(state.location);
    snapCamera();
    setHud();
    loadBillboards();
    setInterval(loadBillboards, 300000);
    syncPresence(); setInterval(syncPresence, 4000);
    $("hud").style.display = "flex";
    $("msgScreen").style.display = "none";
    if (wk.woke) showWake();
    let seen = false; try{ seen = localStorage.getItem("slw3_help") === "1"; }catch(e){}
    if (!seen) openWorldGuide(true);
    requestAnimationFrame(loop);
  }catch(e){
    console.error("Naija Star Life startup failed:", e);
    const detail = e && e.message ? e.message : "Unknown startup error";
    if (detail === "WEBGL"){
      screen("Your browser could not start 3D graphics. Close other tabs, enable hardware acceleration if available, then try again.<br><br><a href='starlife.html'>Return to Star Life menu</a>");
    }else{
      screen("Naija Star Life could not finish loading.<br><br><small>" + esc(detail) + "</small><br><br>Check your connection and try again. If it continues, send this error to support.<br><br><a href='starlife.html'>Return to Star Life menu</a>");
    }
  }
}
window.addEventListener("unhandledrejection", function(e){
  console.error("Naija Star Life background request failed:", e.reason);
});
init();
