<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transactions — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 18px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-decoration: none;
  font-size: 25px;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.header-subtitle {
  font-size: 12px;
  opacity: .9;
  margin-top: 3px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.summary {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.summary-title {
  color: #666;
  font-size: 13px;
  margin-bottom: 6px;
}

.balance {
  color: #0b8f3c;
  font-size: 28px;
  font-weight: bold;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  margin: 20px 0 12px;
}

.transaction {
  background: white;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.transaction-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.transaction-type {
  font-weight: bold;
  font-size: 15px;
  text-transform: capitalize;
}

.amount {
  font-weight: bold;
  white-space: nowrap;
  font-size: 15px;
}

.amount.credit {
  color: #0b8f3c;
}

.amount.debit {
  color: #d93025;
}

.description {
  color: #555;
  font-size: 14px;
  margin-top: 9px;
  line-height: 1.45;
}

.details {
  margin-top: 12px;
  border-top: 1px solid #eee;
  padding-top: 10px;
}

.detail {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  margin-top: 7px;
}

.detail-label {
  color: #777;
  flex-shrink: 0;
}

.detail-value {
  text-align: right;
  word-break: break-word;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
}

.status.approved,
.status.completed,
.status.success,
.status.successful {
  background: #e7f8ed;
  color: #087b34;
}

.status.pending {
  background: #fff6dc;
  color: #946200;
}

.status.rejected,
.status.failed,
.status.cancelled {
  background: #fdeaea;
  color: #c62828;
}

.status.unknown {
  background: #eee;
  color: #555;
}

.loading,
.empty {
  background: white;
  border-radius: 15px;
  padding: 30px 18px;
  text-align: center;
  color: #666;
  box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.error {
  background: #fff1f1;
  border: 1px solid #ffcaca;
  border-radius: 15px;
  padding: 20px;
  color: #b00020;
  box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.error-title {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 10px;
}

.error-message {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.5;
  word-break: break-word;
}

.retry {
  margin-top: 14px;
  border: none;
  background: #0b8f3c;
  color: white;
  padding: 11px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.bottom-space {
  height: 30px;
}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <a href="dashboard.html" class="back">
      ‹
    </a>

    <div>
      <div class="header-title">
        Transactions
      </div>

      <div class="header-subtitle">
        Your account activity
      </div>
    </div>

  </div>

</header>


<div class="container">

  <div class="summary">

    <div class="summary-title">
      Current Balance
    </div>

    <div class="balance" id="balance">
      ₦0.00
    </div>

  </div>


  <div class="section-title">
    Transaction History
  </div>


  <div id="transactionsList">

    <div class="loading">
      Loading transactions...
    </div>

  </div>


  <div class="bottom-space"></div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Keep your existing publishable key here.
  Do NOT use a secret/service-role key.
*/
const SUPABASE_KEY =
   "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

 

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const list =
  document.getElementById("transactionsList");

const balanceElement =
  document.getElementById("balance");


/* =========================
   MONEY
========================= */

function money(value) {

  const number =
    Number(value || 0);

  return "₦" +
    number.toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   AMOUNT STYLE
========================= */

function getAmountClass(type, amount) {

  const text =
    String(type || "")
      .toLowerCase();

  if (
    text.includes("withdraw") ||
    text.includes("debit") ||
    text.includes("fee") ||
    Number(amount) < 0
  ) {

    return "debit";

  }

  return "credit";
}


/* =========================
   STATUS STYLE
========================= */

function statusClass(status) {

  const value =
    String(status || "")
      .toLowerCase();

  if (
    value === "approved" ||
    value === "completed" ||
    value === "success" ||
    value === "successful"
  ) {

    return value;

  }

  if (value === "pending") {

    return "pending";

  }

  if (
    value === "rejected" ||
    value === "failed" ||
    value === "cancelled"
  ) {

    return value;

  }

  return "unknown";
}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance(userId) {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("balance")
    .eq("id", userId)
    .maybeSingle();


  if (error) {

    console.error(
      "Balance error:",
      error
    );

    return;
  }


  if (data) {

    balanceElement.textContent =
      money(data.balance);

  }

}


/* =========================
   SHOW DATABASE ERROR
========================= */

function showDatabaseError(error) {

  console.error(
    "TRANSACTIONS ERROR:",
    error
  );


  const message =
    error?.message ||
    error?.details ||
    error?.hint ||
    "Unknown database error.";


  list.innerHTML = `

    <div class="error">

      <div class="error-title">
        Transaction history could not load
      </div>

      <div>
        The page connected to Supabase,
        but the transactions request was rejected.
      </div>

      <div class="error-message">
        ${escapeHTML(message)}
      </div>

      ${
        error?.details
        ? `
          <div class="error-message">
            <strong>Details:</strong><br>
            ${escapeHTML(error.details)}
          </div>
        `
        : ""
      }

      ${
        error?.hint
        ? `
          <div class="error-message">
            <strong>Hint:</strong><br>
            ${escapeHTML(error.hint)}
          </div>
        `
        : ""
      }

      <button
        class="retry"
        onclick="loadTransactions()">

        Try Again

      </button>

    </div>

  `;
}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions() {

  list.innerHTML = `

    <div class="loading">
      Loading transactions...
    </div>

  `;


  try {

    /* Get logged-in user */

    const {
      data: authData,
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError) {

      throw authError;

    }


    if (!authData.user) {

      window.location.href =
        "index.html";

      return;

    }


    const user =
      authData.user;


    /* Load wallet balance */

    await loadBalance(
      user.id
    );


    /*
      IMPORTANT:
      No created_at is used here.
      We are only using the columns
      you confirmed exist.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .select(
          "user_id,type,amount,description,reference,status"
        )
        .eq(
          "user_id",
          user.id
        );


    if (error) {

      showDatabaseError(
        error
      );

      return;

    }


    /* No transactions */

    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML = `

        <div class="empty">

          <div style="font-size:40px;">
            💳
          </div>

          <h3>
            No transactions yet
          </h3>

          <p>
            Your earnings, withdrawals
            and other account activity
            will appear here.
          </p>

        </div>

      `;

      return;

    }


    /* Display transactions */

    list.innerHTML =
      data.map(
        transaction => {

          const type =
            transaction.type ||
            "Transaction";


          const amount =
            Number(
              transaction.amount || 0
            );


          const amountClass =
            getAmountClass(
              type,
              amount
            );


          const status =
            transaction.status ||
            "Unknown";


          return `

            <div class="transaction">

              <div class="transaction-top">

                <div class="transaction-type">
                  ${escapeHTML(type)}
                </div>

                <div class="amount ${amountClass}">

                  ${
                    amountClass === "debit"
                    ? "-"
                    : "+"
                  }

                  ${money(
                    Math.abs(amount)
                  )}

                </div>

              </div>


              ${
                transaction.description
                ? `

                  <div class="description">

                    ${escapeHTML(
                      transaction.description
                    )}

                  </div>

                `
                : ""
              }


              <div class="details">

                <div class="detail">

                  <span class="detail-label">
                    Status
                  </span>

                  <span class="detail-value">

                    <span
                      class="status ${statusClass(status)}">

                      ${escapeHTML(status)}

                    </span>

                  </span>

                </div>


                ${
                  transaction.reference
                  ? `

                    <div class="detail">

                      <span class="detail-label">
                        Reference
                      </span>

                      <span class="detail-value">
                        ${escapeHTML(
                          transaction.reference
                        )}
                      </span>

                    </div>

                  `
                  : ""
                }

              </div>

            </div>

          `;

        }
      ).join("");

  }

  catch (error) {

    showDatabaseError(
      error
    );

  }

}


/* =========================
   START
========================= */

loadTransactions();

</script>

</body>
</html>
