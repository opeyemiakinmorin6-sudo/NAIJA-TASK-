<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payments — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5fff7;
  color:#17231b;
}

header{
  background:#0b8f3c;
  color:#fff;
  padding:18px 16px;
}

.header-inner{
  max-width:900px;
  margin:auto;
}

.brand{
  font-size:21px;
  font-weight:800;
}

.subtitle{
  margin-top:4px;
  font-size:13px;
  opacity:.9;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px 14px 45px;
}

.back{
  display:inline-block;
  margin-bottom:17px;
  color:#0b8f3c;
  text-decoration:none;
  font-weight:700;
}

.page-title{
  font-size:24px;
  margin-bottom:6px;
}

.page-description{
  color:#657168;
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

.notice{
  display:none;
  padding:13px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
  line-height:1.45;
}

.notice.success{
  display:block;
  background:#eaf8ef;
  border:1px solid #bfe5cb;
  color:#086b2f;
}

.notice.error{
  display:block;
  background:#fff0f0;
  border:1px solid #edc4c4;
  color:#a02020;
}

.card{
  background:#fff;
  border:1px solid #dcefe2;
  border-radius:16px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.job-header{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:15px;
}

.job-title{
  font-size:18px;
  font-weight:800;
  line-height:1.35;
}

.status{
  background:#fff4d8;
  color:#775600;
  border:1px solid #efd48c;
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.detail{
  background:#f7faf8;
  border-radius:10px;
  padding:11px;
}

.label{
  display:block;
  color:#718077;
  font-size:11px;
  margin-bottom:4px;
}

.value{
  font-weight:700;
  font-size:14px;
  word-break:break-word;
}

.amount{
  color:#087d35;
  font-size:19px;
}

.reference{
  background:#f7faf8;
  border-radius:10px;
  padding:12px;
  margin-bottom:15px;
}

.reference strong{
  display:block;
  font-size:12px;
  color:#718077;
  margin-bottom:5px;
}

.reference span{
  font-weight:700;
  word-break:break-all;
}

.proof-box{
  background:#f7faf8;
  border:1px solid #e2ebe4;
  border-radius:12px;
  padding:13px;
  margin-bottom:15px;
}

.proof-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:9px;
}

.proof-image{
  display:block;
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:10px;
  background:#eef2ef;
  margin-bottom:10px;
}

.proof-link{
  display:inline-block;
  color:#075ec9;
  text-decoration:underline;
  font-weight:700;
  font-size:14px;
}

.no-proof{
  color:#a02020;
  font-size:13px;
  line-height:1.4;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:13px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.approve{
  background:#0b8f3c;
  color:#fff;
}

.refresh{
  background:#eef5f0;
  color:#185f32;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:38px 15px;
  color:#68746c;
}

.empty strong{
  color:#25332a;
}

.loading{
  text-align:center;
  padding:35px;
  color:#68746c;
}

@media(max-width:520px){

  .job-header{
    display:block;
  }

  .status{
    display:inline-block;
    margin-top:9px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .proof-image{
    max-height:350px;
  }
}

</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">NAIJA TASK</div>
    <div class="subtitle">Admin Payment Review</div>
  </div>
</header>

<main class="container">

  <a class="back" href="dashboard.html">
    ← Admin Dashboard
  </a>

  <h1 class="page-title">
    Payment Approval
  </h1>

  <p class="page-description">
    Review poster payments before their jobs become available to Taskers.
  </p>

  <div id="notice" class="notice"></div>

  <div id="loading" class="loading">
    Checking admin access...
  </div>

  <div id="content"></div>

</main>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

const SUPABASE_KEY =
   "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";


const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const loading =
  document.getElementById("loading");

const content =
  document.getElementById("content");

const notice =
  document.getElementById("notice");

let currentUser = null;


/* =========================================================
   HELPERS
========================================================= */

function naira(value){

  return "₦" +
    Number(value || 0)
    .toLocaleString("en-NG");
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showNotice(message,type){

  notice.className =
    "notice " + type;

  notice.textContent =
    message;
}


function hideNotice(){

  notice.className =
    "notice";

  notice.textContent =
    "";
}


/* =========================================================
   CHECK LOGIN + ADMIN STATUS
========================================================= */

async function checkAdmin(){

  const {
    data:{user},
    error:authError
  } = await db.auth.getUser();

  if(authError || !user){

    window.location.href =
      "index.html";

    return false;
  }

  currentUser = user;


  const {
    data:admin,
    error:adminError
  } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();


  if(adminError){

    throw adminError;
  }


  if(!admin){

    throw new Error(
      "This account is not registered as an Admin."
    );
  }


  return true;
}


/* =========================================================
   CREATE TEMPORARY PAYMENT SCREENSHOT URL
========================================================= */

async function createProofUrl(path){

  if(!path){
    return null;
  }


  /*
    The payment proof bucket is PRIVATE.

    This creates a temporary signed URL
    instead of exposing the storage file publicly.
  */

  const {
    data,
    error
  } = await db.storage
    .from("payment proof")
    .createSignedUrl(
      path,
      3600
    );


  if(error){

    console.error(
      "Signed URL error:",
      error
    );

    return null;
  }


  return data?.signedUrl || null;
}


/* =========================================================
   LOAD PENDING PAYMENTS
========================================================= */

async function loadPayments(){

  hideNotice();

  content.innerHTML = "";

  loading.style.display =
    "block";

  loading.textContent =
    "Checking admin access...";


  try{

    const isAdmin =
      await checkAdmin();


    if(!isAdmin){
      return;
    }


    loading.textContent =
      "Loading payments...";


    const {
      data:payments,
      error:paymentError
    } = await db
      .from("poster_payments")
      .select("*")
      .eq("status","UNDER_REVIEW")
      .order(
        "created_at",
        {ascending:true}
      );


    if(paymentError){
      throw paymentError;
    }


    loading.style.display =
      "none";


    if(
      !payments ||
      payments.length === 0
    ){

      showEmptyState(
        "No payments waiting for review.",
        "New poster payments will appear here after they submit proof."
      );

      return;
    }


    /*
      Render each pending payment.
    */

    for(
      const payment of payments
    ){

      await renderPayment(payment);
    }


  }catch(error){

    console.error(error);

    loading.style.display =
      "none";

    showNotice(
      error.message ||
      "Unable to load payments.",
      "error"
    );
  }
}


/* =========================================================
   EMPTY STATE
========================================================= */

function showEmptyState(
  title,
  description
){

  content.innerHTML = `
    <div class="card empty">

      <strong>
        ${escapeHtml(title)}
      </strong>

      <p style="margin-top:7px;">
        ${escapeHtml(description)}
      </p>

    </div>
  `;
}


/* =========================================================
   RENDER PAYMENT
========================================================= */

async function renderPayment(payment){

  /*
    Get related task.
  */

  const {
    data:task,
    error:taskError
  } = await db
    .from("tasks")
    .select("*")
    .eq("id",payment.task_id)
    .maybeSingle();


  if(taskError){

    console.error(
      "Task error:",
      taskError
    );

    return;
  }


  if(!task){
    return;
  }


  const total =
    Number(task.reward || 0) *
    Number(task.slots || 0);


  /*
    Create secure temporary screenshot URL.
  */

  let proofUrl = null;

  if(payment.proof_url){

    proofUrl =
      await createProofUrl(
        payment.proof_url
      );
  }


  /*
    Create card.
  */

  const card =
    document.createElement("div");

  card.className =
    "card";


  let proofHtml = "";


  if(proofUrl){

    proofHtml = `

      <div class="proof-box">

        <div class="proof-title">
          Payment Screenshot
        </div>

        <img
          class="proof-image"
          src="${escapeHtml(proofUrl)}"
          alt="Payment proof"
        >

        <a
          class="proof-link"
          href="${escapeHtml(proofUrl)}"
          target="_blank"
          rel="noopener">
          Open Screenshot
        </a>

      </div>

    `;

  }else if(payment.proof_url){

    proofHtml = `

      <div class="proof-box">

        <div class="proof-title">
          Payment Screenshot
        </div>

        <div class="no-proof">
          The screenshot could not be opened.
          Check the payment-proof storage policy.
        </div>

      </div>

    `;

  }else{

    proofHtml = `

      <div class="proof-box">

        <div class="proof-title">
          Payment Screenshot
        </div>

        <div class="no-proof">
          No payment screenshot was submitted.
        </div>

      </div>

    `;
  }


  card.innerHTML = `

    <div class="job-header">

      <div class="job-title">
        ${escapeHtml(
          task.title ||
          "Untitled Job"
        )}
      </div>

      <div class="status">
        UNDER REVIEW
      </div>

    </div>


    <div class="details">

      <div class="detail">

        <span class="label">
          Reward per Tasker
        </span>

        <span class="value">
          ${naira(task.reward)}
        </span>

      </div>


      <div class="detail">

        <span class="label">
          Slots
        </span>

        <span class="value">
          ${
            Number(
              task.slots || 0
            ).toLocaleString()
          }
        </span>

      </div>


      <div class="detail">

        <span class="label">
          Required Funding
        </span>

        <span class="value amount">
          ${naira(total)}
        </span>

      </div>


      <div class="detail">

        <span class="label">
          Payment Method
        </span>

        <span class="value">
          ${
            escapeHtml(
              payment.payment_method ||
              "—"
            )
          }
        </span>

      </div>

    </div>


    <div class="reference">

      <strong>
        Transaction Reference
      </strong>

      <span>
        ${
          escapeHtml(
            payment.payment_reference ||
            "Not provided"
          )
        }
      </span>

    </div>


    ${proofHtml}


    <div class="actions">

      <button
        class="approve"
        data-payment-id="${payment.id}">

        Approve Payment & Make LIVE

      </button>


      <button
        class="refresh">

        Refresh

      </button>

    </div>

  `;


  content.appendChild(card);


  const approveButton =
    card.querySelector(
      ".approve"
    );


  const refreshButton =
    card.querySelector(
      ".refresh"
    );


  approveButton.addEventListener(
    "click",
    function(){

      approvePayment(
        payment.id,
        approveButton,
        card
      );

    }
  );


  refreshButton.addEventListener(
    "click",
    function(){

      loadPayments();

    }
  );
}


/* =========================================================
   APPROVE PAYMENT
========================================================= */

async function approvePayment(
  paymentId,
  button,
  card
){

  /*
    Final confirmation before
    changing the job to LIVE.
  */

  const confirmed =
    window.confirm(
      "Confirm that you have reviewed the payment proof and want to make this job LIVE?"
    );


  if(!confirmed){
    return;
  }


  button.disabled =
    true;

  button.textContent =
    "Approving...";


  try{

    /*
      IMPORTANT:

      This calls the secure database
      function created earlier.

      The browser does NOT directly
      change the job to LIVE.
    */

    const {
      data,
      error
    } = await db.rpc(
      "admin_approve_poster_payment",
      {
        p_payment_id:
          paymentId
      }
    );


    if(error){
      throw error;
    }


    console.log(
      "Approval result:",
      data
    );


    /*
      Remove approved payment
      from pending list.
    */

    card.remove();


    showNotice(
      "Payment approved successfully. The job is now LIVE and can be shown to Taskers.",
      "success"
    );


    /*
      If nothing remains,
      show empty state.
    */

    if(
      content.children.length === 0
    ){

      showEmptyState(
        "No payments waiting for review.",
        "All pending payments have been reviewed."
      );
    }


  }catch(error){

    console.error(
      "Approval error:",
      error
    );


    button.disabled =
      false;

    button.textContent =
      "Approve Payment & Make LIVE";


    showNotice(
      error.message ||
      "Payment approval failed.",
      "error"
    );
  }
}


/* =========================================================
   START
========================================================= */

loadPayments();

</script>

</body>
  </html>
