<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 6px;
}

header p {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.nav {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.nav a {
  display: block;
  background: white;
  color: #0b8f3c;
  text-decoration: none;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.balance {
  text-align: center;
}

.balance h3 {
  margin-top: 0;
}

.balance h2 {
  color: #0b8f3c;
  font-size: 34px;
  margin: 12px 0;
}

.status {
  color: #777;
  font-size: 14px;
}

.transaction {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.transaction:first-child {
  border-top: none;
  padding-top: 5px;
}

.transaction p {
  margin: 7px 0;
}

.transaction small {
  color: #777;
}

.message {
  text-align: center;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>NAIJA TASK</h1>
  <p>My Wallet</p>
</header>

<div class="container">

  <div class="nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="tasks.html">📋 Tasks</a>
    <a href="referrals.html">👥 Referrals</a>
    <a href="withdrawals.html">💸 Withdrawals</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <div class="card balance">

    <h3>Wallet Balance</h3>

    <h2>
      ₦<span id="balance">0.00</span>
    </h2>

    <p id="walletStatus" class="status">
      Loading wallet...
    </p>

  </div>

  <div class="card">

    <h3>Wallet Transactions</h3>

    <div id="transactions">
      <p class="message">
        Loading transactions...
      </p>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Put your CURRENT Supabase publishable key here.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadWallet() {

  const walletStatus =
    document.getElementById("walletStatus");

  const transactionsBox =
    document.getElementById("transactions");


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "index.html";

    return;
  }


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("balance")
    .eq("id", user.id)
    .single();


  if (profileError) {

    console.error(profileError);

    walletStatus.textContent =
      "Unable to load wallet.";

    return;
  }


  document.getElementById(
    "balance"
  ).textContent =
    Number(
      profile?.balance || 0
    ).toFixed(2);


  walletStatus.textContent =
    "Wallet loaded successfully.";


  const {
    data: transactions,
    error: transactionError
  } = await supabaseClient
    .from("wallet_transactions")
    .select(
      "id, type, amount, description, reference, status, created_at"
    )
    .eq(
      "user_id",
      user.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (transactionError) {

    console.error(transactionError);

    transactionsBox.innerHTML =
      '<p class="message">Unable to load transactions.</p>';

    return;
  }


  if (
    !transactions ||
    transactions.length === 0
  ) {

    transactionsBox.innerHTML =
      '<p class="message">No wallet transactions yet.</p>';

    return;
  }


  transactionsBox.innerHTML = "";


  transactions.forEach(transaction => {

    const div =
      document.createElement("div");

    div.className =
      "transaction";


    const title =
      document.createElement("strong");

    title.textContent =
      transaction.type ||
      "Transaction";


    const amount =
      document.createElement("p");

    amount.textContent =
      "Amount: ₦" +
      Number(
        transaction.amount || 0
      ).toFixed(2);


    const description =
      document.createElement("p");

    description.textContent =
      transaction.description ||
      "";


    const status =
      document.createElement("small");

    status.textContent =
      "Status: " +
      (
        transaction.status ||
        "N/A"
      );


    div.appendChild(title);
    div.appendChild(amount);
    div.appendChild(description);
    div.appendChild(status);

    transactionsBox.appendChild(div);

  });

}


loadWallet();

</script>

</body>
</html>
