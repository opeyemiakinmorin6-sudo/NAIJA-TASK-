<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 18px 20px;
}

.header-inner {
  max-width: 600px;
  margin: auto;
}

.back {
  display: inline-block;
  color: white;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 14px;
}

header h1 {
  margin: 0 0 5px;
  font-size: 25px;
}

header p {
  margin: 0;
  opacity: 0.95;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.balance {
  text-align: center;
}

.balance-icon {
  font-size: 38px;
}

.balance h3 {
  margin: 8px 0;
}

.balance h2 {
  color: #0b8f3c;
  font-size: 34px;
  margin: 12px 0;
}

.status {
  color: #777;
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  background: #f5fff7;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}

.stat-icon {
  font-size: 25px;
}

.stat-title {
  display: block;
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.stat-value {
  display: block;
  color: #0b8f3c;
  font-size: 20px;
  font-weight: bold;
  margin-top: 5px;
}

.withdraw-btn {
  display: block;
  background: #0b8f3c;
  color: white;
  text-decoration: none;
  text-align: center;
  padding: 14px;
  border-radius: 10px;
  font-weight: bold;
  margin-top: 12px;
}

.withdraw-btn:hover {
  opacity: 0.9;
}

.transaction {
  border-top: 1px solid #eee;
  padding: 15px 0;
}

.transaction:first-child {
  border-top: none;
  padding-top: 5px;
}

.transaction p {
  margin: 7px 0;
}

.transaction small {
  color: #777;
  display: block;
  margin-top: 5px;
}

.transaction-type {
  font-weight: bold;
  color: #111;
}

.amount {
  font-weight: bold;
}

.positive {
  color: #0b8f3c;
}

.negative {
  color: #c62828;
}

.message {
  text-align: center;
  color: #777;
  padding: 15px 0;
}

.error {
  color: #c62828;
}

.loading {
  text-align: center;
  color: #777;
  padding: 15px 0;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>💰 My Wallet</h1>
    <p>Manage your NAIJA TASK earnings</p>

  </div>
</header>


<div class="container">

  <!-- BALANCE -->

  <div class="card balance">

    <div class="balance-icon">💰</div>

    <h3>Available Balance</h3>

    <h2>
      ₦<span id="balance">0.00</span>
    </h2>

    <p id="walletStatus" class="status">
      Loading wallet...
    </p>

    <a
      href="withdrawals.html"
      class="withdraw-btn"
    >
      
    </a>

  </div>


  <!-- WALLET SUMMARY -->

  <div class="card">

    <h3>📊 Wallet Summary</h3>

    <div class="stats">

      <div class="stat">

        <span class="stat-icon">💵</span>

        <span class="stat-title">
          Total Earned
        </span>

        <span
          class="stat-value"
          id="totalEarned"
        >
          ₦0.00
        </span>

      </div>


      <div class="stat">

        <span class="stat-icon">💸</span>

        <span class="stat-title">
          Total Withdrawn
        </span>

        <span
          class="stat-value"
          id="totalWithdrawn"
        >
          ₦0.00
        </span>

      </div>

    </div>

  </div>


  <!-- TRANSACTIONS -->

  <div class="card">

    <h3>📜 Wallet Transactions</h3>

    <div id="transactions">

      <p class="loading">
        Loading transactions...
      </p>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Keep your CURRENT Supabase publishable key here.

  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function formatNaira(amount) {

  return Number(
    amount || 0
  ).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}


function isEarning(type) {

  const value =
    String(type || "").toUpperCase();

  return (
    value.includes("EARNING") ||
    value.includes("TASK") ||
    value.includes("CREDIT")
  );

}


function isWithdrawal(type) {

  const value =
    String(type || "").toUpperCase();

  return (
    value.includes("WITHDRAW") ||
    value.includes("DEBIT")
  );

}


async function loadWallet() {

  const walletStatus =
    document.getElementById(
      "walletStatus"
    );

  const transactionsBox =
    document.getElementById(
      "transactions"
    );


  /*
    Check logged-in user
  */

  const {
    data: { user },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "index.html";

    return;

  }


  /*
    Load wallet balance
  */

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id", user.id)
      .single();


  if (profileError) {

    console.error(profileError);

    walletStatus.textContent =
      "Unable to load wallet.";

    walletStatus.className =
      "status error";

    return;

  }


  document.getElementById(
    "balance"
  ).textContent =
    formatNaira(
      profile?.balance || 0
    );


  /*
    Load transactions
  */

  const {
    data: transactions,
    error: transactionError
  } =
    await supabaseClient
      .from("wallet_transactions")
      .select(
        "id, type, amount, description, reference, status, created_at"
      )
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (transactionError) {

    console.error(
      transactionError
    );

    walletStatus.textContent =
      "Wallet loaded, but transactions could not be loaded.";

    walletStatus.className =
      "status error";

    transactionsBox.innerHTML =
      `
        <p class="message error">
          Unable to load transactions.
        </p>
      `;

    return;

  }


  walletStatus.textContent =
    "Wallet loaded successfully.";

  walletStatus.className =
    "status";


  /*
    Calculate real totals
  */

  let totalEarned = 0;
  let totalWithdrawn = 0;


  (transactions || []).forEach(
    transaction => {

      const amount =
        Number(
          transaction.amount || 0
        );


      if (
        isEarning(
          transaction.type
        )
      ) {

        totalEarned += amount;

      }


      if (
        isWithdrawal(
          transaction.type
        )
      ) {

        totalWithdrawn += amount;

      }

    }
  );


  document.getElementById(
    "totalEarned"
  ).textContent =
    "₦" +
    formatNaira(
      totalEarned
    );


  document.getElementById(
    "totalWithdrawn"
  ).textContent =
    "₦" +
    formatNaira(
      totalWithdrawn
    );


  /*
    No transactions
  */

  if (
    !transactions ||
    transactions.length === 0
  ) {

    transactionsBox.innerHTML =
      `
        <p class="message">
          No wallet transactions yet.
        </p>
      `;

    return;

  }


  /*
    Display transactions
  */

  transactionsBox.innerHTML = "";


  transactions.forEach(
    transaction => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "transaction";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "transaction-type";

      title.textContent =
        transaction.type ||
        "Transaction";


      const amount =
        document.createElement(
          "p"
        );

      const amountNumber =
        Number(
          transaction.amount || 0
        );


      const withdrawal =
        isWithdrawal(
          transaction.type
        );


      amount.className =
        withdrawal
          ? "amount negative"
          : "amount positive";


      amount.textContent =
        (withdrawal
          ? "- ₦"
          : "+ ₦") +
        formatNaira(
          Math.abs(
            amountNumber
          )
        );


      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        transaction.description ||
        "No description";


      const status =
        document.createElement(
          "small"
        );

      status.textContent =
        "Status: " +
        (
          transaction.status ||
          "N/A"
        );


      if (
        transaction.reference
      ) {

        const reference =
          document.createElement(
            "small"
          );

        reference.textContent =
          "Reference: " +
          transaction.reference;

        div.appendChild(
          reference
        );

      }


      if (
        transaction.created_at
      ) {

        const date =
          document.createElement(
            "small"
          );

        date.textContent =
          "Date: " +
          new Date(
            transaction.created_at
          ).toLocaleString(
            "en-NG"
          );

        div.appendChild(
          date
        );

      }


      div.prepend(
        title
      );

      div.appendChild(
        amount
      );

      div.appendChild(
        description
      );

      div.appendChild(
        status
      );


      transactionsBox.appendChild(
        div
      );

    }
  );

}


loadWallet();

</script>

</body>
</html>
