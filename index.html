<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NAIJA TASK — Complete Tasks. Earn Naira.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5fff7;
      color: #111;
    }

    header {
      background: #0b8f3c;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px 30px;
    }

    .hero h2 {
      margin: 0 0 15px;
      font-size: 27px;
    }

    .hero p {
      max-width: 520px;
      margin: 0 auto 25px;
      color: #555;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 14px 24px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #0b8f3c;
      color: white;
    }

    .secondary {
      background: white;
      color: #0b8f3c;
      border: 2px solid #0b8f3c;
    }

    .form-box {
      display: none;
      width: calc(100% - 30px);
      max-width: 430px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      margin-top: 0;
      text-align: center;
      color: #0b8f3c;
    }

    .form-box input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .form-box input:focus {
      border-color: #0b8f3c;
    }

    .form-box .submit-button {
      width: 100%;
      margin-top: 12px;
    }

    .close-button {
      width: 100%;
      margin-top: 8px;
      background: #eee;
      color: #333;
    }

    .message {
      min-height: 22px;
      text-align: center;
      margin: 12px 0 0;
      line-height: 1.5;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 29px;
      }

      .hero h2 {
        font-size: 24px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .buttons button {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>NAIJA TASK</h1>
    <p>Complete Tasks. Earn Naira.</p>
  </header>


  <main>

    <section class="hero">

      <h2>Earn by Completing Simple Tasks</h2>

      <p>
        Complete available tasks, submit proof, and earn rewards
        into your NAIJA TASK wallet.
      </p>

      <div class="buttons">

        <button
          type="button"
          class="primary"
          onclick="showSignup()">
          Create Account
        </button>

        <button
          type="button"
          class="secondary"
          onclick="showLogin()">
          Login
        </button>

      </div>

    </section>


    <!-- LOGIN -->

    <section
      id="loginBox"
      class="form-box"
      aria-label="Login form">

      <h2>Login to NAIJA TASK</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
        autocomplete="email">

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password">

      <button
        type="button"
        class="primary submit-button"
        onclick="loginUser()">
        Login
      </button>

      <p
        id="loginMessage"
        class="message"
        aria-live="polite">
      </p>

      <button
        type="button"
        class="close-button"
        onclick="hideForms()">
        Close
      </button>

    </section>


    <!-- SIGN UP -->

    <section
      id="signupBox"
      class="form-box"
      aria-label="Create account form">

      <h2>Create NAIJA TASK Account</h2>

      <input
        type="text"
        id="signupName"
        placeholder="Full name"
        autocomplete="name">

      <input
        type="email"
        id="signupEmail"
        placeholder="Email address"
        autocomplete="email">

      <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        autocomplete="new-password">

      <button
        type="button"
        class="primary submit-button"
        onclick="signupUser()">
        Create Account
      </button>

      <p
        id="signupMessage"
        class="message"
        aria-live="polite">
      </p>

      <button
        type="button"
        class="close-button"
        onclick="hideForms()">
        Close
      </button>

    </section>

  </main>


  <footer>
    © 2026 NAIJA TASK — Complete Tasks. Earn Naira.
  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jwakveeiynpakunwjzkj.supabase.co";

    /*
      Your Supabase publishable key goes here.
      Do not use a secret/service-role key.
    */

    const SUPABASE_KEY =
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function showLogin() {

      document.getElementById("signupBox").style.display = "none";

      document.getElementById("loginBox").style.display = "block";

      document.getElementById("loginBox").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    function showSignup() {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("signupBox").style.display = "block";

      document.getElementById("signupBox").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    function hideForms() {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("signupBox").style.display = "none";

    }


    async function signupUser() {

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const message =
        document.getElementById("signupMessage");


      message.textContent = "";


      if (!name || !email || !password) {

        message.textContent =
          "Please fill in all fields.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      message.textContent =
        "Creating your account...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: name
            }
          }

        });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        if (data.user) {

  await supabaseClient
    .from("profiles")
    .upsert({
      id: data.user.id,
      full_name: name
    });

  if (data.session) { 

          

            message.textContent =
              "Account created successfully. Opening your dashboard...";

            setTimeout(() => {

              window.location.href =
                "dashboard.html";

            }, 700);

          } else {

            message.textContent =
              "Account created. Please check your email to confirm your account.";

          }

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }


    async function loginUser() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      message.textContent = "";


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      message.textContent =
        "Logging in...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        if (data.user) {
          await supabaseClient
  .from("profiles")
  .upsert({
    id: data.user.id,
    full_name: name
  });

          message.textContent =
            "Login successful. Opening your dashboard...";

          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 500);

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }

  </script>

</body>
</html>
