<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>NAIJA TASK — Complete Tasks. Earn Naira.</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5fff7;
      color: #111;
    }

    header {
      background: #0b8f3c;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px 30px;
    }

    .hero h2 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .hero p {
      max-width: 500px;
      margin: 0 auto 25px;
      color: #555;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      display: inline-block;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #0b8f3c;
      color: white;
    }

    .primary:hover {
      background: #087631;
    }

    .secondary {
      background: white;
      color: #0b8f3c;
      border: 2px solid #0b8f3c;
    }

    .form-box {
      display: none;
      width: calc(100% - 30px);
      max-width: 430px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      text-align: center;
      margin-top: 0;
      color: #0b8f3c;
    }

    .form-box input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .form-box button {
      width: 100%;
      margin: 12px 0 5px;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    .close-button {
      background: #eee;
      color: #333;
      width: 100%;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 29px;
      }

      .hero h2 {
        font-size: 24px;
      }

      .buttons button {
        width: 100%;
        max-width: 300px;
      }
    }
  </style></head><body>  <header>
    <h1>NAIJA TASK</h1>
    <p>Complete Tasks. Earn Naira.</p>
  </header>  <section class="hero"><h2>Earn by Completing Simple Tasks</h2>

<p>
  Complete available tasks, submit proof, and earn rewards
  directly into your NAIJA TASK wallet.
</p>

<div class="buttons">

  <button
    type="button"
    class="primary"
    onclick="showSignup()">
    Create Account
  </button>

  <button
    type="button"
    class="secondary"
    onclick="showLogin()">
    Login
  </button>

</div>

  </section>  <!-- LOGIN FORM -->  <div id="loginBox" class="form-box"><h2>Login to NAIJA TASK</h2>

<input
  type="email"
  id="loginEmail"
  placeholder="Email address"
  autocomplete="email">

<input
  type="password"
  id="loginPassword"
  placeholder="Password"
  autocomplete="current-password">

<button
  type="button"
  class="primary"
  onclick="loginUser()">
  Login
</button>

<p id="loginMessage" class="message"></p>

<button
  type="button"
  class="close-button"
  onclick="hideForms()">
  Close
</button>

  </div>  <!-- SIGNUP FORM -->  <div id="signupBox" class="form-box"><h2>Create NAIJA TASK Account</h2>

<input
  type="text"
  id="signupName"
  placeholder="Full name"
  autocomplete="name">

<input
  type="email"
  id="signupEmail"
  placeholder="Email address"
  autocomplete="email">

<input
  type="password"
  id="signupPassword"
  placeholder="Password"
  autocomplete="new-password">

<button
  type="button"
  class="primary"
  onclick="signupUser()">
  Create Account
</button>

<p id="signupMessage" class="message"></p>

<button
  type="button"
  class="close-button"
  onclick="hideForms()">
  Close
</button>

  </div>  <footer>
    © 2026 NAIJA TASK — Complete Tasks. Earn Naira.
  </footer>  <!-- SUPABASE -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>

    const SUPABASE_URL =
      "https://jwakveeiynpakunwjzkj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function showLogin() {

      document.getElementById("signupBox").style.display = "none";

      document.getElementById("loginBox").style.display = "block";

      document.getElementById("loginBox")
        .scrollIntoView({
          behavior: "smooth"
        });
    }


    function showSignup() {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("signupBox").style.display = "block";

      document.getElementById("signupBox")
        .scrollIntoView({
          behavior: "smooth"
        });
    }


    function hideForms() {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("signupBox").style.display = "none";
    }


    async function signupUser() {

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const message =
        document.getElementById("signupMessage");


      if (!name || !email || !password) {

        message.textContent =
          "Please fill in all fields.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      message.textContent =
        "Creating your account...";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name
              }

            }

          });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        if (data.user) {

          message.textContent =
            "Account created successfully! Check your email if confirmation is required.";

        }

      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }


    async function loginUser() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      message.textContent =
        "Logging in...";


      try {

        const { error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          message.textContent =
            error.message;

          return;
        }


        message.textContent =
          "Login successful!";


        setTimeout(function() {

          window.location.href =
            "dashboard.html";

        }, 800);


      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }

  </script></body>
  </html>
