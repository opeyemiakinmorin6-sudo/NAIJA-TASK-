<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Naija Task — Complete Tasks. Earn Naira.</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
}

.hero {
  text-align: center;
  padding: 45px 20px;
}

.hero h2 {
  font-size: 28px;
}

.hero p {
  color: #555;
  line-height: 1.6;
}

button {
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin: 5px;
}

.primary {
  background: #0b8f3c;
  color: white;
}

.secondary {
  background: white;
  color: #0b8f3c;
  border: 1px solid #0b8f3c;
}

.form-box {
  display: none;
  max-width: 420px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.form-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.message {
  text-align: center;
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>Naija Task</h1>
  <p>Complete Tasks. Earn Naira.</p>
</header>

<section class="hero">
  <h2>Earn by Completing Simple Tasks</h2>

  <p>
    Complete available tasks, submit proof, and earn rewards
    directly into your Naija Task wallet.
  </p>

  <button class="primary" onclick="showSignup()">
    Create Account
  </button>

  <button class="secondary" onclick="showLogin()">
    Login
  </button>
</section>

<div id="loginBox" class="form-box">

  <h2>Login to Naija Task</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email address"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button class="primary" onclick="loginUser()">
    Login
  </button>

  <p id="loginMessage" class="message"></p>

</div>

<div id="signupBox" class="form-box">

  <h2>Create Naija Task Account</h2>

  <input
    type="text"
    id="signupName"
    placeholder="Full name"
  >

  <input
    type="email"
    id="signupEmail"
    placeholder="Email address"
  >

  <input
    type="password"
    id="signupPassword"
    placeholder="Password"
  >

  <button class="primary" onclick="signupUser()">
    Create Account
  </button>

  <p id="signupMessage" class="message"></p>

</div>

<footer>
  © 2026 Naija Task — Complete Tasks. Earn Naira.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

const SUPABASE_KEY =
  "YOUR_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showLogin() {

  document.getElementById("signupBox").style.display = "none";

  document.getElementById("loginBox").style.display = "block";

  document.getElementById("loginBox")
    .scrollIntoView({ behavior: "smooth" });
}


function showSignup() {

  document.getElementById("loginBox").style.display = "none";

  document.getElementById("signupBox").style.display = "block";

  document.getElementById("signupBox")
    .scrollIntoView({ behavior: "smooth" });
}


async function loginUser() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  message.textContent = "Logging in...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    message.textContent = error.message;

    return;
  }


  message.textContent =
    "Login successful!";


  setTimeout(() => {

    window.location.href =
      "dashboard.html";

  }, 1000);
}


async function signupUser() {

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("signupMessage");


  if (!name || !email || !password) {

    message.textContent =
      "Please fill in all fields.";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  message.textContent =
    "Creating your account...";


  try {

    const { error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: name
          }

        }

      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Account created successfully! You can now log in.";


  } catch (error) {

    message.textContent =
      error.message;

  }

}

</script>

</body>
  </html>
