<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">NAIJA TASK</title>
<desc id="desc">NAIJA TASK official NT monogram in a green rounded square with lime bars.</desc>
<defs>
  <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063d2d"/><stop offset="1" stop-color="#005d3a"/></linearGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005b39"/><stop offset=".55" stop-color="#008b4a"/><stop offset="1" stop-color="#00a34f"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a8df27"/><stop offset="1" stop-color="#b9e92b"/></linearGradient>
</defs>
<rect width="512" height="512" rx="42" fill="url(#outer)"/>
<rect x="72" y="78" width="368" height="356" rx="104" fill="url(#mark)" stroke="#8bbd35" stroke-width="1.5"/>
<rect x="116" y="146" width="280" height="28" fill="url(#lime)"/>
<text x="256" y="316" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="166" font-weight="800" letter-spacing="-12">NT</text>
<rect x="160" y="352" width="192" height="18" rx="9" fill="url(#lime)"/>
</svg>