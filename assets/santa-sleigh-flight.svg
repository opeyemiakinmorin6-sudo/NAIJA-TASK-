<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Father Christmas flying with reindeer</title>
<desc id="desc">A festive red sleigh carrying Father Christmas, pulled through the night sky by three flying reindeer.</desc>
<defs>
 <linearGradient id="sleigh" x2="0" y2="1"><stop stop-color="#ff4c43"/><stop offset="1" stop-color="#9f1426"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe99a"/><stop offset="1" stop-color="#c58b25"/></linearGradient>
 <linearGradient id="fur" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dce7e9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<!-- soft trail -->
<path d="M25 154 Q180 105 330 150" fill="none" stroke="#fff1c4" stroke-width="3" stroke-linecap="round" opacity=".65"/>
<path d="M55 173 Q190 137 300 166" fill="none" stroke="#fff" stroke-width="1.5" opacity=".45"/>
<!-- reins -->
<path d="M350 145 Q315 130 280 141 Q235 125 195 139 Q150 122 110 137" fill="none" stroke="#d8ad57" stroke-width="3"/>
