  <path d="M-54 -3 Q-70 -16 -78 -7" fill="none" stroke-width="3"/>
  <circle cx="-57" cy="-17" r="4" fill="#ff3030" stroke="none"/><circle cx="35" cy="2" r="2.8" fill="#171717" stroke="none"/>
