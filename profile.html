<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 18px 20px 22px;
}

.header-inner {
  max-width: 600px;
  margin: auto;
}

.back {
  display: inline-block;
  background: white;
  color: #0b8f3c;
  text-decoration: none;
  border: 2px solid white;
  padding: 10px 15px;
  border-radius: 9px;
  font-weight: bold;
  margin-bottom: 18px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 25px;
}

header p {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.card h2 {
  margin-top: 0;
  color: #0b8f3c;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: #0b8f3c;
}

input[readonly] {
  background: #f3f3f3;
  color: #666;
}

button.save {
  width: 100%;
  border: none;
  padding: 14px;
  margin-top: 20px;
  border-radius: 9px;
  background: #0b8f3c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button.save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.logout {
  width: 100%;
  border: 1px solid #d32f2f;
  padding: 13px;
  border-radius: 9px;
  background: white;
  color: #d32f2f;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.success {
  color: #0b8f3c;
}

.error {
  color: #d32f2f;
}

.loading {
  text-align: center;
  color: #777;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>👤 My Profile</h1>
    <p>Manage your account information</p>

  </div>
</header>


<div class="container">

  <div class="card">

    <h2>Account Information</h2>

    <p id="loadingMessage" class="loading">
      Loading profile...
    </p>

    <div id="profileForm" style="display:none;">

      <label for="fullName">
        Full Name
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="Enter your full name"
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="Enter your phone number"
      >


      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        type="email"
        readonly
      >


      <button
        id="saveButton"
        class="save"
        onclick="saveProfile()"
      >
        Save Profile
      </button>

      <p id="message"></p>

    </div>

  </div>


  <div class="card">

    <h2>🔐 Account</h2>

    <p>
      Your account information is connected to your
      NAIJA TASK account.
    </p>

    <button
      class="logout"
      onclick="logoutUser()"
    >
      🚪 Logout
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  Put your CURRENT Supabase publishable key here.

  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadProfile() {

  const loadingMessage =
    document.getElementById(
      "loadingMessage"
    );

  const profileForm =
    document.getElementById(
      "profileForm"
    );


  const {
    data: { user },
    error: authError
  } =
    await supabaseClient.auth.getUser();


  if (authError || !user) {

    window.location.href =
      "index.html";

    return;

  }


  document.getElementById(
    "email"
  ).value =
    user.email || "";


  const {
    data,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "full_name, phone"
      )
      .eq(
        "id",
        user.id
      )
      .single();


  if (profileError) {

    console.error(
      profileError
    );

    loadingMessage.textContent =
      "Unable to load your profile.";

    loadingMessage.className =
      "error";

    return;

  }


  document.getElementById(
    "fullName"
  ).value =
    data?.full_name || "";


  document.getElementById(
    "phone"
  ).value =
    data?.phone || "";


  loadingMessage.style.display =
    "none";

  profileForm.style.display =
    "block";

}


async function saveProfile() {

  const message =
    document.getElementById(
      "message"
    );

  const saveButton =
    document.getElementById(
      "saveButton"
    );


  message.textContent =
    "Saving...";

  message.className = "";


  saveButton.disabled =
    true;


  const {
    data: { user },
    error: authError
  } =
    await supabaseClient.auth.getUser();


  if (authError || !user) {

    window.location.href =
      "index.html";

    return;

  }


  const fullName =
    document.getElementById(
      "fullName"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  if (!fullName) {

    message.textContent =
      "Please enter your full name.";

    message.className =
      "error";

    saveButton.disabled =
      false;

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({
        full_name:
          fullName,
        phone:
          phone
      })
      .eq(
        "id",
        user.id
      );


  if (error) {

    console.error(
      error
    );

    message.textContent =
      "Unable to save profile.";

    message.className =
      "error";

    saveButton.disabled =
      false;

    return;

  }


  message.textContent =
    "Profile saved successfully.";

  message.className =
    "success";


  saveButton.disabled =
    false;

}


async function logoutUser() {

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    alert(
      "Unable to logout. Please try again."
    );

    return;

  }


  window.location.href =
    "index.html";

}


loadProfile();

</script>

</body>
</html>
