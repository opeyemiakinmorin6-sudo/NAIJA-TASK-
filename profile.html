<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile — NAIJA TASK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fff7;
  color: #111;
}

header {
  background: #0b8f3c;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 6px;
}

header p {
  margin: 0 0 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

nav {
  display: grid;
  gap: 10px;
}

nav a {
  display: block;
  padding: 12px;
  background: #f5fff7;
  color: #0b8f3c;
  text-decoration: none;
  font-weight: bold;
  border-radius: 8px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: #0b8f3c;
}

button {
  width: 100%;
  border: none;
  padding: 13px;
  border-radius: 8px;
  background: #0b8f3c;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.logout {
  width: auto;
  background: white;
  color: #0b8f3c;
  margin-top: 0;
}

#message {
  margin-top: 15px;
  font-weight: bold;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>NAIJA TASK</h1>
  <p>My Profile</p>

  <button class="logout" onclick="logoutUser()">
    Logout
  </button>
</header>

<div class="container">

  <div class="card">
    <h3>Navigation</h3>

    <nav>
      <a href="dashboard.html">🏠 Home</a>
      <a href="task.html">📋 Tasks</a>
      <a href="wallet.html">💰 Wallet</a>
      <a href="referrals.html">👥 Referrals</a>
      <a href="withdrawal.html">💸 Withdraw</a>
    </nav>
  </div>

  <div class="card">

    <h3>My Profile</h3>

    <label for="fullName">Full Name</label>
    <input
      id="fullName"
      type="text"
      placeholder="Enter your full name"
    >

    <label for="phone">Phone Number</label>
    <input
      id="phone"
      type="tel"
      placeholder="Enter your phone number"
    >

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      readonly
    >

    <button onclick="saveProfile()">
      Save Profile
    </button>

    <p id="message"></p>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

/*
  PUT YOUR NEW SUPABASE PUBLISHABLE KEY HERE.
  Do NOT use the secret/service-role key.
*/
const SUPABASE_KEY =
  "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadProfile() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("email").value =
    user.email || "";

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("full_name, phone")
      .eq("id", user.id)
      .single();

  if (error) {
    document.getElementById("message").textContent =
      "Unable to load profile.";
    return;
  }

  document.getElementById("fullName").value =
    data?.full_name || "";

  document.getElementById("phone").value =
    data?.phone || "";
}


async function saveProfile() {

  const message =
    document.getElementById("message");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const fullName =
    document.getElementById("fullName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if (!fullName) {
    message.textContent =
      "Please enter your full name.";
    return;
  }

  const { error } =
    await supabaseClient
      .from("profiles")
      .update({
        full_name: fullName,
        phone: phone
      })
      .eq("id", user.id);

  if (error) {
    message.textContent =
      "Unable to save profile.";
    return;
  }

  message.textContent =
    "Profile saved successfully.";
}


async function logoutUser() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}


loadProfile();

</script>

</body>
</html>
