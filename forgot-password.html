<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b2b">
<title>Forgot Password | NAIJA TASK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--forest:#073b2b;--green:#0b8f3c;--lime:#b8e62e;--ink:#14271d;--muted:#68796e;--line:#e1e9df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#f4f8ef,#edf4e8);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}
.card{width:min(100%,460px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 65px #173c2014}
.brand{font-size:19px;font-weight:950;color:var(--forest);margin-bottom:24px}
h1{font-size:27px;margin:0 0 8px;color:var(--forest)}p{font-size:13px;line-height:1.7;color:var(--muted)}
label{display:block;margin:18px 0 7px;font-size:12px;font-weight:850}
input{width:100%;height:49px;padding:0 13px;border:1px solid #dce5d9;border-radius:11px;background:#fbfdf9;font:inherit;font-size:14px}
button,.back{display:block;width:100%;margin-top:16px;min-height:49px;border:0;border-radius:11px;background:linear-gradient(110deg,var(--forest),var(--green));color:#fff;font-size:14px;font-weight:900;text-align:center;text-decoration:none;padding:15px;cursor:pointer}
button:disabled{opacity:.6}.back{background:#eff7e9;color:var(--forest);border:1px solid #dce8d7}
#message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}
#message.error{display:block;background:#fff0ee;color:#a32921}#message.success{display:block;background:#eaf7e8;color:#216b32}
.small{text-align:center;font-size:11px;margin-top:17px}
</style>
</head>
<body>
<main class="card">
<div class="brand">🌿 NAIJA TASK</div>
<h1>Forgot your password?</h1>
<p>Enter the email address you used to register. If it is registered, we'll send you a secure password reset link. You do not need to create another account.</p>
<form id="form">
<label for="email">Registered email address</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<button id="send" type="submit">Send password reset link</button>
</form>
<div id="message" role="status" aria-live="polite"></div>
<a class="back" id="back" href="login.html">← Back to Tasker login</a>
<p class="small">Check your inbox and spam folder. For help, contact naijataskofficia@gmail.com.</p>
</main>
<script>
(() => {
 const SUPABASE_URL="https://jwakveeiynpakunwjzkj.supabase.co";
 const KEY="sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";
 let db=null;
 try{
  if(!window.supabase?.createClient) throw new Error("The secure password service did not load. Check your internet connection and refresh this page.");
  db=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 }catch(error){
  const box=document.getElementById("message");box.textContent=error.message;box.className="error";box.style.display="block";
 }
 const params=new URLSearchParams(location.search);
 const role=params.get("role")==="poster"?"poster":"tasker";
 const login=role==="poster"?"poster-login.html":"login.html";
 const back=document.getElementById("back");back.href=login;
 const form=document.getElementById("form"),button=document.getElementById("send"),message=document.getElementById("message");
 function show(text,type){message.textContent=text;message.className=type;message.style.display="block";}
 form.addEventListener("submit",async e=>{
  e.preventDefault();button.disabled=true;button.textContent="Sending secure link…";message.style.display="none";
  try{
   if(!db) throw new Error("Secure password service is unavailable. Refresh this page and try again.");
   const email=document.getElementById("email").value.trim().toLowerCase();
   const redirectTo=location.origin + "/reset-password.html?role=" + encodeURIComponent(role);
   const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});
   if(error)throw error;
   show("If this email is registered, a secure reset link has been sent. Check your inbox and spam folder. Open the link on this device to choose a new password.","success");
  }catch(error){show(error.message||"We could not send the reset link. Please try again or contact support.","error");}
  finally{button.disabled=false;button.textContent="Send password reset link";}
 });
})();
</script>
</body>
</html>
