<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task Poster Login — NAIJA TASK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5fff7;
  color:#123;
  min-height:100vh;
}

.header{
  background:#0b8f3c;
  color:white;
  text-align:center;
  padding:18px 16px;
}

.header h1{
  font-size:24px;
  margin-bottom:5px;
}

.header p{
  font-size:14px;
}

.container{
  width:92%;
  max-width:500px;
  margin:25px auto;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.role{
  background:#e9f9ee;
  border-radius:12px;
  padding:14px;
  text-align:center;
  margin-bottom:20px;
}

.role strong{
  display:block;
  color:#0b8f3c;
  font-size:17px;
  margin-bottom:5px;
}

.role span{
  font-size:13px;
  color:#555;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d5dfd8;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#0b8f3c;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:75px;
}

.show-btn{
  position:absolute;
  right:8px;
  top:7px;
  border:none;
  background:#e9f9ee;
  color:#0b8f3c;
  padding:8px 10px;
  border-radius:8px;
  font-weight:bold;
}

.main-btn{
  width:100%;
  border:none;
  background:#0b8f3c;
  color:white;
  padding:15px;
  border-radius:11px;
  font-size:16px;
  font-weight:bold;
  margin-top:22px;
}

.main-btn:disabled{
  opacity:.6;
}

.message{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.success{
  background:#e8f8ed;
  color:#08752f;
}

.error{
  background:#ffecec;
  color:#b00020;
}

.links{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}

.links a{
  color:#0b8f3c;
  font-weight:bold;
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#555;
  text-decoration:none;
  font-size:14px;
}

</style>

</head>

<body>

<header class="header">

  <h1>NAIJA TASK</h1>

  <p>Task Poster Login</p>

</header>


<div class="container">

  <div class="card">

    <div class="role">

      <strong>📢 Task Poster</strong>

      <span>
        Log in to create and manage your jobs.
      </span>

    </div>


    <h2>Task Poster Login</h2>


    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">
        Password
      </label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="show-btn"
          id="showPassword"
        >
          Show
        </button>

      </div>


      <button
        type="submit"
        class="main-btn"
        id="loginBtn"
      >
        Log In
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="links">

      Don't have a Task Poster account?

      <br><br>

      <a href="poster-signup.html">
        Create Task Poster Account
      </a>

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to NAIJA TASK
    </a>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://jwakveeiynpakunwjzkj.supabase.co";

const SUPABASE_KEY =
      "sb_publishable_iT-y7ZOr_7g_SOx6ZPzR2A_ZjjnLZ6D";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");


function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display =
    "block";
}


/* SHOW PASSWORD */

document
  .getElementById("showPassword")
  .addEventListener("click",function(){

    const input =
      document.getElementById("password");

    if(input.type === "password"){

      input.type = "text";

      this.textContent = "Hide";

    }else{

      input.type = "password";

      this.textContent = "Show";

    }

  });


/* LOGIN */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    message.style.display = "none";

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";


    try{

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if(error){

        throw error;

      }


      if(!data.user){

        throw new Error(
          "Login could not be completed."
        );

      }


      const metadata =
        data.user.user_metadata || {};


      const userType =
        metadata.user_type;

      const role =
        metadata.role;


      /*
        Only Task Poster accounts
        should use this login page.
      */

      if(
        userType !== "task_poster" &&
        role !== "task_poster"
      ){

        await supabaseClient.auth.signOut();

        throw new Error(
          "This is not a Task Poster account. Please use the normal Tasker login."
        );

      }


      showMessage(
        "Login successful. Opening Post a Job...",
        "success"
      );


      setTimeout(function(){

        window.location.href =
          "post-job.html";

      },1000);


    }catch(error){

      console.error(error);

      showMessage(
        error.message ||
        "Login failed. Please check your details.",
        "error"
      );

    }


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Log In";

  }

);

</script>

</body>
  </html>
