<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b8f3c">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Admin Login — NAIJA TASK</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5fff7;color:#17251b;font-family:Arial,Helvetica,sans-serif}
    main{width:100%;max-width:430px;padding:26px;background:#fff;border:1px solid #dceee1;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.07);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 15px;border-radius:16px;background:#0b8f3c;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900}
    h1{margin:0 0 8px;font-size:23px}
    p{color:#66736a;line-height:1.55;font-size:14px}
    a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:11px;background:#0b8f3c;color:#fff;text-decoration:none;font-weight:800}
    .small{font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark">NT</div>
    <h1>NAIJA TASK Admin</h1>
    <p>Opening the secure administrator sign-in. Please wait…</p>
    <a href="./admin.html">Continue to Admin Login</a>
    <p class="small">For security, sign-in and administrator verification are handled in one control center.</p>
  </main>
  <script>
    // Keep a single source of truth for authentication. The admin.html page
    // owns Supabase sign-in, active-admin verification, session restore and logout.
    window.location.replace("./admin.html");
  </script>
</body>
</html>
